<script>
"use strict";
const $=s=>document.querySelector(s);
const WB='<span class="wb">WEB</span>';
/* ---------- diagrams (rebuilt where the slides only had images) ---------- */
const V={
value:()=>`<div class="viz"><h5>Value chain in a company (Chopra &amp; Meindl)</h5><div class="flow"><span>New product development</span><i>&rarr;</i><span>Marketing &amp; sales</span><i>&rarr;</i><span>Operations</span><i>&rarr;</i><span>Distribution</span><i>&rarr;</i><span>Service</span></div><div class="mid" style="margin-top:10px">Supporting functions: Finance &middot; Accounting &middot; Information Technology &middot; Human Resources</div></div>`,
macro:()=>`<div class="viz"><h5>Macro processes in a supply chain</h5><div class="flow"><span>SRM: firm &harr; suppliers</span><i>&rarr;</i><span>ISCM: inside the firm</span><i>&rarr;</i><span>CRM: firm &harr; customers</span></div></div>`,
fit:()=>`<div class="viz"><h5>Uncertainty / responsiveness map and zone of strategic fit ${WB}</h5><svg viewBox="0 0 420 270"><rect x="50" y="10" width="350" height="220" fill="#050505" stroke="#333"/><polygon points="50,230 50,170 400,10 400,70" fill="#2a1d05" stroke="#f59e0b"/><text x="205" y="125" transform="rotate(-24 205 125)" style="fill:#f59e0b">ZONE OF STRATEGIC FIT</text><text x="60" y="35">Responsive SC, certain demand: over-spending</text><text x="150" y="222">Efficient SC, uncertain demand: stock-outs</text><circle cx="85" cy="195" r="5" fill="#ececec"/><text x="95" y="199">Efficient (Walmart, steel mill)</text><circle cx="365" cy="48" r="5" fill="#ececec"/><text x="262" y="44">Responsive (Dell)</text><text x="50" y="248">Certain demand</text><text x="330" y="248">Uncertain demand</text><text x="130" y="262">Implied uncertainty spectrum &rarr;</text><text x="2" y="20" transform="rotate(-90 12 130)">Responsiveness &rarr;</text></svg><p class="cap">Rebuilt from the lecture's axis labels (implied uncertainty vs responsiveness) and Chopra &amp; Meindl's map. Idea: match responsiveness to implied uncertainty; high-high or low-low is fit.</p></div>`,
spec:()=>`<div class="viz"><h5>Responsiveness spectrum (slide examples)</h5><div class="flow"><span>Integrated steel mill: highly efficient</span><i>&rarr;</i><span>Hanes apparel: somewhat efficient</span><i>&rarr;</i><span>Most automotive production: somewhat responsive</span><i>&rarr;</i><span>Dell: highly responsive</span></div></div>`,
front:()=>`<div class="viz"><h5>Cost-responsiveness efficient frontier ${WB}</h5><svg viewBox="0 0 400 230"><line x1="50" y1="200" x2="380" y2="200" stroke="#555"/><line x1="50" y1="200" x2="50" y2="15" stroke="#555"/><path d="M60 190 C170 180 260 130 365 30" fill="none" stroke="#f59e0b" stroke-width="2.5"/><text x="150" y="215">Responsiveness: low &rarr; high</text><text x="2" y="25" transform="rotate(-90 12 110)">Cost: low &rarr; high</text><text x="75" y="60">Inefficient (above the curve)</text><text x="210" y="190">Unattainable (below the curve)</text><text x="270" y="100" style="fill:#f59e0b">Efficient frontier</text></svg><p class="cap">Schematic: for a given responsiveness there is a minimum cost; moving right costs more. A company on the curve trades cost for responsiveness; a company above it is simply inefficient.</p></div>`,
kral:()=>`<div class="viz"><h5>Kraljic matrix (profit impact vs supply risk)</h5><div class="g2"><div><b>Leverage (high profit, low risk)</b>Cost optimisation, competitive bidding, use buying power.</div><div><b>Strategic (high profit, high risk)</b>Close partnerships, joint development, executive involvement.</div><div><b>Non-critical (low profit, low risk)</b>Efficient transactions, automate, minimal resources.</div><div><b>Bottleneck (low profit, high risk)</b>Safety stock, dual sourcing, develop alternative suppliers.</div></div><p class="cap">Rows: top = high profit impact, bottom = low. Columns: left = low supply risk, right = high supply risk.</p></div>`,
bsc:()=>`<div class="viz"><h5>Balanced Scorecard (Kaplan &amp; Norton)</h5><div class="g2"><div><b>Financial</b>Financial results (quarter/year), cash flow, ROI, return on capital employed. SC KPIs: cost reduction, ROI, revenue growth.</div><div><b>Customer</b>Time, quality, service, cost. SC KPIs: order fulfilment rate, customer satisfaction scores, lead time.</div><div><b>Internal business process</b>Process alignment, bottlenecks, automation, activities per function. SC KPIs: cycle time, inventory turnover, flexibility.</div><div><b>Learning &amp; growth</b>Training and learning opportunities, employee turnover, job satisfaction, right level of expertise. SC KPIs: training, technology utilisation, innovation rate.</div></div><div class="mid">Vision and strategy sit at the centre; the four perspectives cascade from them.</div></div>`,
swot:()=>`<div class="viz"><h5>SWOT of a supply chain ${WB}</h5><div class="g2"><div><b>Strengths (internal, +)</b>Agility, end-to-end visibility, reliable supplier partnerships, efficient logistics and inventory systems.</div><div><b>Weaknesses (internal, -)</b>Inflexible or slow supply chain, excess idle inventory, poor shipment visibility, dependence on single suppliers, slow supplier payment.</div><div><b>Opportunities (external, +)</b>New technologies (analytics, automation, tracking), new markets and partnerships, sustainability-led differentiation.</div><div><b>Threats (external, -)</b>Disruptions (disasters, geopolitics, strikes), cyber-attacks on digitised chains, customer or supplier failure, new competitors, regulation.</div></div><p class="cap">Strategy pairs: SO use strengths on opportunities; ST use strengths against threats; WO use opportunities to fix weaknesses; WT minimise weaknesses and avoid threats. Example content is typical, not from your slides.</p></div>`,
five:()=>`<div class="viz"><h5>Porter's Five Forces adapted to supply chain (from slides)</h5><div class="g3"><div class="box"><b>Threat of new entrants</b>Barriers to entry, industry structure, technology advances.</div><div class="box"><b>Rivalry among competitors</b>Market growth, product differentiation, barriers to entry.</div><div class="box"><b>Threat of substitutes</b>Customer preferences, differentiation, regulatory environment.</div></div><div class="g2" style="margin-top:8px"><div><b>Supplier power</b>Supplier concentration, switching costs, supplier relationships.</div><div><b>Buyer power</b>Buyer concentration, price sensitivity, product differentiation.</div></div></div>`,
four:()=>`<div class="viz"><h5>Porter's Four Corners model ${WB}</h5><div class="g2"><div><b>Drivers (motivation)</b>Competitor's goals; are they satisfied with performance and position?</div><div><b>Management assumptions (motivation)</b>How management sees itself, the industry and rivals; makes strategy proactive or reactive.</div><div><b>Current strategy (action)</b>What the rival is doing; gap between intended and realised strategy.</div><div><b>Capabilities (action)</b>Strengths and weaknesses; what the rival can realistically do.</div></div><p class="cap">Drivers and assumptions explain why a rival acts; strategy and capabilities show what it can do. Used to predict the rival's likely next move.</p></div>`,
whip:()=>`<div class="viz"><h5>Bullwhip effect (illustrative bar heights)</h5><svg viewBox="0 0 400 190"><g fill="#f59e0b"><rect x="40" y="150" width="50" height="20"/><rect x="130" y="130" width="50" height="40"/><rect x="220" y="100" width="50" height="70"/><rect x="310" y="50" width="50" height="120"/></g><line x1="30" y1="170" x2="380" y2="170" stroke="#555"/><text x="40" y="185">Retailer</text><text x="125" y="185">Wholesaler</text><text x="212" y="185">Manufacturer</text><text x="312" y="185">Supplier</text><text x="30" y="20">Order variability grows as you move upstream</text></svg><p class="cap">Small consumer-demand changes become larger order swings upstream.</p></div>`,
ally:()=>`<div class="viz"><h5>Alliance commitment ladder</h5><div class="flow"><span>Non-equity alliance (lowest commitment, no ownership)</span><i>&rarr;</i><span>Equity alliance (moderate, stake held)</span><i>&rarr;</i><span>Joint venture (highest, new co-owned legal entity)</span></div></div>`,
scope:()=>`<div class="viz"><h5>Scope of strategic fit (narrow to wide)</h5><div class="flow"><span>Intracompany intraoperation</span><i>&rarr;</i><span>Intracompany intrafunctional</span><i>&rarr;</i><span>Intracompany interfunctional</span><i>&rarr;</i><span>Intercompany interfunctional</span><i>&rarr;</i><span>Agile intercompany</span></div></div>`,

impl:()=>`<div class="viz"><h5>Impact of customer needs on implied demand uncertainty (Chopra &amp; Meindl, Table 2.1) ${WB}</h5><table class="tb"><tr><th>Customer need</th><th>Effect on implied uncertainty</th><th>Why</th></tr><tr><td>Range of quantity required increases</td><td>Increases</td><td>Wider range of quantity means greater variance in demand</td></tr><tr><td>Lead time decreases</td><td>Increases</td><td>Less time to react to orders</td></tr><tr><td>Variety of products required increases</td><td>Increases</td><td>Demand per product becomes more disaggregated</td></tr><tr><td>Number of channels increases</td><td>Increases</td><td>Total customer demand is spread over more channels</td></tr><tr><td>Rate of innovation increases</td><td>Increases</td><td>New products tend to have more uncertain demand</td></tr><tr><td>Required service level increases</td><td>Increases</td><td>Firm must handle unusual surges in demand</td></tr></table><p class="cap">In short: customers want more quantity, variety, novelty and availability, they want it now and they want it everywhere.</p></div>`,
levels:()=>`<div class="viz"><h5>Levels of implied demand uncertainty (examples) ${WB}</h5><div class="flow"><span>LOW: detergent, long-lead-time steel (purely functional products)</span><i>&rarr;</i><span>increasing implied uncertainty</span><i>&rarr;</i><span>HIGH: high fashion, iPod-type launches, entirely new products</span></div><p class="cap">Demand uncertainty is the uncertainty of customer demand; implied demand uncertainty is the resulting uncertainty for the supply chain given the portion of demand it must meet and the attributes customers want.</p></div>`,
supply:()=>`<div class="viz"><h5>Supply source capability and supply uncertainty ${WB}</h5><table class="tb"><tr><th>Supply source capability</th><th>Effect on supply uncertainty</th></tr><tr><td>Frequent breakdowns</td><td>Increases</td></tr><tr><td>Unpredictable and low yields</td><td>Increases</td></tr><tr><td>Poor quality</td><td>Increases</td></tr><tr><td>Limited supply capacity</td><td>Increases</td></tr><tr><td>Inflexible supply capacity</td><td>Increases</td></tr><tr><td>Evolving production process</td><td>Increases</td></tr></table><p class="cap">Stable process (mature technology, reliable suppliers) means low supply uncertainty; evolving process (new products, designs and processes not yet perfected) means high. Matches the slide note that new products have higher supply uncertainty and mature ones lower.</p></div>`,
lee:()=>`<div class="viz"><h5>Matching strategy to demand and supply uncertainty (Hau Lee, 2002, cited on the slide) ${WB}</h5><table class="tb"><tr><th></th><th>Stable supply process (low supply uncertainty)</th><th>Evolving supply process (high supply uncertainty)</th></tr><tr><th>Functional product (low demand uncertainty)</th><td><b>Efficient</b> supply chain</td><td><b>Risk-hedging</b> supply chain</td></tr><tr><th>Innovative product (high demand uncertainty)</th><td><b>Responsive</b> supply chain</td><td><b>Agile</b> supply chain</td></tr></table><p class="cap">Efficient: cut cost, high utilisation. Risk-hedging: pool and share inventory or capacity to hedge supply risk. Responsive: flexible, quick response to demand. Agile: responsive plus hedging, needed when both demand and supply are uncertain.</p></div>`,
srm:()=>`<div class="viz"><h5>SRM objectives and challenges (PwC study cited on the slide) ${WB}</h5><div class="g2"><div><b>4 SRM objectives (Monczka et al., 2011)</b>1 Become 'customer of choice' (preferential treatment: availability, cost, access to technology, innovation, risk reduction). 2 Focus on value. 3 Leverage supplier capabilities (early involvement in innovation and development). 4 Share growth, profits, risks and investments.</div><div><b>Survey ranking of objectives</b>1 Leverage supplier capabilities. 2 Deliver cost reduction targets. 3 Improve security of supply. Others: become customer of choice, manage supply risk profile, enhance relationships, guarantee sustainable sourcing, increase responsiveness, anticipate volatile commodity prices.</div><div><b>Top 3 challenges</b>1 Too much focus on cost instead of value. 2 Lack of specific SRM competencies and skills. 3 Strategic objectives of buyer and supplier not compatible.</div><div><b>Other challenges</b>No alignment between business and procurement; open communication and information sharing is difficult; focus on fighting instead of collaborating; ignorance of soft skills; lack of business involvement; limited top-management sponsorship; lack of mutual understanding and empathy.</div></div><div class="mid">SRM maturity: No SRM &rarr; Exploring &rarr; Established &rarr; World-class</div></div>`,
vrate:()=>`<div class="viz"><h5>Vendor rating format: weighted-point example (illustrative, rebuilt)</h5><table class="tb"><tr><th>Criterion</th><th>Weight</th><th>Vendor A score (0-100)</th><th>Weighted score</th><th>Vendor B score</th><th>Weighted score</th></tr><tr><td>Quality</td><td>40%</td><td>90</td><td>36.0</td><td>75</td><td>30.0</td></tr><tr><td>Delivery</td><td>25%</td><td>80</td><td>20.0</td><td>90</td><td>22.5</td></tr><tr><td>Price</td><td>20%</td><td>70</td><td>14.0</td><td>85</td><td>17.0</td></tr><tr><td>Service</td><td>15%</td><td>60</td><td>9.0</td><td>80</td><td>12.0</td></tr><tr><th>Total</th><th>100%</th><th></th><th>79.0</th><th></th><th>81.5</th></tr></table><p class="cap">Rating = sum of (score x weight). Weights come from step 2 of the vendor rating process and should reflect strategy. Numbers are invented to show the method; your slide's own format table was an image.</p></div>`,
dmaic:()=>""
};
/* Each section: [title, analogy, [[term, detail, 'W' if added from web],...], [viz names]] */
const N={7:[
["Lecture 31 - Impellers, Concepts and Value Chain","Like a car's engine, fuel and road: impellers are the forces that push a supply chain forward.",[
["Impellers","Driving forces or factors that influence and propel supply chain performance and operations. They include facilities, inventory, transportation, information systems, sourcing strategies, pricing mechanisms and other key drivers shaping responsiveness, efficiency and overall performance; each aligns strategy with broader business objectives and competitive strategy."],
["Traditional 3 impellers","(1) Empowered customer: more knowledgeable and demanding; expects variety, availability, competitive pricing; transparency such as seeing restaurant kitchens raises expectations. (2) Developments in information technology tools: faster, more efficient supply chains; data collection, workforce management, resource tracking, real-time inventory monitoring; tools: MRP, ERP, VMI, TAV. (3) Globalization: new markets and consumers, more competition and risk, easy export and import."],
["2 additional impellers (some literature)","Focus on sustainability (ethical sourcing, energy-efficient transport and logistics, waste reduction). Collaboration and integration (across procurement, manufacturing, marketing, sales; partnerships with suppliers and logistics providers)."],
["Systems concept","Views the supply chain as a holistic, interconnected system, not isolated parts; a change in one part ripples through the whole; optimise the whole network rather than segments."],
["Total cost concept","Considers all supply chain costs including indirect and hidden ones: procurement, production, transportation, inventory, storage, distribution. Aim: minimise total cost while keeping or improving quality; analyse cost drivers at each stage."],
["Trade-off concept","Optimising one aspect usually needs sacrificing another (cost vs quality, cost vs speed, inventory level vs customer responsiveness); evaluate choices against strategic objectives."],
["Bullwhip effect","Small fluctuations in consumer demand cause amplified order variations upstream. Causes: information delays, forecast inaccuracies, order batching and other distortions. Results: inefficiency, excess inventory, stock-outs, higher cost. Mitigation: better demand forecasting, shorter order lead times, vendor-managed inventory, collaboration and information sharing."],
["Value chain","Series of interconnected activities that add value as a product moves from conception to consumption. Primary: new product development (specifications from market needs), marketing and sales (generate demand, gather feedback), operations (transform inputs to outputs), distribution (logistics, warehousing, transportation), service (inquiries, issues, retention). Supporting: finance (budgeting, investment), accounting (records and reporting), information technology (systems, networks, data), human resources (recruit, train, develop)."],
["5 essential considerations","Supply sense, supply response, deciding and committing, demand sense, demand response."],
["Supply sense","Ability of supply chain professionals to anticipate, understand and respond effectively to shifts and challenges in the supply chain environment; strategic thinking, analysis, proactive decisions."],
["Supply response","Operations that make things happen (manufacturing, asset management); ability to adjust supply chain operations to changes in demand, market conditions or external factors (responsiveness)."],
["Deciding and committing","Making strategic decisions and commitments aligned with business objectives: evaluating options, setting priorities, setting direction of the supply chain."],
["Demand sense","Ability to sense and anticipate changes in customer demand accurately using data, analytics and market insight to understand preferences and forecast patterns."],
["Demand response","Reacting promptly to changes in customer demand by adjusting production, inventory, distribution and fulfilment."],
["Case notes","The lecture uses video cases (bullwhip effect during COVID-19; Amazon giving customers what they want, when they want). The summary: impellers (empowered customers, technology, globalization), sustainability and collaboration drive success."]],["value"]],
["Lecture 32 - Strategic Supply Chain Management (1)","Like a football team's playbook: it says who does what, when to pass, and how the score is measured.",[
["Supply chain strategy","Overarching plan for planning, design, execution, control and monitoring of supply chain activities. It documents which function handles each activity, when collaboration is needed, what must happen and when, and how performance is measured. It should align to business goals and integrate activities. Best-in-class firms have a separate strategy for each core function, e.g. make-to-stock, make-to-order, engineer-to-order."],
["Components","Sourcing (select suppliers, manage relationships for quality, cost, delivery); logistics (movement of goods, transportation, warehousing, inventory management); production (turning raw materials into finished goods); customer service (orders, after-sales, returns, complaints); distribution (own DCs, 3PLs)."],
["21st-century competition","Global economy and globalization, rapid technological change, increasing importance of knowledge and people. Competitive advantage = formulation and implementation of a superior value-creating strategy; commitments and actions to achieve above-average returns; what the firm will do and will not do."],
["Cost advantage","Determine and control cost drivers; reconfigure the value chain if needed (alter production process, change automation, new distribution channel, new advertising media, direct instead of indirect sales, new raw material, forward or backward integration, change location relative to suppliers or buyers). Value-creating activities for cost leadership: cost-effective MIS, few management layers, simplified planning, consistent policies, effective training, easy-to-use manufacturing technologies, technology investment, low-cost raw materials, monitoring supplier performance, linking supplier products to production, economies of scale, efficient-scale facilities, effective delivery schedules, low-cost transportation, highly trained sales force, proper pricing."],
["Differentiation advantage","Control cost drivers if needed; reconfigure the value chain to lower buyers' costs, raise product or service performance, and create sustainability through customer perceptions of uniqueness and reluctance to switch. Activities: highly developed MIS, emphasis on quality, worker compensation for creativity, subjective performance measures, basic research capability, technology, high-quality raw materials and replacement parts, superior incoming-material handling, attractive products, rapid response to specifications, order-processing procedures, customer credit, personal relationships."],
["Effective strategy qualities","Collaborative (stakeholders share plans and data); agile (scale up or down); resilient (expect, mitigate, recover from disruption); digital (connected, controlled, informed); invest in cybersecurity (cyber threats rise with digitisation)."],
["Technology examples","ERP orchestrates activities with real-time information on processes, machines, inventory; IoT sensors monitor machine productivity and support predictive maintenance; AI and ML automate manufacturing, warehousing, transportation and distribution."],
["Optimisation levers","Supply chain network design (analyse flows, costs, delivery times); demand planning; inventory optimisation (best locations, balance service and cost); S&OP (align what is made and sold with demand); workforce management."],
["Firm's strategic choices","Economies of scale, barriers to market entry, diversification, product differentiation, industry concentration, market frictions."],
["Strategy per value-chain component","Product development: portfolio selection; internal vs outsourced development. Marketing and sales: segmentation, positioning and pricing, promotion. Supply chain: procurement, manufacturing or service operations, distribution, outsourcing decisions. Broad structure: supplier strategy, operations strategy, logistics strategy."],
["Design strategy (distribution)","Inventory management (levels, replenishment, location); transportation (modes, routes, carriers); operating facilities (location, capacity, layout of plants, warehouses, DCs); information flows (systems for demand forecasting, order management and real-time visibility across the chain)."],
["Service strategy (distribution)","Service design; service quality; customer experience management; service differentiation; service recovery; technology integration; employee training; continuous improvement."],
["Case: Unilever (CPFR)","Early 2000s five-year growth strategy and supply chain restructure (governance, global procurement, supply chain managers, supplier engagement, technology): savings of $14.24 billion. Merged almost 30 warehouses into five distribution hubs able to fill orders in about a day; retailers' zero-inventory policy needs diffusion and cross-docking. Set up CPFR agreements with select retailers. Result: forecast accuracy up 10%, inventory holding down 10%, sales volume up 5%."],
["Case: Eaton and Intel","Eaton: pandemic resilience via supply chain education, multi-sourcing, more supplier collaboration, end-to-end connection. Intel: ethical sourcing; smelter audit protocol validates conflict-free tin, tungsten, gold, tantalum using RFID with bagging and tagging."]],[]],
["Lecture 33 - Strategic Supply Chain Management (2): models","Like checking the weather and your own fitness before a climb: external analysis shows what you might do, internal analysis shows what you can do.",[
["Developing strategy","A complex, dynamic field (procurement, manufacturing, distribution, customer service) driven by evolving demand, technology, global market dynamics and regulation. Models give a structured approach to decisions."],
["External vs internal analysis","External environment: opportunities and threats, what a firm might choose to do. Internal organisation: unique resources, capabilities and competencies (needed for sustainable competitive advantage), what a firm can do."],
["Creating value","Firms create value by exploiting core competencies; value is measured by product performance characteristics and attributes customers will pay for; superior value gives above-average returns. Walmart: 'everyday low pricing'. Core competencies plus product-market positions are the main sources of competitive advantage."],
["SWOT analysis (slide diagram missing)","Evaluate strengths, weaknesses, opportunities, threats before designing logistics processes; address weaknesses, capitalise on strengths, leverage opportunities and mitigate threats. The lecture's own SWOT chart was an image; the rebuilt matrix below is added from web research.",""],
["Porter's Five Forces","Strategic tool for analysing competitive forces; traditionally business strategy, adapted to assess the dynamics of the supply chain environment. Created by Harvard professor Michael Porter, published 1979 (HBR: 'How Competitive Forces Shape Strategy'); urges leaders to look beyond rivals to forces in the wider environment."],
["Five forces in supply chain terms","Supplier power: concentration, switching costs, relationships. Buyer power: concentration, price sensitivity, differentiation. Threat of new entrants: barriers to entry, industry structure, technological advances. Threat of substitutes: customer preferences, differentiation, regulatory environment. Rivalry: market growth, differentiation, barriers to entry."],
["Four Corners model (listed on slide, no content)","Porter's tool for predicting a competitor's likely next moves from four corners: drivers, management assumptions, current strategy, capabilities. Drivers and assumptions are the motivation; strategy and capabilities are the actions. Often combined with Five Forces (Five Forces = current situation, Four Corners = possible future steps).","W"],
["Implementation considerations","No one-size-fits-all. Identify demand types (seasonal, linear, consistent; frequency; fluctuations; forecasting tools); understand the product portfolio (different strategies per product line); know customer location (regional vs global shipments); know suppliers' locations (foreign suppliers mean longer lead times); manage inventory with real-time updates."],
["Case: Amazon","Success rests on warehouse and distribution network, a diversified fleet, and advanced technology. More than 2,373 active facilities, over 200 fulfilment centres in North America, about 319 million sq ft of US warehouse space. FBA (sellers send items to Amazon centres; Amazon packs, delivers, services) and FBA Onsite (Amazon optimises seller processes using its WMS while stock stays at the seller). Robots pick, pack, load and store; Scout is a six-wheeled delivery robot. Inventory turnover about 8.39 for fiscal year ending December 2022."],
["Case: Starbucks","Over 35,000 shops, over $32 billion revenue, 50+ years. Vertically integrated, working with about 400,000 coffee producers; own C.A.F.E. (Coffee and Farmer Equity) Practices and ESG standards with strict screening. In 2008 Peter Gibbons (VP global supply chain operations) simplified it: four macro-operations (plan, source, manufacture, deliver), centralised logistics, and a binary Scorecard System measuring operational safety, on-time supply and order fulfilment, overall supply chain cost, and financial cost-effectiveness. Result: 98.6% of coffee ethically sourced; worldwide sales up 5%."]],["swot","five","four"]],
["Lectures 34-35 - Achieving Supply Chain Strategic Fit","Like matching shoes to the terrain: running shoes (efficient) for a track, hiking boots (responsive) for a mountain; the wrong pair loses the race.",[
["Competitive strategy","How a company distinguishes itself and satisfies customer needs; defines which customer needs it targets. Wal-Mart: wide range, low prices, high availability. McMaster-Carr: convenience, availability, responsiveness for MRO products. Blue Nile (variety, lower prices, online diamonds) vs Zales (personalised in-store, limited variety)."],
["Supply chain strategies","Efficient (lowest cost, streamlined, optimised inventory); responsive (agility, quick response, flexibility, even at higher cost); lean (eliminate waste, JIT, continuous improvement, value stream mapping); agile (adaptability to unpredictable markets, speed, innovation); collaborative (partnerships, information sharing, joint goals)."],
["Strategic fit","Consistency between the customer priorities of the competitive strategy and the supply chain capabilities of the supply chain strategy; competitive and supply chain strategies share the same goals. Failure comes from lack of fit or from processes and assets that cannot execute the strategy. Illustration: Dell."],
["Importance of fit","Meets customer needs (satisfaction and loyalty); improves performance by optimising responsiveness and efficiency; enhances competitiveness (unique value propositions); manages costs and risks; supports growth and scalability."],
["3 steps to fit (in order)","Step 1: Understand the customer and supply chain uncertainty. Step 2: Understand the supply chain capabilities. Step 3: Achieve strategic fit (coordinate functional strategies)."],
["Step 1: customer needs","Identify the needs of the customer segment: quantity per lot, response time tolerated, variety, service level, price, desired rate of innovation, demand uncertainty and implied demand uncertainty (uncertainty for the supply chain given the portion of demand it must meet and customer attributes desired)."],
["Implied demand uncertainty and other attributes","Low implied uncertainty vs high: product margin low vs high; average forecast error 10% vs 40%-100%; average stock-out rate 1%-2% vs 10%-40%; average forced season-end markdown 0% vs 10%-25%."],
["Customer needs and implied demand uncertainty","The slide table was an image. Chopra & Meindl Table 2.1: a wider range of quantity, shorter lead time, greater variety, more sales channels, faster innovation and a higher required service level each INCREASE implied demand uncertainty (see the rebuilt table below).","W"],
["Supply uncertainty","Depends on supply source capability and product life cycle: new products have higher supply uncertainty (designs and processes not perfected); mature products lower. Supply uncertainty rises with frequent breakdowns, unpredictable and low yields, poor quality, limited or inflexible capacity and an evolving production process. Implied uncertainty combines demand and supply uncertainty."],
["Step 2: supply chain capabilities","Responsiveness is the ability to: respond to wide ranges of quantities, meet short lead times, handle large variety, build highly innovative products, meet a high service level, handle supply uncertainty. Assess responsiveness, flexibility, cost and quality; bridge gaps through technology, processes, supplier relationships, logistics."],
["Step 3: achieve fit","Make what the supply chain does well consistent with the target customer's needs using the uncertainty/responsiveness map and the zone of strategic fit. High responsiveness for high implied uncertainty; efficiency for low. Two extremes: efficient (Walmart) and responsive (Dell). No right supply chain strategy independent of competitive strategy; there is a right one for a given competitive strategy."],
["McMaster-Carr example","Customers value variety and rapid MRO delivery, so high implied demand uncertainty; it chooses a responsive supply chain over efficiency despite higher cost."],
["Roles across the chain","Stages may need different responsiveness. Retailer holds minimal inventory and passes most implied uncertainty to the manufacturer; England, Inc. uses flexible manufacturing and can absorb more or less uncertainty, changing what its suppliers need (efficiency or responsiveness)."],
["Efficient vs responsive","Primary goal: lowest cost vs quick response. Product design: minimise product cost vs modularity for postponement. Pricing: lower margins vs higher margins. Manufacturing: high utilisation vs capacity flexibility. Inventory: minimise vs buffer. Lead time: reduce but not at greater cost vs aggressively reduce even if costly. Supplier selection: cost and quality (the slide text reads 'Cost and low quality', which looks like a typo) vs speed, flexibility, quality. Transportation: low-cost modes vs fast modes. Source: Fisher (HBR 1997)."],
["Other issues","Multiple products and customer segments (different implied uncertainty; use different supply chains or tailor one); product life cycle (early: uncertain demand, high margins, availability first; late: predictable demand, low margins, price matters; responsiveness shifts to efficiency; e.g. pharma, Intel); competitive changes over time (more competitors raise emphasis on variety at reasonable price; the Internet widens variety)."],
["Pharma example","New drug: demand highly uncertain, margins high, availability captures share, so responsiveness matters most. Later as a commodity: demand and supply more certain, margins lower, price drives choice."],
["Tailored supply chain","One size does not fit all. Dell: responsive chain for customised PCs, later tailored to serve low-cost channels such as Wal-Mart via contract manufacturers. Levi Strauss: standard vs customised jeans. W.W. Grainger: fast-moving, low-uncertainty items in decentralised locations near customers; slow-moving, high-uncertainty items in a centralised warehouse. Tactics: share links, vary manufacturing and transport modes, central vs decentralised stocking."],
["Scope of strategic fit","Extent to which alignment applies across functions and stages. Five categories: intracompany intraoperation (minimise local cost; each stage independent), intracompany intrafunctional (minimise functional cost), intracompany interfunctional (maximise company profit), intercompany interfunctional (maximise supply chain surplus; share information, joint promotions), flexible or agile intercompany (strategic fit while partners change over time)."],
["Key drivers to compete (GEP)","Market alignment, global growth and expansion, supplier relationships, process redesign, performance management (real-time dashboards, KPIs, benchmarks)."],
["Challenges to maintaining fit","Increasing product variety and shrinking life cycles (use product platforms with common components; Apple limits variety). Globalization and uncertainty (exchange rates, global demand, commodity prices; build flexibility; Honda's flexible plants). Fragmentation of ownership (outsourcing and specialisation; align all members). Changing technology and business environment (Dell moved from direct sales to retail). Environment and sustainability (Starbucks' local sustainability in sourcing)."],
["Case: Walmart","Highest sales per square foot over two decades; cost structure supports lower prices. Strategic sourcing finds suppliers meeting demand at best price; long-term alliances promise increased purchases for lowest prices. Supplier communication networks make the network almost one company. Cross-docking is at the heart of efficient replenishment: reduces inventory and transport costs, saves transit time. Out-of-stock occurrences cut by 16%."],
["Case: Dell","Before 2007: variety of customisable products at a reasonable price; direct sales model; build-to-order (assemble after order); JIT inventory; close supplier collaboration with real-time visibility. After 2007: retail distribution, product diversification, supply chain optimisation (lean), strategic partnerships, sustainability, more customer-centric approach."]],["impl","levels","supply","lee","spec","fit","front","scope"]],
["Lecture 36 - Make or Buy, Outsourcing and Strategic Alliances","Like a restaurant deciding to bake its own bread or buy it from the bakery next door: do in-house what is your edge, buy the rest.",[
["Strategic alliance","Legal agreement between two or more companies committing resources to a common set of goals (new markets, shared IP, infrastructure, technology, people, or complementary product lines). Should be mutually beneficial."],
["Types by commitment","Non-equity: lowest resource commitment, work together on a project without sharing ownership (two tech firms build software, each keeps its technology). Equity: moderate commitment; one company takes ownership in the other or a new entity (car maker invests in a battery company). Joint venture: highest commitment; a new independent legal entity (NewCo) co-owned, shared control and profits (two pharma firms develop a drug). Choice depends on project complexity, risk tolerance and desired control."],
["Vertical complementary alliance","Between firms at different stages of the value chain (upstream or downstream) using skills in complementary ways to create new value: operational efficiency, new markets."],
["Horizontal complementary alliance","Between firms at the same stage (often competitors or same industry) combining resources and skills; marketing, distribution, joint production; share risks and costs."],
["Purposes of outsourcing and alliances","Enhance competitiveness (access specialised resources, capabilities, expertise not available internally); improve efficiency and cost-effectiveness; access new markets and customers; foster innovation and learning; mitigate risks and uncertainties; enhance flexibility and adaptability."],
["Benefits of outsourcing","Cost savings; access to specialised expertise; focus on core competencies; scalability and flexibility; improved efficiency and productivity; risk mitigation; enhanced focus on customer satisfaction."],
["Limitations of outsourcing","Loss of control; communication and coordination challenges (time zones, language, culture); quality and performance risks; dependency on external providers; data security and confidentiality; hidden costs and contractual issues; negative impact on internal workforce."],
["Make-or-buy decision","Choose between producing in-house and buying or outsourcing. Guided by core competencies (unique strengths that differentiate), cost, flexibility, scalability and strategic alignment with long-term goals. Typical criteria also include quality, capacity, control, risk and relationships. Cost and quality problems are the usual triggers.","W"],
["Case: Apple","Outsources manufacturing and assembly of all devices to China because manufacturing is not its core competency and assembly there is significantly cheaper; designs in the US, builds in China, ships back for sale."],
["Case: Nike","Core competencies are marketing and design; partners with contract manufacturers instead of making products."],
["Case: Google","Core competencies: search algorithm, data analytics, user experience design. Identify yours via SWOT, customer feedback, benchmarking against leaders, best practices."]],["ally"]]],
8:[
["Lecture 37 - Strategic Sourcing","Like choosing a long-term business partner rather than the cheapest stall at the market.",[
["Strategic sourcing","Procurement strategy of identifying, evaluating and selecting suppliers on specific criteria to optimise the supply chain and achieve long-term business goals. Systematic and proactive; goes beyond lowest-cost supplier: strong relationships, quality and delivery, lower cost, mitigated risk. Analyses product and process specifications, supplier market and customer service to decide local vs global sourcing; includes sourcing strategy, contract negotiation, supplier relationships, transition action plans; aligns sourcing with organisational strategy."],
["Characteristics","Disciplined buying practices; total cost focus (total cost of ownership: quality, service, delivery); consolidated purchasing power (better terms, lower ordering cost, economies of scale); tight supplier relationships (partners: trust, long-term commitment, shared vision); improved teamwork and purchasing skills (cross-functional); realigned business processes (remove redundancy, cut cycle time and inventory); continuous improvement; focus on value creation."],
["Supplier selection and management","Importance of suppliers (control unit cost, lower total acquisition cost, meet customer needs, fewer suppliers, design subassemblies). Selection criteria: quality, delivery, performance history, warranties and claims policies, production facilities and capacity, price, technical capability, financial position. Evaluation by scoring and formal reviews. Certification: certified suppliers consistently deliver quality, reducing routine testing. Management: ongoing communication, monitoring, issue resolution. Benefits: cost reduction, operational performance, product quality, shorter time-to-market, responsiveness."],
["Supplier relationship management (SRM)","Strategic approach to collaborative, mutually beneficial relationships with key suppliers built on trust, open communication, win-win. Objectives: become the 'customer of choice', leverage supplier capabilities for innovation and development, share growth, profits, risks and investments. Aims: preferential treatment, access to technology and innovation, risk reduction. Activities: selection, contract negotiation, performance measurement, joint planning, risk management."],
["Establishing SRM (9 steps)","1 Define SRM strategy aligned with business objectives. 2 Identify key suppliers (strategic importance, business volume, collaboration potential). 3 Assess supplier capabilities (quality, delivery, cost, innovation, sustainability). 4 Establish governance (roles, decisions, cross-functional teams). 5 Develop collaboration initiatives (joint product development, process optimisation, cost reduction, best practices). 6 Invest in technology (supplier management software, platforms, analytics). 7 Foster open communication (meetings, forums, workshops). 8 Implement performance measurement (KPIs, reviews). 9 Develop supplier development programs (training, mentoring, knowledge sharing)."],
["SRM objectives and challenges (slide figures were images)","Rebuilt from the PwC report the slide cites (Verweij and Peek, 2013). Objectives: customer of choice, focus on value, leverage supplier capabilities, share growth, profit, risk and investment. Survey ranking: leveraging supplier capabilities first, cost reduction second, security of supply third. Top challenges: too much focus on cost instead of value, lack of SRM competencies, incompatible strategic objectives. SRM is for a limited number of key suppliers; others are managed by contract management and vendor rating.","W"],
["Supplier segmentation","Categorise suppliers to prioritise effort and tailor strategy. Criteria: spend, risk (impact of supplier failure), criticality (importance to core operations), performance (quality, delivery, reliability), market position (share, technology, innovation), geographic location (logistics, lead time, regional regulation)."],
["Kraljic matrix","Four categories by profit impact and supply risk: strategic (high, high), leverage (high profit, low risk), bottleneck (low profit, high risk), non-critical (low, low)."],
["ABC analysis","Pareto principle (80/20). A-class: small number of suppliers with the majority of spend or strategic importance. B-class: moderate number, average spend or importance. C-class: large number, low spend or importance."],
["Global sourcing","Procuring from suppliers worldwide for lower cost, better quality, advanced technology, improved production capability. Eight dimensions: cost (total landed cost incl. transport and duties, infrastructure investments), quality, corporate social responsibility, risk (political instability, currency, disruption), opportunities (technology, innovation, skilled labour), politics (trade regulations, intervention), local context (culture, infrastructure, legal framework), enabling infrastructure (transport, communication)."],
["Case: Colorado manufacturer","Founded 1950s; build-to-order, low-volume high-mix; outdated MRP caused about $1M excess and obsolete inventory; customer lead time 12 weeks (double competitors'). New president (lean and supply chain expertise) set a 3-5 year roadmap; goal: cut customer lead time 80% to two weeks. 7 steps: define strategic objectives; specify critical parts (machined, total landed cost, local suppliers); assess and select qualified suppliers (NDA, questionnaire, 3-year price stability); supplier selection and parts allocation; award parts and negotiate (five shops, 10-30% each, Kanban); implementation (Kanban from blanket PO, new ERP, daily floor walk); track results (quarterly supplier scorecard, weekly review)."],
["Colorado results","Machined-part lead time 6-8 weeks to two days; supplier on-time delivery 50% to 95%; supplier quality 60% to over 99%; price stability gave 30% improvement in gross profit; inventory down 50% freeing $750,000. Customer lead time 12 to 2 weeks (80%); quality up 25%, warranty cost 0.2% of sales; market share up 30% over four years."]],["srm","kral"]],
["Lecture 38 - Vendor Rating","Like a report card for suppliers: same exam, weighted subjects, feedback each term.",[
["Vendor rating","Formal evaluation system assessing suppliers on delivery, quality, price and service by assigning a rating or score. Assesses and monitors performance, gives feedback, benchmarks against standards, reduces subjectivity, selects vendors for development. Usually computed with weights on quality and delivery ratings; important where volumes and spend are large (e.g. railways)."],
["Criteria","Quality (specification adherence, failure rate, rework, replacements). Price (competitiveness, stability, accuracy, notice of price changes, clear billing). Delivery (lead time, quantity accuracy, packaging and documentation, emergency deliveries). Service (complaint handling, technical support, emergency support, timely resolution). Reliability (track record, reputation, financial stability). Innovation (R&D, willingness to adapt, unique offerings). Relationship (communication, collaboration, understanding needs)."],
["Need for vendor rating","Performance evaluation; supplier development (training, best practices); risk mitigation (poor quality, late delivery, inadequate service; diversify, contingency); cost optimisation; performance benchmarking; supplier relationship management (open feedback, trust)."],
["8 steps","1 Define evaluation criteria. 2 Assign weights. 3 Gather data (reports, feedback, audits, inspections, surveys). 4 Evaluate performance (quantitative and qualitative). 5 Calculate ratings (e.g. weighted scoring: score x weight, summed). 6 Review and validate. 7 Communicate results and feedback. 8 Use ratings for decisions (selection, renewals, development, risk)."],
["Technique: categorical plan","Managers from different departments list factors important to them; very subjective; each supplier rated Good, Satisfactory or Poor on each list."],
["Technique: weighted point plan","Factors categorised and weights assigned to each factor by importance; vendor performance is scored and multiplied by the weights."],
["Technique: cost ratio plan","Ratings based on costs incurred in buying from each supplier for variables such as quality, price, delivery; cost ratio = individual cost / total purchase value x 100. Example: delivery cost Rs 5,000 on purchases of Rs 1,00,000 gives 5,000 / 1,00,000 x 100 = 10%."],
["Technique: forced decision matrix","Attributes (quality, service, price, reliability, lead time) are compared pairwise; the more important one gets weight 1 and the other 0."],
["Technique: service cost ratio","Subjective measure of intangible service: labour stability, financial stability, flexibility for rush orders, R&D."],
["IBM quality rating","Based on quality costs. VGR = (desired cost of inspection / actual cost of inspection) x 100."],
["Bell quality rating (LQI)","Lot Quality Index by Bell Helicopter Company: LQI = X / L, where L = total lots received in the period and X = (L1 x 1.00) + (L2 x 2.10) + (L3 x 2.90) + (L4 x 3.10) + (L5 x 3.90). L1 = lots acceptable as received; L2 = lots rejected by sampling inspection but labelled; L3 = rejected, rework at supplier's end; L4 = rejected, returned not usable; L5 = rejected, rework at Bell. Formula can be modified to suit the company."],
["Weighted-point worked example (illustrative)","Weights: quality 40, delivery 25, price 20, service 15. Vendor A scores 90, 80, 70, 60: rating = 0.40x90 + 0.25x80 + 0.20x70 + 0.15x60 = 36 + 20 + 14 + 9 = 79. A second vendor is compared in the rebuilt table below. The slide's own vendor rating format was an image.","W"],
["Advantages","Minimises subjectivity and covers all relevant criteria; feedback from all areas in one package; better communication with vendors; overall control of the vendor base; requires specific action on weaknesses; continuous review standards, so continuous improvement."]],["vrate"]],
["Lecture 39 - Supply Chain Coordination","Like an orchestra: each section can play well alone, but without a shared score and conductor the music falls apart.",[
["Coordination","Strategic alignment and integration of processes, activities and information flow among suppliers, manufacturers, distributors, retailers to optimise overall performance: efficiency, lower cost, responsiveness, timely delivery. Elements: demand forecasting, inventory management, production planning, transportation logistics, communication systems."],
["Coordination with suppliers","Demand forecasting: collaborative forecasting (predict future demand so suppliers can adjust production schedules) and real-time information sharing. Inventory: vendor-managed inventory (suppliers manage stock at the manufacturer or distributor) and JIT delivery. Quality: agreed standards, continuous improvement via feedback and reviews. Communication: regular meetings, integrated IT systems."],
["Coordination with distributors","Order fulfilment (order management systems, coordinated distribution planning); inventory (stock replenishment, safety stock); customer service (reliable delivery, returns management); data sharing (sales data, KPIs such as order accuracy, delivery times, satisfaction); collaboration (joint business planning, real-time communication)."],
["Supplier-distributor interaction","Supplier delivers to the distributor on a purchase order; both track inventory; the distributor gets a production plan from the manufacturer; finished goods go to the distributor's warehouse; the distributor fills retailer orders through delivery and transportation; retailers sell to customers. Coordination points: purchase orders, production plan, inventory management, delivery and transportation."],
["Lack of coordination and bullwhip","Ineffective communication among entities causes inefficiency. Bullwhip causes: demand forecasting inaccuracies, order batching, price fluctuations, lack of information sharing. Impacts: increased costs, excess inventory, stock-outs, poor customer service."],
["5 obstacles to coordination","Inventive (lack of resources or expertise for new technology; resistance to change). Information processing (data inaccuracies, delays in sharing; inadequate systems). Operational (capacity constraints, bottlenecks, transport delays, quality problems). Pricing (conflicting objectives, lack of transparency, power imbalance). Behavioural (lack of trust, poor collaboration and communication)."],
["Managerial action 1: align goals and incentives","Maximise total supply chain surplus, not individual profit; align functions with profitability. Pricing for coordination: lot-size-based quantity discounts, two-part tariffs, volume discounts; contracts: buyback, revenue sharing, quantity flexibility. Alter sales force incentives from sell-in to sell-through to reduce forward buying."],
["Managerial action 2: information visibility and accuracy","Share point-of-sale data; collaborative forecasting and planning (common forecast); single-stage control of replenishment (continuous replenishment programs, vendor-managed inventories)."],
["Managerial action 3: operational performance","Reduce replenishment lead time (electronic ordering, flexible manufacturing, cross-docking); reduce lot sizes; ration based on past sales and share information to limit gaming (order inflation)."],
["Managerial action 4: stabilise orders by pricing","Move from lot-size-based to volume-based quantity discounts (over a rolling horizon); stabilise pricing: eliminate promotions, use everyday low pricing, tie promotion dollars to sell-through."],
["Managerial action 5: partnerships and trust","Trust and information sharing lower transaction costs and duplication; clear roles, effective contracts and conflict resolution make the chain responsive."],
["Macro processes","CRM: processes at the firm-customer interface. ISCM: processes internal to the firm. SRM: processes at the firm-supplier interface."],
["Case: Amazon CRM","Personalised recommendations from past purchases and browsing; one-click ordering; order visibility from placement to delivery; call-back option when call-centre volume is high. 2008 top CRM vendors (Gartner): SAP 22.5%, Oracle 16.1%, Salesforce.com 10.6%, Microsoft 6.4%, Amdocs 4.9%; Amazon relies on in-house development."],
["Case: Hindustan Oil Company (HOC)","Oil industry leader through efficient supply chain, quality control, R&D, customer focus; refining, marketing, distribution of petroleum products; sustainability and carbon-footprint initiatives."],
["Conclusion","Coordination built on trust, transparency and shared goals gives efficiency and advantage; CRM manages customer interactions; CPFR enables joint planning, demand visibility and inventory management."]],["whip","macro"]],
["Lectures 40-41 - Supply Chain Performance and the Balanced Scorecard","Like a pilot's dashboard: no single dial tells you if the flight is safe; you need fuel, speed, altitude and weather together.",[
["Supply chain performance","Effectiveness and efficiency of each stage in optimising cost, reducing inefficiency, increasing speed and meeting customer expectations; metrics such as on-time delivery, stock availability, order accuracy, production lead times. Measures are qualitative (customer satisfaction, product quality) or quantitative (order-to-delivery lead time, response time, flexibility, resource utilisation, delivery performance)."],
["Financial measures","Cost of raw materials; revenue from goods sold; activity-based costs (material handling, manufacturing, assembling); inventory holding cost; transportation cost; cost of expired perishables; penalties for incorrectly filled or late orders; credits for incorrect or late supplier deliveries; cost of goods returned by customers; credits for goods returned to suppliers."],
["Non-financial measures","Cycle time (supply chain lead time: raw material to customer's address; order-to-delivery lead time: order placement to delivery). Customer service level (order fill rate, stock-out rate, backorder level, probability of on-time delivery). Inventory levels: raw materials, work-in-process, finished goods, spare parts. Resource utilisation: manufacturing, storage, logistics, human, financial resources. Also ability to perform, flexibility, quality."],
["Qualitative measures","Customer satisfaction, customer complaints, customer response time, product quality, delivery experience (on or before due date), order accuracy."],
["Balanced Scorecard (BSC)","Developed by Robert Kaplan and David Norton: a strategic planning and management system aligning business activities to vision and strategy, improving communication, and monitoring performance against goals, with financial and non-financial indicators across four perspectives: financial, customer, internal business processes, learning and growth. Nearly 60% of Fortune 500 companies use some form."],
["BSC supply chain KPIs","Financial: cost reduction, ROI, revenue growth. Customer: order fulfilment rate (on time and in full), customer satisfaction scores, lead time. Internal process: cycle time, inventory turnover, supply chain flexibility. Learning and growth: employee training and development, technology utilisation, innovation rate."],
["Implementing BSC (5 steps)","Define strategic objectives; develop specific metrics (clear, measurable, aligned); collect and analyse data (real-time systems); review and adjust; foster collaboration across departments and partners."],
["BSC benefits and pitfalls","Benefits: holistic measurement, strategic alignment, better decisions, continuous improvement; turns strategy into daily marching orders. Pitfalls: lack of a well-defined strategy; too much focus on lagging measures; generic metrics copied from other firms; self-serving managers chasing bonuses."],
["BSC example (manufacturing excellence)","Strategy map: financial (improve productivity, grow revenue; long-term shareholder value, ROCE); customer (low cost, world-class quality and delivery timing, skilled partner, brand image); internal (operational excellence, process innovation, socially responsible: productivity, delivery, kaizen, safety, environment, ISO 9002); learning and growth (skills, information systems, strategic awareness)."],
["QDC performance indices","Quality (QPI), delivery (DPI), cost (CPI) indices: single measures emphasising important characteristics of performance."],
["QPI formulas","Percentage of rejection = defects received / total items received x 100. DPMO = defects found / total items tested x 10^6. Supplier rejection % = number of rejections / total suppliers x 100. Percentage non-compliance = non-compliances / total observations x 100. Non-compliance rectified % = rectified / total non-compliance x 100."],
["DPI formulas","Supplier on-time and in-full delivery = orders fulfilled on time and in full / total purchase orders placed x 100. Delivery in full, on time = % delivery in full x % delivery on time - % rejected. Supplier lead time variability = actual delivery time - lead time. Overall lead time variability = actual delivery time - required lead time. % shipments in good condition = non-defective shipments / total shipments received x 100. Average delivery time = sum of periods from dispatch to receipt / number of shipments."],
["CPI and procurement cost indices","Cost Performance Index (earned value management) = Earned Value / Actual Cost; CPI = 1 on budget, CPI &gt; 1 under budget, CPI &lt; 1 over budget; Earned Value = Planned Value x % complete. Cost avoidance = actual purchasing price - lowest price quoted. Cost reduction = actual purchasing price - lowest price paid (as written on the slide). Procurement ROI = (cost reduction + cost avoidance) / cost of procurement operations. Procurement cost as % of sales = total procurement costs / total sales value x 100."],
