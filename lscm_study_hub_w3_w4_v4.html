<script>
"use strict";
const $=s=>document.querySelector(s);
/* Each section: [title, analogy, [[term, detail],...], optional flow]. Flashcards are generated from these. */
const N={3:[
["Lecture 12 - Reverse Logistics (1): concept, importance","Like returning an empty gas cylinder to the supplier: the flow runs backwards from customer to seller.",[
["What it is","Traditional logistics with the flow in the opposite direction; the movement concerns waste and returns. Defined as taking waste and returns along the supply chain and reworking them (or parts of them) to create a new product that can be sold (Stanislawski & Szymonik, 2023)."],
["Other names","Retro logistics, reverse supply chain, reverse logistics flow, reverse flow, backward supply chain, returns management, aftermarket logistics, aftermarket supply chain."],
["Lambert & Stock","Reverse distribution is 'going the wrong way on a one way street' because the great majority of product shipments flow in one direction."],
["Carter & Ellram","The return, upstream movement of a good or material from reuse, recycling or disposal; linked to environmental, quality and wear-dating issues; often performed by new, auxiliary channel members."],
["Thierry et al.","Places reverse logistics under the umbrella of product recovery management."],
["Rogers & Tibben-Lembke","Adapting the Council of Logistics Management definition: planning, implementing and controlling the efficient, cost-effective flow of raw materials, in-process inventory, finished goods and related information from the point of consumption to the point of origin, for recapturing value or proper disposal."],
["Reverse vs forward","Forward flow = raw materials and components needed for production. Reverse flow = everything coming from the consumer that is waste or a return."],
["Reverse vs green logistics","Identifying them as the same is a mistake. Green logistics relates to environmentally friendly resources and their transformation in ways that are favourable to people and not harmful to the environment."],
["Types of returns","Return of unused products; commercial returns; returns of products under warranty; wastes and products from network activities (supply chain and reverse logistics); packaging."],
["Why important: legislation","Several countries, especially in Europe, force manufacturers to take back products after use. Netherlands (from January 1999): manufacturers and importers of white and brown goods must take back and recover products; similar rule for cars. Germany: Packaging Ordinance requires companies to collect all sales packaging."],
["Why important: economics","Landfill space is depleting and landfill cost rose sharply: US national average tipping fee went from $8 to about $49.78 between 1985 and 2010 (about 600%). Recovery systems became more profitable for automobile parts, copiers, computers, tyres and aviation equipment. Reverse logistics is now a strategic part of business planning."],
["Why important: environment","Reduces costs while ensuring sustainability, helps adhere to environmental legislation, and lets a company project itself as 'green' (an increasingly important marketing element)."],
["Why important: services shift","Consumers increasingly buy a set of services with products (e.g. maintenance contracts covering repairs and parts), which facilitates take-back of end-of-life products."],
["E-waste example","E-waste is among the fastest-growing waste types; 80% of mobile phones are upgraded every two years. Sources: households, industries, institutions (schools, hospitals, government). Collection via municipal points, electronic industries, retailers, informal and formal recycling. Informal recycling is common in developing countries such as India and South Africa, where methods are rudimentary and much e-waste ends in uncontrolled landfills."]]],
["Lecture 13 - Reverse Logistics (2): aspects, process, success factors, measures, cases","Like a repair-and-recycle depot: every returned item is checked at the door, sorted, then fixed, resold, recycled or, as a last resort, dumped.",[
["Key aspect: product returns","Returns due to defects, damage, overstock or dissatisfaction: receiving, inspecting, refurbishing, repackaging."],
["Key aspect: remanufacturing and refurbishment","Restore returned or used products to functional or marketable condition: disassembly, repair, cleaning, reassembly."],
["Key aspect: recycling and disposal","Recycling packaging, extracting valuable materials from end-of-life products, disposing hazardous waste responsibly."],
["Key aspect: warranty and service management","Handling warranty claims, service requests and repairs with service providers, suppliers and customers."],
["Key aspect: asset recovery and remarketing","Recover value through resale, remarketing, redistribution: selling refurbished products, liquidating excess inventory, repurposing assets."],
["Key aspect: supply chain optimization","Use reverse processes to improve efficiency, cut cost, improve sustainability: reverse logistics software, route optimization, integration with forward logistics."],
["Process (Ait-Kadi et al., 2013)","Gatekeeping, collection, sorting, processing (treatment), disposal."],
["Gatekeeping","Controls product entrance into the reverse system; blocks returns that do not belong to the business or where there is no contract or legal obligation. Usually ends in acceptance or rejection."],
["Collection","Recovery and transport of returned products; can be handled by customers, third parties or the business. Canon: in 1990 launched an ink cartridge collection programme with a pre-paid shipping coupon in new cartridge packaging; now collection in 24 countries via retailers, a logistics service provider or direct shipping."],
["Sorting","Validates the information from gatekeeping; products sorted by condition and reason for return."],
["Processing and treatment","Three sub-steps: choose from the processing activities the business offers (limited by stock levels and sale possibility, and by product nature, age, condition), then process. Options: repackaging, repair, disassembling, reconfiguring, remanufacturing, updating or upgrading, recycling, donating, selling on secondary markets, incinerating, disposing."],
["Remanufacturing vs repair","Remanufacturing reworks modules, components or whole products to a state equivalent to new; unlike repair, it systematically replaces a larger number of used or defective modules or components."],
["Disposal","Landfill or incinerator, used as a last resort. Ensure no hazardous materials in the waste (or treat them to comply with laws and policy); incinerators should at least recover heat energy (vapour turned into electricity)."],
["Success factors (10)","Visibility and transparency; efficient returns management; product recovery and disposition; collaboration with partners; network design; technology and data analytics; compliance and regulation; customer experience and satisfaction; continuous improvement and innovation; sustainability and corporate responsibility."],
["Visibility and transparency","Track returned products, their condition and movement; reveals bottlenecks and delays."],
["Efficient returns management","Clear return policies, convenient return options, streamlined processing to minimise delays and errors."],
["Network design","Strategically locate return centres, refurbishment facilities, recycling centres and disposal sites to cut transport cost, lead time and improve resource use."],
["Technology and data analytics","Tracking and tracing systems, automated sorting and processing, predictive analytics: real-time visibility, faster decisions, proactive problem-solving."],
["Performance measures","Return rate (% of units sold that are returned); return processing time; recovery rate (% of returns refurbished, repaired, resold or recycled); regulatory compliance; disposition cost; transportation cost; inventory holding cost; customer education and communication; customer satisfaction; environmental impact (carbon, energy, water, waste); continuous improvement; supplier collaboration; training and skills; technology adoption (RFID, IoT sensors, AI); risk management and contingency planning; reverse supply chain integration; circular economy initiatives; metrics alignment; stakeholder engagement."],
["Case: Amazon","No-fuss returns and training programmes. National Retail Federation: record $761 billion of merchandise returned in 2021; 16.6% of holiday-season merchandise returned (up over 56% on the year before); online return rate nearly 21% (18% in 2020). Free, fast returns attract customers but raise volume and cost. Product donation: software identifies and sorts items fit for donation at fulfilment centres. Samsung 49-inch TV in SIPP packaging: eliminates nine packaging components, package volume down 69%, air shipped down 87%."],
["Case: IKEA","Generous return policy; refurbishment centres (inspect, repair, clean, new finishes); material recovery facilities (separate wood, metal, plastics for recycling); circular design (durability, repairability, recyclability). Goal: carbon neutral by 2030."]],],
["Lecture 14 - Green Logistics","Like a kitchen that sorts waste and buys local: green SCM is the whole kitchen; green logistics is only the delivery bike.",[
["GSCM","The component reflecting the relationship between the natural environment and supply chain operations; includes external and internal factors that influence logistics management, and measures supply chain performance on environmental aspects."],
["GSCM practices","Green transportation (freight CO2 emissions rising since the 1990s; 71% in 2016 and expected to rise 50% more by 2050); green procurement and logistics (buying products and services less harmful to environment at competitive prices); green warehouse (adequate stock to avoid waste, lower transport cost); green design; green manufacturing (little to no pollution or waste); green marketing."],
["Green logistics","Eco-friendly logistics: managing flow of goods and resources to minimise environmental impact; reduces carbon emissions, energy use, waste across transport, warehousing, distribution. Examples: alternative fuels, route optimization, energy-efficient vehicles, less packaging waste, reverse logistics, eco-friendly packaging. Before the 1960s there was little concern; the environment was seen as able to absorb waste and replace resources without limit (Murphy & Poist, 1995)."],
["GSCM vs green logistics","Scope: entire process from raw material extraction to delivery vs transportation and distribution only. Activities: sustainable sourcing, efficient manufacturing, recycling, eco packaging vs route optimization, low-emission vehicles, efficient WMS, sustainable packaging. Objective: minimise environmental impact of whole chain while keeping efficiency and profit vs make logistics more environmentally friendly by cutting GHG, energy and resource use."],
["Challenges","Rising raw material prices; COVID-19 disruption (sourcing difficulty, higher prices); need to change management ideas and existing models toward 'energy conservation, environmental protection and low consumption'."],
["Key technologies","Green transport technologies (cut GHG, air pollution, noise, space use); green vehicle routing considering CO2-equivalent emissions; logistics solutions for carbon neutrality (green procurement, packaging, warehousing; tackling the last-mile challenge); horizontal collaboration (pooling logistics activities and consolidating supply chains of two or more manufacturers); logistics agglomeration in clusters; decarbonization = measure emissions, set reduction targets, assess carbon-reducing options; road freight is a major contributor so alternative fuels matter."],
["KPI: reverse chain performance","% of returns refurbished or recycled, processing time, cost per unit of managing returns."],
["KPI: circular economy transition","% raw materials from recycled or renewable sources; % reduction in waste; ROI of circular initiatives."],
["KPI: environmental and financial","Correlation between environmental indicators (carbon footprint, energy) and financial indicators (profit margin, ROI); cost-benefit analysis; fuel efficiency (fuel per distance or per weight); route optimization effectiveness."],
["KPI: sustainability and waste","% reduction in waste per unit output; recycling rate; energy efficiency ratio."],
["KPI: TOVE","Transportation Overall Vehicle Effectiveness. Vehicle utilization rate = actual payload weight / maximum payload capacity."],
["Standards and frameworks","EN 16258 and ISO 14083 (measure and report GHG and energy in transport); GLEC Framework (Global Logistics Emissions Council: calculate direct and indirect emissions); harmonization of emissions calculations for consistency and benchmarking."],
["Carbon footprint formulas","Footprint = emissions from transport + warehousing + other logistics. Emissions = activity level x emission factor. Electricity: kWh/yr x 0.85 = kg CO2. Petrol: litres/yr x 2.296 = kg CO2. Diesel: litres/yr x 2.653 = kg CO2."],
["Case: DHL","Founded 1969 by Adrian Dalsey, Larry Hillblom and Robert Lynn; operates in 220 countries; CSR and sustainability focus since 2009; GoGreen programme. Aimed to reduce carbon emission to 50%, resulting in pollution emission reduced to 70% (as stated on the slide); clean pickup and delivery using electrified vehicles and bicycles; training for suppliers and employees."],
["Case: Myntra (green packaging)","Plastic-free packaging also adopted by seller partners. Replaced poly pouches with recycled paper bags, bubble wrap with carton waste shredded material, plastic tape with paper tape, invoice polybags with recycled Kraft paper pouch, and used RFID-tagged multi-use polyester bags. Diverted 670 tonnes of plastic (as of September 2021). 'E-commerce-ready packaging' removes the secondary packaging layer. Partnered with Canopy (no deforestation) and Better Cotton Initiative; two fulfilment centres solar powered."],
["Case: IKEA (green transport)","Travel plans for staff (bicycle, walking, bus, car-sharing); loading shelves instead of wooden pallets cut space and cost. 2019 report: transport emissions 19.4%. Goals: cut GHG from transport by 30% in 2020 and reach 70% reduction by 2030."],
["Future prospects","Battery electric vehicles (BEV) best for short city routes; fuel cell vehicles (FCV) for longer routes, huge trucks, buses; both emit no GHG or air pollutants. Data envelopment analysis (DEA) evaluates efficiency of green practices. Supplier selection matters: green purchasing ability, green competencies, environmental management, investments, regulatory compliance."]]],
["Lecture 15 - Lean Logistics (1): definition, 3Ms, principles, KPIs","Like packing a trekking backpack: carry only what adds value; every extra kilo is waste.",[
["Lean logistics","Approach to supply chain management focused on eliminating waste, improving efficiency, streamlining processes, creating constant flow, enhancing collaboration and achieving quality, while cutting costs and maintaining or improving service (Paul Myerson, 2012). Also: recognising and eliminating wasteful activities to increase product flow and speed (Alan Harrison, 2011)."],
["Benefits","Improved efficiency, reduced costs, improved customer service, increased profitability; more agile, responsive supply chain."],
["History","Rooted in lean manufacturing from Japan. Term coined by John Krafcik in his 1988 master's thesis at MIT. Lean manufacturing pioneered by Toyota engineer Taiichi Ohno in the 1970s. Logistics cost is 5-15% of turnover in industry and 15-25% in retail."],
["Muda = waste","Any activity or process that does not add value. Seven types (categorized by Taiichi Ohno in the Toyota Production System): Transport (movement between operations and locations); Inventory (WIP, finished goods, raw material stock); Motion (movement of a person or machine during an operation); Waiting (for a machine, product to arrive, etc.); Overproduction (beyond what the customer ordered); Over-processing (operations beyond what the customer requires); Defects (rejects and rework)."],
["Other wastes","Talent (unused skills and knowledge); resources (lights and idle machines left on); by-products (not used). Tools to remove waste: Poka-yoke, Kanban, Takt time, SMED, one-piece flow."],
["Waste sources in logistics","Inventory (keep minimum), warehousing (an extra stop that adds cost and risk), trucks (each loading is motion), travel (time on the road; combine shipments), people (reallocate to productive tasks), e-vehicles (support waste reduction and sustainability)."],
["Muri = overburden","Unnecessary stress on employees and processes; causes breakdowns of machines and absenteeism of employees. Caused by Mura and failures such as lack of training, unclear ways of working, wrong tools, poor performance measures. Examples: untrained work, poor layouts, unclear instructions, lack of tools, fluctuating demand, poor maintenance, unreliable processes, poor communication."],
["Mura = unevenness","Waste of unevenness or inconsistency; Mura drives Muda. Example: manager measured on monthly output, department rushes in the last week, over-uses components, then the first week is slow, giving a 'hockey stick' production graph. Better to smooth production to customer demand."],
["Principles (5)","Eliminating waste; improving efficiency (cycle times, throughput, right materials at right time); streamlining processes (remove redundant steps, improve visibility, automate); creating constant flow (inventory levels, lead times, information flow); enhancing collaboration (suppliers, manufacturers, customers); achieving quality (accuracy, consistency, reliability, quality standards)."],
["KPIs","On-time delivery; lead time; inventory turnover; order accuracy; transportation cost per unit; warehouse utilization; cycle time; dock-to-stock time (from receipt at dock to stored on racks); return rate; order fulfilment cycle time; perfect order rate; backorder rate; supplier on-time delivery; order lead time variability; shipment damage rate; sustainability metrics; employee engagement and training metrics."]]],
["Lecture 16 - Lean Logistics (2): methodologies and Value Stream Mapping","Like a fitness plan: first map where you are (VSM), then fix what is wasteful.",[
["Methodologies","Value stream mapping; JIT inventory management; standardized work procedures; continuous improvement culture (Kaizen events, suggestion systems); supplier collaboration; Lean Six Sigma (DMAIC, root cause analysis); technology integration (WMS, TMS, inventory optimization); sustainable packaging; route optimization; performance-based contracts; demand forecasting and planning; modular transportation (intermodal, containerization); reverse logistics optimization; performance measurement and monitoring."],
["Value Stream Mapping (VSM)","Identifies waste, inefficiencies and bottlenecks and develops strategies to remove them. Maps the whole value stream from customer request to delivery. Defines value from the customer's perspective. A visual representation of every step including material flows, information flows and process times. Quote by W. Edwards Deming: 'If you can't describe what you are doing as a process, you don't know what you're doing.'"],
["VSM step 1: Prepare","Document the case for change, define scope (start and end of process), identify requirements, review measurements; set logistics for the event (participants, location, materials)."],
["VSM step 2: Gather data (current state)","Walk the value stream, follow item and information flow; collect per step: trigger/done, actual lead time, actual cycle time, on-time delivery, defect rate, batch sizes, quality, variations, output, staffing, overtime, work in process. Map flow of items and information; add data and issues."],
["VSM step 3: Future state and action plans","Discuss ideal state, develop future state map, action plans and cadence tracking, draft timeline, communication and training."],
["VSM step 4: Execute to plan","Implement improvements through workshops, events, projects; achieve value stream objectives; create continuous improvement environment."],
["VSM step 5: Align","Periodic alignment meeting: review results and impact on metrics, next quarter events, business changes; update plans; address resistance and sustainment."],
["Worked example (stapling)","Steps: pick up paper (1 s), walk to stapler (5 s, 20 ft), staple paper (2 s), walk to desk (5 s, 20 ft), put down paper (1 s). Total time 14 s, total distance 40 ft, value-added time 4 s, value-added distance 0, so value-added time = 28% (the two walks are excess travel). Customer need: stapled pages. Source: Dickson Chiu (2006)."]],
[["Prepare","Gather data","Future state","Execute","Align"]]],
["Lecture 17 - Lean Logistics (3): DMAIC, JIT, 5S, Kaizen, SMED, challenges, Toyota case","Like running a restaurant kitchen: define the dish, measure the waste, fix it, then keep it that way.",[
["DMAIC","Define: agree scope, goals and financial targets with sponsor. Measure: establish current-state performance (VSM and capability measures). Analyze: root causes of deviation from customer requirements. Improve: verify critical outputs, design improvements, pilot; outputs are new KPIs, action plans, future state maps, control plans, documentation. Control: monitoring systems for KPIs, control plans for deviations, corrective actions, continuous review."],
["JIT (Just-in-Time)","Management philosophy that minimises inventory and waste by producing goods only as needed; reduces storage cost, excess inventory, obsolescence. Needs close supplier coordination and flexibility. JIT cycle steps: Design, Manage (TQM review), Pull (Kanban signalling, smaller lots), Establish (vendor relationships), Fine-tune (inventory policies), Build (team skills), Refine (fewer parts and steps), Review (quality metrics, root cause analysis)."],
["5S","Sort (Seiri): separate essential from non-essential. Set in order (Seiton): organise remaining items in designated locations. Shine (Seiso): clean and maintain for hygiene and safety. Standardize (Seiketsu): standard procedures to keep improvements. Sustain (Shitsuke): discipline and culture so employees uphold the first four daily."],
["Kaizen","Continuous improvement via small steps: easier and faster, lower risk, accumulated effect often greater than one big improvement. Linked to the Deming cycle."],
["SMED","Single-Minute Exchange of Die: rapid changeover from running one product to the next. 'Single minute' = changeovers and start-ups under 10 minutes (single-digit minutes). One-Touch Exchange of Die (OTED): under 100 seconds."],
["Challenges in implementing lean","Cultural resistance; lack of leadership commitment; silo mentality; limited employee engagement; inadequate training and skills; measurement and accountability; sustainability of gains; external factors (market, regulation, downturns)."],
["TPS founders and JIT origin","Toyota founder Kiichiro Toyoda; TPS founders Taiichi Ohno (1912-1990) and Shigeo Shingo (1909-1990). The phrase Just-in-Time was coined by Kiichiro Toyoda in 1937 because the young company was poor and could not afford excess equipment or material. After WWII Ohno was tasked with improving productivity and driving in Just-in-Time and Jidoka."],
["7 principles of TPS","Reduced setup time; small-lot production; employee involvement and empowerment; quality at the source; equipment maintenance; pull production; supplier involvement."],
["Poka-yoke","Mistake or error proofing: low-cost, highly reliable devices that detect abnormal situations before they occur or, once they occur, stop the machine and prevent defective products."],
["Heijunka","Production smoothing: a levelling technique supporting JIT, smoothing production across departments and suppliers over time; reduces waste by levelling fluctuations in performance within the assembly line; TPS uses it to handle fluctuating customer demand."],
["Standardization","Standardized work has three elements: takt time, working sequence, standard in-process stock. Critical ingredient for Jidoka and JIT; consistent methods limit variation."],
["Toyota performance","Per-head production rose 80% after TPS (39.7 to 70.8 vehicles). Market share: 1970 GM 40% vs Toyota 2%; Toyota 3% in 1980, 8% in 1990, 9% in 2000, 13% in 2006 (GM 26%). Described by the Japanese word 'jojo': slowly, gradually, steadily."]],
[["Define","Measure","Analyze","Improve","Control"]]]],
4:[
["Lecture 18 - Trends in Logistics (1): history, categories, stakeholders, technology","Like a city's traffic system: many different vehicles and authorities, increasingly run by sensors and software.",[
["History","Traced to military contexts. Computing advances in the 1960s and 1970s drove mathematical modelling in logistics. Consolidation into functional departments and growth of third-party transport and LSPs led to the 'Industrialization of Services'. UPS, FedEx and Walmart pioneered industrialization of logistics services. E-logistics then RFID and the 'Internet of Things' (internet technologies + RFID objects + decentralised control)."],
["Categories of modern logistics (Behrends, 2016)","Retail; consumer shopping trips; Couriers, Express and Parcel (CEP: global networks, cross-dock terminals); HoReCa (hotels, restaurants, catering: frequent Just-In-Time deliveries); construction (irregular but timely supply); waste management; industrial and terminal haulage."],
["Stakeholders (Behrends, 2016)","Shippers and receivers (decide shipment size, frequency, lead time, delivery precision); public authorities (land-use, traffic planning, infrastructure; boost economy while limiting freight impact on residents); carriers (own-account or third-party; high utilization with required service quality)."],
["Technology trends","Automation, IoT, cloud computing, AI, digital twins; plus blockchain, advanced data analytics, robotics, augmented reality, advanced geolocation. Future trends: elastic logistics, green logistics, last-mile delivery, autonomous vehicles, on-demand warehousing."],
["Elastic logistics","Ability of a business to rapidly reduce or expand logistics activities and infrastructure in line with supply chain demand using data-driven technology."],
["Automation, IoT, cloud","Automation: software or machinery taking over part of manual tasks. IoT automates warehouse operations and optimises space use. Cloud: on-demand access to logistics software, storage and processing; real-time shipment tracking."],
["Robots, AI, AR, digital twins","Logistics robots store and move goods (intralogistics). AI optimises routes and schedules from delivery locations and inventory levels. AR-enhanced warehousing lays shortest routes to find items. Digital twins test disruptions, outlier and black swan events without affecting real operations. GPS, BLE, Wi-Fi, cellular and IoT trackers support tracking."],
["Cold chain logistics","Management and transport of temperature-sensitive products (perishables, pharmaceuticals) in a controlled environment to maintain quality and integrity. Components: temperature control; packaging (insulated containers, refrigerated trucks); monitoring and tracking; risk management (equipment failure, temperature excursions); regulatory compliance (FDA, WHO)."],
["Blockchain","Decentralised, distributed ledger giving transparency, traceability and security without intermediaries. Elements: transparency and traceability (tamper-proof record); enhanced visibility; improved security (cryptography, consensus); streamlined processes via smart contracts; reduced cost and delays. It identifies non-compliance with standards or product damage during transport."],
["Smart contract","Self-executing contract with predefined rules and conditions, automatically enforced when criteria are met, reducing manual intervention. Helps with fraud, administrative errors and wasted time."],
["Big data roles","Predictive analytics (historical and real-time data to forecast demand, optimise inventory, anticipate disruptions); route optimization (traffic, weather, performance data); warehouse management (layout, picking time, high-demand items); demand forecasting; supply chain visibility; risk management (supplier failure, disasters, geopolitical events)."]]],
["Lecture 19 - Trends in Logistics (2): drivers, India, challenges, measures, cases","Like online shopping: customers want live tracking, small frequent parcels and green delivery, so every layer has to be digital.",[
["Factors fostering innovation","Supply chain agility; global labour shortages; automation complexity; demand for real-time data; transparency for critical collaborations; Less Than Truckload demand; digitally evolving business; API-based integrations; demand forecasting; digital freight marketplaces; ecosystem integration."],
["Agility and labour","Self-managed onboarding avoids weeks of waiting in a managed-service queue (onboard a client in hours). Labour shortage pushes automation: machine picking and packing; driverless truck platoons where the second truck mimics the first truck's human driver."],
["Automation complexity and real-time data","End-to-end integration of WMS/ERP with eCommerce platforms removes manual data compilation. The 'Amazon effect' (2-day, same-day shipping) makes customers expect live order location and delivery windows; WMS/ERP links to visibility platforms such as project44 or FourKites."],
["EDI and APIs","EDI starts and orchestrates business processes; APIs give deeper insight. APIs do real-time processing instead of batch processing, so partners get more frequent updates."],
["Less Than Truckload (LTL)","Multiple smaller orders from various companies share one carrier, giving a full load with many stops. Benefits: cost (pay only for the space used), eCommerce friendly, small-business friendly, environmentally conscious (fuller loads, fewer trips, lower emissions)."],
["Demand forecasting","Estimating future customer demand from data such as sales history, seasonality, economy, market trends, pricing, competition, so employees, materials and schedules are planned."],
["Digital freight marketplaces","Digital networks where shippers and carriers connect; shippers compare carriers' times, prices and services in one place; carriers reach more customers."],
["Ecosystem integration","One all-encompassing integration platform for internal and external systems: fewer errors, lower complexity, usually cheaper than multiple tools, real-time data sharing."],
["India: digital transformation","IoT fleet management systems give real-time vehicle performance, fuel consumption and driver behaviour data."],
["India: last-mile innovation","Drones, autonomous vehicles, crowd-shipping. Flipkart piloted drone deliveries in some areas to beat traffic bottlenecks."],
["India: sustainable practices","Amazon India committed to a 100% electric delivery fleet by 2030."],
["India: warehouse automation","DHL eCommerce India automated sortation centre in Delhi handles up to 6,000 shipments per hour."],
["India: predictive analytics","Delhivery uses predictive analytics to optimise delivery routes."],
["India: collaboration and e-commerce focus","BlackBuck: digital freight platform connecting shippers and truckers. Ekart (Flipkart's logistics arm): faster delivery, hassle-free returns."],
["Challenges","Supply chain disruptions (wildfires, floods, wars, strikes, low Panama Canal water; need resilience); trading partners failing commitments (80% of companies reported failures; 27% had 11+ partners fail; 29% plan new partners); labour shortages; rising operational costs (32% will invest in supply chain tech; 43% say ecosystem integration cuts costs; 33% say it raises revenue and profit); sustainability targets (45% call it critical; laws are tightening; 32% say integration removes data silos)."],
["Performance measures for modern logistics","Efficiency (order fulfilment time, cycle time, resource utilization); cost-effectiveness (operating and transport costs); customer satisfaction (on-time delivery, order accuracy, feedback); environmental impact (carbon emissions, fuel consumption, waste generation); flexibility and agility (response time to demand change, lead time variability, inventory turnover); innovation adoption (implementation rate, user adoption, ROI); supply chain visibility (tracking accuracy, inventory visibility, real-time monitoring)."],
["Case: DHL","Invested $350 million to digitise operations; built end-to-end visibility solution MySupplyChain using predictive analytics."],
["Case: Amazon anticipatory shipping","Predicts when, where and which items customers will purchase based on buying habit history in particular areas; a popular item ships from a nearby hub faster. Also predicts how many drivers are needed, number of shipments, and best vehicle storage, improving last-mile sustainability."],
["Case: Swiggy and Flipkart","Swiggy: hyperlocal delivery networks with local restaurants and delivery partners (faster, fresher). Flipkart: last-mile partnerships with local logistics providers for faster delivery, wider coverage and reach into remote areas."]]],
["Lecture 20 - Logistics vs Supply Chain Management","Like a football match: logistics is the passing and positioning of the ball; SCM is the whole team strategy that sets up the game.",[
["Terminology","The terms are often used interchangeably; what is called SCM in the US is more commonly called logistics management in Europe. Perspectives vary: some say no difference; others say SCM includes logistics and logistics is a set of sub-processes within SCM."],
["Supply chain management","Collaboration between firms connecting suppliers, customers and partners to boost efficiency and create value for the end consumer (Michigan State University). Strategic decisions that set the operational framework within which logistics is performed."],
["Logistics (CSCMP definition)","Part of the supply chain process that plans, implements and controls the efficient, effective forward and reverse flow and storage of goods, services and related information between point of origin and point of consumption to meet customer requirements. Includes demand planning, inventory management, transportation, fleet management, material handling, order fulfilment."],
["Inbound vs outbound","Inbound: material acquisition, handling, transportation, storage. Outbound: collection, maintenance, distribution and transport of goods to the end user. Objective: right quality, right price, right time, right place."],
["What they share","Both focus on goods, services or information; both support company success and differentiation; both increase customer satisfaction; both follow the flow supplier, manufacturer, wholesaler, retailer or consumer."],
["Key differences","Logistics: movement, storage and flow of goods, services, information; focus on meeting customer requirements; old term (military origin; Alexander the Great, born 356 B.C., credited as a logistics master); an activity within the supply chain. SCM: links major business processes within and across companies into a high-performance model; focus on competitive advantage; relatively new term (20th century); covers production and inventory planning, labour planning, materials and facilities management, manufacturing and delivery. Many experts credit logistician Keith Oliver with coining 'supply chain management' in the early 1980s."],
["Why logistics matters","Right products at right time; cut cost and raise efficiency; retain customers and loyalty; unique value proposition; deliver from the most cost-effective production location to the customer."],
["Logistical components","Information; storage; warehousing (receiving, put-away, picking, packing, shipping, returns); material handling; packaging; unitization; inventory control; transportation (cars, trains, trucks, planes, ships)."],
["Logistics across the supply chain","Planning: information, inventory control. Sourcing: information, material handling, transportation. Manufacturing: information, material handling, storage, warehousing, packaging, unitization, transportation. Delivering: information, warehousing, inventory management, material handling, packaging, transportation. Returning: information, packaging/unitization, material handling, transportation, warehousing."],
["Case: GEODIS","Online retailer with seasonal spikes, fast delivery promises (next or two days) and accuracy needs. Solutions: KPI monitoring, demand forecasting and planning, scalable pop-up warehouses for peaks, shipping from warehouses nearest transport hubs. Result: multi-country network, less cross-border shipping, 91% fulfilment rate for European customers."]]]]};

"Lecture 17":[["Lean vs agile logistics","Lean: objective efficient operations; method remove all waste; constraint customer service; long-term stability; productivity and utilisation; uniform, standardised work; formal planning cycles. Agile: flexibility to meet demands; customer satisfaction; constraint cost; fast reaction to changing circumstances; lead time and service level; variable work with more local control; less structured, empowered staff.","D"],["Toyota Production System house","Roof: highest quality, lowest cost, shortest lead time by eliminating wasted time and activity. Pillars: JIT (takt time, one-piece flow, pull system), culture of continuous improvement, Jidoka (manual or automatic line stop, separate operator and machine activities, error-proofing, visual control). Base: operational stability (Heijunka, standard work, TPM, value chain).","D"],["Jidoka and Poka-yoke","Principles of Jidoka: discover an abnormality, stop the process, fix the immediate problem, investigate and solve the root cause. Key components: Poka-yoke, Andon system, autonomous maintenance.","D"],["Gemba","Genchi Genbutsu: go and see. Engage: understand and ask about issues using the 5 whys. Muda, Mura, Muri: discover forms of waste. Be respectful: always. Analyse and assess the data you gathered, including the people there.","D"],["Kaizen","Kai (change) + Zen (better) = Kaizen, continuous improvement: everybody, everyday, everywhere. Successful examples on slides: easy to lubricate (gear box oil filling, before and after); difficult to inspect becomes easy to inspect (bell condition, before and after); tyre changeover time cut from 5 to 10 minutes to 5 to 10 seconds.","D"],["Continuous flow case study","Batch and push processing: 21 minutes for the first piece, lead time 30+ minutes for the total order. Continuous flow (make one, move one): 3 minutes for the first piece, 12 minutes for the total order.","D"],["JIT case study (six steps)","Customer orders a batch, company orders matching parts; correct parts arrive as needed; stored briefly; assembled shortly after arrival; assembled product ready; finished product distributed soon after assembly.","D"],["Toyota performance charts","Per-head production (ten thousand JPY, 1969-1980): Toyota highest and rising fastest, then Nissan, with GM and Ford far lower. Operating income (US$ millions, 1994-2006): Toyota rises sharply from about 2001, passing Honda and Nissan, to roughly 6,000-7,000 by 2004-2006 (read approximately from the chart).","D"]],
"Lecture 18":[["Logistics 1.0 to 4.0 (Galindo, 2016)","1.0: steam engine power and mechanisation of transport. 2.0: electric power, mass production, automation of handling systems. 3.0: computers and IT, logistics management systems (WMS, TMS), NACCS. 4.0: Internet, IoT and IoS, RFID, CPS, DM. Complexity rises with each stage. Slide timeline markers at about 1800, 1969 and 2000; 'Today 2106' appears to be a typo for 2016.","D"],["Drone last-mile system","Diagram from Eskandaripour and Boldsaikhan (2023): depot, trucks, drones and customers connected by Wi-Fi links.","D"]],
"Lecture 19":[["Challenges diagram","Five challenges around a hub: supply chain disruptions; trading partners failing to uphold commitments; labor shortages; rising operational costs; sustainability targets.","D"]],
"Lecture 20":[["Four perspectives diagram","Slide shows four Venn pictures from Larson and Halldorsson: traditionalist, re-labeling, unionist, intersectionist.","D"],["What the four perspectives mean","Traditionalist: SCM is part of logistics. Re-labeling: SCM is logistics under a new name. Unionist: logistics is a part of SCM (SCM is broader). Intersectionist: the two overlap.","W"]]};

const _WB='<span class="wb">WEB</span>',_SL='<span class="wb sl">SLIDE IMAGE</span>';
const bgx=x=>x==="W"?_WB:x==="D"?_SL:"";
function hit(list,sec,title){const T=title.toLowerCase();return list.some(p=>{let s="",t=p;const i=p.indexOf("|");if(i>-1){s=p.slice(0,i);t=p.slice(i+1)}if(s&&!sec.startsWith(s))return false;const ex=t.endsWith("$");if(ex)t=t.slice(0,-1);t=t.toLowerCase();return ex?T===t:T.startsWith(t)})}
const lvl=(sec,title)=>hit(EXAMK,sec,title)?"E":hit(KEYK,sec,title)?"K":"";
let FLT="all",HLN=true,IMPF=false;
const NUMRE=/(\$\s?\d[\d,]*(?:\.\d+)?(?:\s?(?:million|billion))?|\b\d{1,3}(?:,\d{3})+(?:\.\d+)?\b|\b\d+(?:\.\d+)?%|\b(?:1[5-9]|20)\d\d\b|\b\d{2,}(?:\.\d+)?\b)/g;
const hn=t=>HLN?t.split(/(<[^>]+>|&[#a-z0-9]+;)/).map(p=>(p[0]==="<"||p[0]==="&")?p:p.replace(NUMRE,"<mark>$1</mark>")).join(""):t;
const mkb=l=>l==="E"?'<span class="mk e" title="Directly tested in your assignment MCQs">EXAM</span>':l==="K"?'<span class="mk k" title="Key definition, list, formula or number">KEY</span>':"";
function itm(s,x){const l=lvl(s[0],x[0]);if(FLT==="imp"&&!l)return"";if(FLT==="exam"&&l!=="E")return"";return `<dt>${mkb(l)}${x[0]}${bgx(x[2])}</dt><dd class="${l}">${hn(x[1])}</dd>`}

function toolbar(){const c=cnt(),b=(f,t)=>`<button class="btn${FLT===f?" on":""}" onclick="setF('${f}')">${t}</button>`;return `<div class="tools">${b("all","All notes")}${b("imp","Exam + Key only")}${b("exam","Exam only")}<button class="btn${HLN?" on":""}" onclick="setH()">Highlight numbers: ${HLN?"ON":"OFF"}</button></div><p class="legend"><span class="mk e">EXAM</span> ${c[0]} items directly tested in your assignment MCQs &nbsp; <span class="mk k">KEY</span> ${c[1]} items: definitions, lists, formulas, numbers and cases to learn. Amber numbers are figures, dates and percentages.</p>`}

function setF(f){FLT=f;rerender()}

$("#fi").onclick=()=>{IMPF=!IMPF;$("#fi").textContent="Important only: "+(IMPF?"ON":"OFF");$("#fi").classList.toggle("on",IMPF);cards($("#fs").value)};
function notes(w){return toolbar()+`<p class="legend">${SL} = a slide that was a picture or diagram, rebuilt here. ${WB} = explanation added from internet research. Everything else is read from the slide text.</p>`+N[w].map((s,i)=>{const vz=Object.keys(VZ).find(k=>s[0].startsWith(k));return `<details${i?"":" open"}><summary>${s[0]}</summary><div class="an"><b>Analogy:</b> ${s[1]}</div><dl>${s[2].map(x=>`${itm(s,x)}`).join("")}</dl>`+(s[3]?`<div class="flow">${s[3][0].map(x=>`<span>${x}</span>`).join("<i>&rarr;</i>")}</div>`:"")+(vz?VZ[vz].map(k=>V[k]()).join(""):"")+`</details>`}).join("")}
$("#w3").innerHTML=notes(3);$("#w4").innerHTML=notes(4);
const CARDS=[].concat(...[3,4].map(w=>[].concat(...N[w].map(s=>s[2]))));
function cards(q){q=(q||"").toLowerCase();$("#fg").innerHTML=CARDS.filter(c=>(c[0]+c[1]).toLowerCase().includes(q)).map(c=>`<div class="fc"><b>${c[0]}</b>${BG(c[2])}<p>${c[1]}</p></div>`).join("")}
$("#fg").onclick=e=>{const c=e.target.closest(".fc");if(c)c.classList.toggle("f")};

return `<div class="q"><span class="tag">Week ${q[0]} assignment &middot; Q${n+1}</span><h4>${q[1]}</h4>`+
q[2].map((o,j)=>{let c="";if(s){if(j===q[3])c="ok";else if(j===s.p)c="no"}
return `<button class="o ${c}" data-i="${i}" data-o="${j}"${s?" disabled":""}>${String.fromCharCode(65+j)}) ${o}</button>`}).join("")+
(s?`<div class="ex"><b>${s.p===q[3]?"Correct.":s.p>=0?"Incorrect.":"Answer revealed."}</b> ${q[4]}</div>`:`<button class="rv" data-r="${i}">Check answer</button>`)+`</div>`}).join("");

else if(d.r!==undefined&&!S[d.r])S[d.r]={p:-1};else return;quiz()};

quiz();$("#nav button").click();
