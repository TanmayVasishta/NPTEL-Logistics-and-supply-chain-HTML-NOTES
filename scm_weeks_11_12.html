D[11]={notes:[
["Lecture 52 - Inventory Management",
IMP('Asked: <b>Minimum Stock = Buffer Stock + Safety Stock</b> and <b>decoupling inventory</b> (reserve for a second machine if the first fails).')+
`<h4>Inventory management: meaning</h4><p><b>Inventory management</b> is the process of ordering, storing, using and selling a company's inventory: raw materials, components, finished products, and the warehousing and processing of such items. <b>Inventory</b> is any stored material (also called stock; in manufacturing, "stock" strictly means finished goods in the store). In the service industry there is no exchange of physical stock, so inventory is mostly intangible: the steps involved before completing a sale.</p>
<h4>Useful terms</h4>`+dMin+
T(['Term','Meaning'],[
['<b>Minimum Stock</b>','Minimum quantity always available to avoid shortage (critical or hard-to-resupply products): <b>Buffer Stock + Safety Stock</b>'],
['<b>Buffer Stock</b>','Stock equal to consumption during the standard replenishment period'],
['<b>Safety Stock</b>','Extra stock kept to mitigate stock-out risk from uncertainties in supply and demand'],
['Bin card / Stock card','Documents updated by the storekeeper tracking the stock of one product in a bin or the storage'],
['Committed inventory','Items committed to a particular order'],['Demand signal','Any request to remove stock from a warehouse, in any format'],
['Inventory ledger','Accounting record of receptions and dispatches in quantity and value'],['Lead time','Time between placing an order and receiving it'],
['On-hand inventory','Items available to be released'],['Over-stock','Too much inventory kept'],['Physical inventory','Counting and verifying goods to reconcile data'],
['Re-ordering cycle','Period between two successive regular orders'],['SKU','Stock Keeping Unit: unique code for a single line item'],
['Stock-out','Inventory cannot cope with demand for an item'],['VMI','Vendor Managed Inventory: suppliers manage physical inventory in the retailer\'s stock'],['WIP','Work in progress / process']])+
`<h4>Types of inventory</h4>`+T(['Type','Meaning','Example or note'],[
['Raw materials','Initial components or materials for production','Input to the process'],
['<b>Work in progress (WIP)</b>','Goods being manufactured but not yet completed','Semi-finished goods on the factory floor'],
['Finished goods','Fully manufactured, ready for sale',''],
['<b>MRO</b> (Maintenance, Repair, Operating)','Supplies for upkeep of machines and equipment; <b>not accounted as inventory items in the books</b>','Lubricants, coolants, uniforms, gloves, nuts, bolts, screws'],
['<b>Buffer inventory</b>','Held for unexpected rise in demand (e.g. promotion that sells more than planned)','"Prevention is better than cure"'],
['<b>Cycle inventory</b>','Goods ordered in lot sizes to meet minimum production requirements; plan with campaigns, seasonality, trends','Cycle stock'],
['<b>Decoupling inventory</b>','<b>Items kept in reserve to be processed by another machine if the previous machine fails</b>; shields against supplier problems, inconsistent lead times and production halts','Keeps the chain from collapsing'],
['<b>Transit (pipeline) inventory</b>','Shipped by the seller but not yet at the buyer\'s destination','Also called pipeline inventory']])+
`<div class="tip">Distinction used in the lecture: buffer inventory covers an unexpected demand increase; safety stock covers WIP and supplier delays (e.g. manufacturing shutdown).</div>`],
["Lecture 53 - Inventory Management (Contd.)",

`<p>Four methods in the lecture: <b>JIT, MRP, EOQ, DSI</b>, plus the zero inventory concept, ABC analysis and VMI.</p>
<h4>Just-in-Time (JIT)</h4><p>Receive goods only as needed in production to raise efficiency and cut waste. Originated in Japan in the 1960s and 1970s; <b>Toyota</b> contributed most. Needs careful scheduling and a strong relationship with suppliers.</p>`+
T(['Benefits','Risks and limits','Companies'],[['Lower storage and insurance cost; less obsolescence; better cash flow; supplier relationships; efficiency; quality','Supply disruptions halt production; supplier dependency; unpredictable demand causes shortages; costly set-up','Toyota (TPS, 1970s), Dell (build to order), Harley-Davidson']])+
`<h4>Material Requirements Planning (MRP)</h4><p>Sales-forecast-dependent system making sure materials are available for production and products for delivery. Combines the production schedule, inventory data and the <b>bill of materials (BOM)</b> to compute purchasing and shipping schedules. Example: a ski manufacturer stocks plastic, fibreglass, wood and aluminium from forecast orders.</p>`+
T(['Benefits','Limits','Users'],[['Inventory control, production planning, cost savings, supplier coordination, efficiency','Needs accurate data; complex and costly; inflexible to sudden change; must integrate with ERP and SCM','Toyota, Intel, Boeing']])+
`<h4>Economic Order Quantity (EOQ)</h4><p>Number of units to add per batch order to minimise total inventory cost, assuming constant demand. Costs: <b>ordering (set-up) cost</b> and <b>holding cost</b>.</p>`+M([['EOQ = sqrt(2DS / H)','D annual demand, S cost per order, H holding cost per unit per year']])+dEoq+
`<p>Lecture example (shirt shop selling 1,000 shirts a year): EOQ is about <b>28.3 units</b> per order. (Standard figures for this example: order cost 2, holding cost 5 per shirt.)</p>
<h4>Days Sales of Inventory (DSI)</h4><p>Average time in days a company takes to <b>turn inventory, including work in progress, into sales</b>. Also called average age of inventory, days inventory outstanding (DIO), days in inventory (DII). It shows liquidity: how many days current stock will last. <b>Lower DSI is generally preferred</b>; norms differ by industry. Example in lecture: Pfizer.</p>`+M([['DSI = (Avg inventory / COGS) x 365','Standard formula; days to clear stock']])+
`<h4>Zero inventory concept</h4><p>Lean concept aimed at minimising or eliminating excess inventory in production; also Zero Inventory System or Zero Inventory Manufacturing. <b>Based on JIT</b> and lean thinking: produce and deliver exactly when needed, in the right quantity, with minimum waste.</p>`+
T(['Importance','Notes'],[['Cost reduction','Lower storage, handling, insurance'],['Efficiency','Streamlined processes, less waste'],['Working capital','Less capital tied up in stock'],['Risk mitigation','Less obsolete or spoiled stock']])+
`<h4>ABC analysis (inventory theory model)</h4><p>Ranks inventory by importance using the <b>80/20 (Pareto)</b> idea; often combined with JIT. Drawback: stock must be classified correctly.</p>`+dAbc+
T(['Category','Share of items','Share of income','Control'],[['<b>A</b>','<b>20%</b>','<b>70%</b>','Tightest ordering control, most attention'],['B','30%','25%','Moderate; still matters'],['C','50%','5%','Loose control']])+
`<h4>Vendor Managed Inventory (VMI)</h4><p>The <b>supplier assumes responsibility for inventory management and disposition at the customer's warehouse</b>. Prerequisite: regular transfer of all relevant data (inventory, consumption) to the supplier. It optimises performance along the chain; the supplier ensures optimal stock levels, and production and inventories can be planned better.</p>`+dVmi+
`<h4>Product-based versus service-based companies</h4><p>Product companies manage physical stock (inventory management); service companies have no physical stock and manage waiting (queue management), as in Week 5.</p>`],
["Lecture 54 - Supply Chain Digitalization",
IMP('Asked: <b>IoT</b> (sensors and RFID for real-time data), <b>ERP</b> = Enterprise Resource Planning, and the benefit <b>better financial management through automated reorder notifications</b>.')+
`<h4>What supply chain digitization is</h4><p>Using digital technologies and analytics to connect, automate and optimise supply chain processes for end-to-end visibility, better decisions and efficiency. <b>Digital transformation</b> adds a change in culture, processes and skills.</p>
<h4>Key components</h4>`+T(['Component','Role'],[['<b>IoT</b> (Internet of Things)','Sensors, RFID tags and devices collecting real-time data on inventory and shipments'],['<b>ERP</b> (Enterprise Resource Planning)','Integrates inventory, procurement, production planning and finance in one system'],['AI / machine learning, analytics','Demand forecasts, optimisation, preventing stock-outs'],['Blockchain','Traceability and transparency'],['Cloud platforms','Shared, unified data across partners'],['Risk management tools','Assess geopolitical, natural disaster and supplier risks; contingency plans'],['Compliance tools','Track regulatory requirements and documentation'],['Continuous improvement','Automate workflows, culture of experimentation']])+
`<h4>Implementing digital transformation</h4>`+dDig+
L(['<b>Vision:</b> aligned with enterprise objectives (decision-making, automation, visibility)','<b>Assess resources:</b> legacy systems, capability to generate, collect and analyse data, workforce skills','<b>Unified platform:</b> complete end-to-end visibility for inventory, warehouse, forecasting, logistics','<b>Automate planning:</b> routine tasks, not complex or collaborative scenarios; real-time and AI analytics','<b>Align the team:</b> success depends on collaboration and adopting new methods'])+
`<h4>Benefits of digitization</h4>`+T(['Benefit','Example'],[
['<b>Better financial management</b>','Automated notifications when to reorder, avoiding high <b>stockout costs</b>; more accurate replenishment cuts carrying cost and dead stock'],
['Minimised lead times','Fulfilment software linked to the e-commerce store receives and prepares orders automatically'],
['Improved decision making','Historical sales and buying behaviour predict demand and set inventory per DC'],
['Increased automation','Less manual work and human error'],
['Organisational flexibility','Freedom to choose the degree of centralisation'],
['Accelerates innovation','Strengthens business model and partner relationships'],
['End-to-end customer engagement','Order tracking keeps customers informed and in control']])+
`<h4>Factors fostering digitalization</h4>`+T(['Factor','Detail'],[['Government initiatives and policies','Funding, tax incentives, regulatory frameworks'],['Market demand and competition','Customer expectations force adoption'],['Technological advancement','AI, ML, IoT, blockchain'],['Globalization and complexity','Manual, disconnected systems no longer viable']])+
`<h4>Challenges</h4><p>Three unavoidable issues from technical tools and human factors. The main one remains <b>technical</b>: companies' information systems and the availability and quality of data; others are people and process related (skills, resistance, adoption).</p>`],
["Lecture 55 - Smart Supply Chains",
IMP('Know the smart supply chain components (real-time visibility, predictive analytics, automation, dynamic optimisation, collaborative networks) and the <b>three Ps: Profit, People, Planet</b>.')+
`<h4>Evolution</h4>`+F(['Early 20th century: Taylor, Ford (efficiency)','Late 20th century: globalization','1980s-90s: IT and ERP','Recent: smart technologies, Industry 4.0'])+
`<h4>Definition and characteristics</h4><p>Smart supply chains use data-driven insight, automation and connectivity to improve agility, efficiency and resilience, with real-time monitoring of inventory, production and transport. Characteristics: <b>instrumented, interconnected, intelligent, automated, integrated, innovative</b>, adaptable. Definitions in the literature are inconsistent; they refer to smart drivers (logistics, warehouse), data streams, technologies, and characteristics. <b>Industry 4.0</b> = cyber-physical systems, cloud and AI.</p>
<h4>Key components</h4>`+T(['Component','Meaning'],[['Real-time visibility','IoT sensors across the chain; track goods, spot bottlenecks'],['Predictive analytics','Big data and AI forecast demand, optimise inventory, anticipate maintenance'],['Automated processes','Robotics, automated material handling, autonomous vehicles'],['Dynamic optimisation','AI and algorithms re-optimise schedules, stock and routes'],['Collaborative networks','Cloud platforms and digital ecosystems share information'],['Sustainable practices','Lower energy, waste; renewable energy, green logistics, eco packaging'],['Agile and resilient','Real-time monitoring and predictive analytics to adapt to disruption']])+
`<h4>Responsiveness, efficiency, flexibility, resilience</h4>`+T(['Concept','Meaning'],[['Responsiveness','Adapt quickly to market change and deliver superior customer experience'],['<b>Efficiency</b>','Produce goods or services without wasting materials, time or energy; maximise outputs from given inputs'],['Flexibility','Anticipate and respond to changes in demand and operating conditions'],['Resilience','Efficiency + visibility and traceability + flexibility, supported by IoT, AI and blockchain, so disruptions (disasters, cyber-attacks) are anticipated and handled']])+
`<h4>Sustainability in the smart supply chain</h4><p>A chain that <b>closes the loop</b> of upstream and downstream flows by recycling and recovering used items and re-entering them in production, with goals from economic, environmental and social dimensions.</p>`+M([['Profit','Economic value through efficient manufacturing and distribution'],['People','Customer value with attention to social and environmental effects'],['Planet','Minimise resource use; eliminate environmental impact of waste']])+
`<h4>Implementation</h4><p>IoT-based, blockchain-based, and cloud and AI-based sustainable smart supply chains; example: power distribution supply chain using Industry 4.0 smart grids.</p>`],
["Lecture 56 - Robust and Resilient Supply Chain Design",
IMP('Asked: the <b>ultimate goal of a resilient supply chain is to bounce back from disruptions and learn from them</b>. Know robustness, vulnerability, PPRR and the Temple.')+
`<h4>Vulnerability, risk, robustness, resilience</h4>`+T(['Concept','Meaning'],[['Risk','Operational, financial or strategic; identify, assess, mitigate (redundancy, supplier diversification, contingency plans)'],['Vulnerability','Susceptibility to disruptions (disasters, geopolitics, downturns, demand shifts) that hit flows of materials, information, resources'],['Robustness','Ability to withstand and recover while keeping essential functions; flexible, adaptable, agile'],['<b>Resilience</b>','<b>Ultimate goal: bounce back from disruptions and learn from them to improve future performance</b>; adaptive capacity, collaboration, transparency, technology']])+
`<h4>Types of supply chain risk</h4>`+T(['External (harder to predict)','Internal (more manageable)'],[['<b>Demand</b> (miscalculated demand); <b>Supply</b> (late or no raw materials); <b>Environmental</b> (socio-economic, political, governmental, environmental); <b>Business</b> (unexpected change in a dependent entity, e.g. supplier sale)','<b>Manufacturing</b> (key component disrupted); <b>Business</b> (personnel, management, reporting); <b>Planning and control</b> (poor forecasting); <b>Mitigation and contingency</b> (no contingency plan)']])+
`<h4>PPRR risk management model</h4>`+dPprr+
`<h4>SCRM strategies (7 in the lecture)</h4>`+L(['Leverage the <b>PPRR</b> model','Manage environmental risk (COVID-19: multi-sourcing; breweries made hand sanitiser, Ford made ventilators; diversify suppliers, source closer, stress tests, inventory buffers, harmonise technology)','Track freight carrier metrics: transit time, number of stops and stop time, loading time, route optimisation, maintenance schedule; have a logistics contingency plan','Conduct internal risk awareness training (best practices, cybersecurity, risk software)','Continuously monitor every level for risk indicators','Use data to model key risk event scenarios (predictive analytics)','Consolidate data in one centralised repository'])+
`<h4>Temple of Supply Chain Resilience</h4>`+dTemple+
`<h4>Components of a robust supply chain</h4>`+L(['<b>Flexibility</b> (flexible manufacturing, agile inventory, dynamic distribution)','<b>Resilience</b> (contingency plans, backup inventory, alternative sourcing)','<b>Redundancy</b> (alternative suppliers, facilities, routes)','<b>Collaboration</b> with partners','<b>Risk management</b>','<b>Technology integration</b> (analytics, AI, IoT)','<b>Visibility</b> across the chain'])+
`<h4>Case: JD.com</h4><p>Integrated retail giant with a self-operated mode: buys all products from suppliers under long-term agreements and handles inventory, distribution, delivery and after-sales, controlling quality. Self-operated stores give about <b>60% of sales</b>; affiliated stores the rest. Traditional multi-stage chains (factory to brand manufacturer to agent to distributor to retailer) lack information sharing and suffer bullwhip magnification; the integrated chain is more resilient.</p>`],
["Lecture 57 - 21st Century Supply Chain",
IMP('Know the five themes (digitalization, visibility, globalization, sustainability and CSR, customer-centricity) and the trends (visibility, sustainability, regionalisation, robotics).')+
`<h4>Evolution and challenges</h4><p>Technology, globalization and changing consumer preferences forced supply chains to evolve. Global chains raised interconnectedness and complexity: efficient when stable but <b>highly vulnerable</b> to disruption. COVID-19 showed the need for resilience: diversified suppliers, contingency plans, risk assessment.</p>
<h4>Five themes</h4>`+T(['Theme','Meaning'],[['Digitalization and automation','AI, ML, big data, IoT: real-time data and decisions'],['Visibility and transparency','Insight from sourcing to delivery; better risk management and forecasting'],['Globalization and outsourcing','Cost, expertise, markets; but geopolitical and trade risks'],['Sustainability and CSR','Lower emissions and waste, ethical sourcing, fair labour'],['Customer-centricity and omni-channel','Speed, convenience, personalisation across stores, e-commerce, apps, social media']])+
`<h4>Trends highlighted for 2024</h4>`+T(['Trend','Detail'],[['1 Integral visibility','Real-time visibility moves from nice-to-have to must-have; unified data platforms (IoT, logistics providers, ERP), analytics and digital twins'],['2 Sustainability as differentiator','Green transport, recyclable packaging, circular models, life cycle assessment, ESG disclosure; Paris Agreement context'],['3 Regionalised supply chains','Nearshoring, multi-node networks, dual or multi-sourcing to reduce risk and enable just-in-time'],['4 Robotic and autonomous operations','Automation of warehouses and transport'],['ESG','Environmental, social, governance factors increasingly shape supply chain dynamics'],['Web-based SCM','Web platforms integrate partners and information']])]],
gl:[["Inventory management","Ordering, storing, using and selling a firm's inventory."],["Minimum stock","Buffer stock + safety stock."],["Buffer stock","Stock equal to consumption during the standard replenishment period."],["Safety stock","Extra stock against uncertainty in supply and demand."],["Lead time","Order placement to receipt."],["Stock-out","Stock cannot meet demand."],["SKU","Stock keeping unit; unique item code."],["WIP","Goods in production, not yet completed."],["MRO inventory","Maintenance, repair, operating supplies; not booked as inventory."],["Buffer inventory","Held for unexpected demand increases."],["Cycle inventory","Goods ordered in lot sizes for minimum production needs."],["Decoupling inventory","Reserve to be processed by another machine if one fails."],["Transit inventory","Shipped but not yet delivered; pipeline inventory."],["JIT","Receive goods only as needed; Toyota pioneered."],["MRP","Material requirements planning using BOM and forecasts."],["BOM","Bill of materials."],["EOQ","Order quantity minimising ordering plus holding cost."],["DSI","Days sales of inventory: average days to turn stock into sales; lower is better."],["Zero inventory","Lean concept based on JIT."],["ABC analysis","Pareto-based inventory ranking."],["Category A","20% of items, 70% of income."],["Category B","30% of items, 25% of income."],["Category C","50% of items, 5% of income."],["VMI","Supplier manages stock at the customer's location."],["Digitization","Digital tools for connected, automated supply chain."],["IoT","Sensors and RFID for real-time data."],["ERP","Enterprise Resource Planning."],["Digitization benefit","Automated reorder notifications avoid stockout costs."],["Smart supply chain","Data-driven, automated, connected chain (Industry 4.0)."],["Three Ps","Profit, People, Planet."],["Vulnerability","Susceptibility to disruption."],["Robustness","Withstand and recover while keeping function."],["Resilience","Bounce back and learn from disruptions."],["SCRM","Supply chain risk management."],["PPRR","Prevention, Preparedness, Response, Recovery."],["Temple of resilience","Foundation strategy; floor design; pillars agility, collaboration, risk culture, design; roof transparency."],["Regionalisation","Nearshoring and multi-node networks."],["JD.com","Self-operated mode, about 60% of sales."]],

["o","Which of the following formulas is used to calculate Minimum Stock?",["Minimum Stock = Safety Stock - Buffer Stock","Minimum Stock = Buffer Stock + Safety Stock","Minimum Stock = Reorder level + Safety Stock","Minimum Stock = Maximum Daily Sales + Maximum Lead Time"],1,"Minimum stock is buffer stock plus safety stock."],

["o","In supply chain digitization, what does ERP stand for?",["Enterprise Resource Planning","Electronic Resource Planning","Efficient Retail Processing","Essential Reliable Procurement"],0,"ERP integrates inventory, procurement, production planning and more."],

D[12]={notes:[
["Lecture 58 - Sustainable Supply Chain",
IMP('Asked: <b>goal = minimise environmental harm (energy, water, waste)</b>; <b>Triple Bottom Line coined by John Elkington</b>; <b>revenue and profit are traditional concerns</b>; <b>cost is the primary barrier</b>.')+
`<h4>Role of sustainability in the supply chain</h4><p><b>Supply chain sustainability</b> = companies' efforts to consider the environmental and human impact of their products' journey: raw material sourcing, production, storage, delivery and every transport link. <b>Goal:</b> minimise environmental harm (<b>energy usage, water consumption, waste production</b>) while having a positive impact on people and communities. These concerns are <b>in addition to</b> traditional corporate concerns such as <b>revenue and profit</b>.</p>
<p>The <b>Brundtland Commission</b> (UN) defined sustainable development as development that meets present needs without compromising future generations. The <b>2005 UN World Summit</b> named economic, environmental and social sustainability as the three pillars; all three must be reconciled. Growth in Brazil, China and India raised pressure on resources, so focus rose.</p>
<h4>Why firms focus on sustainability (3 factor groups)</h4>`+L(['Reducing risk and improving financial performance','Attracting customers who value sustainability','Making the world more sustainable'])+
`<h4>Cases</h4>`+L(['<b>Unilever</b> helped tomato growers in Brazil adopt drip irrigation; almost half its sales and most growth come from emerging economies; buys about 10% of world tea and 30% of spinach','<b>Wal-Mart</b> began defensively after activist criticism, then cut energy costs (efficient bulbs, skylights) and packaging; redesigned milk jugs with Costco, saving 10 to 20 cents a gallon'])+
`<h4>Triple Bottom Line (TBL)</h4>`+dTbl+
`<p>Coined by <b>John Elkington</b>: a yardstick for assessing supply chain sustainability while driving profitability. Aims: transparency in performance, economic opportunity, stronger local activities and competitive advantage, less environmental degradation.</p>`+
T(['TBL measure','Includes'],[['<b>Social</b>','Health, well-being, quality of life: supportive work environments, gender equality, ethical practices, labour rights'],['<b>Environmental</b>','Green practices, certified suppliers, lower fossil fuel, waste and electricity use'],['<b>Economic</b>','Financial flow, expenditure, ROI, sustainable investments, growth prospects']])+
L(['Reduces carbon footprint and energy expense','Paves the way for future growth and financial security','Enhances brand image and productivity'])+
`<h4>Benefits: five business activities</h4>`+T(['Activity','Benefit'],[['Supply chain operations','Lower energy cost by setting emission targets with suppliers'],['Branding','MIT Sloan: consumers may pay <b>2-10% more</b> for supply chain transparency'],['Compliance','Government mandates; UN 2030 Sustainable Development Goals; traceability, e-waste, conflict minerals'],['Investor relations','Irresponsible practices hurt stock prices; nearly half of investors (Gallup) interested in sustainable funds'],['Corporate culture','Millennials seek purpose; helps hire and retain']])+
`<h4>Key metrics (10)</h4>`+T(['Metric','Meaning'],[['Carbon footprint','Total greenhouse gas emissions of operations'],['Energy consumption','Energy used across manufacturing, transport, distribution'],['Water usage','Water consumed in production'],['Waste generation','Waste at each stage; recycling'],['Supplier diversity','Size, location, ownership, social responsibility'],['Ethical sourcing','Share of materials from suppliers meeting labour and environmental standards'],['Supplier compliance','Adherence, e.g. Fair Trade or FSC certification'],['Product lifecycle analysis','Environmental impact from extraction to disposal'],['Transportation efficiency','MPG or kg CO2 per ton-km'],['Social impact','Fair wages, worker safety, community development']])+
`<h4>Drivers adding to sustainability (links to the six drivers)</h4>`+T(['Driver','Example'],[['Facilities','Energy-efficient stores; waste turned into profit (Walmart)'],['Inventory','Cut landfill stock and harmful additives; Walmart removed phosphates and redesigned packaging'],['Transportation','Walmart cut delivery fuel use by <b>65%</b>; IKEA designs for density'],['Sourcing','Starbucks C.A.F.E. programme; Mattel recall due to lead paint shows the risk'],['Information','Lack of standard measurement; internal scorecards (Walmart packaging tool)'],['Pricing','Differential pricing by load or time; tax credits (Nissan Leaf); customer willingness to pay long term']])+
`<h4>Improving sustainability</h4><p>First step: find the supply chain's pain points by calculating the <b>product carbon footprint (PCF)</b>, which shows which operations need improvement; then set targets with suppliers, redesign packaging and transport, and track metrics.</p>
<h4>Challenges</h4><p><b>Cost is the primary barrier</b> to implementing sustainable supply chains. Other difficulties: lack of standard measurement and reporting, supplier compliance, and the time customers take to accept change.</p>`],
["Lecture 59 - Emergency Supply Chain",
IMP('Asked: conventional chains adopt <b>proactive or reactive strategies for disruptions (fires, floods, labour strikes)</b>; the <b>2015 Nepal earthquake</b> as an example of humanitarian coordination.')+
`<h4>What is an emergency supply chain (ESC)?</h4><p>A specialised logistical framework for urgent, unforeseen situations: natural disasters, public health emergencies, geopolitical crises. The Joint Logistics Enterprise defines a <b>complex emergency</b> as international conflict, humanitarian and domestic disaster relief scenarios involving warfare, food insecurity, epidemics and social conflict. ESCs have two domains: <b>networks supporting military expeditions</b> and <b>chains supporting NGO disaster relief</b>. Aim: timely and effective response, minimal disruption, support for recovery (stockpiling, alternate routes, agile communication).</p>
<h4>Why a separate framework: disruption versus emergency</h4>`+T(['Conventional supply chain disruption','Emergency supply chain'],[['Conventional chains adopt <b>proactive or reactive strategies</b> for fires, floods, labour strikes','Formed in response to the emergency, often without prior relationships'],['Existing configuration is adjusted; <b>identity unchanged</b> (same stakeholders, products, facilities)','New locations, routes and demand points set up quickly'],['Disruption happens to an existing chain','Disaster relief chains exist specifically to address disasters'],['Success: results at lowest cost, effective and efficient','Success: results quickly; <b>effectiveness over efficiency</b>, "at all cost"']])+dEsc+
`<h4>Uniqueness of emergency logistics</h4>`+L(['Upstream and downstream elements assemble rapidly and need heavy coordination and information sharing','Cost-saving optimisation may be inappropriate; faster modes (flying instead of sealift)','Objective is operational effectiveness, not meeting general demand','Prioritisation of needs is required and urgent decisions carry risk'])+
`<h4>Humanitarian supply chain management</h4><p>Coordination of relief organisations such as UNICEF, using technology for tracking and prioritisation. Highlighted example: the <b>2015 Nepal earthquake</b> as effective humanitarian supply chain coordination.</p>`],
["Lecture 60 - Assets Management in Supply Chain",
IMP('Asked: the <b>meaning of supply chain asset</b> (tangible or intangible resource), <b>WIP vs raw materials</b>, and <b>asset vs inventory management (complete life cycle)</b>.')+
`<h4>Supply chain asset</h4><p>A <b>supply chain asset</b> is any <b>tangible or intangible resource within a supply chain that contributes to its overall functioning and value creation</b>: physical (manufacturing facilities, warehouses, vehicles, inventory) and intangible (information systems, intellectual property, supplier relationships, brand reputation). The definition in the lecture excludes the company's cash and liquid investments.</p>
<h4>Supply chain asset management</h4><p>Per the Corporate Finance Institute: developing, operating, maintaining and selling assets cost-effectively. It covers scheduled maintenance, work orders, historical and inventory data, employee and vendor scheduling, institutional knowledge. Example: a driver's post-trip inspection flags brake issues, so a quick work order cuts downtime. Reactive-only asset management hurts productivity; keep a birds-eye view.</p>
<h4>Inventory management versus asset management</h4>`+T(['Inventory management','Asset management'],[['Tracks stock as it enters and leaves','Manages items the organisation intends to keep <b>through their complete life cycles</b>, from procurement to disposal'],['Replenishes goods and parts to sell to customers','Regular inspection, cleaning, repair or replacement'],['Customers return items to inventory only if dissatisfied','Users borrow items and return them to the system'],['Minimal contact and minimal details per item','Detailed history per asset; decides which assets provide value']])+
`<h4>Types of asset in the supply chain</h4>`+T(['Asset','Meaning'],[['<b>Raw materials</b>','Initial components or materials used in production'],['<b>Work-in-progress (WIP)</b>','Goods being manufactured, not yet complete'],['Finished goods','Fully manufactured, ready for sale or distribution'],['Packaging materials','For packing finished goods for transport and storage'],['Tools and equipment','Machinery and tools for manufacturing or distribution'],['Transportation vehicles','Trucks, ships, airplanes'],['Warehousing infrastructure','Warehouses and storage units'],['IT assets','Software, hardware, technology infrastructure'],['Intellectual property','Patents, trademarks, copyrights'],['Human resources','Skilled labour and workforce']])+

function tierOf(w,si,p){

 const o=(OVR[w]||[]).find(r=>r[0].test(head)&&(r[2]===undefined||r[2]===si));
 const asked=(KEYS[w]||[]).filter(k=>k[0].test(p)).map(k=>k[1]);
 let t,a=[];
 if(o){t=o[1];}
 else if(asked.length){t='H';a=asked;}
 else if(/class="imp"/.test(p)){t='M';}
 else t='M';
 return {t,a:a,head};
}
