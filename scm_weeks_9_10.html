/* ===================== WEEK 9 ===================== */
D[9]={notes:[
["Lecture 42 - Importance of Distribution in Supply Chain",
IMP('Asked: <b>short response time = facilities close to customers</b>; <b>product availability</b> definition; <b>outbound cost per unit is higher than inbound</b> (lot size economies); <b>last-mile delivery</b>.')+
`<h4>Role of distribution</h4><p><b>Distribution</b> = the steps taken to move and store a product from the supplier stage to the customer stage. It covers raw materials and components moving from suppliers to manufacturers and finished goods moving from manufacturers to end consumers. It is a <b>key driver of overall profitability</b> because it affects both supply chain cost and customer experience.</p>
<p><b>Walmart:</b> distribution lets it offer high availability of relatively common products at very low cost, through efficient distribution networks that minimise cost and maximise efficiency.</p>`+dDph+
`<p>An inappropriate network raises cost and lowers customer satisfaction, so firms must evaluate options against their strategy.</p>
<h4>Service factors influencing network design</h4>`+T(['Factor','Meaning','Design consequence'],[
['<b>Response time</b>','Time between order placement and receipt','Customers valuing short response need <b>facilities close to them</b>; tolerant customers allow fewer, centralised facilities'],
['Product variety','Number of different products / configurations offered','Wide variety needs a network that can store and handle many items'],
['<b>Product availability</b>','<b>Probability of having a product in stock when a customer order arrives</b>','Higher availability needs more inventory and aggregation'],
['Customer experience','Ease of ordering and receiving, customisation, extra services','Network must support the intended experience'],
['Time to market','Time to bring a new product to market','Must support quick launches'],
['Order visibility','Ability to track an order from placement to delivery','Needs tracking systems'],
['Returnability','Ease of returning unsatisfactory goods and network ability to handle returns','Needs efficient reverse flow']])+
`<h4>Cost factors</h4><p>Network changes affect inventory, transportation, facilities, and information costs; sourcing and pricing also influence the choice of distribution system. As the number of facilities increases, inventory and facility costs rise, while the response time falls.</p>`+dFacCost+
T(['Relationship','Behaviour'],[['Facilities vs inventory cost','More facilities, more safety stock (loss of aggregation): inventory cost rises'],['Facilities vs facility cost','Fixed and handling costs rise with more sites'],['Facilities vs transportation cost','Falls, provided <b>inbound economies of scale</b> are maintained (outbound distance shrinks as a fraction of total distance)'],['Facilities vs response time','Response time improves']])+
`<div class="tip"><b>Why outbound cost per unit exceeds inbound:</b> inbound lot sizes are larger. Example: an Amazon warehouse receives full truckloads of books inbound but ships small packages with a few books per customer outbound.</div>
<h4>Design options for a distribution network</h4>`+T(['Option','Idea'],[
['Direct shipping','Ship from manufacturer or supplier straight to the end customer; no intermediaries'],
['Centralised distribution','One central DC serves all customers; cost effective for large, widely spread customer base'],
['Decentralised distribution','Several DCs in different regions; better response time and service'],
['<b>Cross-docking</b>','Move products from inbound to outbound transport with no storage'],
['Drop-shipping','Supplier or manufacturer ships to the customer; no inventory held, lower upfront cost'],
['Hybrid distribution','Central DC for bulk storage plus regional DCs for fast delivery'],
['Third-party logistics (3PL)','Outsource network design and operation to specialists: savings, scalability, expertise']])+
`<h4>Online sales and the distribution network</h4>`+T(['Consideration','Detail'],[['Fulfilment centres','Dedicated online-order sites, strategically placed'],['Inventory management','Often larger inventories, accurate systems to prevent stock-outs'],['<b>Last-mile delivery</b>','<b>Final leg of delivery to the customer\'s doorstep</b>; partner with logistics providers or own fleet'],['Order processing and packaging','Streamlined for high volume'],['Returns management','Online sales have higher return rates; handle refunds, exchanges, restocking'],['Technology and automation','WMS, order management systems, automated pick and pack'],['Customer experience','User-friendly site, online tracking, responsive service'],['Scalability and flexibility','Handle growth and changing preferences'],['Integration with stores','Ship-from-store and in-store pickup'],['Data analytics','Buying patterns and delivery performance drive improvements']])+
`<h4>Impact of online sales on customer service</h4>`+T(['Better online','Worse online'],[['Larger selection (Netflix vs rental stores); inventory aggregation improves availability; 24/7 access; global reach; personalisation; quick launch of new products; real-time tracking; dynamic price and promotion changes; lower cost of revenue collection','Physical products take longer (shipping); returns harder and costlier than in stores; instant gratification missing; digital products are instant (movies, music)']])+
`<h4>Impact of online sales on costs</h4>`+T(['Factor','Effect'],[['<b>Aggregation</b>','Lower inventory by centralising stock if customers accept waiting (Amazon vs Barnes and Noble)'],['<b>Postponement</b>','Delay variety until order arrives (Dell builds PCs after order; Amazon prints low-volume books on demand)'],['Network centralisation','Fewer facilities (Netflix about 50 warehouses vs Blockbuster thousands of stores)'],['Operational efficiency','Customer-entered orders cost less than call centres; smoother order flow'],['Handling and delivery','Groceries cost more online because pick and delivery shift to the seller'],['Digital goods','Internet nearly removes transport cost'],['Nondigital goods','Centralised stock raises outbound transport cost relative to inbound'],['Enhanced visibility','Shared demand data lowers overall supply chain cost'],['Infrastructure cost','Amazon integrating Zappos: about 120,000 product descriptions and over 2 million photos']])],
["Lecture 43 - Designing Distribution Networks in Supply Chain",
IMP('Asked: <b>Manufacturer storage with direct shipping eliminates intermediaries</b> and ships to the customer; <b>Dell added retail (Wal-Mart) in 2007</b>.')+
`<h4>Six distribution network designs</h4>`+dSix+
T(['Design','Key characteristics','Benefits','Considerations'],[
['<b>1 Manufacturer storage, direct shipping (drop shipping)</b>','Manufacturer keeps finished goods in own facilities; customers order from the manufacturer, who ships straight to them; <b>no distributors or retailers</b>','Cost savings, control over inventory and quality, fast fulfilment, fewer intermediaries','Needs infrastructure and resources; geographic coverage; transport coordination'],
['2 Manufacturer storage, direct shipping and <b>in-transit merge</b>','Same as 1, plus consolidating multiple orders (from different sources) into one shipment during transit','Better transport efficiency, one delivery per customer','Needs advanced planning and real-time tracking'],
['3 <b>Distributor storage with carrier delivery</b>','Distributors hold inventory in own warehouses; package carriers deliver; distributors manage receiving, storing, shipping','Localised inventory, faster fulfilment, handles higher variety than retail stores, value-added services','Warehouse and inventory control, carrier coordination, customer relationships'],
['4 <b>Distributor storage with last-mile delivery</b>','Distributor stores and also does last leg (own vehicles, 3PL or crowd-sourced); common in e-commerce and grocery','Quicker delivery, reduced transport cost, higher satisfaction; may offer installation or assembly','Route planning, delivery staff, infrastructure, customer communication; route optimisation software'],
['5 Manufacturer / distributor storage with <b>customer pickup</b>','Product stored at manufacturer or distributor site; customer collects','Lower transport cost, faster response, higher availability','Limited convenience and product variety'],
['6 <b>Retail storage with customer pickup</b>','Product stored at a retail store; customer picks up (or inspects before buying)','Convenience, fastest response, cross-selling, personalised service','Limited variety and availability; highest inventory and facility costs']])+
`<h4>Comparative ranking (Chopra and Meindl summary)</h4>`+T(['Dimension','Direct shipping (design 1)','Retail storage with pickup (design 6)'],[['Response time','Slowest (days to weeks)','Fastest (immediate)'],['Product variety','Highest','Lowest'],['Product availability','Easiest to provide (aggregated)','Most expensive to provide'],['Inventory cost','Lowest','Highest'],['Facility cost','Lowest','Highest'],['Transportation cost','Highest','Lowest (bulk to store)'],['Order visibility','Harder','Easier (customer physically present)'],['Returnability','Difficult','Easiest']])+
`<div class="tip">Designs 3 to 5 sit between these extremes. Move from 1 towards 6 and response time, facility and inventory cost rise while transport cost and variety fall.</div>
<h4>Selecting a design: factors</h4>`+L(['<b>Customer needs</b> - response time, variety and availability, convenience, order visibility, returnability','<b>Product characteristics</b> - value, demand variability, perishability','<b>Cost factors</b> - inventory, transportation, facilities, handling','<b>Industry dynamics</b> - competition, technology, customer preferences','Scalability and adaptability; ownership structure','Alignment with the company\'s overall strategy'])+
`<h4>Case study: Dell and online sales</h4>`+L(['Dell pioneered online sales of computer hardware; by <b>2009 online sales were about half</b> of sales in the category','Sold exclusively online at first, then began <b>distributing through retail stores such as Wal-Mart in 2007</b>'])+
T(['Aspect','Customised high-value hardware','Low-cost standardised hardware'],[['Customer service','Online excels (flexible configurations); slight fulfilment delay is acceptable','Delay is a disadvantage; customers want immediate availability'],['Inventory','Aggregation and <b>postponement</b> (assemble after order, hold only components) cut inventory sharply','Inventory benefit is weaker'],['Facilities','Only manufacturing and component warehouses; no DCs or stores','Same saving, but less decisive'],['Transportation','Higher outbound cost (individual PCs shipped)','Higher outbound cost and slower response hurt more'],['Other benefits','Rapid launch of new products; 24/7 low-cost service; fast payment collection gives negative working capital; IT investment offset by benefits','Benefits less pronounced'],['Verdict','Strong gains in responsiveness and cost','Online channel advantage is smaller']])+
`<p>Conclusions of the lecture: companies often adopt a <b>hybrid</b> of online and offline channels. Impact on cost varies by industry and firm: Amazon and Blue Nile saw profits increase while Webvan struggled.</p>`],
["Lecture 44 - Facility Location Planning",
IMP('Asked: FLP belongs to <b>operations research and computational geometry</b>; <b>point rating weights sum to 1</b>; labour, land, taxation = <b>economic factors</b>; <b>centre of gravity minimises transportation cost</b>.')+
`<h4>What facility location planning is</h4><p>Facility location decisions are <b>strategic</b>: they can affect the whole organisation, and they stay dynamic because of changing technology, competition and consumer taste. The study of <b>facility location problems (FLP)</b>, also called <b>location analysis</b>, is a branch of <b>operations research and computational geometry</b> concerned with optimal placement of facilities to minimise transportation cost while considering factors such as keeping hazardous materials away from housing and keeping clear of competitors. Facilities planning also applies to units inside a facility, e.g. an airport baggage department.</p>
<h4>Facility location without proper planning</h4>`+dLoc+
T(['Option','Implication'],[['1 Sell to another company (disinvestment)','Recovers some investment but signals market retreat and loss of presence'],['2 Close and liquidate assets','Short-term loss, stops drain; liquidation often below book value; manage layoffs and legal needs'],['3 Continue at existing location','Higher operating cost and lower profit, but keeps customers and brand; optimise logistics, renegotiate supplier contracts, invest in technology'],['4 Relocate','Significant moving and site cost and transition disruption; long-term benefits may outweigh them']])+
`<h4>Three-tier model for assessing location competitiveness</h4>`+dTier+
`<h4>Factors affecting facility location (domestic)</h4>`+T(['Factor','Why it matters'],[['Electric power availability and cost','Multiple sources, capacity for present and future needs, predictable rates'],['Natural disasters and weather','Hurricanes, floods, tornadoes, earthquakes disrupt beyond contingency plans'],['Property tax rates','Affect real estate improvements and equipment investment'],['Corporate income tax','Apportionment structure; single sales factor states more favourable'],['Sales taxes','Affect capital-intensive projects before operation begins'],['Labour availability and quality','Skilled workforce is essential'],['Construction costs and quality','Drive project cost and quality'],['Telecommunications infrastructure','Points of presence, trunk lines, national carriers'],['Economic development incentives','Lower project and operating cost but cannot offset a poor business climate'],['Quality of life','Attracts and retains skilled workers']])+
`<h4>Factors for international location planning</h4>`+T(['Category','Factors'],[
['<b>Economic factors</b>','<b>Cost of labour</b>, <b>cost of land and facilities</b>, transportation and logistics cost, <b>taxation</b>, economic stability, market access, incentives and subsidies'],
['Environmental','Climate and natural disasters, environmental regulations, sustainability initiatives (renewable energy)'],
['Political and regulatory','Regulatory environment (labour, environmental, trade), political stability, trade agreements and tariffs, intellectual property protection, ease of doing business'],
['Social and cultural','Cultural compatibility, quality of life, labour availability and skills, demographic trends, language and communication, healthcare and education facilities'],
['Technological and infrastructure','Infrastructure quality (roads, ports, airports), telecommunications and IT, R&D and innovation'],
['Supply chain and operational','Proximity to suppliers and customers, supply chain integration, operational flexibility']])+
`<h4>Operations strategies for multiple facilities</h4>`+T(['Strategy','Benefit','Case'],[['Separate facilities by <b>product or service</b>','Specialisation, efficiency, simpler quality control','Procter and Gamble: cleaning products plant vs personal care plant'],['Separate facilities by <b>geographical area</b>','Lower transport cost, faster delivery, better local service','Amazon fulfilment centres in North America, Europe, Asia'],['Separate facilities by <b>process</b>','Process specialisation, better control at each stage','Tesla: Nevada Gigafactory (batteries) and Fremont (vehicle assembly)']])+
`<h4>Systematic site evaluation</h4><p>Step 1: identify all factors (infrastructure, suppliers, cost structure, quality of labour and materials, free trade zones, political risk, business environment, customer proximity, government barriers). Step 2: apply qualitative models when factors cannot be quantified. Step 3: apply quantitative models.</p>
<h4>Qualitative models</h4>`+L(['<b>Simple comparison chart:</b> list critical subjective factors, compare locations, pick the best fit (e.g. Biratnagar vs Kathmandu on community attitude, lifestyle, cultural alignment)','<b>Weighted factor scoring:</b> list factors, assign weights (1 to 5), develop a rating scale (1 to 10), score each location, multiply and sum, choose the highest'])+
`<h4>Point rating / factor rating technique</h4>`+F(['Identify factors','Assign weights (sum = 1 or 100%)','Rating scale (e.g. 1 to 5)','Rate each location','Weighted score = rating x weight, summed','Pick the highest'])+
`<p>Lecture example: new distribution centre with cost factors (weight 0.4: land and construction cost), market factors (0.35: nearness to customers and highways), operational factors (0.25: skilled labour, utilities). Weights add to <b>1</b>.</p>`+
T(['Illustrative factor group','Weight','Rating A','Rating B','Score A','Score B'],[['Cost','0.40','3','4','1.20','1.60'],['Market','0.35','5','3','1.75','1.05'],['Operational','0.25','4','4','1.00','1.00'],['<b>Total</b>','<b>1.00</b>','','','<b>3.95</b>','<b>3.65</b>']])+
`<div class="tip">Ratings above are illustrative (the slide table was not in the transcript). Method and weights are from the lecture; Location A wins here.</div>
<h4>Quantitative models</h4>
<h4>1. Median (load-distance) method with rectilinear distance</h4><p>Minimises total transport cost / distance between the new facility and existing ones; movement only along X and Y axes. Find the <b>median load</b>, then the facility whose cumulative load first covers the median fixes the coordinate.</p>`+
L(['Lecture example: total load 2,863, median load about 1,432','Bareilly 1-452, Shahjahanpur 453-1130 do not reach the median; <b>Kanpur 1131-1842 includes it</b>, so X-coordinate = Kanpur\'s = 50','Same on the Y axis gives Gonda = 50','Cost rate is highlighted by dotted lines between facilities'])+
`<h4>2. Centre of gravity (CG) model</h4><p>Determines the optimal location of a new facility by taking the weighted average of existing facility locations or demand points, thereby <b>minimising transportation cost</b> of serving multiple locations.</p>`+M([['Cx = Σ(wi xi) / Σwi','Weighted average X coordinate'],['Cy = Σ(wi yi) / Σwi','Weighted average Y coordinate'],['wi','Volume shipped, number of customers or other importance weight']])+
F(['Assign X-Y coordinates','Assign weights','Compute Cx and Cy','Interpret as new site'])+
`<p>Lecture numbers: weights 452, 678, 483, 711, 539 (total 2,863) with X coordinates 10, 30, 80, 50, 80 give Σ wi xi = 142,170, so <b>Cx = 142,170 / 2,863 = 49.7</b>.</p>
<h4>3. Varignon frame (mechanical analogue)</h4><p>Strings through holes at raw-material locations R1...Rm and markets, joined at a knot P and weighted by W = (annual trips) x (cost per unit distance); without friction the knot settles at the best plant location.</p>
<h4>Resource-oriented location examples</h4>`+L(['Sugar mills near sugarcane farms: lower transport time and carriage inwards','Tea factories in Assam, West Bengal and Karnataka: tea needs moist soil and climate','UAE is the largest exporter of crude oil; ADNOC is a leading company'])+
`<p><b>Conclusion:</b> location planning is not just a cost-effective site; it positions the firm to exploit local advantages, mitigate risk and align with long-term goals (Amazon and Toyota use multi-facility strategies).</p>`]],

 and computational geometry."],["Disinvestment","Selling a badly located facility."],["Three-tier model","Country, region, community/site view of location competitiveness."],["Economic location factors","Labour cost, land and facility cost, taxation, transport cost."],["Point rating","Weighted factor scoring; weights sum to 1; highest score wins."],["Median method","Rectilinear cost minimisation using median load."],["Centre of gravity","Weighted average coordinates minimising transport cost."],["Varignon frame","Strings and weights as a mechanical analogue to find the best site."],["Multi-facility strategies","By product (P&G), geography (Amazon), process (Tesla)."]],

["Lecture 45 - Demand Forecasting",
IMP('Asked: forecasting avoids <b>overproduction and underproduction</b>; <b>geography</b> factor (swimwear in Florida); <b>over-reliance on past data</b>; <b>expert/insider knowledge</b>; <b>limited visibility</b> (market volatility, rapid tech change, unpredictable events); forecasting helps <b>reduce carrying cost and prevent stock-outs</b>.')+
`<h4>Context: demand in India (World Bank / press numbers in the lecture)</h4>`+M([['7.2%','India GDP growth FY22/23, second highest among G20'],['6.3%','World Bank forecast FY23/24'],['8.4% YoY','Real GDP growth in Q3 of fiscal 2024'],['6.5% YoY','GVA growth in same quarter'],['10.6% YoY','Private investment spending growth'],['-3.2% YoY','Government consumption (biggest drag)'],['-0.8% YoY','Agriculture contraction (first since 2019)'],['11.6% / 9.5%','Manufacturing / construction growth']])+
`<p>A wide gap between GDP (8.4%) and GVA (6.5%) means demand (expenditure side) grows faster than supply (production side): possible excess demand for too few goods and higher inflation, which shows why forecasting matters.</p>
<h4>What is demand forecasting?</h4><p>The process of <b>understanding and predicting customer demand</b> to make smart decisions about supply chain operations, profit margins, cash flow, capital expenditure and capacity planning. It estimates total sales and revenue for a future period, often (not always) from historical data. It is vital to <b>avoid overproduction and underproduction</b>. Steps: decide what is measured and the time perspective, select the type and method, then collect, analyse and interpret.</p>
<h4>Five factors influencing demand forecast</h4>`+T(['Factor','Example'],[['<b>Seasonality</b>','Boating gear in summer; costumes and candy at Halloween; wedding season'],['<b>Competition</b>','New entrant drops demand; a competitor folding raises it'],['<b>Economy</b>','Recession lowers luxury demand, raises low-priced generic demand'],['<b>Types of goods</b>','Perishables need very precise forecasts; subscription boxes are predictable'],['<b>Geography</b>','Swimwear stored mostly in Florida where it is ordered most']])+
`<h4>Importance (benefits)</h4>`+T(['Benefit','How'],[['Inventory management','Right stock level: lower carrying cost, no stock-outs'],['Cost reduction','Align production and procurement with demand; less waste'],['Customer satisfaction','Products available when and where wanted'],['Marketing and promotion','Time and place campaigns'],['Financial planning','Project revenue, budget, investment'],['Risk mitigation','Plan contingencies for volatile markets'],['Production planning','Avoid over and underproduction'],['Resource allocation','People, machinery, raw materials'],['Supply chain optimisation','Visibility of future requirements'],['Seasonal planning','Prepare inventory and staffing for peaks'],['Competitive advantage','Agility against demand volatility'],['Strategic decisions','Product development, market and capacity expansion']])+
`<h4>Challenges</h4>`+T(['Challenge','Detail'],[['Lack of data','Too little data for accurate prediction'],['<b>Over-reliance on past data</b>','History cannot account for evolving market factors'],['<b>Limited visibility into the future</b>','Market volatility, rapid technological change, unpredictable external events'],['Poor forecasting processes','Wrong processes and tools'],['Insufficient resources','Lack of analysts'],['Inaccurate demand models','Errors in inventory and production decisions'],['Unpredictable external factors','Economic shifts, disasters, politics, technology']])+
`<h4>Types of demand forecasting</h4>`+T(['Type','Meaning'],[['Passive','Past sales used to predict future; assumes similar to last year; for steady-sales firms'],['Active','Used by start-ups and fast growers; includes growth plans, marketing, competitive environment'],['Short-term','Small window; day-to-day, JIT, Black Friday planning'],['Long-term','More than a year; seasonality, annual patterns, capacity, capital plans'],['Macro','External forces: economy, competition, consumer trends'],['Micro','Specific industry or segment (e.g. organic peanut butter for millennial parents in Austin)']])+
`<h4>Methods</h4>`+dFc+
`<h4>Qualitative methods</h4>
<h4>Delphi method</h4><p>Structured, iterative technique relying on a panel of experts to reach convergence of opinion.</p>`+F(['Select experts (10-50)','Design questionnaire','First round, independent answers','Feedback and analysis','Subsequent rounds (usually 2-4)','Final report'])+
L(['Anonymity avoids groupthink and dominant individuals','Each round shows statistical feedback and anonymised responses; experts revise','Ends at consensus or stable pattern; final report states agreement, disagreement and actions'])+
`<h4>Expert or insider knowledge</h4><p>Specialised understanding of people with significant experience in a field, industry or organisation. Tools: <b>interviews, focus groups, Delphi, workshops and brainstorming, surveys and questionnaires</b>.</p>
<h4>Survey method</h4>`+F(['Define objectives','Design questionnaire','Select sample','Administer','Collect and analyse','Interpret','Report'])+
T(['Mode','Features'],[['Online','Cheap, fast, large reach (SurveyMonkey, Google Forms)'],['Telephone','Real-time clarification'],['Face-to-face','High response, non-verbal cues; slow and costly'],['Mail','Reaches remote areas; low response, slow']])+
`<p>Question types: multiple choice, Likert scale, ranking, dichotomous (yes/no), open-ended. Sampling: random, stratified, convenience. Analysis tools: SPSS, Excel; qualitative data via thematic analysis.</p>
<h4>Interviews and focus groups</h4><p>Qualitative methods exploring attitudes, experiences, perceptions: define objectives, interview guide, choose participants, conduct (rapport, open questions, active listening), record and transcribe, analyse themes and report.</p>
<h4>Salesforce composite forecasting</h4><p>Combines multiple data sources and methods to offset the weaknesses of single methods.</p>`+F(['Collect data (CRM, opportunities, accounts, history)','Choose methods and weights','Generate initial forecasts','Collaborative input from reps and managers','Combine using weights','Review and adjust','Visualise and report'])+
`<h4>Quantitative methods</h4><p><b>Time series analysis</b> uses historic data to find the underlying <b>trend</b> (general direction) and <b>seasonal variation</b> (regular weekly, monthly or quarterly patterns), then predicts the future for budgeting and forecasting.</p>`+
T(['Moving average','Idea'],[['<b>SMA</b> (simple)','Average over a fixed number of periods; shorter window reacts faster, longer window smoother'],['<b>EMA</b> (exponential)','More weight on recent data, older data decays; faster response; can be computed from today\'s value and previous EMA; suits non-linear data'],['<b>WMA</b> (weighted)','Chosen weights per period, sum of weighted values divided by sum of weights; filters outliers; flexible']])+
`<h4>Trend projection</h4>`+F(['Collect historical data','Plot data','Choose trend model (linear, exponential, polynomial)','Fit trend line','Extrapolate','Evaluate and adjust'])+
`<p>Assumption: past patterns continue into the future.</p>`],
["Lecture 46 - Capacity Planning",
IMP('Asked: <b>Efficiency = actual output / effective capacity x 100%</b> (utilisation uses design capacity); <b>long-term / strategic capacity planning</b> covers several years.')+
`<p><b>Capacity planning</b> balances available resources to satisfy customer demand or project capacity needs: how much production capacity is needed as demand changes. In production and project management, capacity is the amount of work completed in a given time.</p>
<h4>Types by horizon</h4>`+T(['Type','Horizon and focus'],[['<b>Long-term / strategic</b>','Several years; supply and need forecasting; aligned with business goals and growth; strategic workforce capacity planning'],['Medium-term / tactical','A few months to a year; bridges strategic and operational; scheduling, forecasting, utilisation tracking'],['Short-term / operational','Days to months; reactive; scheduling, workforce management; solves immediate resource gaps']])+
`<h4>Capacity measures</h4>`+dCap+
T(['Term','Meaning'],[['<b>Design capacity</b>','Maximum output a facility is engineered to achieve under ideal conditions'],['<b>Effective (system) capacity</b>','Design capacity minus allowances (maintenance, downtime, breaks, scheduling conflicts, variations in demand)'],['<b>Actual output</b>','Rate actually achieved; cannot exceed effective capacity; hit by breakdowns, absenteeism, shortages']])+
M([['Efficiency','(Actual output / Effective capacity) x 100%'],['Utilisation','(Actual output / Design capacity) x 100%'],['Effective capacity','Design capacity - allowances']])+
`<h4>Worked example</h4><p>Actual production last week 25,000 units; design capacity 230 units per hour; plant runs 7 days, three 8-hour shifts; effective capacity 28,000.</p>`+
L(['Weekly design capacity = (7 x 3 x 8) x 230 = <b>38,640 units</b>','Utilisation = 25,000 / 38,640 = <b>64.7%</b>','Efficiency = 25,000 / 28,000 = <b>89.3%</b>'])+
`<h4>Capacity planning strategies by resource</h4>`+T(['Strategy','Purpose'],[['Workforce','Right number of workers and hours'],['Product','Right products or inventory to fulfil deliverables (pet store: food, toys, carriers)'],['Tool','Machinery, vehicles, assembly parts'],['Resource','Maximise capacity of existing resources; decide which to add or remove'],['Project','Time and resources for a given project; balance workload against milestones']])+
`<h4>Capacity planning process</h4>`+F(['Estimate capacity requirements','Evaluate existing capacity and gap','Identify alternatives','Financial analysis','Qualitative assessment','Choose best long-term alternative','Implement','Monitor results'])+
`<h4>Alternatives</h4>`+L(['Increase capacity (new equipment or facilities)','Optimise existing capacity (process improvement)','Outsource production or services','Flexible workforce (temporary, part-time)','Demand management (pricing, promotions)','Contingency plans (buffer inventory, backup suppliers)','Leverage technology and innovation (Industry 4.0)'])+
`<p>Implementation needs detailed planning, stakeholder engagement, continuous improvement and change management; qualitative issues include culture, employee morale, supply chain relationships and reputation.</p>
<h4>Evaluating alternatives</h4><p><b>Economic:</b> cost, useful life, compatibility, revenue (break-even analysis). <b>Non-economic:</b> employee and community reactions, and similar considerations.</p>
<h4>Break-even analysis</h4>`+dBep+
M([['Q BEP = FC / (r - v)','r = price per unit, v = variable cost per unit'],['TC = FC + v x Q','Total cost'],['Q for profit P','(P + FC) / (r - v)']])+
`<h4>Example: pizza place</h4><p>New small pizza line: lease USD 4,000 per month, variable cost USD 4, price USD 9.</p>`+
L(['Break-even = 4,000 / (9 - 4) = <b>800 pizzas per month</b>','Profit at 1,200 pizzas = 1,200 x 9 - (4,000 + 1,200 x 4) = 10,800 - 8,800 = <b>USD 2,000 profit</b> (the slide shows USD 6,000, which is revenue minus variable cost only and leaves out the USD 4,000 fixed cost)','Pizzas for USD 10,000 profit = (10,000 + 4,000) / 5 = <b>2,800</b>','Expected demand 700 < 800: <b>not profitable</b>'])+
`<h4>Make or buy break-even</h4><p>Set Total cost of Make = Total cost of Buy: Q BEP = FC / (VB - VM). Example (ABX Company): fixed cost 160,000, VM = 100, VB = 150: Q BEP = 160,000 / 50 = <b>3,200</b>. At 1,000 units: Make = 100,000 + 160,000 = 260,000; Buy = 150,000, so <b>buy</b>. Above the break-even quantity the option with the lower variable cost wins.</p>`],
["Lecture 47 - Sequencing and Scheduling",
IMP('Sequencing rules and their results (<b>SPT gives the lowest total flow time</b>); <b>Johnson\'s rule</b> for two machines; conditions for three machines.')+
`<p><b>Sequencing</b> is the order of processing a set of tasks over resources; <b>scheduling</b> adds the allocation of start and finish times to each order. Scheduling provides a shop-floor calendar and is often done by software considering resources, demand and capacity.</p>
<h4>Sequencing rules (five-job example in the lecture)</h4>`+T(['Rule','Priority to','Total flow time','Average delay'],[
['<b>FIFO</b> First In First Out','First arrival','50 days (mean 10)','4.6 days'],
['<b>LIFO</b> Last In First Out','Last arrival (rarely used; accelerates a delayed job)','46 days (mean 9.2)','4.0 days'],
['<b>SPT</b> Shortest Processing Time','Quickest job; fewer queues','<b>36 days (mean 7.2)</b>','<b>2.4 days</b>'],
['<b>LPT</b> Longest Processing Time','Longest job; fewer changeovers, better utilisation','60 days (mean 12)','6.8 days'],
['<b>EDD</b> Earliest Due Date','Most urgent deadline','39 days (mean 7.8)','<b>2.4 days</b>'],
['<b>LS</b> Least Slack','Smallest slack s = d - p','-','-'],
['<b>CR</b> Critical Ratio','Smallest (time until due / remaining processing time); dynamic, combines EDD and SPT','-','-']])+
`<div class="tip">In this example SPT gives the lowest total flow time and, with EDD, the lowest average delay. LPT is worst on both.</div>
<h4>Advantages and limitations</h4>`+T(['Advantages','Limitations'],[['Avoids bottlenecks; adaptable standard rules; lean stable processes; customer-specific sequences; captures planning know-how','Dynamic changes disrupt plans; limited machines, labour, materials; complexity with many jobs; conflicting priorities; setup and changeover difficulty; software and integration limits']])+
`<h4>Types of scheduling problems</h4>`+L(['<b>Single machine:</b> n jobs on one machine','<b>Flow shop:</b> n jobs with m operations and the same sequence for every job (general problem has exponential complexity)'])+
`<h4>Johnson\'s rule (2 machines, n jobs)</h4><p>Gives an optimal sequence in polynomial time. Preconditions: constant job times, job times independent of sequence, every job finishes machine 1 before machine 2, equal priority.</p>`+F(['List jobs and times','Pick the shortest time','If on machine 1: schedule first; if on machine 2: schedule last','Remove job; repeat towards the middle'])+
`<p>Ties are broken arbitrarily. With heavy idle time at the second centre, job splitting may be used.</p>
<h4>n jobs on three machines (A, B, C)</h4><p>Apply Johnson if either condition holds: <b>min(A) &gt;= max(B)</b> or <b>min(C) &gt;= max(B)</b>. Then replace the machines with two fictitious machines G and H (Gi = Ai + Bi, Hi = Bi + Ci) and sequence as usual. Example in the lecture: MDH Masala processing five items on machines A, B and C.</p>`],
["Lecture 48 - Transportation Management",
IMP('Asked: the four components of transportation decisions are <b>Load, Mode, Flow, Route</b>.')+
`<h4>Major components of transportation decisions</h4>`+F(['Load','Mode','Flow','Route'])+
`<h4>1. Load</h4><p>Quantity and composition of goods transported at a given time; goal is high capacity utilisation, low handling cost and timely delivery.</p>`+T(['Aspect','Meaning'],[['Load size','Amount per shipment, from parcels to full truckloads or containers'],['Load weight','Total mass; obey weight limits (safety, fines, delays)'],['Load volume','Space occupied; palletisation and stacking for cubic optimisation'],['Load packaging','Protection against damage, theft, spoilage; easy handling'],['Load composition','Mix of products; consolidation cuts shipping cost'],['Load balancing','Even weight distribution (axle weight, centre of gravity) for stability and fuel efficiency']])+
`<h4>Fleet selection and size: key factors</h4>`+L(['Transportation demand (history, trends, forecasts)','Service level requirements (lead time, frequency, flexibility, SLAs)','Geographical coverage (area, distance, traffic, accessibility)','Cargo characteristics','Redundancy and flexibility for disruptions','Cost: total cost of ownership (acquisition, operating, maintenance, fuel, depreciation)','Technology: route optimisation, telematics, fleet management','Regulatory compliance (registration, licences, insurance, driver hours)','Scalability and growth'])+
`<h4>2. Mode</h4>`+T(['Mode','Best for','Advantages','Challenges'],[
['<b>Road</b>','Short to medium distance, regional, last mile, perishables','Flexibility, door to door, frequent, reaches remote places, JIT','Congestion, weather, regulations, higher cost per mile on long hauls'],
['<b>Rail</b>','Long-distance bulk and heavy goods','Cheap at scale, low fuel and emissions, reliable schedules','Limited access, slower, extra handling'],
['<b>Maritime (water)</b>','Bulk, commodities, long haul, international trade','Lowest cost per ton, high capacity, global','Slowest, weather and port congestion, no door to door'],
['<b>Air</b>','Time-sensitive, high-value, perishable','Speed, predictable schedules, global','Highest cost, limited capacity for bulky cargo, airport dependence'],
['<b>Pipeline</b>','Petroleum, gas, chemicals, continuous flow','Low cost per unit, safe, low energy, dedicated route','Limited cargo types, high initial investment, leak and maintenance risks'],
['<b>Intermodal</b>','Combine modes in one shipment','Uses strengths of each mode, door to door, end-to-end visibility','Coordination, documentation, terminal dependence']])+
`<p>Lecture example (mode choice by cost): finished goods shipped plant to warehouse; annual volume 1,200,000 lb; product worth USD 25 per lb; plant and carrying cost 30% per year (a trade-off between transport cost and inventory carrying cost).</p>
<h4>3. Flow</h4>`+T(['Flow','Meaning','Challenges'],[['Physical flow','Movement of goods from suppliers to customers (transport, handling, storage)','Delays, capacity limits, disruptions'],['Information flow','Orders, invoices, forecasts, data exchange','Silos, inaccurate data, incompatible systems'],['Financial flow','Payments, pricing, invoicing','Payment delays, invoice mismatch, currency changes'],['Reverse flow','Returns, repairs, recycling, disposal (reverse logistics)','Returns handling, defective goods, regulation, cost']])+
`<h4>4. Route</h4><p>Strategic selection of optimal routes considering distance, time, cost, capacity, mode, infrastructure and regulation. It minimises cost and transit time, optimises resources and ensures timely delivery. Challenges: traffic, road conditions, weather, restrictions, geopolitics.</p>
<h4>Transportation management systems (TMS)</h4><p>Software that automates carrier selection, load building, routing and scheduling and freight payment. Lecture facts: US companies spend over <b>USD 600 billion</b> a year on transportation and about USD 1 billion on TMS. Examples: Polaroid (least-cost carrier and method), Tree of Life (inbound freight efficiency from <b>55% to 75%</b>), Orange Glo (automated freight payment, better on-time delivery).</p>`],
["Lectures 49 and 50 - Transportation Problem Programming",
IMP('Asked: a <b>balanced transportation problem has total supply = total demand</b>. Know NWCR, LCM, VAM, MODI and the optimality condition <b>m + n - 1</b> allocations.')+
`<p>The <b>transportation problem</b> finds the cheapest way to ship goods from several sources (factories, warehouses) to several destinations (customers, DCs) while meeting supply and demand. It is a linear programming problem: decision variables are quantities shipped, the objective minimises total cost.</p>
<h4>Assumptions</h4>`+L(['Fixed supply and demand','Single homogeneous commodity','Cost is linear in quantity shipped','Route capacity limits (maximum per route)','Non-negative variables','Full shipments (goods fully transported)'])+
`<h4>Types</h4>`+T(['Type','Meaning'],[['<b>Balanced</b>','<b>Total supply = total demand</b>'],['Unbalanced','Supply is not equal to demand; add a <b>dummy source or destination</b> with zero cost to balance']])+dTpa+
`<h4>Phase I: initial basic feasible solution (IBFS)</h4><p>An initial allocation meeting all supply and demand constraints; problem must be balanced. A basic solution has <b>m + n - 1</b> allocations (m sources, n destinations).</p>
<h4>1. North-West Corner Rule (NWCR)</h4><p>Start at the upper-left cell; allocate min(supply, demand); strike out the exhausted row or column; move on; repeat. It ignores costs, so it is easy but rarely optimal.</p>
<p><b>Lecture example:</b> supplies Jaipur 40, Udaipur 60, Mumbai 70; demands Kanpur 70, Pune 40, Delhi 60 (balanced: 170 = 170).</p>`+
T(['Allocation','Units','Unit cost (Rs)','Cost'],[['Jaipur to Kanpur','40','4','160'],['Udaipur to Kanpur','30','3','90'],['Udaipur to Pune','30','4','120'],['Mumbai to Pune','10','2','20'],['Mumbai to Delhi','60','8','480'],['<b>Total</b>','170','','<b>Rs 870</b>']])+
`<div class="tip">The slide writes the first term as (40x40); the correct product is 4 x 40 = 160, which is what makes the total Rs 870.</div>
<h4>2. Least Cost Method (LCM)</h4><p>Pick the cell with the lowest cost in the whole table, allocate min(supply, demand), strike out the satisfied row or column, repeat. Ties are broken arbitrarily (e.g. two cells with cost 3). In the lecture example the lowest cost is 1 (Jaipur to Delhi), and 40 units are allocated.</p>
<h4>3. Vogel\'s Approximation Method (VAM)</h4><p>Standard method: for each row and column compute the <b>penalty</b> (difference between the two smallest costs), select the row or column with the largest penalty, allocate the maximum to its cheapest cell, strike out, recompute. Usually gives a start closest to optimal.</p>
<h4>Phase II: optimality with MODI (u-v method)</h4>`+L(['Needs m + n - 1 allocations (add a tiny epsilon if fewer: degenerate case)','Set one u or v to 0; for each occupied cell ui + vj = cij to find all u and v','For each empty cell compute opportunity cost dij = cij - (ui + vj)','<b>If all dij &gt;= 0 the solution is optimal</b>; if some dij = 0 an alternative optimum exists','Otherwise form a loop from the most negative cell, shift units and repeat'])+
`<h4>Lecture example: optimal result</h4><p>All dij &gt;= 0 with d32 = 0, so the current solution is optimal and an <b>alternative optimum exists</b>. Optimal allocation: X11 = 10, X12 = 50, X13 = 40, X23 = 30, X25 = 90, X31 = 30, X34 = 90.</p>`+
M([['Rs 1,400','Minimum cost = 4x10 + 1x50 + 2x40 + 3x30 + 7x90 + 5x30 + 4x90']])+
`<h4>Why transportation programming is useful in logistics</h4>`+L(['<b>Cost minimisation</b> - fuel, maintenance, labour','<b>Improved service levels</b> - faster, more reliable delivery','<b>Inventory management</b> - timely delivery, fewer stock-outs, less excess','<b>Resource optimisation</b> - vehicles, drivers, warehouses, less idle time','<b>Time efficiency</b> - best routes and schedules','<b>Competitive advantage</b> - lower costs, better service'])],
["Lecture 51 - Assignment Problem Programming",
IMP('Assignment problem is a <b>special case of the transportation problem</b> (one-to-one, square matrix). Know the <b>Hungarian method</b> and the dummy row/column rule.')+
`<p>An <b>assignment problem</b> assigns a number of resources to an equal number of activities to minimise total cost (or maximise total profit). It arises because men, machines and so on have different efficiencies for different activities. Uses: workers to machines, markets to factories, salesmen to sales areas.</p>
<h4>Mathematical model</h4>`+L(['n jobs and n persons; cij = cost of person i on job j','xij = 1 if resource i is assigned to task j, otherwise 0','Minimise ΣΣ cij xij','Constraints: each task gets exactly one resource and each resource exactly one task','A special application of linear programming, a special case of the transportation problem'])+
T(['Type','Matrix'],[['Balanced','Square (n x n); rows = columns'],['Unbalanced','Non-square; add a <b>dummy row or column with zero costs</b>']])+
`<h4>Hungarian method</h4>`+dHun+
T(['Step','Action'],[['1','Build the cost table and balance it (dummy with zero cost)'],['2','Opportunity cost table: subtract row minimum from each row, then column minimum from each column; every row and column now has a zero'],['3','Assign: find a row with exactly one unmarked zero, box it, strike other zeros in its column; repeat for columns; if ties, choose arbitrarily (then an alternative optimum exists)'],['4','If assignments = n, optimal; total cost uses the original costs of assigned cells'],['5','Otherwise cover all zeros with the minimum number of lines: tick unassigned rows, tick columns with zeros in ticked rows, tick rows with assignments in ticked columns, repeat; draw lines through ticked columns and unticked rows'],['6','Revise: K = smallest uncovered element; subtract K from uncovered cells, add K at line crossings; singly covered cells unchanged'],['7','Repeat steps 3 to 6 until optimal']])+
`<h4>Worked example 1 (computer centre)</h4><p>Three programmers and three programmes: row minima 80, 80 and 110 are subtracted; then column minima 0, 10 and 0; single zeros are assigned in (1,C) and (3,A), then (2,B). Assignments (3) = rows (3), so the solution is optimal.</p>
<h4>Worked example 2 (unbalanced)</h4><p>Four jobs, five machines: a <b>dummy job 5</b> with zero costs is added; after the first pass only four assignments exist; the covering lines number 4, less than the order 5, so the matrix is revised with the smallest uncovered element; then 5 assignments are found. <b>Machine E receives no job</b> (the dummy), giving the minimum total time.</p>
<h4>Advantages of assignment programming</h4>`+T(['Group','Points'],[['Efficiency','Minimises cost, time and wastage; can maximise benefits; dynamic optimisation; enhances productivity'],['Clarity','Clear mathematical objective, quantifiable metrics, integrates constraints'],['Ease','Simple binary variables; tabular representation; scalable; accessible to non-experts'],['Flexibility','Adaptable constraints; tailored solutions; what-if scenario analysis'],['Real-time use','Fast response in emergencies and transport; IoT and sensor data; workforce management; routing and scheduling']])+
`<h4>Assumptions</h4>`+L(['Deterministic demand and supply','Homogeneous tasks and resources','Fixed assignment costs','No intermediate stops or transshipments','Linear relationships','Simple capacity limits','Single period planning','Objective: minimise cost or maximise benefit','Non-negative variables','Fixed origins and destinations'])]],

function tierOf(w,si,p){
 const hm=p.match(/^<h4>(.*?)<\/h4>/);
 const head=hm?hm[1].replace(/<[^>]*>/g,''):'Overview';
 const o=(OVR[w]||[]).find(r=>r[0].test(head)&&(r[2]===undefined||r[2]===si));
 const asked=(KEYS[w]||[]).filter(k=>k[0].test(p)).map(k=>k[1]);
 let t,a=[];
 if(o){t=o[1];}
 else if(asked.length){t='H';a=asked;}
 else if(/class="imp"/.test(p)){t='M';}
 else t='M';
 return {t,a:a,head};
}
function decorate(){
 document.querySelectorAll('.acc').forEach((acc,si)=>{
  const c=acc.querySelector('.c');if(c.dataset.d)return;c.dataset.d='1';
  const cnt={H:0,M:0,L:0};
  c.innerHTML=c.innerHTML.split(/(?=<h4>)/).filter(p=>p.trim()).map(p=>{
   const hm=/^<h4>/.test(p);
   if(!hm&&/class="imp"/.test(p)&&p.replace(/<[^>]*>/g,'').length<420)return p;
   const r=tierOf(wk,si,p);cnt[r.t]++;
   const lab=r.t==='H'?'\u2605 Must know'+(r.a.length?' \u00b7 asked in '+[...new Set(r.a.join(', ').split(', '))].join(', '):''):r.t==='M'?'\u25cf Good to know':'\u25cb Background';
   return '<div class="blk p-'+r.t+'"><span class="pb">'+lab+'</span>'+p+'</div>';
  }).join('');
  const h=acc.querySelector('.h');
  h.innerHTML=h.innerHTML+'<span class="cnt">\u2605 '+cnt.H+' \u00b7 \u25cf '+cnt.M+' \u00b7 \u25cb '+cnt.L+'</span>';
 });
}

function render(){
 if(tab==='notes'){
  main.innerHTML=D[wk].notes.map(d=>`<div class="acc"><div class="h">${d[0]}</div><div class="c">${d[1]}</div></div>`).join('');
  main.querySelectorAll('.h').forEach(h=>h.onclick=()=>h.parentNode.classList.toggle('open'));
  main.querySelector('.acc').classList.add('open');decorate();
 }else if(tab==='cards'){
  main.innerHTML=`<input type="search" id="fs" placeholder="Search Week ${wk} terms..."><div class="grid" id="fg"></div>`;
  const draw=f=>{const g=document.getElementById('fg');
   g.innerHTML=D[wk].gl.filter(x=>(x[0]+x[1]).toLowerCase().includes(f)).map(x=>`<div class="fc"><div class="fi"><div class="fa">${x[0]}</div><div class="fb">${x[1]}</div></div></div>`).join('');
   g.querySelectorAll('.fc').forEach(c=>c.onclick=()=>c.classList.toggle('f'));};
  draw('');document.getElementById('fs').oninput=e=>draw(e.target.value.toLowerCase());
 }else if(tab==='imp'){
  main.innerHTML='<div class="imp"><b>★ Important topics for Week '+wk+'.</b> These are the ideas the assignment questions tested or that the lectures stress with numbers, definitions or named examples. Revise these first.</div>'+T(['#','Important topic','What to remember'],D[wk].imp.map((x,i)=>[i+1,'<b>'+x[0]+'</b>',x[1]]));
 }else quiz();
}
function quiz(){
 const s=S[wk],qs=D[wk].q;
 main.innerHTML=`<div class="bar"><label>Set <select id="qs"><option value="all">All Week ${wk} questions</option><option value="o">Original assignment (${qs.filter(q=>q[0]==='o').length})</option><option value="x">Extra practice (${qs.filter(q=>q[0]==='x').length})</option></select></label><span id="sc"></span><div class="prog"><i id="pg"></i></div><button class="p" id="rs">Reset / Retake</button></div><div id="res"></div><div id="qb"></div>`;
 const sel=document.getElementById('qs');sel.value=s.f;
 sel.onchange=()=>{newQ(wk);S[wk].f=sel.value;quiz()};
 document.getElementById('rs').onclick=()=>{const f=s.f;newQ(wk);S[wk].f=f;quiz()};
 const idx=qs.map((q,i)=>i).filter(i=>s.f==='all'||qs[i][0]===s.f);
 s.order=idx;
 document.getElementById('qb').innerHTML=idx.map((i,n)=>{const q=qs[i];
  return `<div class="q" id="q${i}"><div class="t">Q${n+1} &middot; ${lab[q[0]]}</div><p>${q[1]}</p>`+q[2].map((o,j)=>`<button class="o" data-q="${i}" data-o="${j}">${'ABCD'[j]}) ${o}</button>`).join('')+`<button class="chk" data-c="${i}">Check Answer</button><div class="ex" id="e${i}"></div></div>`}).join('');
 document.querySelectorAll('.o').forEach(b=>b.onclick=()=>ans(+b.dataset.q,+b.dataset.o));
 document.querySelectorAll('.chk').forEach(b=>b.onclick=()=>ans(+b.dataset.c,-1));
 idx.forEach(i=>{if(s.st[i]!==undefined)show(i,s.st[i])});
 upd();
}
function show(i,sel){
 const q=D[wk].q[i];
 document.querySelectorAll(`#q${i} .o`).forEach((b,j)=>{b.disabled=true;if(j===q[3])b.classList.add('ok');else if(j===sel)b.classList.add('no')});
 const e=document.getElementById('e'+i);
 e.innerHTML=(sel===q[3]?'<b style="color:var(--ok)">Correct.</b> ':sel===-1?'<b>Answer: '+'ABCD'[q[3]]+'.</b> ':'<b style="color:var(--no)">Incorrect.</b> Correct answer: '+'ABCD'[q[3]]+'. ')+q[4];
 e.classList.add('s');
}
function ans(i,o){
 const s=S[wk];if(s.st[i]!==undefined)return;
 s.st[i]=o;s.done++;if(o===D[wk].q[i][3])s.score++;
 show(i,o);upd();
}
function upd(){
 const s=S[wk],n=s.order.length;
 document.getElementById('sc').textContent=`Score: ${s.score} / ${s.done} (of ${n})`;
 document.getElementById('pg').style.width=(n?s.done/n*100:0)+'%';
 if(n&&s.done===n){const r=document.getElementById('res'),p=s.score/n;r.style.display='block';
  r.innerHTML=`<b>${s.score} / ${n}</b><div>${Math.round(p*100)}% &middot; ${p>=.8?'Excellent work':p>=.6?'Good, review the misses':'Revisit the notes and retry'}</div>`}
}
