s. Cost and quality problems are the usual triggers.","K"],["Case: Apple","Outsources manufacturing and assembly of all devices to China because manufacturing is not its core competency and assembly there is significantly cheaper; designs in the US, builds in China, ships back for sale.","E"],["Case: Nike","Core competencies are marketing and design; partners with contract manufacturers instead of making products.",""],["Case: Google","Core competencies: search algorithm, data analytics, user experience design. Identify yours via SWOT, customer feedback, benchmarking against leaders, best practices.",""]],"q":[["o","According to the traditional view, the three primary 'impellers' of a supply chain are:",["Sustainability, Collaboration, and Globalization","Empowered Customers, Information Technology Tool Developments, and Globalization","Pricing Mechanisms, Sourcing Strategies, and Inventory Management","Systems Concept, Total Cost Concept, and Trade-off Concept"],1,"L31: empowered customer, IT tool developments, globalization. Sustainability and collaboration are the two extra impellers some literature adds."],["o","Which best describes the 'bullwhip effect'?",["Reducing total costs by eliminating hidden expenses","Small fluctuations in consumer demand lead to increasingly larger variations in orders upstream","Minimising inventory by having suppliers manage replenishment","The impact of globalization on competition"],1,"L31/L39: small demand changes are amplified upstream through forecast errors, batching, price fluctuation, poor information sharing."],["o","Which concept captures the ability to anticipate, understand and navigate shifts and challenges in the supply chain environment?",["Demand Sense","Supply Response","Supply Sense","Demand Response"],2,"L31 defines Supply Sense exactly this way. Demand Sense is about anticipating customer demand."],["o","Digitising with ERP, IoT and AI/ML requires increasing investment in which strategy to counter rising network threats?",["Agile Scaling Strategy","Cybersecurity Strategy","Collaborative Forecasting Strategy","Predictive Maintenance Strategy"],1,"L32: 'Invest in Cybersecurity' as digitisation raises cyber threats."],["o","What is the correct order of the three steps to achieve strategic fit?",["Minimise costs; maximise response times; expand warehouses","Optimise inventory; establish supplier locations; formulate pricing","Understand customer and supply chain uncertainty; understand supply chain capabilities; achieve strategic fit (coordinate functional strategies)","Implement ERP; robot automation; cybersecurity"],2,"L34: Step 1 customer and uncertainty, Step 2 capabilities, Step 3 achieve fit."],["o","Why does Apple outsource manufacturing and assembly to China, per the case study?",["Hardware design and software engineering are its only core competencies and China offers substantially lower manufacturing costs","US regulations prohibit domestic assembly","It sells over 90% of inventory in China","Manufacturing is its core competency and it owns most Chinese facilities"],0,"L36: manufacturing is not Apple's core competency and assembly in China is significantly cheaper."],["o","Which core logistics procedure is at the heart of Walmart's strategy to replenish stock efficiently, cutting inventory and transport cost and time?",["CPFR","Cross-docking","3PL outsourcing","Vendor-managed inventory"],1,"L35 Walmart case: cross-docking decreases inventory and transport costs and saves transport time. (CPFR was Unilever's.)"],["o","In a distribution design strategy, which component designs systems such as demand forecasting and order management for real-time visibility across the chain?",["Operating Facilities","Information Flows","Logistics Strategy","Service Differentiation"],1,"L32 design strategy lists inventory, transportation, operating facilities and information flows; information flows is this one."],["o","How is Porter's Five Forces adapted in supply chain strategy?",["To calculate the payback period of warehouse automation","To analyse competitive forces and assess the dynamics of the supply chain environment","To measure inventory turnover","To replace SWOT analysis"],1,"L33: a business strategy tool adapted to assess supply chain environment dynamics."],["o","How do outsourcing and strategic alliances help businesses 'Enhance Competitiveness'?",["By allowing access to specialised resources, capabilities and expertise not available internally","By eliminating the need for KPIs","By shifting compliance onto the customer","By localising everything in one facility"],0,"L36 purposes of outsourcing and alliances."]],"imp":[["Traditional 3 impellers (Lecture 31)","(1) Empowered customer: more knowledgeable and demanding; expects variety, availability, competitive pricing; transparency such as seeing restaurant kitchens raises expectations. (2) Developments in information technology tools..."],["Bullwhip effect (Lecture 31)","Small fluctuations in consumer demand cause amplified order variations upstream. Causes: information delays, forecast inaccuracies, order batching and other distortions. Results: inefficiency, excess inventory, stock-outs, high..."],["Supply sense (Lecture 31)","Ability of supply chain professionals to anticipate, understand and respond effectively to shifts and challenges in the supply chain environment; strategic thinking, analysis, proactive decisions."],["Effective strategy qualities (Lecture 32)","Collaborative (stakeholders share plans and data); agile (scale up or down); resilient (expect, mitigate, recover from disruption); digital (connected, controlled, informed); invest in cybersecurity (cyber threats rise with dig..."],["Design strategy (distribution) (Lecture 32)","Inventory management (levels, replenishment, location); transportation (modes, routes, carriers); operating facilities (location, capacity, layout of plants, warehouses, DCs); information flows (systems for demand forecasting, ..."],["Porter's Five Forces (Lecture 33)","Strategic tool for analysing competitive forces; traditionally business strategy, adapted to assess the dynamics of the supply chain environment. Created by Harvard professor Michael Porter, published 1979 (HBR: 'How Competitiv..."],["Five forces in supply chain terms (Lecture 33)","Supplier power: concentration, switching costs, relationships. Buyer power: concentration, price sensitivity, differentiation. Threat of new entrants: barriers to entry, industry structure, technological advances. Threat of sub..."],["3 steps to fit (in order) (Lectures 34-35)","Step 1: Understand the customer and supply chain uncertainty. Step 2: Understand the supply chain capabilities. Step 3: Achieve strategic fit (coordinate functional strategies)."],["Case: Walmart (Lectures 34-35)","Highest sales per square foot over two decades; cost structure supports lower prices. Strategic sourcing finds suppliers meeting demand at best price; long-term alliances promise increased purchases for lowest prices. Supplier ..."],["Purposes of outsourcing and alliances (Lecture 36)","Enhance competitiveness (access specialised resources, capabilities, expertise not available internally); improve efficiency and cost-effectiveness; access new markets and customers; foster innovation and learning; mitigate ris..."],["Case: Apple (Lecture 36)","Outsources manufacturing and assembly of all devices to China because manufacturing is not its core competency and assembly there is significantly cheaper; designs in the US, builds in China, ships back for sale."]]},"8":{"notes":[["Lecture 37 - Strategic Sourcing","<div class=\"tip\"><b>Analogy:<\/b> Like choosing a long-term business partner rather than the cheapest stall at the market.<\/div><h4 data-t=\"H\">Strategic sourcing<\/h4><p>Procurement strategy of identifying, evaluating and selecting suppliers on specific criteria to optimise the supply chain and achieve long-term business goals. Systematic and proactive; goes beyond lowest-cost supplier: strong relationships, quality and delivery, lower cost, mitigated risk. Analyses product and process specifications, supplier market and customer service to decide local vs global sourcing; includes sourcing strategy, contract negotiation, supplier relationships, transition action plans; aligns sourcing with organisational strategy.<\/p><h4 data-t=\"M\">Characteristics<\/h4><p>Disciplined buying practices; total cost focus (total cost of ownership: quality, service, delivery); consolidated purchasing power (better terms, lower ordering cost, economies of scale); tight supplier relationships (partners: trust, long-term commitment, shared vision); improved teamwork and purchasing skills (cross-functional); realigned business processes (remove redundancy, cut cycle time and inventory); continuous improvement; focus on value creation.<\/p><h4 data-t=\"L\">Supplier selection and management<\/h4><p>Importance of suppliers (control unit cost, lower total acquisition cost, meet customer needs, fewer suppliers, design subassemblies). Selection criteria: quality, delivery, performance history, warranties and claims policies, production facilities and capacity, price, technical capability, financial position. Evaluation by scoring and formal reviews. Certification: certified suppliers consistently deliver quality, reducing routine testing. Management: ongoing communication, monitoring, issue resolution. Benefits: cost reduction, operational performance, product quality, shorter time-to-market, responsiveness.<\/p><h4 data-t=\"M\">Supplier relationship management (SRM)<\/h4><p>Strategic approach to collaborative, mutually beneficial relationships with key suppliers built on trust, open communication, win-win. Objectives: become the 'customer of choice', leverage supplier capabilities for innovation and development, share growth, profits, risks and investments. Aims: preferential treatment, access to technology and innovation, risk reduction. Activities: selection, contract negotiation, performance measurement, joint planning, risk management.<\/p><h4 data-t=\"M\">Establishing SRM (9 steps)<\/h4><p>1 Define SRM strategy aligned with business objectives. 2 Identify key suppliers (strategic importance, business volume, collaboration potential). 3 Assess supplier capabilities (quality, delivery, cost, innovation, sustainability). 4 Establish governance (roles, decisions, cross-functional teams). 5 Develop collaboration initiatives (joint product development, process optimisation, cost reduction, best practices). 6 Invest in technology (supplier management software, platforms, analytics). 7 Foster open communication (meetings, forums, workshops). 8 Implement performance measurement (KPIs, reviews). 9 Develop supplier development programs (training, mentoring, knowledge sharing).<\/p><h4 data-t=\"L\">SRM objectives and challenges (slide figures were images)<span class=\"wb\">WEB<\/span><\/h4><p>Rebuilt from the PwC report the slide cites (Verweij and Peek, <mark>2013<\/mark>). Objectives: customer of choice, focus on value, leverage supplier capabilities, share growth, profit, risk and investment. Survey ranking: leveraging supplier capabilities first, cost reduction second, security of supply third. Top challenges: too much focus on cost instead of value, lack of SRM competencies, incompatible strategic objectives. SRM is for a limited number of key suppliers; others are managed by contract management and vendor rating.<\/p><h4 data-t=\"M\">Supplier segmentation<\/h4><p>Categorise suppliers to prioritise effort and tailor strategy. Criteria: spend, risk (impact of supplier failure), criticality (importance to core operations), performance (quality, delivery, reliability), market position (share, technology, innovation), geographic location (logistics, lead time, regional regulation).<\/p><h4 data-t=\"H\">Kraljic matrix<\/h4><p>Four categories by profit impact and supply risk: strategic (high, high), leverage (high profit, low risk), bottleneck (low profit, high risk), non-critical (low, low).<\/p><h4 data-t=\"H\">ABC analysis<\/h4><p>Pareto principle (<mark>80<\/mark>/<mark>20<\/mark>). A-class: small number of suppliers with the majority of spend or strategic importance. B-class: moderate number, average spend or importance. C-class: large number, low spend or importance.<\/p><h4 data-t=\"H\">Global sourcing<\/h4><p>Procuring from suppliers worldwide for lower cost, better quality, advanced technology, improved production capability. Eight dimensions: cost (total landed cost incl. transport and duties, infrastructure investments), quality, corporate social responsibility, risk (political instability, currency, disruption), opportunities (technology, innovation, skilled labour), politics (trade regulations, intervention), local context (culture, infrastructure, legal framework), enabling infrastructure (transport, communication).<\/p><h4 data-t=\"L\">Case: Colorado manufacturer<\/h4><p>Founded 1950s; build-to-order, low-volume high-mix; outdated MRP caused about <mark>$1<\/mark>M excess and obsolete inventory; customer lead time <mark>12<\/mark> weeks (double competitors'). New president (lean and supply chain expertise) set a 3-5 year roadmap; goal: cut customer lead time <mark>80%<\/mark> to two weeks. 7 steps: define strategic objectives; specify critical parts (machined, total landed cost, local suppliers); assess and select qualified suppliers (NDA, questionnaire, 3-year price stability); supplier selection and parts allocation; award parts and negotiate (five shops, <mark>10<\/mark>-<mark>30%<\/mark> each, Kanban); implementation (Kanban from blanket PO, new ERP, daily floor walk); track results (quarterly supplier scorecard, weekly review).<\/p><h4 data-t=\"L\">Colorado results<\/h4><p>Machined-part lead time 6-8 weeks to two days; supplier on-time delivery <mark>50%<\/mark> to <mark>95%<\/mark>; supplier quality <mark>60%<\/mark> to over <mark>99%<\/mark>; price stability gave <mark>30%<\/mark> improvement in gross profit; inventory down <mark>50%<\/mark> freeing <mark>$750,000<\/mark>. Customer lead time <mark>12<\/mark> to 2 weeks (<mark>80%<\/mark>); quality up <mark>25%<\/mark>, warranty cost <mark>0.2%<\/mark> of sales; market share up <mark>30%<\/mark> over four years.<\/p><h4 data-t=\"M\">Flow and rebuilt diagrams<\/h4><div class=\"viz\"><h5>SRM objectives and challenges (PwC study cited on the slide) <span class=\"wb\">WEB<\/span><\/h5><div class=\"g2\"><div><b>4 SRM objectives (Monczka et al., 2011)<\/b>1 Become 'customer of choice' (preferential treatment: availability, cost, access to technology, innovation, risk reduction). 2 Focus on value. 3 Leverage supplier capabilities (early involvement in innovation and development). 4 Share growth, profits, risks and investments.<\/div><div><b>Survey ranking of objectives<\/b>1 Leverage supplier capabilities. 2 Deliver cost reduction targets. 3 Improve security of supply. Others: become customer of choice, manage supply risk profile, enhance relationships, guarantee sustainable sourcing, increase responsiveness, anticipate volatile commodity prices.<\/div><div><b>Top 3 challenges<\/b>1 Too much focus on cost instead of value. 2 Lack of specific SRM competencies and skills. 3 Strategic objectives of buyer and supplier not compatible.<\/div><div><b>Other challenges<\/b>No alignment between business and procurement; open communication and information sharing is difficult; focus on fighting instead of collaborating; ignorance of soft skills; lack of business involvement; limited top-management sponsorship; lack of mutual understanding and empathy.<\/div><\/div><div class=\"mid\">SRM maturity: No SRM &rarr; Exploring &rarr; Established &rarr; World-class<\/div><\/div><div class=\"viz\"><h5>Kraljic matrix (profit impact vs supply risk)<\/h5><div class=\"g2\"><div><b>Leverage (high profit, low risk)<\/b>Cost optimisation, competitive bidding, use buying power.<\/div><div><b>Strategic (high profit, high risk)<\/b>Close partnerships, joint development, executive involvement.<\/div><div><b>Non-critical (low profit, low risk)<\/b>Efficient transactions, automate, minimal resources.<\/div><div><b>Bottleneck (low profit, high risk)<\/b>Safety stock, dual sourcing, develop alternative suppliers.<\/div><\/div><p class=\"cap\">Rows: top = high profit impact, bottom = low. Columns: left = low supply risk, right = high supply risk.<\/p><\/div>"],["Lecture 38 - Vendor Rating","<div class=\"tip\"><b>Analogy:<\/b> Like a report card for suppliers: same exam, weighted subjects, feedback each term.<\/div><h4 data-t=\"H\">Vendor rating<\/h4><p>Formal evaluation system assessing suppliers on delivery, quality, price and service by assigning a rating or score. Assesses and monitors performance, gives feedback, benchmarks against standards, reduces subjectivity, selects vendors for development. Usually computed with weights on quality and delivery ratings; important where volumes and spend are large (e.g. railways).<\/p><h4 data-t=\"M\">Criteria<\/h4><p>Quality (specification adherence, failure rate, rework, replacements). Price (competitiveness, stability, accuracy, notice of price changes, clear billing). Delivery (lead time, quantity accuracy, packaging and documentation, emergency deliveries). Service (complaint handling, technical support, emergency support, timely resolution). Reliability (track record, reputation, financial stability). Innovation (R&D, willingness to adapt, unique offerings). Relationship (communication, collaboration, understanding needs).<\/p><h4 data-t=\"L\">Need for vendor rating<\/h4><p>Performance evaluation; supplier development (training, best practices); risk mitigation (poor quality, late delivery, inadequate service; diversify, contingency); cost optimisation; performance benchmarking; supplier relationship management (open feedback, trust).<\/p><h4 data-t=\"M\">8 steps<\/h4><p>1 Define evaluation criteria. 2 Assign weights. 3 Gather data (reports, feedback, audits, inspections, surveys). 4 Evaluate performance (quantitative and qualitative). 5 Calculate ratings (e.g. weighted scoring: score x weight, summed). 6 Review and validate. 7 Communicate results and feedback. 8 Use ratings for decisions (selection, renewals, development, risk).<\/p><h4 data-t=\"M\">Technique: categorical plan<\/h4><p>Managers from different departments list factors important to them; very subjective; each supplier rated Good, Satisfactory or Poor on each list.<\/p><h4 data-t=\"M\">Technique: weighted point plan<\/h4><p>Factors categorised and weights assigned to each factor by importance; vendor performance is scored and multiplied by the weights.<\/p><h4 data-t=\"M\">Technique: cost ratio plan<\/h4><p>Ratings based on costs incurred in buying from each supplier for variables such as quality, price, delivery; cost ratio = individual cost / total purchase value x <mark>100<\/mark>. Example: delivery cost Rs <mark>5,000<\/mark> on purchases of Rs 1,<mark>00,000<\/mark> gives <mark>5,000<\/mark> / 1,<mark>00,000<\/mark> x <mark>100<\/mark> = <mark>10%<\/mark>.<\/p><h4 data-t=\"M\">Technique: forced decision matrix<\/h4><p>Attributes (quality, service, price, reliability, lead time) are compared pairwise; the more important one gets weight 1 and the other 0.<\/p><h4 data-t=\"M\">Technique: service cost ratio<\/h4><p>Subjective measure of intangible service: labour stability, financial stability, flexibility for rush orders, R&D.<\/p><h4 data-t=\"L\">IBM quality rating<\/h4><p>Based on quality costs. VGR = (desired cost of inspection / actual cost of inspection) x <mark>100<\/mark>.<\/p><h4 data-t=\"M\">Bell quality rating (LQI)<\/h4><p>Lot Quality Index by Bell Helicopter Company: LQI = X / L, where L = total lots received in the period and X = (L1 x 1.<mark>00<\/mark>) + (L2 x 2.<mark>10<\/mark>) + (L3 x 2.<mark>90<\/mark>) + (L4 x 3.<mark>10<\/mark>) + (L5 x 3.<mark>90<\/mark>). L1 = lots acceptable as received; L2 = lots rejected by sampling inspection but labelled; L3 = rejected, rework at supplier's end; L4 = rejected, returned not usable; L5 = rejected, rework at Bell. Formula can be modified to suit the company.<\/p><h4 data-t=\"L\">Weighted-point worked example (illustrative)<span class=\"wb\">WEB<\/span><\/h4><p>Weights: quality <mark>40<\/mark>, delivery <mark>25<\/mark>, price <mark>20<\/mark>, service <mark>15<\/mark>. Vendor A scores <mark>90<\/mark>, <mark>80<\/mark>, <mark>70<\/mark>, <mark>60<\/mark>: rating = 0.40x90 + 0.25x80 + 0.20x70 + 0.15x60 = <mark>36<\/mark> + <mark>20<\/mark> + <mark>14<\/mark> + 9 = <mark>79<\/mark>. A second vendor is compared in the rebuilt table below. The slide's own vendor rating format was an image.<\/p><h4 data-t=\"L\">Advantages<\/h4><p>Minimises subjectivity and covers all relevant criteria; feedback from all areas in one package; better communication with vendors; overall control of the vendor base; requires specific action on weaknesses; continuous review standards, so continuous improvement.<\/p><h4 data-t=\"M\">Flow and rebuilt diagrams<\/h4><div class=\"viz\"><h5>Vendor rating format: weighted-point example (illustrative, rebuilt)<\/h5><table class=\"tb\"><tr><th>Criterion<\/th><th>Weight<\/th><th>Vendor A score (0-100)<\/th><th>Weighted score<\/th><th>Vendor B score<\/th><th>Weighted score<\/th><\/tr><tr><td>Quality<\/td><td>40%<\/td><td>90<\/td><td>36.0<\/td><td>75<\/td><td>30.0<\/td><\/tr><tr><td>Delivery<\/td><td>25%<\/td><td>80<\/td><td>20.0<\/td><td>90<\/td><td>22.5<\/td><\/tr><tr><td>Price<\/td><td>20%<\/td><td>70<\/td><td>14.0<\/td><td>85<\/td><td>17.0<\/td><\/tr><tr><td>Service<\/td><td>15%<\/td><td>60<\/td><td>9.0<\/td><td>80<\/td><td>12.0<\/td><\/tr><tr><th>Total<\/th><th>100%<\/th><th><\/th><th>79.0<\/th><th><\/th><th>81.5<\/th><\/tr><\/table><p class=\"cap\">Rating = sum of (score x weight). Weights come from step 2 of the vendor rating process and should reflect strategy. Numbers are invented to show the method; your slide's own format table was an image.<\/p><\/div>"],["Lecture 39 - Supply Chain Coordination","<div class=\"tip\"><b>Analogy:<\/b> Like an orchestra: each section can play well alone, but without a shared score and conductor the music falls apart.<\/div><h4 data-t=\"M\">Coordination<\/h4><p>Strategic alignment and integration of processes, activities and information flow among suppliers, manufacturers, distributors, retailers to optimise overall performance: efficiency, lower cost, responsiveness, timely delivery. Elements: demand forecasting, inventory management, production planning, transportation logistics, communication systems.<\/p><h4 data-t=\"H\">Coordination with suppliers<\/h4><p>Demand forecasting: collaborative forecasting (predict future demand so suppliers can adjust production schedules) and real-time information sharing. Inventory: vendor-managed inventory (suppliers manage stock at the manufacturer or distributor) and JIT delivery. Quality: agreed standards, continuous improvement via feedback and reviews. Communication: regular meetings, integrated IT systems.<\/p><h4 data-t=\"L\">Coordination with distributors<\/h4><p>Order fulfilment (order management systems, coordinated distribution planning); inventory (stock replenishment, safety stock); customer service (reliable delivery, returns management); data sharing (sales data, KPIs such as order accuracy, delivery times, satisfaction); collaboration (joint business planning, real-time communication).<\/p><h4 data-t=\"L\">Supplier-distributor interaction<\/h4><p>Supplier delivers to the distributor on a purchase order; both track inventory; the distributor gets a production plan from the manufacturer; finished goods go to the distributor's warehouse; the distributor fills retailer orders through delivery and transportation; retailers sell to customers. Coordination points: purchase orders, production plan, inventory management, delivery and transportation.<\/p><h4 data-t=\"M\">Lack of coordination and bullwhip<\/h4><p>Ineffective communication among entities causes inefficiency. Bullwhip causes: demand forecasting inaccuracies, order batching, price fluctuations, lack of information sharing. Impacts: increased costs, excess inventory, stock-outs, poor customer service.<\/p><h4 data-t=\"H\">5 obstacles to coordination<\/h4><p>Inventive (lack of resources or expertise for new technology; resistance to change). Information processing (data inaccuracies, delays in sharing; inadequate systems). Operational (capacity constraints, bottlenecks, transport delays, quality problems). Pricing (conflicting objectives, lack of transparency, power imbalance). Behavioural (lack of trust, poor collaboration and communication).<\/p><h4 data-t=\"M\">Managerial action 1: align goals and incentives<\/h4><p>Maximise total supply chain surplus, not individual profit; align functions with profitability. Pricing for coordination: lot-size-based quantity discounts, two-part tariffs, volume discounts; contracts: buyback, revenue sharing, quantity flexibility. Alter sales force incentives from sell-in to sell-through to reduce forward buying.<\/p><h4 data-t=\"M\">Managerial action 2: information visibility and accuracy<\/h4><p>Share point-of-sale data; collaborative forecasting and planning (common forecast); single-stage control of replenishment (continuous replenishment programs, vendor-managed inventories).<\/p><h4 data-t=\"M\">Managerial action 3: operational performance<\/h4><p>Reduce replenishment lead time (electronic ordering, flexible manufacturing, cross-docking); reduce lot sizes; ration based on past sales and share information to limit gaming (order inflation).<\/p><h4 data-t=\"M\">Managerial action 4: stabilise orders by pricing<\/h4><p>Move from lot-size-based to volume-based quantity discounts (over a rolling horizon); stabilise pricing: eliminate promotions, use everyday low pricing, tie promotion dollars to sell-through.<\/p><h4 data-t=\"M\">Managerial action 5: partnerships and trust<\/h4><p>Trust and information sharing lower transaction costs and duplication; clear roles, effective contracts and conflict resolution make the chain responsive.<\/p><h4 data-t=\"M\">Macro processes<\/h4><p>CRM: processes at the firm-customer interface. ISCM: processes internal to the firm. SRM: processes at the firm-supplier interface.<\/p><h4 data-t=\"L\">Case: Amazon CRM<\/h4><p>Personalised recommendations from past purchases and browsing; one-click ordering; order visibility from placement to delivery; call-back option when call-centre volume is high. <mark>2008<\/mark> top CRM vendors (Gartner): SAP <mark>22.5%<\/mark>, Oracle <mark>16.1%<\/mark>, Salesforce.com <mark>10.6%<\/mark>, Microsoft <mark>6.4%<\/mark>, Amdocs <mark>4.9%<\/mark>; Amazon relies on in-house development.<\/p><h4 data-t=\"L\">Case: Hindustan Oil Company (HOC)<\/h4><p>Oil industry leader through efficient supply chain, quality control, R&D, customer focus; refining, marketing, distribution of petroleum products; sustainability and carbon-footprint initiatives.<\/p><h4 data-t=\"L\">Conclusion<\/h4><p>Coordination built on trust, transparency and shared goals gives efficiency and advantage; CRM manages customer interactions; CPFR enables joint planning, demand visibility and inventory management.<\/p><h4 data-t=\"M\">Flow and rebuilt diagrams<\/h4><div class=\"viz\"><h5>Bullwhip effect (illustrative bar heights)<\/h5><svg viewBox=\"0 0 400 190\"><g fill=\"#f59e0b\"><rect x=\"40\" y=\"150\" width=\"50\" height=\"20\"/><rect x=\"130\" y=\"130\" width=\"50\" height=\"40\"/><rect x=\"220\" y=\"100\" width=\"50\" height=\"70\"/><rect x=\"310\" y=\"50\" width=\"50\" height=\"120\"/><\/g><line x1=\"30\" y1=\"170\" x2=\"380\" y2=\"170\" stroke=\"#555\"/><text x=\"40\" y=\"185\">Retailer<\/text><text x=\"125\" y=\"185\">Wholesaler<\/text><text x=\"212\" y=\"185\">Manufacturer<\/text><text x=\"312\" y=\"185\">Supplier<\/text><text x=\"30\" y=\"20\">Order variability grows as you move upstream<\/text><\/svg><p class=\"cap\">Small consumer-demand changes become larger order swings upstream.<\/p><\/div><div class=\"viz\"><h5>Macro processes in a supply chain<\/h5><div class=\"flow\"><span>SRM: firm &harr; suppliers<\/span><i>&rarr;<\/i><span>ISCM: inside the firm<\/span><i>&rarr;<\/i><span>CRM: firm &harr; customers<\/span><\/div><\/div>"],["Lectures 40-41 - Supply Chain Performance and the Balanced Scorecard","<div class=\"tip\"><b>Analogy:<\/b> Like a pilot's dashboard: no single dial tells you if the flight is safe; you need fuel, speed, altitude and weather together.<\/div><h4 data-t=\"L\">Supply chain performance<\/h4><p>Effectiveness and efficiency of each stage in optimising cost, reducing inefficiency, increasing speed and meeting customer expectations; metrics such as on-time delivery, stock availability, order accuracy, production lead times. Measures are qualitative (customer satisfaction, product quality) or quantitative (order-to-delivery lead time, response time, flexibility, resource utilisation, delivery performance).<\/p><h4 data-t=\"M\">Financial measures<\/h4><p>Cost of raw materials; revenue from goods sold; activity-based costs (material handling, manufacturing, assembling); inventory holding cost; transportation cost; cost of expired perishables; penalties for incorrectly filled or late orders; credits for incorrect or late supplier deliveries; cost of goods returned by customers; credits for goods returned to suppliers.<\/p><h4 data-t=\"M\">Non-financial measures<\/h4><p>Cycle time (supply chain lead time: raw material to customer's address; order-to-delivery lead time: order placement to delivery). Customer service level (order fill rate, stock-out rate, backorder level, probability of on-time delivery). Inventory levels: raw materials, work-in-process, finished goods, spare parts. Resource utilisation: manufacturing, storage, logistics, human, financial resources. Also ability to perform, flexibility, quality.<\/p><h4 data-t=\"L\">Qualitative measures<\/h4><p>Customer satisfaction, customer complaints, customer response time, product quality, delivery experience (on or before due date), order accuracy.<\/p><h4 data-t=\"H\">Balanced Scorecard (BSC)<\/h4><p>Developed by Robert Kaplan and David Norton: a strategic planning and management system aligning business activities to vision and strategy, improving communication, and monitoring performance against goals, with financial and non-financial indicators across four perspectives: financial, customer, internal business processes, learning and growth. Nearly <mark>60%<\/mark> of Fortune <mark>500<\/mark> companies use some form.<\/p><h4 data-t=\"H\">BSC supply chain KPIs<\/h4><p>Financial: cost reduction, ROI, revenue growth. Customer: order fulfilment rate (on time and in full), customer satisfaction scores, lead time. Internal process: cycle time, inventory turnover, supply chain flexibility. Learning and growth: employee training and development, technology utilisation, innovation rate.<\/p><h4 data-t=\"L\">Implementing BSC (5 steps)<\/h4><p>Define strategic objectives; develop specific metrics (clear, measurable, aligned); collect and analyse data (real-time systems); review and adjust; foster collaboration across departments and partners.<\/p><h4 data-t=\"L\">BSC benefits and pitfalls<\/h4><p>Benefits: holistic measurement, strategic alignment, better decisions, continuous improvement; turns strategy into daily marching orders. Pitfalls: lack of a well-defined strategy; too much focus on lagging measures; generic metrics copied from other firms; self-serving managers chasing bonuses.<\/p><h4 data-t=\"L\">BSC example (manufacturing excellence)<\/h4><p>Strategy map: financial (improve productivity, grow revenue; long-term shareholder value, ROCE); customer (low cost, world-class quality and delivery timing, skilled partner, brand image); internal (operational excellence, process innovation, socially responsible: productivity, delivery, kaizen, safety, environment, ISO <mark>9002<\/mark>); learning and growth (skills, information systems, strategic awareness).<\/p><h4 data-t=\"L\">QDC performance indices<\/h4><p>Quality (QPI), delivery (DPI), cost (CPI) indices: single measures emphasising important characteristics of performance.<\/p><h4 data-t=\"M\">QPI formulas<\/h4><p>Percentage of rejection = defects received / total items received x <mark>100<\/mark>. DPMO = defects found / total items tested x <mark>10<\/mark>^6. Supplier rejection % = number of rejections / total suppliers x <mark>100<\/mark>. Percentage non-compliance = non-compliances / total observations x <mark>100<\/mark>. Non-compliance rectified % = rectified / total non-compliance x <mark>100<\/mark>.<\/p><h4 data-t=\"M\">DPI formulas<\/h4><p>Supplier on-time and in-full delivery = orders fulfilled on time and in full / total purchase orders placed x <mark>100<\/mark>. Delivery in full, on time = % delivery in full x % delivery on time - % rejected. Supplier lead time variability = actual delivery time - lead time. Overall lead time variability = actual delivery time - required lead time. % shipments in good condition = non-defective shipments / total shipments received x <mark>100<\/mark>. Average delivery time = sum of periods from dispatch to receipt / number of shipments.<\/p><h4 data-t=\"M\">CPI and procurement cost indices<\/h4><p>Cost Performance Index (earned value management) = Earned Value / Actual Cost; CPI = 1 on budget, CPI &gt; 1 under budget, CPI &lt; 1 over budget; Earned Value = Planned Value x % complete. Cost avoidance = actual purchasing price - lowest price quoted. Cost reduction = actual purchasing price - lowest price paid (as written on the slide). Procurement ROI = (cost reduction + cost avoidance) / cost of procurement operations. Procurement cost as % of sales = total procurement costs / total sales value x <mark>100<\/mark>.<\/p><h4 data-t=\"H\">Measurement techniques (14)<\/h4><p>1 Inventory investment (% of revenue; S&OP, value stream mapping, quick changeover, Kanban). 2 Inventory efficiency: turns = annualised COGS / average inventory investment; days of supply = inventory investment / daily COGS. 3 On-time supplier delivery (on-time %, hours late or early). 4 Forecast accuracy (average deviation, average absolute deviation, root mean squared deviation for safety stock). 5 Lead time. 6 Unplanned orders. 7 Schedule changes (TPM, 5S, mistake-proofing). 8 Overdue backlog. 9 Material availability. <mark>10<\/mark> Excess and obsolete inventory. <mark>11<\/mark> Customer service targets (root cause analysis). <mark>12<\/mark> Perfect order = order entry accuracy x pick accuracy x on-time delivery x damage-free shipping x invoice accuracy. <mark>13<\/mark> Gross profit margin = revenue - COGS. <mark>14<\/mark> Asset efficiency = sales / average assets; ROA = net profit margin x asset efficiency; GMROI = gross margin / average inventory investment cost.<\/p><h4 data-t=\"L\">Case: ShipBob<\/h4><p>3PL tracking perfect order rate, supply chain costs (WMS, automation), order fill rate (real-time inventory, predictive analytics), lead times and supplier diversification, and cash-to-cash cycle time.<\/p><h4 data-t=\"L\">Case: Southwest Airlines<\/h4><p>Scorecard links ground-crew performance (fast turnaround) to financial measures (lower costs); keeps hundreds of detailed metrics for supervisors but gives top management a dashboard of a few key measures.<\/p><h4 data-t=\"M\">Flow and rebuilt diagrams<\/h4><div class=\"viz\"><h5>Balanced Scorecard (Kaplan &amp; Norton)<\/h5><div class=\"g2\"><div><b>Financial<\/b>Financial results (quarter/year), cash flow, ROI, return on capital employed. SC KPIs: cost reduction, ROI, revenue growth.<\/div><div><b>Customer<\/b>Time, quality, service, cost. SC KPIs: order fulfilment rate, customer satisfaction scores, lead time.<\/div><div><b>Internal business process<\/b>Process alignment, bottlenecks, automation, activities per function. SC KPIs: cycle time, inventory turnover, flexibility.<\/div><div><b>Learning &amp; growth<\/b>Training and learning opportunities, employee turnover, job satisfaction, right level of expertise. SC KPIs: training, technology utilisation, innovation rate.<\/div><\/div><div class=\"mid\">Vision and strategy sit at the centre; the four perspectives cascade from them.<\/div><\/div>"]],"gl":[["Strategic sourcing","Procurement strategy of identifying, evaluating and selecting suppliers on specific criteria to optimise the supply chain and achieve long-term business goals. Systematic and proactive; goes beyond lowest-cost supplier: strong relationships, quality and delivery, lower cost, mitigated risk. Analyses product and process specifications, supplier market and customer service to decide local vs global sourcing; includes sourcing strategy, contract negotiation, supplier relationships, transition action plans; aligns sourcing with organisational strategy.","E"],["Characteristics","Disciplined buying practices; total cost focus (total cost of ownership: quality, service, delivery); consolidated purchasing power (better terms, lower ordering cost, economies of scale); tight supplier relationships (partners: trust, long-term commitment, shared vision); improved teamwork and purchasing skills (cross-functional); realigned business processes (remove redundancy, cut cycle time and inventory); continuous improvement; focus on value creation.","K"],["Supplier selection and management","Importance of suppliers (control unit cost, lower total acquisition cost, meet customer needs, fewer suppliers, design subassemblies). Selection criteria: quality, delivery, performance history, warranties and claims policies, production facilities and capacity, price, technical capability, financial position. Evaluation by scoring and formal reviews. Certification: certified suppliers consistently deliver quality, reducing routine testing. Management: ongoing communication, monitoring, issue resolution. Benefits: cost reduction, operational performance, product quality, shorter time-to-market, responsiveness.",""],["Supplier relationship management (SRM)","Strategic approach to collaborative, mutually beneficial relationships with key suppliers built on trust, open communication, win-win. Objectives: become the 'customer of choice', leverage supplier capabilities for innovation and development, share growth, profits, risks and investments. Aims: preferential treatment, access to technology and innovation, risk reduction. Activities: selection, contract negotiation, performance measurement, joint planning, risk management.","K"],["Establishing SRM (9 steps)","1 Define SRM strategy aligned with business objectives. 2 Identify key suppliers (strategic importance, business volume, collaboration potential). 3 Assess supplier capabilities (quality, delivery, cost, innovation, sustainability). 4 Establish governance (roles, decisions, cross-functional teams). 5 Develop collaboration initiatives (joint product development, process optimisation, cost reduction, best practices). 6 Invest in technology (supplier management software, platforms, analytics). 7 Foster open communication (meetings, forums, workshops). 8 Implement performance measurement (KPIs, reviews). 9 Develop supplier development programs (training, mentoring, knowledge sharing).","K"],["SRM objectives and challenges (slide figures were images)","Rebuilt from the PwC report the slide cites (Verweij and Peek, 2013). Objectives: customer of choice, focus on value, leverage supplier capabilities, share growth, profit, risk and investment. Survey ranking: leveraging supplier capabilities first, cost reduction second, security of supply third. Top challenges: too much focus on cost instead of value, lack of SRM competencies, incompatible strategic objectives. SRM is for a limited number of key suppliers; others are managed by contract management and vendor rating.",""],["Supplier segmentation","Categorise suppliers to prioritise effort and tailor strategy. Criteria: spend, risk (impact of supplier failure), criticality (importance to core operations), performance (quality, delivery, reliability), market position (share, technology, innovation), geographic location (logistics, lead time, regional regulation).","K"],["Kraljic matrix","Four categories by profit impact and supply risk: strategic (high, high), leverage (high profit, low risk), bottleneck (low profit, high risk), non-critical (low, low).","E"],["ABC analysis","Pareto principle (80/20). A-class: small number of suppliers with the majority of spend or strategic importance. B-class: moderate number, average spend or importance. C-class: large number, low spend or importance.","E"],["Global sourcing","Procuring from suppliers worldwide for lower cost, better quality, advanced technology, improved production capability. Eight dimensions: cost (total landed cost incl. transport and duties, infrastructure investments), quality, corporate social responsibility, risk (political instability, currency, disruption), opportunities (technology, innovation, skilled labour), politics (trade regulations, intervention), local context (culture, infrastructure, legal framework), enabling infrastructure (transport, communication).","E"],["Case: Colorado manufacturer","Founded 1950s; build-to-order, low-volume high-mix; outdated MRP caused about $1M excess and obsolete inventory; customer lead time 12 weeks (double competitors'). New president (lean and supply chain expertise) set a 3-5 year roadmap; goal: cut customer lead time 80% to two weeks. 7 steps: define strategic objectives; specify critical parts (machined, total landed cost, local suppliers); assess and select qualified suppliers (NDA, questionnaire, 3-year price stability); supplier selection and parts allocation; award parts and negotiate (five shops, 10-30% each, Kanban); implementation (Kanban from blanket PO, new ERP, daily floor walk); track results (quarterly supplier scorecard, weekly review).",""],["Colorado results","Machined-part lead time 6-8 weeks to two days; supplier on-time delivery 50% to 95%; supplier quality 60% to over 99%; price stability gave 30% improvement in gross profit; inventory down 50% freeing $750,000. Customer lead time 12 to 2 weeks (80%); quality up 25%, warranty cost 0.2% of sales; market share up 30% over four years.",""],["Vendor rating","Formal evaluation system assessing suppliers on delivery, quality, price and service by assigning a rating or score. Assesses and monitors performance, gives feedback, benchmarks against standards, reduces subjectivity, selects vendors for development. Usually computed with weights on quality and delivery ratings; important where volumes and spend are large (e.g. railways).","E"],["Criteria","Quality (specification adherence, failure rate, rework, replacements). Price (competitiveness, stability, accuracy, notice of price changes, clear billing). Delivery (lead time, quantity accuracy, packaging and documentation, emergency deliveries). Service (complaint handling, technical support, emergency support, timely resolution). Reliability (track record, reputation, financial stability). Innovation (R&D, willingness to adapt, unique offerings). Relationship (communication, collaboration, understanding needs).","K"],["Need for vendor rating","Performance evaluation; supplier development (training, best practices); risk mitigation (poor quality, late delivery, inadequate service; diversify, contingency); cost optimisation; performance benchmarking; supplier relationship management (open feedback, trust).",""],["8 steps","1 Define evaluation criteria. 2 Assign weights. 3 Gather data (reports, feedback, audits, inspections, surveys). 4 Evaluate performance (quantitative and qualitative). 5 Calculate ratings (e.g. weighted scoring: score x weight, summed). 6 Review and validate. 7 Communicate results and feedback. 8 Use ratings for decisions (selection, renewals, development, risk).","K"],["Technique: categorical plan","Managers from different departments list factors important to them; very subjective; each supplier rated Good, Satisfactory or Poor on each list.","K"],["Technique: weighted point plan","Factors categorised and weights assigned to each factor by importance; vendor performance is scored and multiplied by the weights.","K"],["Technique: cost ratio plan","Ratings based on costs incurred in buying from each supplier for variables such as quality, price, delivery; cost ratio = individual cost / total purchase value x 100. Example: delivery cost Rs 5,000 on purchases of Rs 1,00,000 gives 5,000 / 1,00,000 x 100 = 10%.","K"],["Technique: forced decision matrix","Attributes (quality, service, price, reliability, lead time) are compared pairwise; the more important one gets weight 1 and the other 0.","K"],["Technique: service cost ratio","Subjective measure of intangible service: labour stability, financial stability, flexibility for rush orders, R&D.","K"],["IBM quality rating","Based on quality costs. VGR = (desired cost of inspection / actual cost of inspection) x 100.",""],["Bell quality rating (LQI)","Lot Quality Index by Bell Helicopter Company: LQI = X / L, where L = total lots received in the period and X = (L1 x 1.00) + (L2 x 2.10) + (L3 x 2.90) + (L4 x 3.10) + (L5 x 3.90). L1 = lots acceptable as received; L2 = lots rejected by sampling inspection but labelled; L3 = rejected, rework at supplier's end; L4 = rejected, returned not usable; L5 = rejected, rework at Bell. Formula can be modified to suit the company.","K"],["Weighted-point worked example (illustrative)","Weights: quality 40, delivery 25, price 20, service 15. Vendor A scores 90, 80, 70, 60: rating = 0.40x90 + 0.25x80 + 0.20x70 + 0.15x60 = 36 + 20 + 14 + 9 = 79. A second vendor is compared in the rebuilt table below. The slide's own vendor rating format was an image.",""],["Advantages","Minimises subjectivity and covers all relevant criteria; feedback from all areas in one package; better communication with vendors; overall control of the vendor base; requires specific action on weaknesses; continuous review standards, so continuous improvement.",""],["Coordination","Strategic alignment and integration of processes, activities and information flow among suppliers, manufacturers, distributors, retailers to optimise overall performance: efficiency, lower cost, responsiveness, timely delivery. Elements: demand forecasting, inventory management, production planning, transportation logistics, communication systems.","K"],["Coordination with suppliers","Demand forecasting: collaborative forecasting (predict future demand so suppliers can adjust production schedules) and real-time information sharing. Inventory: vendor-managed inventory (suppliers manage stock at the manufacturer or distributor) and JIT delivery. Quality: agreed standards, continuous improvement via feedback and reviews. Communication: regular meetings, integrated IT systems.","E"],["Coordination with distributors","Order fulfilment (order management systems, coordinated distribution planning); inventory (stock replenishment, safety stock); customer service (reliable delivery, returns management); data sharing (sales data, KPIs such as order accuracy, delivery times, satisfaction); collaboration (joint business planning, real-time communication).",""],["Supplier-distributor interaction","Supplier delivers to the distributor on a purchase order; both track inventory; the distributor gets a production plan from the manufacturer; finished goods go to the distributor's warehouse; the distributor fills retailer orders through delivery and transportation; retailers sell to customers. Coordination points: purchase orders, production plan, inventory management, delivery and transportation.",""],["Lack of coordination and bullwhip","Ineffective communication among entities causes inefficiency. Bullwhip causes: demand forecasting inaccuracies, order batching, price fluctuations, lack of information sharing. Impacts: increased costs, excess inventory, stock-outs, poor customer service.","K"],["5 obstacles to coordination","Inventive (lack of resources or expertise for new technology; resistance to change). Information processing (data inaccuracies, delays in sharing; inadequate systems). Operational (capacity constraints, bottlenecks, transport delays, quality problems). Pricing (conflicting objectives, lack of transparency, power imbalance). Behavioural (lack of trust, poor collaboration and communication).","E"],["Managerial action 1: align goals and incentives","Maximise total supply chain surplus, not individual profit; align functions with profitability. Pricing for coordination: lot-size-based quantity discounts, two-part tariffs, volume discounts; contracts: buyback, revenue sharing, quantity flexibility. Alter sales force incentives from sell-in to sell-through to reduce forward buying.","K"],["Managerial action 2: information visibility and accuracy","Share point-of-sale data; collaborative forecasting and planning (common forecast); single-stage control of replenishment (continuous replenishment programs, vendor-managed inventories).","K"],["Managerial action 3: operational performance","Reduce replenishment lead time (electronic ordering, flexible manufacturing, cross-docking); reduce lot sizes; ration based on past sales and share information to limit gaming (order inflation).","K"],["Managerial action 4: stabilise orders by pricing","Move from lot-size-based to volume-based quantity discounts (over a rolling horizon); stabilise pricing: eliminate promotions, use everyday low pricing, tie promotion dollars to sell-through.","K"],["Managerial action 5: partnerships and trust","Trust and information sharing lower transaction costs and duplication; clear roles, effective contracts and conflict resolution make the chain responsive.","K"],["Macro processes","CRM: processes at the firm-customer interface. ISCM: processes internal to the firm. SRM: processes at the firm-supplier interface.","K"],["Case: Amazon CRM","Personalised recommendations from past purchases and browsing; one-click ordering; order visibility from placement to delivery; call-back option when call-centre volume is high. 2008 top CRM vendors (Gartner): SAP 22.5%, Oracle 16.1%, Salesforce.com 10.6%, Microsoft 6.4%, Amdocs 4.9%; Amazon relies on in-house development.",""],["Case: Hindustan Oil Company (HOC)","Oil industry leader through efficient supply chain, quality control, R&D, customer focus; refining, marketing, distribution of petroleum products; sustainability and carbon-footprint initiatives.",""],["Conclusion","Coordination built on trust, transparency and shared goals gives efficiency and advantage; CRM manages customer interactions; CPFR enables joint planning, demand visibility and inventory management.",""],["Supply chain performance","Effectiveness and efficiency of each stage in optimising cost, reducing inefficiency, increasing speed and meeting customer expectations; metrics such as on-time delivery, stock availability, order accuracy, production lead times. Measures are qualitative (customer satisfaction, product quality) or quantitative (order-to-delivery lead time, response time, flexibility, resource utilisation, delivery performance).",""],["Financial measures","Cost of raw materials; revenue from goods sold; activity-based costs (material handling, manufacturing, assembling); inventory holding cost; transportation cost; cost of expired perishables; penalties for incorrectly filled or late orders; credits for incorrect or late supplier deliveries; cost of goods returned by customers; credits for goods returned to suppliers.","K"],["Non-financial measures","Cycle time (supply chain lead time: raw material to customer's address; order-to-delivery lead time: order placement to delivery). Customer service level (order fill rate, stock-out rate, backorder level, probability of on-time delivery). Inventory levels: raw materials, work-in-process, finished goods, spare parts. Resource utilisation: manufacturing, storage, logistics, human, financial resources. Also ability to perform, flexibility, quality.","K"],["Qualitative measures","Customer satisfaction, customer complaints, customer response time, product quality, delivery experience (on or before due date), order accuracy.",""],["Balanced Scorecard (BSC)","Developed by Robert Kaplan and David Norton: a strategic planning and management system aligning business activities to vision and strategy, improving communication, and monitoring performance against goals, with financial and non-financial indicators across four perspectives: financial, customer, internal business processes, learning and growth. Nearly 60% of Fortune 500 companies use some form.","E"],["BSC supply chain KPIs","Financial: cost reduction, ROI, revenue growth. Customer: order fulfilment rate (on time and in full), customer satisfaction scores, lead time. Internal process: cycle time, inventory turnover, supply chain flexibility. Learning and growth: employee training and development, technology utilisation, innovation rate.","E"],["Implementing BSC (5 steps)","Define strategic objectives; develop specific metrics (clear, measurable, aligned); collect and analyse data (real-time systems); review and adjust; foster collaboration across departments and partners.",""],["BSC benefits and pitfalls","Benefits: holistic measurement, strategic alignment, better decisions, continuous improvement; turns strategy into daily marching orders. Pitfalls: lack of a well-defined strategy; too much focus on lagging measures; generic metrics copied from other firms; self-serving managers chasing bonuses.",""],["BSC example (manufacturing excellence)","Strategy map: financial (improve productivity, grow revenue; long-term shareholder value, ROCE); customer (low cost, world-class quality and delivery timing, skilled partner, brand image); internal (operational excellence, process innovation, socially responsible: productivity, delivery, kaizen, safety, environment, ISO 9002); learning and growth (skills, information systems, strategic awareness).",""],["QDC performance indices","Quality (QPI), delivery (DPI), cost (CPI) indices: single measures emphasising important characteristics of performance.",""],["QPI formulas","Percentage of rejection = defects received / total items received x 100. DPMO = defects found / total items tested x 10^6. Supplier rejection % = number of rejections / total suppliers x 100. Percentage non-compliance = non-compliances / total observations x 100. Non-compliance rectified % = rectified / total non-compliance x 100.","K"],["DPI formulas","Supplier on-time and in-full delivery = orders fulfilled on time and in full / total purchase orders placed x 100. Delivery in full, on time = % delivery in full x % delivery on time - % rejected. Supplier lead time variability = actual delivery time - lead time. Overall lead time variability = actual delivery time - required lead time. % shipments in good condition = non-defective shipments / total shipments received x 100. Average delivery time = sum of periods from dispatch to receipt / number of shipments.","K"],["CPI and procurement cost indices","Cost Performance Index (earned value management) = Earned Value / Actual Cost; CPI = 1 on budget, CPI &gt; 1 under budget, CPI &lt; 1 over budget; Earned Value = Planned Value x % complete. Cost avoidance = actual purchasing price - lowest price quoted. Cost reduction = actual purchasing price - lowest price paid (as written on the slide). Procurement ROI = (cost reduction + cost avoidance) / cost of procurement operations. Procurement cost as % of sales = total procurement costs / total sales value x 100.","K"],["Measurement techniques (14)","1 Inventory investment (% of revenue; S&OP, value stream mapping, quick changeover, Kanban). 2 Inventory efficiency: turns = annualised COGS / average inventory investment; days of supply = inventory investment / daily COGS. 3 On-time supplier delivery (on-time %, hours late or early). 4 Forecast accuracy (average deviation, average absolute deviation, root mean squared deviation for safety stock). 5 Lead time. 6 Unplanned orders. 7 Schedule changes (TPM, 5S, mistake-proofing). 8 Overdue backlog. 9 Material availability. 10 Excess and obsolete inventory. 11 Customer service targets (root cause analysis). 12 Perfect order = order entry accuracy x pick accuracy x on-time delivery x damage-free shipping x invoice accuracy. 13 Gross profit margin = revenue - COGS. 14 Asset efficiency = sales / average assets; ROA = net profit margin x asset efficiency; GMROI = gross margin / average inventory investment cost.","E"],["Case: ShipBob","3PL tracking perfect order rate, supply chain costs (WMS, automation), order fill rate (real-time inventory, predictive analytics), lead times and supplier diversification, and cash-to-cash cycle time.",""],["Case: Southwest Airlines","Scorecard links ground-crew performance (fast turnaround) to financial measures (lower costs); keeps hundreds of detailed metrics for supervisors but gives top management a dashboard of a few key measures.",""]],"q":[["o","What is the primary focus of strategic sourcing?",["Finding the absolute lowest purchase price only","Maximising short-term transaction volume","Optimising the supply chain and achieving long-term business goals","Eliminating international suppliers"],2,"L37: goes beyond lowest-cost supplier to long-term goals, relationships, quality and risk."],["o","How are 'A-Class Suppliers' characterised in ABC analysis?",["Many suppliers with low spend","A moderate number with average spend","Lowest initial price regardless of quality","A small number of suppliers accounting for the majority of spend or strategic importance"],3,"L37 Pareto 80/20: A small number but most spend; C many but low spend."],["o","What is the fundamental definition of 'Lead Time'?",["Profit margin of a product line","The duration required to complete a specific task or process","Items returned per quarter","Maximum storage capacity of a DC"],1,"L41 measurement technique 5: 'Lead time is the duration required to complete a specific task or process.'"],["o","What is the main purpose of 'Collaborative Forecasting' between suppliers and manufacturers?",["To predict future demand so suppliers can adjust production schedules accordingly","To set retail prices","To eliminate contract negotiation","To shift risk onto distributors"],0,"L39 coordination with suppliers: demand forecasting and planning."],["o","Which Balanced Scorecard perspective covers process alignment, process bottlenecks and process automation?",["Financial","Customer","Internal Process","Learning and Growth"],2,"L40 diagram: internal process perspective lists process alignment, bottlenecks, automation, number of activities per function."],["o","'Data inaccuracies and delays in information sharing' fall under which obstacle category?",["Information processing obstacles","Inventive obstacles","Operational obstacles","Pricing obstacles"],0,"L39 obstacles to coordination."],["o","What is the core purpose of a formal vendor rating system?",["Lower retail prices automatically","Assess and monitor supplier performance on delivery, quality, price and service","Remove cross-functional teams","Outsource procurement"],1,"L38 definition."],["o","Who originally developed the Balanced Scorecard?",["Sunil Chopra and Peter Meindl","Taiichi Ohno and Shigeo Shingo","Michael Porter and Peter Drucker","Robert Kaplan and David Norton"],3,"L40: developed by Robert Kaplan and David Norton."],["o","Beyond purchase price, what should the 'Cost' dimension of global sourcing consider?",["Marketing expenses and tax rates","Total cost of ownership (total landed cost) and potential infrastructure investments","Domestic inflation","Competitor pricing and union fees"],1,"L37 eight dimensions: cost includes total landed cost (transport, duties) and infrastructure investments."],["o","In the Kraljic Matrix, a supplier with high profit impact but low supply risk is a:",["Strategic Supplier","Bottleneck Supplier","Leverage Supplier","Non-critical Supplier"],2,"L37: leverage (high, low); strategic (high, high); bottleneck (low, high); non-critical (low, low)."],["x","Unilever's CPFR improved forecast accuracy by 10%. What followed?",["10% less inventory holding and 5% higher sales volume","20% cost saving","A 16% fall in out-of-stocks","Inventory turnover of 8.39"],0,"L32 Unilever case. (16% is Walmart's out-of-stock reduction; 8.39 is Amazon's turnover.)"],["x","Which strategy suits a bottleneck supplier (low profit, high supply risk)?",["Competitive bidding","Safety stock, dual sourcing, alternative suppliers","Joint development","Automate transactions"],1,"L37 tailoring SRM by segment."],["x","Which is NOT one of the four metrics in Starbucks' binary scorecard?",["Operational safety","On-time supply and order fulfilment rate","Brand awareness","Overall cost of the supply chain"],2,"L33: safety, on-time supply and fulfilment, overall cost, financial cost-effectiveness."],["x","For high implied demand uncertainty, strategic fit calls for:",["An efficient supply chain","A responsive supply chain","No inventory","Lowest-cost transport only"],1,"L35: match responsiveness to implied uncertainty (e.g. McMaster-Carr, Dell)."],["x","In a forced decision matrix, the more important attribute in a pairwise comparison gets:",["Weight 1 (the other 0)","Weight 10","A rating of Good","Half the total weight"],0,"L38 technique."],["x","In Bell's Lot Quality Index, lots acceptable as received are weighted:",["1.00","2.10","2.90","3.90"],0,"L38: X = L1 x 1.00 + L2 x 2.10 + L3 x 2.90 + L4 x 3.10 + L5 x 3.90."],["x","A Cost Performance Index (CPI) greater than 1 means:",["Over budget","On budget","Under budget","Behind schedule"],2,"L41: CPI = EV / AC; above 1 means better than planned."],["x","A joint venture is distinguished from other alliance types by:",["No ownership exchange","A stake in the partner","A new independent co-owned legal entity (NewCo)","A purely verbal agreement"],2,"L36: highest commitment level."],["x","Which is a cause of the bullwhip effect?",["Sharing point-of-sale data","Order batching","Everyday low pricing","Single-stage replenishment control"],1,"L39 causes: forecast inaccuracy, order batching, price fluctuations, lack of information sharing. The others are remedies."],["x","Responsiveness spectrum: which firm is 'highly responsive' on the slide?",["Integrated steel mill","Hanes apparel","Most automotive production","Dell"],3,"L34 responsiveness spectrum: steel mill efficient to Dell highly responsive."]],"imp":[["Strategic sourcing (Lecture 37)","Procurement strategy of identifying, evaluating and selecting suppliers on specific criteria to optimise the supply chain and achieve long-term business goals. Systematic and proactive; goes beyond lowest-cost supplier: strong ..."],["Kraljic matrix (Lecture 37)","Four categories by profit impact and supply risk: strategic (high, high), leverage (high profit, low risk), bottleneck (low profit, high risk), non-critical (low, low)."],["ABC analysis (Lecture 37)","Pareto principle (80/20). A-class: small number of suppliers with the majority of spend or strategic importance. B-class: moderate number, average spend or importance. C-class: large number, low spend or importance."],["Global sourcing (Lecture 37)","Procuring from suppliers worldwide for lower cost, better quality, advanced technology, improved production capability. Eight dimensions: cost (total landed cost incl. transport and duties, infrastructure investments), quality,..."],["Vendor rating (Lecture 38)","Formal evaluation system assessing suppliers on delivery, quality, price and service by assigning a rating or score. Assesses and monitors performance, gives feedback, benchmarks against standards, reduces subjectivity, selects..."],["Coordination with suppliers (Lecture 39)","Demand forecasting: collaborative forecasting (predict future demand so suppliers can adjust production schedules) and real-time information sharing. Inventory: vendor-managed inventory (suppliers manage stock at the manufactur..."],["5 obstacles to coordination (Lecture 39)","Inventive (lack of resources or expertise for new technology; resistance to change). Information processing (data inaccuracies, delays in sharing; inadequate systems). Operational (capacity constraints, bottlenecks, transport d..."],["Balanced Scorecard (BSC) (Lectures 40-41)","Developed by Robert Kaplan and David Norton: a strategic planning and management system aligning business activities to vision and strategy, improving communication, and monitoring performance against goals, with financial and ..."],["BSC supply chain KPIs (Lectures 40-41)","Financial: cost reduction, ROI, revenue growth. Customer: order fulfilment rate (on time and in full), customer satisfaction scores, lead time. Internal process: cycle time, inventory turnover, supply chain flexibility. Learnin..."],["Measurement techniques (14) (Lectures 40-41)","1 Inventory investment (% of revenue; S&OP, value stream mapping, quick changeover, Kanban). 2 Inventory efficiency: turns = annualised COGS / average inventory investment; days of supply = inventory investment / daily COGS. 3 ..."]],"pnote":10},"9":{"notes":[["Lecture 42 - Importance of Distribution in Supply Chain","<div class=\"imp\"><b>★ Important:<\/b> Asked: <b>short response time = facilities close to customers<\/b>; <b>product availability<\/b> definition; <b>outbound cost per unit is higher than inbound<\/b> (lot size economies); <b>last-mile delivery<\/b>.<\/div><h4>Role of distribution<\/h4><p><b>Distribution<\/b> = the steps taken to move and store a product from the supplier stage to the customer stage. It covers raw materials and components moving from suppliers to manufacturers and finished goods moving from manufacturers to end consumers. It is a <b>key driver of overall profitability<\/b> because it affects both supply chain cost and customer experience.<\/p>\n<p><b>Walmart:<\/b> distribution lets it offer high availability of relatively common products at very low cost, through efficient distribution networks that minimise cost and maximise efficiency.<\/p><div class=\"dg\"><svg viewBox=\"0 0 760 130\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"360\" y1=\"60\" x2=\"400\" y2=\"60\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"10\" y=\"25\" width=\"350\" height=\"70\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"185\" y=\"49\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">PHASE I<\/text><text x=\"185\" y=\"64\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Visualise the broad structure<\/text><text x=\"185\" y=\"79\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">direct sale or through an intermediary?<\/text><rect x=\"400\" y=\"25\" width=\"350\" height=\"70\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"575\" y=\"49\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">PHASE II<\/text><text x=\"575\" y=\"64\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Convert structure into locations,<\/text><text x=\"575\" y=\"79\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">capabilities, capacities, demand allocation<\/text><\/svg><div class=\"cap\">Rebuilt: the two broad phases of distribution network design.<\/div><\/div><p>An inappropriate network raises cost and lowers customer satisfaction, so firms must evaluate options against their strategy.<\/p>\n<h4>Service factors influencing network design<\/h4><table><tr><th>Factor<\/th><th>Meaning<\/th><th>Design consequence<\/th><\/tr><tr><td><b>Response time<\/b><\/td><td>Time between order placement and receipt<\/td><td>Customers valuing short response need <b>facilities close to them<\/b>; tolerant customers allow fewer, centralised facilities<\/td><\/tr><tr><td>Product variety<\/td><td>Number of different products / configurations offered<\/td><td>Wide variety needs a network that can store and handle many items<\/td><\/tr><tr><td><b>Product availability<\/b><\/td><td><b>Probability of having a product in stock when a customer order arrives<\/b><\/td><td>Higher availability needs more inventory and aggregation<\/td><\/tr><tr><td>Customer experience<\/td><td>Ease of ordering and receiving, customisation, extra services<\/td><td>Network must support the intended experience<\/td><\/tr><tr><td>Time to market<\/td><td>Time to bring a new product to market<\/td><td>Must support quick launches<\/td><\/tr><tr><td>Order visibility<\/td><td>Ability to track an order from placement to delivery<\/td><td>Needs tracking systems<\/td><\/tr><tr><td>Returnability<\/td><td>Ease of returning unsatisfactory goods and network ability to handle returns<\/td><td>Needs efficient reverse flow<\/td><\/tr><\/table><h4>Cost factors<\/h4><p>Network changes affect inventory, transportation, facilities, and information costs; sourcing and pricing also influence the choice of distribution system. As the number of facilities increases, inventory and facility costs rise, while the response time falls.<\/p><div class=\"dg\"><svg viewBox=\"0 0 760 270\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><line x1=\"60\" y1=\"20\" x2=\"60\" y2=\"225\" stroke=\"#71717a\"/><line x1=\"60\" y1=\"225\" x2=\"720\" y2=\"225\" stroke=\"#71717a\"/>\n<polyline fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" points=\"80,205 200,188 320,166 440,140 560,112 680,82\"/>\n<polyline fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"3\" points=\"80,215 200,208 320,196 440,180 560,160 680,135\"/>\n<polyline fill=\"none\" stroke=\"#34d399\" stroke-width=\"3\" points=\"80,40 200,95 320,135 440,160 560,175 680,182\"/>\n<polyline fill=\"none\" stroke=\"#f5f5f4\" stroke-width=\"3\" stroke-dasharray=\"6 4\" points=\"80,38 200,75 320,100 440,112 560,108 680,95\"/>\n<text x=\"690\" y=\"82\" fill=\"#fb7185\" font-size=\"11\">Inventory cost<\/text><text x=\"690\" y=\"138\" fill=\"#f59e0b\" font-size=\"11\">Facility cost<\/text><text x=\"690\" y=\"186\" fill=\"#34d399\" font-size=\"11\">Transportation cost<\/text><text x=\"690\" y=\"98\" fill=\"#f5f5f4\" font-size=\"11\">Total logistics cost<\/text>\n<text x=\"390\" y=\"255\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Number of facilities<\/text><text x=\"20\" y=\"120\" fill=\"#f5f5f4\" font-size=\"12\" transform=\"rotate(-90 20 120)\" text-anchor=\"middle\">Cost<\/text><\/svg>\n<div class=\"cap\">Rebuilt (schematic): inventory and facility costs rise with the number of facilities; transportation cost falls while inbound economies of scale hold; total logistics cost is U-shaped. Response time also improves as facilities increase.<\/div><\/div><table><tr><th>Relationship<\/th><th>Behaviour<\/th><\/tr><tr><td>Facilities vs inventory cost<\/td><td>More facilities, more safety stock (loss of aggregation): inventory cost rises<\/td><\/tr><tr><td>Facilities vs facility cost<\/td><td>Fixed and handling costs rise with more sites<\/td><\/tr><tr><td>Facilities vs transportation cost<\/td><td>Falls, provided <b>inbound economies of scale<\/b> are maintained (outbound distance shrinks as a fraction of total distance)<\/td><\/tr><tr><td>Facilities vs response time<\/td><td>Response time improves<\/td><\/tr><\/table><div class=\"tip\"><b>Why outbound cost per unit exceeds inbound:<\/b> inbound lot sizes are larger. Example: an Amazon warehouse receives full truckloads of books inbound but ships small packages with a few books per customer outbound.<\/div>\n<h4>Design options for a distribution network<\/h4><table><tr><th>Option<\/th><th>Idea<\/th><\/tr><tr><td>Direct shipping<\/td><td>Ship from manufacturer or supplier straight to the end customer; no intermediaries<\/td><\/tr><tr><td>Centralised distribution<\/td><td>One central DC serves all customers; cost effective for large, widely spread customer base<\/td><\/tr><tr><td>Decentralised distribution<\/td><td>Several DCs in different regions; better response time and service<\/td><\/tr><tr><td><b>Cross-docking<\/b><\/td><td>Move products from inbound to outbound transport with no storage<\/td><\/tr><tr><td>Drop-shipping<\/td><td>Supplier or manufacturer ships to the customer; no inventory held, lower upfront cost<\/td><\/tr><tr><td>Hybrid distribution<\/td><td>Central DC for bulk storage plus regional DCs for fast delivery<\/td><\/tr><tr><td>Third-party logistics (3PL)<\/td><td>Outsource network design and operation to specialists: savings, scalability, expertise<\/td><\/tr><\/table><h4>Online sales and the distribution network<\/h4><table><tr><th>Consideration<\/th><th>Detail<\/th><\/tr><tr><td>Fulfilment centres<\/td><td>Dedicated online-order sites, strategically placed<\/td><\/tr><tr><td>Inventory management<\/td><td>Often larger inventories, accurate systems to prevent stock-outs<\/td><\/tr><tr><td><b>Last-mile delivery<\/b><\/td><td><b>Final leg of delivery to the customer's doorstep<\/b>; partner with logistics providers or own fleet<\/td><\/tr><tr><td>Order processing and packaging<\/td><td>Streamlined for high volume<\/td><\/tr><tr><td>Returns management<\/td><td>Online sales have higher return rates; handle refunds, exchanges, restocking<\/td><\/tr><tr><td>Technology and automation<\/td><td>WMS, order management systems, automated pick and pack<\/td><\/tr><tr><td>Customer experience<\/td><td>User-friendly site, online tracking, responsive service<\/td><\/tr><tr><td>Scalability and flexibility<\/td><td>Handle growth and changing preferences<\/td><\/tr><tr><td>Integration with stores<\/td><td>Ship-from-store and in-store pickup<\/td><\/tr><tr><td>Data analytics<\/td><td>Buying patterns and delivery performance drive improvements<\/td><\/tr><\/table><h4>Impact of online sales on customer service<\/h4><table><tr><th>Better online<\/th><th>Worse online<\/th><\/tr><tr><td>Larger selection (Netflix vs rental stores); inventory aggregation improves availability; 24/7 access; global reach; personalisation; quick launch of new products; real-time tracking; dynamic price and promotion changes; lower cost of revenue collection<\/td><td>Physical products take longer (shipping); returns harder and costlier than in stores; instant gratification missing; digital products are instant (movies, music)<\/td><\/tr><\/table><h4>Impact of online sales on costs<\/h4><table><tr><th>Factor<\/th><th>Effect<\/th><\/tr><tr><td><b>Aggregation<\/b><\/td><td>Lower inventory by centralising stock if customers accept waiting (Amazon vs Barnes and Noble)<\/td><\/tr><tr><td><b>Postponement<\/b><\/td><td>Delay variety until order arrives (Dell builds PCs after order; Amazon prints low-volume books on demand)<\/td><\/tr><tr><td>Network centralisation<\/td><td>Fewer facilities (Netflix about 50 warehouses vs Blockbuster thousands of stores)<\/td><\/tr><tr><td>Operational efficiency<\/td><td>Customer-entered orders cost less than call centres; smoother order flow<\/td><\/tr><tr><td>Handling and delivery<\/td><td>Groceries cost more online because pick and delivery shift to the seller<\/td><\/tr><tr><td>Digital goods<\/td><td>Internet nearly removes transport cost<\/td><\/tr><tr><td>Nondigital goods<\/td><td>Centralised stock raises outbound transport cost relative to inbound<\/td><\/tr><tr><td>Enhanced visibility<\/td><td>Shared demand data lowers overall supply chain cost<\/td><\/tr><tr><td>Infrastructure cost<\/td><td>Amazon integrating Zappos: about 120,000 product descriptions and over 2 million photos<\/td><\/tr><\/table>"],["Lecture 43 - Designing Distribution Networks in Supply Chain","<div class=\"imp\"><b>★ Important:<\/b> Asked: <b>Manufacturer storage with direct shipping eliminates intermediaries<\/b> and ships to the customer; <b>Dell added retail (Wal-Mart) in 2007<\/b>.<\/div><h4>Six distribution network designs<\/h4><div class=\"dg\"><svg viewBox=\"0 0 780 386\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"336.66666666666663\" y1=\"53\" x2=\"483.33333333333326\" y2=\"53\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"226\" y1=\"115\" x2=\"262\" y2=\"115\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"392\" y1=\"115\" x2=\"428\" y2=\"115\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"558\" y1=\"115\" x2=\"594\" y2=\"115\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"267.5\" y1=\"177\" x2=\"345\" y2=\"177\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"475\" y1=\"177\" x2=\"552.5\" y2=\"177\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"267.5\" y1=\"239\" x2=\"345\" y2=\"239\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"475\" y1=\"239\" x2=\"552.5\" y2=\"239\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"267.5\" y1=\"301\" x2=\"345\" y2=\"301\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"475\" y1=\"301\" x2=\"552.5\" y2=\"301\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"226\" y1=\"363\" x2=\"262\" y2=\"363\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"392\" y1=\"363\" x2=\"428\" y2=\"363\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"558\" y1=\"363\" x2=\"594\" y2=\"363\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"206.66666666666666\" y=\"38\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"271.66666666666663\" y=\"57\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Manufacturer (stores)<\/text><rect x=\"483.33333333333326\" y=\"38\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"548.3333333333333\" y=\"57\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Customer<\/text><rect x=\"96\" y=\"100\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"161\" y=\"119\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Manufacturer A<\/text><rect x=\"262\" y=\"100\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"327\" y=\"119\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Manufacturer B<\/text><rect x=\"428\" y=\"100\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"493\" y=\"119\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Merge point<\/text><rect x=\"594\" y=\"100\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"659\" y=\"119\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Customer<\/text><rect x=\"137.5\" y=\"162\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"202.5\" y=\"181\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Manufacturer<\/text><rect x=\"345\" y=\"162\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"410\" y=\"181\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Distributor warehouse<\/text><rect x=\"552.5\" y=\"162\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\
