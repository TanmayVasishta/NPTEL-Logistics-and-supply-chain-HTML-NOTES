ase: Amazon anticipatory shipping (Lecture 19)","Predicts when, where and which items customers will purchase based on buying habit history in particular areas; a popular item ships from a nearby hub faster. Also predicts how many drivers are needed, number of shipments, and ..."],["Key differences (Lecture 20)","Logistics: movement, storage and flow of goods, services, information; focus on meeting customer requirements; old term (military origin; Alexander the Great, born 356 B.C., credited as a logistics master); an activity within t..."]]},"5":{"notes":[["Lecture 21 - Fundamentals of Supply Chain Management","<div class=\"imp\"><b>★ Important:<\/b> Asked: <b>supply chain models<\/b> (flexible = seasonality). Likely follow-ups: <b>three decision phases<\/b> and horizons, the Chopra and Meindl definition, the <b>three flows<\/b>.<\/div><h4>What is a supply chain?<\/h4><p>Example in the lecture: a customer wants detergent and goes to a supermarket (Big Bazaar / third-party DC), supplied by P&amp;G or another manufacturer, who is supplied by plastic producers, chemical manufacturers (oil companies), packaging, paper and timber industries.<\/p>\n<p><b>Chopra and Meindl (2013):<\/b> all parties involved, directly or indirectly, in fulfilling a customer request: manufacturer, suppliers, transporters, warehouses, retailers and even customers. Within each firm it includes new product development, marketing, operations, distribution, finance and customer service. <b>Lu Dawei and Chen:<\/b> a group of interconnected companies that add value to the stream that transforms inputs from source to the end product or service demanded by the designated end customer.<\/p>\n<p><b>Supply chain management (SCM)<\/b> combines demand and supply networks and focuses on efficient working of every step. Every link tries to minimise cost and improve long-run performance by removing useless expense, handling and movement; it monitors distribution, production and transport via control of inventory, shipment, internal sales and production.<\/p><div class=\"dg\"><svg viewBox=\"0 0 760 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"130\" y1=\"36\" x2=\"160\" y2=\"36\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"280\" y1=\"36\" x2=\"310\" y2=\"36\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"430\" y1=\"36\" x2=\"460\" y2=\"36\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"580\" y1=\"36\" x2=\"610\" y2=\"36\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"610\" y1=\"52\" x2=\"580\" y2=\"52\" stroke=\"#fb7185\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"460\" y1=\"52\" x2=\"430\" y2=\"52\" stroke=\"#fb7185\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"310\" y1=\"52\" x2=\"280\" y2=\"52\" stroke=\"#fb7185\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"160\" y1=\"52\" x2=\"130\" y2=\"52\" stroke=\"#fb7185\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"10\" y=\"20\" width=\"120\" height=\"44\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"70\" y=\"46\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Supplier<\/text><rect x=\"160\" y=\"20\" width=\"120\" height=\"44\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"220\" y=\"46\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Manufacturer<\/text><rect x=\"310\" y=\"20\" width=\"120\" height=\"44\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"370\" y=\"46\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Distributor<\/text><rect x=\"460\" y=\"20\" width=\"120\" height=\"44\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"520\" y=\"46\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Retailer<\/text><rect x=\"610\" y=\"20\" width=\"120\" height=\"44\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"670\" y=\"46\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Customer<\/text><text x=\"380\" y=\"100\" fill=\"#f59e0b\" font-size=\"13\" text-anchor=\"middle\">Product flow: supplier to customer (forward) and returns (reverse)<\/text><text x=\"380\" y=\"128\" fill=\"#fb7185\" font-size=\"13\" text-anchor=\"middle\">Funds flow: customer to supplier (payments)<\/text><text x=\"380\" y=\"156\" fill=\"#34d399\" font-size=\"13\" text-anchor=\"middle\">Information flow: both directions (orders, forecasts, schedules, status)<\/text><\/svg><div class=\"cap\">Rebuilt: three flows of a supply chain (product, funds, information). Chopra and Meindl.<\/div><\/div><h4>Objectives<\/h4><p>Maximise overall value generated: timely delivery, effective inventory management, flexibility and responsiveness, efficient cost-effective production, collaborative supplier-consumer relationship, improved logistics, optimised delivery (time, cost, amount), more customer value, better distribution, demand fulfilment, quality and integrated technology.<\/p>\n<h4>Supply chain decisions<\/h4><div class=\"dg\"><svg viewBox=\"0 0 760 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"240\" y1=\"70\" x2=\"265\" y2=\"70\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"495\" y1=\"70\" x2=\"520\" y2=\"70\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"10\" y=\"30\" width=\"230\" height=\"80\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"125\" y=\"51.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">1. Strategy / Design<\/text><text x=\"125\" y=\"66.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">several years<\/text><text x=\"125\" y=\"81.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">outsource vs in-house, locations,<\/text><text x=\"125\" y=\"96.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">capacities, modes, IT systems<\/text><rect x=\"265\" y=\"30\" width=\"230\" height=\"80\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"380\" y=\"51.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">2. Planning<\/text><text x=\"380\" y=\"66.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">quarter to a year<\/text><text x=\"380\" y=\"81.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">which market from which site,<\/text><text x=\"380\" y=\"96.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">inventory policy, subcontracting<\/text><rect x=\"520\" y=\"30\" width=\"230\" height=\"80\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#fb7185\" stroke-width=\"1.6\"/><text x=\"635\" y=\"51.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">3. Operation<\/text><text x=\"635\" y=\"66.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">weekly or daily<\/text><text x=\"635\" y=\"81.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">allocate orders, due dates,<\/text><text x=\"635\" y=\"96.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">pick lists, shipments, replenishment<\/text><text x=\"380\" y=\"135\" fill=\"#71717a\" font-size=\"12\" text-anchor=\"middle\">Configuration is fixed at each lower level; goal narrows from structure to handling individual orders<\/text><\/svg><div class=\"cap\">Rebuilt: three supply chain decision phases and their time horizons.<\/div><\/div><table><tr><th>Phase<\/th><th>Horizon<\/th><th>Examples<\/th><\/tr><tr><td>Strategy / design<\/td><td>Several years<\/td><td>Outsource or in-house; location and capacity of plants and warehouses; products per location; modes; information systems<\/td><\/tr><tr><td>Planning<\/td><td>Quarter to a year<\/td><td>Configuration fixed; maximise surplus; which markets from which locations, inventory policy, subcontracting, backup locations, timing and size of promotions<\/td><\/tr><tr><td>Operation<\/td><td>Weekly or daily<\/td><td>Allocate orders to inventory or production, set due dates, pick lists, allocate orders to shipments, delivery schedules, replenishment orders<\/td><\/tr><\/table><h4>Types of supply chain models<\/h4><table><tr><th>Model<\/th><th>Best for<\/th><\/tr><tr><td>Continuous flow<\/td><td>Mature industries; same good repeatedly; stable demand<\/td><\/tr><tr><td>Agile<\/td><td>Unpredictable demand or custom orders; flexibility first<\/td><\/tr><tr><td>Fast<\/td><td>Short life-cycle products; ride a trend and sell out before it ends<\/td><\/tr><tr><td><b>Flexible<\/b><\/td><td><b>Seasonality<\/b>: ramp production up and down for peaks and troughs<\/td><\/tr><tr><td>Efficient<\/td><td>Tight profit margins; best use of equipment, inventory, order processing<\/td><\/tr><tr><td>Custom<\/td><td>Specialised, technical industries (e.g. automobile)<\/td><\/tr><\/table><h4>Concept of SCM: three components<\/h4><table><tr><th>Component<\/th><th>Meaning<\/th><th>Level<\/th><\/tr><tr><td>Configuration (architecture)<\/td><td>How the chain is built: size of supply base, extent of vertical integration, outsourcing, distribution channel design<\/td><td>Strategic<\/td><\/tr><tr><td>Relationship<\/td><td>Inter-firm links, mainly OEM with first-tier suppliers and customers; arm's length (price and volume only) versus close partnership (vision, investment plans, NPI, financials)<\/td><td>Strategic and operational<\/td><\/tr><tr><td>Coordination<\/td><td>Operational flow of material, ideally JIT; inventory, capacity, forecasting, scheduling, customer service<\/td><td>Operational<\/td><\/tr><\/table><h4>Worked example: the detergent supply chain<\/h4><div class=\"dg\"><svg viewBox=\"0 0 760 230\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"160\" y1=\"28\" x2=\"220\" y2=\"90\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"160\" y1=\"74\" x2=\"220\" y2=\"100\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"160\" y1=\"120\" x2=\"220\" y2=\"110\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"160\" y1=\"166\" x2=\"220\" y2=\"115\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"370\" y1=\"100\" x2=\"420\" y2=\"100\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"570\" y1=\"100\" x2=\"620\" y2=\"100\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"10\" y=\"10\" width=\"150\" height=\"36\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#71717a\" stroke-width=\"1.6\"/><text x=\"85\" y=\"32\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Plastic producer<\/text><rect x=\"10\" y=\"56\" width=\"150\" height=\"36\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#71717a\" stroke-width=\"1.6\"/><text x=\"85\" y=\"70.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Chemical manufacturer<\/text><text x=\"85\" y=\"85.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">(oil company)<\/text><rect x=\"10\" y=\"102\" width=\"150\" height=\"36\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#71717a\" stroke-width=\"1.6\"/><text x=\"85\" y=\"124\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Packaging / paper<\/text><rect x=\"10\" y=\"148\" width=\"150\" height=\"36\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#71717a\" stroke-width=\"1.6\"/><text x=\"85\" y=\"170\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Timber industry<\/text><rect x=\"220\" y=\"70\" width=\"150\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"295\" y=\"96.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Manufacturer<\/text><text x=\"295\" y=\"111.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">(P&G etc.)<\/text><rect x=\"420\" y=\"70\" width=\"150\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"495\" y=\"96.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Supermarket / DC<\/text><text x=\"495\" y=\"111.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">(Big Bazaar or 3PL)<\/text><rect x=\"620\" y=\"70\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"685\" y=\"96.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Customer<\/text><text x=\"685\" y=\"111.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">wants detergent<\/text><text x=\"380\" y=\"215\" fill=\"#71717a\" font-size=\"11\" text-anchor=\"middle\">Rebuilt: the lecture's detergent example. Many upstream tiers feed the manufacturer; the customer is at the end.<\/text><\/svg><\/div><h4>Logistics versus SCM<\/h4><p>Logistics (Week 1) is the planning, implementation and control of movement and storage. SCM is wider: it integrates demand and supply networks and every party from raw-material source to end customer. Every link tries to <b>minimise cost and improve long-run performance<\/b> by eradicating useless expense, handling and movement.<\/p>\n<h4>Basic supply chain stages (Chopra and Meindl)<\/h4><div class=\"flow\"><div>Supplier<\/div><i>&rarr;<\/i><div>Manufacturer<\/div><i>&rarr;<\/i><div>Distributor / wholesaler<\/div><i>&rarr;<\/i><div>Retailer<\/div><i>&rarr;<\/i><div>Customer<\/div><\/div><p>A supply chain is dynamic: product, information and funds flow continuously. Design, planning and operation of these flows decide success or failure; chains must adapt to changing technology and customer expectations.<\/p>\n<h4>Objectives of SCM (full list from the slide)<\/h4><table><tr><th>Group<\/th><th>Objectives<\/th><\/tr><tr><td>Delivery<\/td><td>Timely delivery; optimise delivery (time, cost, amount); enhance distribution<\/td><\/tr><tr><td>Inventory and production<\/td><td>Effective inventory management; efficient, cost-effective production; improve quality<\/td><\/tr><tr><td>Customer<\/td><td>Increase value for the customer; increase demand fulfilment<\/td><\/tr><tr><td>Responsiveness<\/td><td>Flexibility and responsiveness; improve logistics management<\/td><\/tr><tr><td>Relationships and technology<\/td><td>Collaborative supplier-consumer relationship; improved integrated technology<\/td><\/tr><\/table><h4>Conclusion of the lecture<\/h4><p>Procurement, production, distribution and logistics must be strategically aligned with business goals. Technology adoption, partner collaboration and sustainability are increasingly important. A well-managed chain drives innovation, resilience and value creation.<\/p>"],["Lecture 22 - SC Operations: Manufacturing versus Service SC","<div class=\"imp\"><b>★ Important:<\/b> Asked: <b>manufacturing uses inventory, services use queues<\/b>; manufacturing is <b>push<\/b>, services are <b>pull<\/b>. Know the 5 service attributes.<\/div><p>Operations management deals with producing and distributing goods and services. <b>Four functions:<\/b> planning, scheduling, control, improvement. SCM is a subset of operations management concentrating on material and information flow among suppliers and customers.<\/p>\n<h4>Services versus products<\/h4><p>Five attributes of services: <b>intangibility, perishability, heterogeneity, inseparability, customer participation<\/b>. Perishability mirrors inventory management for demand uncertainty; heterogeneity, inseparability and participation have manufacturing counterparts in modularity and JIT.<\/p>\n<p><b>Manufacturing supply chain:<\/b> network of organisations, resources and technologies that produce and distribute goods (raw materials to assembly, packaging, distribution). <b>Service supply chain:<\/b> interconnected activities delivering intangible services (healthcare, transport, hospitality, professional); customer engagement, service delivery, resource allocation, support.<\/p><table><tr><th>Factor<\/th><th>Manufacturing SC<\/th><th>Service SC<\/th><\/tr><tr><td>Input<\/td><td>Suppliers' materials and components<\/td><td>Information, labour, skills<\/td><\/tr><tr><td>Value-added process<\/td><td>Physical production and assembly<\/td><td>Customer-provider interaction<\/td><\/tr><tr><td>Output<\/td><td>Pre-defined product<\/td><td>Customised service<\/td><\/tr><tr><td>Production system<\/td><td><b>Push<\/b> (sell from inventory)<\/td><td><b>Pull<\/b> (initiated by customer demand)<\/td><\/tr><tr><td>Demand uncertainty<\/td><td>Managed with <b>inventory<\/b><\/td><td>Managed with <b>queues<\/b><\/td><\/tr><tr><td>Customer relations<\/td><td>Often low level<\/td><td>Critical to overall success<\/td><\/tr><\/table><h4>Case: Amazon<\/h4><p>Began by filling orders with books bought from a distributor; added warehouses for speed (about 20 US and 30 elsewhere in 2009); outbound shipping cost almost USD 2 billion in 2009; 460,000 digital books for Kindle; acquired <b>Zappos<\/b> (added variety: 121,000 product descriptions, 2.2 million images) and <b>diapers.com<\/b> (little variety, high shipping volume).<\/p><h4>Significance of the supply chain in operations management<\/h4><ul><li><b>Network of organisations<\/b> - suppliers, manufacturers, distributors, retailers and customers create and deliver products or services<\/li><li><b>Flow of resources<\/b> - planning and coordination put the right resources at the right time and place<\/li><li><b>Focus<\/b> - SCM is a subset of operations management concerned with material and information flow among suppliers and customers<\/li><li><b>Impact<\/b> - less waste and better resource use (efficiency), superior quality, timely and responsive service (satisfaction)<\/li><\/ul><h4>Service attributes and their manufacturing counterparts<\/h4><table><tr><th>Service attribute<\/th><th>Manufacturing parallel<\/th><\/tr><tr><td>Intangibility<\/td><td>Blurred by tangible elements inside service processes<\/td><\/tr><tr><td>Perishability<\/td><td>Inventory management to handle demand uncertainty<\/td><\/tr><tr><td>Heterogeneity<\/td><td>Modularity (variety from standard parts)<\/td><\/tr><tr><td>Inseparability<\/td><td>Just-in-time production<\/td><\/tr><tr><td>Customer participation<\/td><td>JIT and build-to-order practices<\/td><\/tr><\/table><h4>Service supply chain framework<\/h4><div class=\"dg\"><svg viewBox=\"0 0 760 190\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"375\" y1=\"46\" x2=\"375\" y2=\"66\" stroke=\"#f59e0b\" stroke-width=\"2\" /><rect x=\"10\" y=\"10\" width=\"740\" height=\"36\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"380\" y=\"32\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Service supply chain strategy: BALANCE competitive service requirements with cost and investments<\/text><rect x=\"10\" y=\"66\" width=\"230\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"125\" y=\"80\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Value propositions<\/text><text x=\"125\" y=\"95\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">core competencies<\/text><text x=\"125\" y=\"110\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">product and service offerings<\/text><rect x=\"265\" y=\"66\" width=\"230\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"380\" y=\"87.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Organisation and<\/text><text x=\"380\" y=\"102.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">decision-making<\/text><rect x=\"520\" y=\"66\" width=\"230\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"635\" y=\"95\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Systems and tools<\/text><rect x=\"137\" y=\"136\" width=\"230\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"252\" y=\"160\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Policies and procedures<\/text><rect x=\"392\" y=\"136\" width=\"230\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"507\" y=\"160\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Performance targets and benchmarks<\/text><\/svg><div class=\"cap\">Rebuilt: service supply chain framework from the lecture slide.<\/div><\/div><h4>Amazon in detail<\/h4><ul><li>Started by filling every order with books bought from a distributor, in response to customer orders<\/li><li>Added warehouses so it could react faster: about <b>20 in the US and 30 elsewhere<\/b> (2009)<\/li><li>Uses USPS, UPS, FedEx; outbound shipping cost almost <b>USD 2 billion<\/b> in 2009<\/li><li>Kindle: more than <b>460,000 digital books<\/b>, plus audio and video<\/li><li>Acquired <b>Zappos<\/b> (variety: 121,000 product descriptions, 2.2 million images) and <b>diapers.com<\/b> (little variety, large shipping volume)<\/li><\/ul><p>Lesson: manufacturing and service chains differ, but inventory management, process optimisation and customer satisfaction matter in both.<\/p>"],["Lecture 23 - Principle Streams of Supply Chain (1)","<div class=\"imp\"><b>★ Important:<\/b> Asked: <b>three streams<\/b>, <b>insourcing<\/b>, <b>vertical integration<\/b>, and the <b>first three procurement steps in order<\/b>.<\/div><h4>Three streams<\/h4><div class=\"flow\"><div>Procurement / Supply / Sourcing<\/div><i>&rarr;<\/i><div>Operations / Material / Production<\/div><i>&rarr;<\/i><div>Logistics / Distribution<\/div><\/div><h4>Sourcing<\/h4><p>Systematic identification, assessment and enlistment of suppliers by set criteria, usually via tendering, at tactical and strategic levels; first step of the chain; balances quality against affordability.<\/p><table><tr><th>Type<\/th><th>Meaning<\/th><\/tr><tr><td>Outsourcing<\/td><td>Hire an outside party for work done in-house; front or back office; abroad or domestic<\/td><\/tr><tr><td><b>Insourcing<\/b><\/td><td>Delegate to a person or team <b>within the company<\/b>; cost saving, on-site quality monitoring<\/td><\/tr><tr><td>Near-sourcing<\/td><td>Place operations close to the home market<\/td><\/tr><tr><td>Global (off-shore) sourcing<\/td><td>Buy from lower labour and production cost countries (China typical); new skills and resources<\/td><\/tr><tr><td>Prime / subcontracting<\/td><td>Subcontractor performs part of a larger project<\/td><\/tr><tr><td>Captive service operations<\/td><td>Partly or wholly-owned entity overseas: control and confidentiality, but weaker economies of scale<\/td><\/tr><tr><td>Professional service<\/td><td>Recruit specialised service occupations<\/td><\/tr><tr><td><b>Vertical integration<\/b><\/td><td><b>Merging companies at different stages of the same industry<\/b>; acquiring a supplier = backward; acquiring distribution = forward<\/td><\/tr><tr><td>Few or many suppliers<\/td><td>Multi-supplier for commodities (price based); single source for close partnership<\/td><\/tr><tr><td>Joint venture<\/td><td>Entity of two or more parties with shared ownership, returns, risk, governance<\/td><\/tr><tr><td>Virtual enterprise<\/td><td>Independent firms linked by IT to share skills, costs, market access<\/td><\/tr><\/table><h4>Procurement management: 8 steps<\/h4><div class=\"flow\"><div>1 Identifying and planning<\/div><i>&rarr;<\/i><div>2 Choosing and selecting suppliers<\/div><i>&rarr;<\/i><div>3 Negotiating the contract<\/div><i>&rarr;<\/i><div>4 Placing the first purchase order<\/div><i>&rarr;<\/i><div>5 Accelerating (expediting) the order<\/div><i>&rarr;<\/i><div>6 Receipt and inspection<\/div><i>&rarr;<\/i><div>7 Clearing the invoice and payment<\/div><i>&rarr;<\/i><div>8 Maintaining relationships and records<\/div><\/div><p>Procurement must be part of product development; use risk management and performance indicators; it is continuous, not one-time. Example: construction company sourcing cement and steel.<\/p>\n<h4>Supply management<\/h4><p>Identifying, acquiring and managing resources and suppliers: goals are cost control, efficient resource allocation, risk management and information gathering.<\/p><h4>Sourcing vs procurement vs supply management<\/h4><table><tr><th>Term<\/th><th>Meaning<\/th><\/tr><tr><td>Sourcing<\/td><td>Finding, assessing and enlisting suppliers by criteria (tendering); strategic and tactical; first step of the chain<\/td><\/tr><tr><td>Procurement management<\/td><td>Overseeing and administering all methods of acquiring materials, products, goods and services; involves buyer, seller and many platforms; not a one-time activity; use technology<\/td><\/tr><tr><td>Supply management<\/td><td>Identifying, acquiring and managing resources and suppliers (goods, information, services); goals: cost control, efficient allocation, risk management, effective information gathering<\/td><\/tr><\/table><h4>The 8 procurement steps explained<\/h4><table><tr><th>Step<\/th><th>Meaning<\/th><\/tr><tr><td>1 Identifying and planning<\/td><td>Define needs and plan the purchase; involve procurement in product development<\/td><\/tr><tr><td>2 Choosing and selecting suppliers<\/td><td>Evaluate against criteria<\/td><\/tr><tr><td>3 Negotiating the contract<\/td><td>Know your negotiating position<\/td><\/tr><tr><td>4 Placing the first purchase order<\/td><td>Formal order issue<\/td><\/tr><tr><td>5 Accelerating the order<\/td><td>Expediting to keep delivery on schedule<\/td><\/tr><tr><td>6 Receipt and inspection<\/td><td>Verify quantity and quality<\/td><\/tr><tr><td>7 Clearing the invoice and payment<\/td><td>Match and pay<\/td><\/tr><tr><td>8 Maintaining relationships and records<\/td><td>Supplier relationship and documentation<\/td><\/tr><\/table><p>Example: a construction company finds suppliers of cement and steel, negotiates contracts, builds relationships, checks quality and ensures delivery to the site on time. Also from the lecture: manufacturing as a sourcing option means creating new products from raw materials or components.<\/p>"],["Lecture 24 - Principle Streams of Supply Chain (2)","<div class=\"imp\"><b>★ Important:<\/b> Asked: the <b>6 M's<\/b> (Man, Machine, Methods, Materials, Money, Markets) and the logistics management goal (<b>minimise cost, maximise efficiency<\/b>).<\/div><h4>Operations management<\/h4><p>Converts inputs (raw material, labour, equipment, technology) into outputs as effectively as possible. Functions: planning, scheduling, execution. Applied in manufacturing, service, retail, hospitality, logistics and supply chain.<\/p>\n<h4>Material management<\/h4><ul><li><b>MRP<\/b> - quantity and timing of raw materials needed; avoids over and under stocking<\/li><li><b>Purchase planning<\/b> - when and how much to order; balance holding cost against ordering cost<\/li><li><b>Inventory control<\/b> - raw material, WIP, finished goods<\/li><li><b>Material supply management<\/b> - flow from suppliers to production<\/li><li><b>Quality control<\/b> - inspect and test materials<\/li><li><b>Cost reduction<\/b> - timely procurement, less waste<\/li><\/ul><h4>Production management: the 6 M's<\/h4><div class=\"flow\"><div>Man<\/div><i>&rarr;<\/i><div>Machine<\/div><i>&rarr;<\/i><div>Methods<\/div><i>&rarr;<\/i><div>Materials<\/div><i>&rarr;<\/i><div>Money<\/div><i>&rarr;<\/i><div>Markets<\/div><\/div><p>Goals: right quantity, quality, time and cost. Functions: product and resource selection, production planning and control, machine maintenance and replacement. Strategies: <b>continuous improvement, JIT, TPM (Total Productive Maintenance), SCM<\/b>. Example: furniture plant.<\/p>\n<h4>Logistics management<\/h4><p>Planning, implementation and control of movement and storage of goods, services and information; delivers the right product to the right place at the right time in the right condition while <b>minimising costs and maximising efficiency<\/b>. Components: warehouse management (WMS: barcode, RFID, automation), transportation management (TMS: tracking, mediator between order systems and carriers), distribution management systems (order management, inventory allocation, warehouse forecasting).<\/p><h4>Operations managers are responsible for<\/h4><ul><li>Creating, implementing and administering operations systems, processes and practices<\/li><li>Balancing resources, revenue and costs for highest profit<\/li><li>Steering product and service design by customer needs<\/li><li>Overseeing operations strategy<\/li><li>Streamlining production, logistics and supply chain workflows<\/li><\/ul><h4>Where operations management applies<\/h4><table><tr><th>Domain<\/th><th>Focus<\/th><\/tr><tr><td>Manufacturing<\/td><td>Design, create, deliver goods; plan, schedule, control raw materials, labour, equipment<\/td><\/tr><tr><td>Service<\/td><td>Manage service delivery for a smooth customer experience<\/td><\/tr><tr><td>Retail<\/td><td>Stocking shelves, inventory, customer service<\/td><\/tr><tr><td>Hospitality<\/td><td>Front desk, housekeeping, catering<\/td><\/tr><tr><td>Logistics<\/td><td>Efficient flow of products and services origin to consumption<\/td><\/tr><tr><td>Supply chain<\/td><td>Transformation from raw material to finished product; resource, information and financial flows<\/td><\/tr><\/table><h4>Material management<\/h4><p>Planning, organising and controlling the flow of materials for a manufacturer (MRP, sourcing, purchasing, stock and movement). Primary goal: materials available in the right quantity, at the right time and place, at lowest cost. Includes <b>MRP, purchase planning, inventory control, material supply management, quality control<\/b> and cost reduction (see list above).<\/p>\n<h4>Production management<\/h4><p>Narrow definition of production management as just \"transforming inputs into outputs\" ignores the human factor, hence the <b>6 M's<\/b>. Goals: right quantity, right quality, right time, right cost. Strategies: continuous improvement, JIT, <b>TPM<\/b>, SCM. Example: furniture plant where planning sets targets and quality control checks output.<\/p>\n<h4>Logistics management components<\/h4><table><tr><th>System<\/th><th>Function<\/th><\/tr><tr><td><b>WMS<\/b> (warehouse)<\/td><td>Software automating receiving, put-away, picking, packing, shipping using barcode, RFID and automation<\/td><\/tr><tr><td><b>TMS<\/b> (transport)<\/td><td>Manages transport of goods; tracks delivery and shipment status; mediates between legacy order systems and carriers<\/td><\/tr><tr><td>Distribution management system<\/td><td>Order management, inventory allocation, warehouse forecasting; streamlines distribution<\/td><\/tr><\/table>"],["Lecture 25 - Objectives of Supply Chain Networks","<div class=\"imp\"><b>★ Important:<\/b> Asked: the <b>four network design decision categories<\/b> (not employee compensation). Know cost-versus-responsiveness location logic and the 4 phases.<\/div><p><b>Supply chain profitability<\/b> = revenue from the customer minus total supply chain cost; customers are the only source of revenue. A <b>supply chain network<\/b> is the interconnected system of suppliers, manufacturers, distributors, retailers, warehouses, transport providers and customers; network design builds and models the chain to understand cost and time to market.<\/p>\n<h4>Four network design decision categories<\/h4><table><tr><th>Decision<\/th><th>Question<\/th><\/tr><tr><td>Facility role<\/td><td>What role and what processes at each facility?<\/td><\/tr><tr><td>Facility location<\/td><td>Where should facilities be?<\/td><\/tr><tr><td>Capacity allocation<\/td><td>How much capacity at each?<\/td><\/tr><tr><td>Market and supply allocation<\/td><td>Which markets does each facility serve and which sources feed it?<\/td><\/tr><\/table><h4>Factors influencing network decisions<\/h4><table><tr><th>Factor<\/th><th>Insight<\/th><\/tr><tr><td>Strategic<\/td><td>Cost leaders pick lowest-cost sites (Foxconn, Flextronics in China); responsive firms stay near market (Zara in Portugal and Spain)<\/td><\/tr><tr><td>Technological<\/td><td>High economies of scale: few big plants (semiconductors, AMD); low fixed cost: many local plants (Coca-Cola bottling)<\/td><\/tr><tr><td>Macroeconomic<\/td><td>Taxes, tariffs, exchange rates, shipping costs<\/td><\/tr><tr><td>Political<\/td><td>Stable countries; Global Political Risk Index (Eurasia Group): government, society, security, economy<\/td><\/tr><tr><td>Infrastructure<\/td><td>1990s China: Shanghai, Tianjin, Guangzhou despite higher costs<\/td><\/tr><tr><td>Competitive<\/td><td>Locate near or far from competitors depending on competition form, resources<\/td><\/tr><tr><td>Customer response time<\/td><td>Convenience stores many and close; supermarkets fewer, larger<\/td><\/tr><\/table><div class=\"dg\"><svg viewBox=\"0 0 760 260\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><line x1=\"60\" y1=\"20\" x2=\"60\" y2=\"220\" stroke=\"#71717a\"/><line x1=\"60\" y1=\"220\" x2=\"720\" y2=\"220\" stroke=\"#71717a\"/>\n<polyline fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" points=\"80,200 200,170 320,140 440,110 560,80 680,50\"/>\n<polyline fill=\"none\" stroke=\"#34d399\" stroke-width=\"3\" points=\"80,40 200,100 320,140 440,165 560,180 680,190\"/>\n<polyline fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"3\" stroke-dasharray=\"6 4\" points=\"80,60 200,110 320,150 440,160 560,140 680,120\"/>\n<text x=\"690\" y=\"48\" fill=\"#fb7185\" font-size=\"12\">Inventory + facility cost<\/text><text x=\"690\" y=\"200\" fill=\"#34d399\" font-size=\"12\">Transportation cost<\/text><text x=\"690\" y=\"132\" fill=\"#f59e0b\" font-size=\"12\">Total logistics cost<\/text>\n<text x=\"390\" y=\"245\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Number of facilities<\/text><text x=\"20\" y=\"120\" fill=\"#f5f5f4\" font-size=\"12\" transform=\"rotate(-90 20 120)\" text-anchor=\"middle\">Cost<\/text><\/svg><div class=\"cap\">Rebuilt: inventory and facility cost rise with facilities; transportation falls, then rises if inbound economies of scale are lost. Total cost has a minimum.<\/div><\/div><h4>Framework<\/h4><div class=\"dg\"><svg viewBox=\"0 0 760 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"180\" y1=\"70\" x2=\"200\" y2=\"70\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"370\" y1=\"70\" x2=\"390\" y2=\"70\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"560\" y1=\"70\" x2=\"580\" y2=\"70\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"10\" y=\"30\" width=\"170\" height=\"80\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"95\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Phase I<\/text><text x=\"95\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Define supply chain<\/text><text x=\"95\" y=\"89\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">strategy / design<\/text><rect x=\"200\" y=\"30\" width=\"170\" height=\"80\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"285\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Phase II<\/text><text x=\"285\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Define regional<\/text><text x=\"285\" y=\"89\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">facility configuration<\/text><rect x=\"390\" y=\"30\" width=\"170\" height=\"80\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"475\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Phase III<\/text><text x=\"475\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Select desirable<\/text><text x=\"475\" y=\"89\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">potential sites<\/text><rect x=\"580\" y=\"30\" width=\"170\" height=\"80\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"665\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Phase IV<\/text><text x=\"665\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Choose location and<\/text><text x=\"665\" y=\"89\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">capacity allocation<\/text><text x=\"380\" y=\"135\" fill=\"#71717a\" font-size=\"12\" text-anchor=\"middle\">Narrowing from firm-wide design to a precise site and capacity for each facility<\/text><\/svg><div class=\"cap\">Rebuilt: four-phase framework for network design decisions.<\/div><\/div><ul><li><b>Phase I<\/b> - stages and who performs them; competitive strategy; competitor evolution; capital constraints (acquire, build or partner)<\/li><li><b>Phase II<\/b> - demand forecast by region; homogeneous needs favour large consolidated facilities, varied needs favour local ones; economies of scale or scope<\/li><li><b>Phase III<\/b> - hard infrastructure (suppliers, transport, communication, utilities, warehousing) and soft infrastructure (skilled workforce, turnover, community receptivity)<\/li><li><b>Phase IV<\/b> - precise location and capacity maximising profit given margin, demand, costs, taxes and tariffs<\/li><\/ul><h4>Case: Zara (Inditex)<\/h4><div class=\"cards\"><div class=\"m\"><b>4-6 weeks<\/b><span>Design-to-sales cycle (industry: 6+ months)<\/span><\/div><div class=\"m\"><b>75%<\/b><span>Merchandise display changed in a short span<\/span><\/div><div class=\"m\"><b>~40%<\/b><span>Production capacity owned; rest outsourced<\/span><\/div><div class=\"m\"><b>24 h / 48 h<\/b><span>Delivery to Europe / Americas-Asia stores from 8 Spanish DCs<\/span><\/div><\/div><p>Uncertain-demand items from Europe, predictable items from Asia; over 40% of purchases after the season starts (typical retailer under 20%); half the markdowns; strong IT for sales data.<\/p><h4>More objectives of the supply chain<\/h4><ul><li>Marketing has only one source of revenue: <b>customers<\/b>; manage product, service, information and funds flow properly<\/li><li><b>Profitability<\/b> = what the customer pays minus the firm's expenses to supply the product; higher profitability means more value<\/li><li><b>Replenishment<\/b> (restoring stock to a former level) is easy with an adequate chain; distributors deliver faster<\/li><li>Shorter time to fill and order; better efficiency; world-class performance through coordination<\/li><li>Right levels of pre and post-production inventory; easier balance of supply and demand<\/li><li>Efficiency and efficacy: better labour, space and equipment use; lower fixed asset, manufacturing, transportation and inventory costs, and shorter system-wide response time<\/li><li>Better decisions for top and middle managers; supports stability strategy and competitive advantage<\/li><li>Intermediaries used properly give regular distribution of goods<\/li><\/ul><h4>Definition and components<\/h4><p>CIPS: network design covers all movements and storage of raw materials, WIP and finished goods from origin to consumption, and the planning, implementation and control of operations. Components: suppliers, manufacturers, distributors, retailers, warehouses, transport providers, customers. Networks range from simple linear chains to global multi-tier networks; managing them means optimising processes, collaboration and technology for visibility and responsiveness.<\/p>\n<h4>Zara discussion questions (from the lecture)<\/h4><ul><li>What advantage does Zara gain from a very responsive supply chain?<\/li><li>Why both in-house and outsourced manufacturing, and why keep capacity in Europe?<\/li><li>Why source uncertain-demand products locally and predictable ones from Asia?<\/li><li>Why replenish stores several times a week, and how does frequency affect inventory?<\/li><li>Is the responsive replenishment infrastructure better suited to online or physical retail?<\/li><\/ul><p>Model answers: speed matches display to preferences (full-price sales, half the markdowns); European sources are fast for uncertain items while Asia is cheap for predictable ones; frequent replenishment keeps store stock close to demand and cuts inventory and forecast error.<\/p>"]],"gl":[["Supply chain","All parties directly or indirectly fulfilling a customer request (Chopra and Meindl).",""],["SCM","Managing demand and supply networks to minimise cost and improve performance.",""],["Three flows","Product, funds and information.",""],["Strategy / design","Multi-year structural decisions.",""],["Planning phase","Quarter to a year; configuration fixed.",""],["Operation phase","Weekly or daily order-level decisions.",""],["Continuous flow model","Mature industries, stable demand.",""],["Agile model","Unpredictable demand, custom orders.",""],["Fast model","Short life-cycle trend products.",""],["Flexible model","Seasonal demand peaks and troughs.",""],["Efficient model","Thin margins, maximum efficiency.",""],["Custom model","Specialised industries such as automobiles.",""],["SC configuration","Architecture of the chain; strategic.",""],["SC relationship","Arm's length versus close partnership.",""],["SC coordination","Operational, ideally JIT flow of materials.",""],["Push system","Sell from inventory, driven by forecast; manufacturing.",""],["Pull system","Initiated by customer demand; services.",""],["Insourcing","Delegating to a team inside the company.",""],["Near-sourcing","Operations placed close to home market.",""],["Captive service operation","Own entity overseas; control but less scale.",""],["Vertical integration","Merging firms at different stages of one industry.",""],["Backward / forward integration","Acquire a supplier / acquire distribution.",""],["Virtual enterprise","Independent firms linked by IT.",""],["Procurement steps","Plan, choose, negotiate, PO, accelerate, receive and inspect, pay, maintain records.",""],["MRP","Material requirements planning: quantity and timing of materials.",""],["6 M's","Man, Machine, Methods, Materials, Money, Markets.",""],["TPM","Total Productive Maintenance.",""],["Network design decisions","Facility role, location, capacity allocation, market and supply allocation.",""],["Four design phases","Strategy, regional configuration, potential sites, location and capacity.",""],["Hard vs soft infrastructure","Physical facilities versus skills, turnover, receptivity.",""],["Zara","4-6 week cycle, local fast sourcing for uncertain items.",""],["Global Political Risk Index","Eurasia Group index over four categories.",""]],"q":[["o","Which supply chain model is best suited for companies affected by seasonality, with high demand peaks and low volume at other times?",["Continuous flow model","Agile model","Fast model","Flexible model"],3,"The flexible model ramps production up and down."],["o","In the Manufacturing vs Service SC comparison, how is 'demand uncertainty' managed differently?",["Manufacturing uses queues; services use inventory","Manufacturing uses inventory; services use queues","Both use inventory equally","Both use queues equally"],1,"Services cannot stock, so they queue."],["o","Production Management uses the '6 M's'. Which of the following is NOT one of the 6 M's?",["Man and Machine","Methods and Money","Materials and Markets","Motivation and Media"],3,"Man, Machine, Methods, Materials, Money, Markets."],["o","What is the correct sequence of the first three steps in Procurement Management?",["Placing the Purchase Order, Negotiating the Contract, Identifying and Planning","Identifying and Planning, Choosing and Selecting Suppliers, Negotiating the Contract","Negotiating the Contract, Identifying and Planning, Choosing Suppliers","Receipt and Inspection, Clearing the Invoice, Maintaining Records"],1,"Steps 1 to 3 of the 8-step procurement process."],["o","Vertical Integration in sourcing involves:",["Forming joint ventures with international companies","Merging of companies at different production and/or distribution stages in the same industry","Outsourcing all non-core activities","Purchasing from multiple suppliers simultaneously"],1,"Backward (supplier) or forward (distribution) integration."],["o","Which is a key characteristic of a Service Supply Chain's production system?",["Pull (initiated by customer demand)","Push (sell from inventory)","Both push and pull equally","Neither push nor pull"],0,"Services are pull; manufacturing is push."],["o","Which type of sourcing involves delegating a job to someone within the company itself?",["Outsourcing","Near-sourcing","Insourcing","Global sourcing"],2,"Insourcing keeps work in-house."],["o","The three principle streams of the supply chain are:",["Planning, Execution, and Monitoring","Procurement/Supply/Sourcing; Operations/Material/Production; Logistics/Distribution","Inbound, Internal, and Outbound logistics","Strategic, Tactical, and Operational management"],1,"Lectures 23 and 24."],["o","Logistics Management delivers the right product to the right place, at the right time, in the right condition, while:",["Maximizing advertising spend","Minimizing costs and maximizing efficiency","Increasing production batch sizes","Reducing the number of suppliers"],1,"Cost minimisation and efficiency."],["o","Supply chain network design decisions fall into four categories. Which is NOT one of them?",["Facility role","Facility location","Employee compensation","Capacity allocation"],2,"The fourth is market and supply allocation."],["x","Which of these is NOT one of the three flows in a supply chain?",["Product","Funds","Information","Labour"],3,"Product, funds and information."],["x","The supply chain planning phase covers a time frame of:",["Weekly or daily","A quarter to a year","Several years","Hourly only"],1,"Strategy is multi-year; operation is weekly or daily."],["x","Which supply chain model suits short life-cycle trend products?",["Continuous flow","Fast","Efficient","Custom"],1,"The fast model sells a trend product out before the trend ends."],["x","Which statement about supply chain configuration is correct?",["It is purely operational","It is also called supply chain architecture and is strategic","It covers only coordination of inventory","It concerns only price and volume exchange"],1,"Configuration decides supply base size, vertical integration, outsourcing and channel design."],["x","Acquiring your input supplier is called:",["Forward integration","Backward integration","Near-sourcing","Insourcing"],1,"Backward integration moves upstream; forward moves into distribution."],["x","Which step is 5 in the procurement management process?",["Placing the first purchase order","Accelerating the order","Receipt and inspection","Clearing the invoice"],1,"Step 4 is first PO, step 5 accelerating the order, step 6 receipt and inspection."],["x","In service supply chains, demand uncertainty is mainly handled using:",["Finished goods inventory","Queues","Raw material stock","Push production"],1,"Manufacturing uses inventory; services use queues."],["x","Which is NOT among the 5 unique attributes of services in Lecture 22?",["Perishability","Inseparability","Heterogeneity","Standardised storability"],3,"Attributes: intangibility, perishability, heterogeneity, inseparability, customer participation."],["x","Semiconductor manufacturing typically uses:",["Many small local plants","A few high-capacity facilities","Only retail outlets","No facilities"],1,"Economies of scale and cheap transport favour few large plants; Coca-Cola bottling is the opposite."],["x","As the number of facilities in a network increases, inventory and facility costs:",["Decrease","Increase","Stay the same","Vanish"],1,"Transportation cost falls at first, then can rise if inbound scale is lost."],["x","Phase III of network design (select potential sites) emphasises which infrastructure?",["Only soft infrastructure","Hard infrastructure (suppliers, transport, utilities) and soft infrastructure (skilled workforce)","Only taxes","Competitor prices"],1,"Hard and soft infrastructure both matter."],["x","Zara achieves a design-to-sales cycle of about:",["6 months","3 months","4 to 6 weeks","1 day"],2,"The industry average exceeds six months."]],"imp":[["Three SC decision phases","Strategy/design = several years; planning = quarter to a year; operation = weekly or daily. Configuration is fixed at the lower levels."],["Supply chain models","Flexible = seasonality; continuous flow = mature, stable; agile = unpredictable or custom; fast = short life cycle; efficient = thin margins; custom = specialised (automobile)."],["Definition and flows","Chopra and Meindl: all parties directly or indirectly fulfilling a customer request. Three flows: product, funds, information."],["Three SCM components","Configuration (architecture, strategic), relationship (arm's length vs partnership), coordination (operational, JIT)."],["Manufacturing versus service SC","Push (sell from inventory) vs pull (customer initiated); inventory vs queues; customer relations low vs critical. 5 service attributes."],["Three principle streams","Procurement/supply/sourcing; operations/material/production; logistics/distribution."],["Sourcing types","Insourcing (inside the company), outsourcing, near-sourcing, global sourcing, captive operations, vertical integration (backward = supplier, forward = distribution)."],["Procurement 8 steps","1 identify and plan, 2 choose suppliers, 3 negotiate contract, 4 first PO, 5 accelerate order, 6 receipt and inspection, 7 invoice and payment, 8 relationships and records."],["6 M's of production","Man, Machine, Methods, Materials, Money, Markets."],["Logistics management goal","Right product, place, time, condition while minimising cost and maximising efficiency; WMS, TMS, DMS."],["Network design decisions","Facility role, facility location, capacity allocation, market and supply allocation (not employee compensation)."],["Factors in network design","Cost leaders go low-cost (Foxconn); responsive firms stay near market (Zara); scale favours few plants (semiconductors), low fixed cost favours many (Coca-Cola)."],["Cost versus number of facilities","Inventory and facility cost rise; transportation cost falls then can rise; total has a minimum."],["Four-phase network framework","I strategy, II regional configuration, III potential sites (hard and soft infrastructure), IV location and capacity."],["Zara numbers","4-6 week cycle vs 6+ months; 24 h Europe / 48 h elsewhere delivery; 40% own capacity; half the markdowns."]]},"6":{"notes":[["Lecture 26 - Supply Chain Uncertainty and Processes","<div class=\"imp\"><b>★ Important:<\/b> Asked: <b>implied demand uncertainty<\/b> (emergency orders = higher; higher service level = higher) and the <b>three macro processes<\/b> CRM, ISCM, SRM.<\/div><p>Opening question: are you 100% sure the delivery will come this weekend, and that the truck holds exactly 1,500 units? COVID-19 was not foreseen either. <b>Supply chain uncertainty<\/b> = unpredictability that disrupts flow of goods: natural disasters, geopolitics, labour shortages, logistics disruptions, demand swings.<\/p>\n<h4>Demand versus implied demand uncertainty<\/h4><table><tr><th>Concept<\/th><th>Meaning<\/th><\/tr><tr><td>Demand uncertainty<\/td><td>Overall unpredictability of customer demand (trends, behaviour, economy)<\/td><\/tr><tr><td><b>Implied demand uncertainty<\/b><\/td><td>Uncertainty of the <b>portion of demand the chain plans to satisfy<\/b>, shaped by order frequency, lead times, service level<\/td><\/tr><\/table><ul><li><b>Emergency orders versus long lead time:<\/b> emergency-serving firm has <b>higher<\/b> implied uncertainty; long lead time lets orders be filled evenly<\/li><li><b>Service level:<\/b> raising it means meeting rare surges, so implied uncertainty rises even if underlying demand uncertainty is unchanged<\/li><\/ul><h4>Supply uncertainty<\/h4><ul><li><b>Capability of the chain<\/b> - production process and yields; e.g. PC industry with new components: low yields, breakdowns<\/li><li><b>Product life-cycle position<\/b> - new phone: high; salt in a supermarket: low<\/li><li>Linked to implied demand uncertainty; falls as technology matures<\/li><\/ul><h4>Risk versus uncertainty<\/h4><p><b>Risk<\/b> = outcome and probability, so it can be estimated (low probability but severe impact is still big risk). <b>Uncertainty<\/b> = decision makers cannot estimate the outcome or probability.<\/p>\n<h4>Sources (courier-industry study)<\/h4><ul><li><b>Logistics<\/b> - delivery delays, network management, storage, carrier strength, machine failures<\/li><li><b>Information<\/b> - accuracy, availability, timeliness; infrastructure breakdown<\/li><li><b>Customer-related<\/b> - volatile behaviour, reputation, receivables, forecast errors (consignors and consignees)<\/li><li><b>Environmental<\/b> - political, economic, social, technological, environmental; labour issues, congestion, disasters, fuel<\/li><\/ul><h4>Countering uncertainty<\/h4><ul><li>Diversify suppliers across regions<\/li><li>Enhance visibility (analytics, tracking, data sharing)<\/li><li>Build flexibility (buffer stock, agile manufacturing)<\/li><li>Strengthen relationships<\/li><li>Invest in resilience (redundant capacity, backup inventory)<\/li><li>Risk management (assessments, scenario planning, alternative routes)<\/li><li>Monitor and adapt; use automation, AI, data analytics<\/li><\/ul><h4>Mitigating through automated planning<\/h4><ul><li>More frequent plans (yearly to weekly reviews cuts inventory)<\/li><li>Consistent planning methods using best practices<\/li><li>Integrating more data sources<\/li><li>Visibility across the chain, reducing the <b>bullwhip effect<\/b><\/li><li>Holistic KPI tracking<\/li><\/ul><h4>Macro processes<\/h4><div class=\"dg\"><svg viewBox=\"0 0 760 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"120\" y1=\"75\" x2=\"160\" y2=\"75\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"310\" y1=\"75\" x2=\"345\" y2=\"75\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"495\" y1=\"75\" x2=\"530\" y2=\"75\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"680\" y1=\"75\" x2=\"700\" y2=\"75\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"10\" y=\"50\" width=\"110\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#71717a\" stroke-width=\"1.6\"/><text x=\"65\" y=\"79\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Supplier<\/text><rect x=\"160\" y=\"30\" width=\"150\" height=\"90\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"235\" y=\"64\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">SRM<\/text><text x=\"235\" y=\"79\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Supplier Relationship<\/text><text x=\"235\" y=\"94\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Management<\/text><rect x=\"345\" y=\"30\" width=\"150\" height=\"90\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"420\" y=\"64\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">ISCM<\/text><text x=\"420\" y=\"79\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Internal Supply Chain<\/text><text x=\"420\" y=\"94\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Management<\/text><rect x=\"530\" y=\"30\" width=\"150\" height=\"90\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"605\" y=\"64\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">CRM<\/text><text x=\"605\" y=\"79\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Customer Relationship<\/text><text x=\"605\" y=\"94\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Management<\/text><rect x=\"700\" y=\"50\" width=\"50\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#71717a\" stroke-width=\"1.6\"/><text x=\"725\" y=\"79\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Cust.<\/text><text x=\"235\" y=\"140\" fill=\"#f59e0b\" font-size=\"11\" text-anchor=\"middle\">Sourcing, supplier evaluation, negotiation<\/text><text x=\"420\" y=\"140\" fill=\"#34d399\" font-size=\"11\" text-anchor=\"middle\">Capacity, demand and supply planning, fulfilment<\/text><text x=\"605\" y=\"140\" fill=\"#f59e0b\" font-size=\"11\" text-anchor=\"middle\">Marketing, pricing, sales, order mgmt, call centre<\/text><\/svg><div class=\"cap\">Rebuilt: three supply chain macro processes (CRM, ISCM, SRM).<\/div><\/div><h4>Why automation reduces uncertainty (5 reasons)<\/h4><table><tr><th>Reason<\/th><th>Detail<\/th><\/tr><tr><td>Frequency<\/td><td>Automated planning allows more frequent plans; yearly to weekly review reduces inventory<\/td><\/tr><tr><td>Consistency<\/td><td>Best practice from all planners; predictable downstream processes<\/td><\/tr><tr><td>More data<\/td><td>Combine inventory, sales forecasts, production plans<\/td><\/tr><tr><td>Visibility<\/td><td>Shared plans reduce the <b>bullwhip effect<\/b>; downstream has time to react<\/td><\/tr><tr><td>Holistic KPIs<\/td><td>Quantify process changes (e.g. warehouse headcount versus service)<\/td><\/tr><\/table><h4>Macro process aims<\/h4><table><tr><th>Process<\/th><th>Aim<\/th><th>Includes<\/th><\/tr><tr><td>CRM<\/td><td>Generate demand, ease order placement and tracking<\/td><td>Marketing, pricing, sales, order management, call centre<\/td><\/tr><tr><td>ISCM<\/td><td>Fulfil demand efficiently and cheaply<\/td><td>Capacity planning, demand and supply planning, order fulfilment<\/td><\/tr><tr><td>SRM<\/td><td>Arrange supply sources<\/td><td>Supplier evaluation and selection, supply term negotiation<\/td><\/tr><\/table>"],["Lecture 27 - Supply Chain Operational Views","<div class=\"imp\"><b>★ Important:<\/b> Asked: <b>replenishment cycle = retailer-distributor<\/b>; <b>pull = reactive<\/b>; know SCOR processes and attributes.<\/div><h4>SCOR model<\/h4><p>Planning and diagnostic system from the <b>Supply-Chain Council<\/b>; benchmarking and diagnostic tools; more than 250 metrics. Five management processes: <b>Plan, Source, Make, Deliver, Return<\/b> (plus Enable). Five performance dimensions: <b>Reliability, Responsiveness, Agility, Costs, Asset Management Efficiency<\/b>.<\/p><div class=\"dg\"><svg viewBox=\"0 0 760 230\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"140\" y1=\"45\" x2=\"160\" y2=\"45\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"290\" y1=\"45\" x2=\"310\" y2=\"45\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"440\" y1=\"45\" x2=\"460\" y2=\"45\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"590\" y1=\"45\" x2=\"610\" y2=\"45\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"10\" y=\"20\" width=\"130\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"75\" y=\"49\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">PLAN<\/text><rect x=\"160\" y=\"20\" width=\"130\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"225\" y=\"49\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">SOURCE<\/text><rect x=\"310\" y=\"20\" width=\"130\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"375\" y=\"49\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">MAKE<\/text><rect x=\"460\" y=\"20\" width=\"130\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"525\" y=\"49\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">DELIVER<\/text><rect x=\"610\" y=\"20\" width=\"130\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"675\" y=\"49\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">RETURN<\/text><rect x=\"10\" y=\"100\" width=\"730\" height=\"34\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#71717a\" stroke-width=\"1.6\"/><text x=\"375\" y=\"121\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">ENABLE (rules, data, policies, risk, compliance supporting all processes)<\/text><rect x=\"10\" y=\"160\" width=\"140\" height=\"46\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"80\" y=\"187\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Reliability<\/text><rect x=\"160\" y=\"160\" width=\"140\" height=\"46\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"230\" y=\"187\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Responsiveness<\/text><rect x=\"310\" y=\"160\" width=\"140\" height=\"46\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"380\" y=\"187\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Agility<\/text><rect x=\"460\" y=\"160\" width=\"140\" height=\"46\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"530\" y=\"187\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Costs<\/text><rect x=\"610\" y=\"160\" width=\"130\" height=\"46\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"675\" y=\"179.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Asset mgmt<\/text><text x=\"675\" y=\"194.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">efficiency<\/text><text x=\"375\" y=\"152\" fill=\"#34d399\" font-size=\"12\" text-anchor=\"middle\">Five performance attributes<\/text><\/svg><div class=\"cap\">Rebuilt: SCOR model (Supply-Chain Council). Processes across the top, performance attributes below. The 4 P's: Performance, Process, Practice, People.<\/div><\/div><table><tr><th>Process<\/th><th>Scope<\/th><\/tr><tr><td>Plan<\/td><td>Planning, scheduling, coordinating resources to meet demand<\/td><\/tr><tr><td>Source<\/td><td>Procuring materials, products, services from suppliers<\/td><\/tr><tr><td>Make<\/td><td>Manufacturing, assembling, producing to demand<\/td><\/tr><tr><td>Deliver<\/td><td>Order management, inventory management, transport and delivery<\/td><\/tr><tr><td>Return<\/td><td>Returns, repairs, recycling, disposal after delivery<\/td><\/tr><\/table><h4>4 P's of SCOR<\/h4><ul><li><b>Performance<\/b> - KPIs on the five attributes<\/li><li><b>Process<\/b> - standard process framework (plan, source, make, deliver, return, enable)<\/li><li><b>Practice<\/b> - methods and tools, best practices<\/li><li><b>People<\/b> - skills, organisation, collaboration, continuous improvement<\/li><\/ul><p><b>Attributes:<\/b> reliability (right quantity, right condition), responsiveness (speed), costs, asset management (working capital and fixed assets).<\/p>\n<h4>Benefits and limitations<\/h4><table><tr><th>Benefits<\/th><th>Limitations<\/th><\/tr><tr><td>Covers the whole chain; benchmarking; aligns metrics across boundaries; common vocabulary; standard improvement targets<\/td><td>Complexity and time; one-size-fits-all; rigid linear structure; limited scope (little on social responsibility and sustainability); depends on complete accurate data<\/td><\/tr><\/table><p>E-commerce note: digital supply chains (HTML, HTTPS, TCP/IP) let firms never meet suppliers or customers; SCOR can close gaps; online customers expect fast, cheap, easy-pay, supported delivery.<\/p>\n<h4>Process and cyclic view<\/h4><div class=\"dg\"><svg viewBox=\"0 0 760 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"120\" y1=\"95\" x2=\"160\" y2=\"95\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"270\" y1=\"95\" x2=\"310\" y2=\"95\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"420\" y1=\"95\" x2=\"460\" y2=\"95\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"570\" y1=\"95\" x2=\"610\" y2=\"95\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"10\" y=\"70\" width=\"110\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"65\" y=\"99\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Customer<\/text><rect x=\"160\" y=\"70\" width=\"110\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"215\" y=\"99\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Retailer<\/text><rect x=\"310\" y=\"70\" width=\"110\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"365\" y=\"99\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Distributor<\/text><rect x=\"460\" y=\"70\" width=\"110\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"515\" y=\"99\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Manufacturer<\/text><rect x=\"610\" y=\"70\" width=\"110\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"665\" y=\"99\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Supplier<\/text><text x=\"140\" y=\"50\" fill=\"#34d399\" font-size=\"11\" text-anchor=\"middle\">Customer order cycle<\/text><text x=\"290\" y=\"150\" fill=\"#f59e0b\" font-size=\"11\" text-anchor=\"middle\">Replenishment cycle<\/text><text x=\"440\" y=\"50\" fill=\"#34d399\" font-size=\"11\" text-anchor=\"middle\">Manufacturing cycle<\/text><text x=\"590\" y=\"150\" fill=\"#f59e0b\" font-size=\"11\" text-anchor=\"middle\">Procurement cycle<\/text><text x=\"375\" y=\"185\" fill=\"#71717a\" font-size=\"11\" text-anchor=\"middle\">Each cycle operates at the interface between two successive stages<\/text><\/svg><div class=\"cap\">Rebuilt: cyclic view of supply chain processes.<\/div><\/div><ul><li><b>Customer<\/b> - convert arrivals into orders<\/li><li><b>Retailer<\/b> - order entry communicated quickly<\/li><li><b>Distributor<\/b> - reach target customers directly and cost-efficiently; access for services<\/li><li><b>Manufacturer<\/b> - make to order, turn raw material into product<\/li><li><b>Supplier<\/b> - contributes goods or services to the next link<\/li><\/ul><p>Cyclic view clearly defines process owners, roles and desired outcomes; useful for operational decisions.<\/p>\n<h4>Push/pull view<\/h4><div class=\"dg\"><svg viewBox=\"0 0 760 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs>\n<rect x=\"20\" y=\"40\" width=\"440\" height=\"44\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"240\" y=\"67\" fill=\"#f5f5f4\" font-size=\"13\" text-anchor=\"middle\">PUSH: speculative, driven by forecasts<\/text>\n<rect x=\"470\" y=\"40\" width=\"270\" height=\"44\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"605\" y=\"67\" fill=\"#f5f5f4\" font-size=\"13\" text-anchor=\"middle\">PULL: reactive, driven by orders<\/text>\n<line x1=\"465\" y1=\"20\" x2=\"465\" y2=\"110\" stroke=\"#fb7185\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><text x=\"465\" y=\"130\" fill=\"#fb7185\" font-size=\"12\" text-anchor=\"middle\">Push/pull boundary: customer order arrives<\/text>\n<text x=\"20\" y=\"25\" fill=\"#a1a1aa\" font-size=\"12\">Supplier, manufacturing, replenishment ...<\/text><text x=\"740\" y=\"25\" fill=\"#a1a1aa\" font-size=\"12\" text-anchor=\"end\">... customer order cycle<\/text><\/svg><div class=\"cap\">Rebuilt: push/pull view. Processes before the order are push; those after are pull.<\/div><\/div><div class=\"tip\"><b>Pull<\/b> = reactive (in response to a customer order). <b>Push<\/b> = speculative (in anticipation of orders).<\/div><h4>SCOR levels (standard SCOR structure)<\/h4><table><tr><th>Level<\/th><th>Content<\/th><\/tr><tr><td>1<\/td><td>Top-level process types (plan, source, make, deliver, return)<\/td><\/tr><tr><td>2<\/td><td>Configuration: process categories<\/td><\/tr><tr><td>3<\/td><td>Process elements, inputs, outputs, metrics<\/td><\/tr><tr><td>4+<\/td><td>Company-specific implementation<\/td><\/tr><\/table><p>The lecture also stresses that cyclic, process and push/pull views together give a holistic perspective from planning and sourcing to manufacturing, delivery and returns.<\/p>"],["Lecture 28 - Supply Chain Models and Modelling Systems","<div class=\"imp\"><b>★ Important:<\/b> Know each <b>model with its example company<\/b> (Amazon, Zara, Nike, Dell, HP, P&G), agile's <b>four traits<\/b>, and the Intel numbers.<\/div><p><b>Supply chain modelling<\/b> designs and analyses a chain to find improvements and simulate scenarios. Model types: static, dynamic, Monte Carlo, linear programming, simulation, queuing, statistical. Choice depends on the optimisation goal. Wrong framework choice exposes the firm to risk, interruption and cost escalation.<\/p>\n<h4>Major components<\/h4><p>Inventory (most critical), transportation, warehousing, manufacturing, procurement, distribution, customer service, information technology.<\/p>\n<h4>Supply chain models<\/h4><table><tr><th>Model<\/th><th>Idea<\/th><th>Example<\/th><\/tr><tr><td>Continuous<\/td><td>Steady flow; JIT; stable demand and uniform goods; less flexible to sudden change<\/td><td>Amazon<\/td><\/tr><tr><td>Fast chain<\/td><td>Quick delivery, short life cycles; design-to-shelf in weeks versus six months<\/td><td>Zara<\/td><\/tr><tr><td>Efficient chain<\/td><td>Reduce waste, maximise efficiency in competitive markets; relies on production forecasts; vulnerable to labour or material shortages<\/td><td><\/td><\/tr><tr><td>Agile<\/td><td>Responsive and adaptive; volatile demand; four traits: <b>process alignment, virtual integration, network base, market sensitivity<\/b>; can charge more; profitable only to a volume threshold<\/td><td>Nike<\/td><\/tr><tr><td>Custom-configured<\/td><td>Tailored to customer; blends agile and continuous flow; small batch, prototypes<\/td><td>Dell<\/td><\/tr><tr><td>Flexible<\/td><td>Handles demand peaks and long low periods; needs part segmentation, precise stocking algorithms, flexible planning; \"toggle on or off\"<\/td><td>Hewlett Packard<\/td><\/tr><tr><td>Virtual (future)<\/td><td>Cloud computing and analytics for visibility and communication<\/td><td>Procter and Gamble<\/td><\/tr><\/table><h4>Best practices<\/h4><p>Understand business needs; choose approach; validate with accurate data; test what-if scenarios; consider different models; involve stakeholders; update regularly; document assumptions and limits; train users; monitor KPIs.<\/p>\n<h4>Challenges<\/h4><p>Complex relationships, imperfect data, multiple objectives, dynamic environment, integration issues, resource constraints, scenario complexity, risk and uncertainty, change management.<\/p>\n<h4>Control towers<\/h4><p>Cloud-based, using AI, machine learning and big data for end-to-end real-time visibility across the network; plan for unknowns and reduce disruption.<\/p>\n<h4>Cases<\/h4><div class=\"cards\"><div class=\"m\"><b>9 to 2 weeks<\/b><span>Intel Atom chip order cycle after make-to-order pilot (Malaysia)<\/span><\/div><div class=\"m\"><b>> USD 4 saved<\/b><span>Per unit on a USD 20 chip (cost was about USD 5.50)<\/span><\/div><div class=\"m\"><b>10% cost cut<\/b><span>Chemical company MILP network model<\/span><\/div><div class=\"m\"><b>95% next-day<\/b><span>Products delivered next day after redesign<\/span><\/div><\/div><p>Intel: only inventory was a lever, so it moved to make-to-order, a bi-weekly assembly test window, formal S&amp;OP and vendor-managed inventory. The chemical company used a MILP model (sites, candidate DCs, demand regions), faced ERP data standardisation and resistance to change.<\/p><h4>Benefits of supply chain modelling<\/h4><p>Simulate scenarios, find the most efficient or practical option, balance cost and service, support informed manager decisions. Linear programming optimises resource distribution for a goal; simulation and queuing models test dynamics.<\/p>\n<h4>Model comparison cheat sheet<\/h4><table><tr><th>Model<\/th><th>Keyword<\/th><th>Example<\/th><\/tr><tr><td>Continuous<\/td><td>Stable demand, JIT<\/td><td>Amazon<\/td><\/tr><tr><td>Fast<\/td><td>Short life cycle<\/td><td>Zara<\/td><\/tr><tr><td>Efficient<\/td><td>Thin margins<\/td><td>-<\/td><\/tr><tr><td>Agile<\/td><td>Volatile demand, 4 traits<\/td><td>Nike<\/td><\/tr><tr><td>Custom-configured<\/td><td>Tailored to customer<\/td><td>Dell<\/td><\/tr><tr><td>Flexible<\/td><td>Seasonal peaks<\/td><td>Hewlett Packard<\/td><\/tr><tr><td>Virtual<\/td><td>Cloud and analytics<\/td><td>P&G<\/td><\/tr><\/table>"],["Lecture 29 - Supply Chain Drivers (Facilities and Inventory)","<div class=\"imp\"><b>★ Important:<\/b> Asked: the <b>six drivers<\/b>, <b>centralising facilities = efficiency up, responsiveness down<\/b>, and <b>Little's Law<\/b>.<\/div><p>Drivers are the key elements that decide a chain's responsiveness and efficiency and interact to meet the competitive strategy. They can also be sources of vulnerability and risk.<\/p><div class=\"dg\"><svg viewBox=\"0 0 760 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><rect x=\"10\" y=\"15\" width=\"230\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"125\" y=\"39\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Facilities<\/text><rect x=\"265\" y=\"15\" width=\"230\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"380\" y=\"39\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Inventory<\/text><rect x=\"520\" y=\"15\" width=\"230\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"635\" y=\"39\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Transportation<\/text><rect x=\"10\" y=\"115\" width=\"230\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"125\" y=\"139\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Information<\/text><rect x=\"265\" y=\"115\" width=\"230\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"380\" y=\"139\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Sourcing<\/text><rect x=\"520\" y=\"115\" width=\"230\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"635\" y=\"139\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Pricing<\/text><text x=\"380\" y=\"85\" fill=\"#71717a\" font-size=\"12\" text-anchor=\"middle\">Logistics drivers (top row)  |  Cross-functional drivers (bottom row)<\/text><\/svg><div class=\"cap\">Rebuilt: six supply chain drivers.<\/div><\/div><div class=\"dg\"><svg viewBox=\"0 0 760 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"340\" y1=\"70\" x2=\"420\" y2=\"70\" stroke=\"#f59e0b\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"420\" y1=\"90\" x2=\"340\" y2=\"90\" stroke=\"#f59e0b\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"10\" y=\"30\" width=\"330\" height=\"80\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"175\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">RESPONSIVENESS<\/text><text x=\"175\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">fast modes (air, express), decentralised facilities,<\/text><text x=\"175\" y=\"89\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">more finished goods near customers<\/text><rect x=\"420\" y=\"30\" width=\"330\" height=\"80\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"585\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">EFFICIENCY<\/text><text x=\"585\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">slow cheap modes (sea, rail), centralised facilities,<\/text><text x=\"585\" y=\"89\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">inventory held upstream or as raw material<\/text><text x=\"380\" y=\"135\" fill=\"#71717a\" font-size=\"12\" text-anchor=\"middle\">Every driver is a trade-off between the two ends of this scale<\/text><\/svg><div class=\"cap\">Rebuilt: responsiveness versus efficiency trade-off.<\/div><\/div><table><tr><th>Type<\/th><th>Drivers<\/th><th>Character<\/th><\/tr><tr><td>Logistics drivers<\/td><td>Facilities, inventory, transportation<\/td><td>Physical movement, storage, delivery; narrower; often external partners; efficiency and cost<\/td><\/tr><tr><td>Cross-functional drivers<\/td><td>Information, sourcing, pricing<\/td><td>Integration across departments; broader scope from procurement to customer service; larger impact<\/td><\/tr><\/table><h4>Facilities<\/h4><ul><li>Physical locations where inventory is stored or transformed: warehouses, plants, DCs<\/li><li>Centralising raises efficiency, lowers responsiveness; decentralising does the reverse<\/li><li><b>Toyota and Honda<\/b> open plants in every major market (responsiveness, protection from currency and trade barriers); Honda's flexible SUV/car plants helped in 2008<\/li><li>Role: flexibility versus capacity, product versus functional focus, cross-docking versus storage<\/li><li>Location: economies of scale versus proximity; macroeconomic, labour, infrastructure, tax<\/li><li>Capacity: excess capacity gives flexibility but raises cost; high utilisation improves efficiency but hurts responsiveness<\/li><\/ul><h4>Facility metrics<\/h4><table><tr><th>Metric<\/th><th>Meaning<\/th><\/tr><tr><td>Capacity<\/td><td>Maximum a facility can process<\/td><\/tr><tr><td>Utilisation<\/td><td>Fraction of capacity in use; unit cost falls and delays rise as it increases<\/td><\/tr><tr><td>Processing / setup / down / idle time<\/td><td>Fractions of time in each state; utilisation should be limited by demand, not setup or downtime<\/td><\/tr><tr><td>Production cost per unit<\/td><td>Average cost per unit, case or pound<\/td><\/tr><tr><td>Quality losses<\/td><td>Fraction of output lost to defects<\/td><\/tr><tr><td>Theoretical flow time<\/td><td>Time if no delays occur<\/td><\/tr><tr><td>Actual average flow time<\/td><td>Theoretical plus delays; use for due dates<\/td><\/tr><tr><td>Flow time efficiency<\/td><td>Theoretical / actual flow time (low = lots of waiting)<\/td><\/tr><tr><td>Top 20
