  const body=(imp.length?'<h3>Quick list</h3><table><tr><th>Topic</th><th>What to remember</th></tr>'+imp.map(x=>'<tr><td><b>'+x[0]+'</b></td><td>'+x[1]+'</td></tr>').join('')+'</table>':'')+
   DATA.weeks[w].notes.map((s,si)=>{const b=secHTML(w,si,true);return b.replace(/<div class="blk p-H"/,'<h3>'+s[0]+'</h3><div class="blk p-H"')===b?'':b.replace(/<div class="blk p-H"/,'<h3>'+s[0]+'</h3><div class="blk p-H"')}).join('');
  return '<div class="acc"><div class="h"><span>Week '+w+' &middot; '+WT[w]+'</span></div><div class="c">'+body+'</div></div>'}).join('');
 main.innerHTML=h;
}
/* ---------- flashcards ---------- */
function rCards(){
 main.innerHTML='<input type="search" id="fs" placeholder="Search terms in '+(wk?'Week '+wk:'all weeks')+'..."><div class="grid" id="fg"></div>';
 const draw=f=>{const ws=wk?[wk]:WK;let h='';ws.forEach(w=>DATA.weeks[w].gl.forEach(g=>{if((g[0]+g[1]).toLowerCase().includes(f))h+='<div class="fc"><span class="fw">W'+w+(g[2]==='E'?' \u2605':g[2]==='K'?' \u25cf':'')+'</span><div class="fi"><div class="fa">'+g[0]+'</div><div class="fb">'+g[1]+'</div></div></div>'}));$('#fg').innerHTML=h||'<div class="hint">No match.</div>';};
 draw('');$('#fs').oninput=e=>draw(e.target.value.toLowerCase());
}
/* ---------- important ---------- */
function rImp(){
 const ws=wk?[wk]:WK;
 main.innerHTML='<div class="imp"><b>\u2605 Important topics.</b> What the assignment questions tested, plus what each lecture stresses with numbers, definitions or named cases.</div>'+ws.map(w=>'<div class="card"><b style="color:var(--a)">Week '+w+' &middot; '+WT[w]+'</b><table><tr><th>#</th><th>Topic</th><th>What to remember</th></tr>'+DATA.weeks[w].imp.map((x,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+x[0]+'</b></td><td>'+x[1]+'</td></tr>').join('')+'</table></div>').join('');
}
/* ---------- mega quiz ---------- */
function runIds(){
 let list=QS.filter(q=>QF.w==='all'||q.w===+QF.w);
 if(QF.s==='weak'){const ws=weakIds();return list.filter(q=>ws.includes(q.id)).sort((a,b)=>(PR.q[b.id].w||0)-(PR.q[a.id].w||0)).map(q=>q.id);}
 const o=list.filter(q=>q.set==='o'),x=list.filter(q=>q.set==='x');
 return (QF.s==='o'?o:QF.s==='x'?x:[...o,...x]).map(q=>q.id);
}
function qCard(q,n,showMeta){
 return '<div class="q" id="qc_'+q.id+'"><div class="t">Q'+n+' &middot; '+wkLabel(q)+' &middot; '+setLabel(q)+(PR.q[q.id]&&PR.q[q.id].weak?' <span class="miss">missed '+PR.q[q.id].w+'x</span>':'')+'</div><p>'+esc(q.q)+'</p>'+q.o.map((o,j)=>'<button class="o" data-act="ans" data-q="'+q.id+'" data-o="'+j+'">'+'ABCD'[j]+') '+esc(o)+'</button>').join('')+'<button class="chk" data-act="rev" data-q="'+q.id+'">Check Answer</button><div class="ex" id="ex_'+q.id+'"></div></div>';
}
function rQuiz(){
 AN={};RUN={ids:runIds(),done:0,score:0,by:{}};
 const total=QS.filter(q=>q.set==='o').length,pt=QS.filter(q=>q.set==='x').length;
 let h='<div class="card"><b style="color:var(--a)">Mega Quiz</b><div class="hint">'+total+' assignment questions from all 12 weeks come first, followed by '+pt+' practice questions at the end. Every miss is saved to Weak Spots so you can re-read it later.</div></div>';
 h+='<div class="bar"><label>Weeks <select id="qw"><option value="all">All 12 weeks</option>'+WK.map(w=>'<option value="'+w+'">Week '+w+'</option>').join('')+'</select></label><label>Set <select id="qs"><option value="mega">Mega: assignments, then practice</option><option value="o">Assignments only</option><option value="x">Practice only</option><option value="weak">My weak spots</option></select></label><span id="sc"></span><div class="prog"><i id="pg"></i></div><button class="p" data-act="restart">Restart</button></div><div id="res"></div><div id="qb"></div>';
 main.innerHTML=h;$('#qw').value=QF.w;$('#qs').value=QF.s;
 $('#qw').onchange=e=>{QF.w=e.target.value;rQuiz()};$('#qs').onchange=e=>{QF.s=e.target.value;rQuiz()};
 let last='',n=0,out='';
 RUN.ids.forEach(id=>{const q=QM[id];const key=(q.set==='o'?'A':'P')+'|'+wkLabel(q);if(key!==last){last=key;out+='<div class="sech'+(q.set==='x'?' pr':'')+'">'+(q.set==='o'?'Assignment':'Practice')+' &middot; '+wkLabel(q)+'</div>';}
  n++;out+=qCard(q,n);});
 $('#qb').innerHTML=out||'<div class="card hint">No questions in this selection'+(QF.s==='weak'?' (no weak spots yet).':'.')+'</div>';
 updQ();
}
function updQ(){
 if(!RUN)return;const n=RUN.ids.length;const sc=$('#sc');if(!sc)return;
 sc.textContent='Score: '+RUN.score+' / '+RUN.done+' (of '+n+')';$('#pg').style.width=(n?RUN.done/n*100:0)+'%';
 if(n&&RUN.done===n){const r=$('#res'),p=RUN.score/n,miss=n-RUN.score;
  const rows=Object.keys(RUN.by).map(k=>'<tr><td>'+k+'</td><td>'+RUN.by[k][0]+' / '+RUN.by[k][1]+'</td></tr>').join('');
  r.style.display='block';r.innerHTML='<b class="big">'+RUN.score+' / '+n+'</b> &middot; '+Math.round(p*100)+'% &middot; '+(p>=.8?'Excellent':p>=.6?'Good, review the misses':'Revisit the notes')+'<div class="hint" style="margin:6px 0">'+miss+' missed question'+(miss!==1?'s':'')+' saved to Weak Spots.</div><table><tr><th>Group</th><th>Correct</th></tr>'+rows+'</table><button class="bx p" data-act="tab" data-v="weak">Open weak spots</button> <button class="bx" data-act="tab" data-v="rev">Open revision</button> <button class="bx" data-act="rem" data-v="1d">Remind me tomorrow</button>';}
}
function feedback(q,sel){
 const bs=document.querySelectorAll('#qc_'+q.id+' .o');
 bs.forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('ok');else if(j===sel)b.classList.add('no')});
 const ok=sel===q.a,r=PR.q[q.id];
 const e=$('#ex_'+q.id);if(!e)return;
 e.innerHTML=(ok?'<b style="color:var(--ok)">Correct.</b> ':sel===-1?'<b>Answer: '+'ABCD'[q.a]+'.</b> ':'<b style="color:var(--no)">Incorrect.</b> Correct answer: '+'ABCD'[q.a]+'. ')+q.e+(ok&&r&&!r.weak&&r.w?' <b style="color:var(--ok)">Back in the clear (2 right in a row).</b>':ok&&r&&r.weak?' <span class="hint">(Weak spot: get it right once more to clear it.)</span>':'')+(ok?'':'<div style="margin-top:6px"><span class="miss">Saved to Weak Spots.</span> '+jumpLink(q)+'</div>');
 e.classList.add('s');
}
function answer(id,sel){
 const q=QM[id];if(AN[id]!==undefined)return;AN[id]=sel;
 const ok=sel===q.a;
 const r=PR.q[id]||(PR.q[id]={w:0,c:0,s:0,weak:false});r.l=Date.now();r.p=sel;
 if(ok){r.c++;r.s++;if(r.weak&&r.s>=2)r.weak=false;}else{r.w++;r.s=0;r.weak=true;}
 savePR();
 if(RUN&&RUN.ids.includes(id)){RUN.done++;if(ok)RUN.score++;const k=(q.set==='o'?'Assignment':'Practice')+' \u00b7 '+wkLabel(q);const b=RUN.by[k]||(RUN.by[k]=[0,0]);b[1]++;if(ok)b[0]++;}
 feedback(q,sel);
 const wc=weakIds().length;const bd=document.querySelector('#tabs .badge');
 chrome();banner();updQ();
}
/* ---------- weak spots ---------- */
function progTable(){
 let rows='';let tot={a:0,m:0};
 WK.forEach(w=>{const qs=QS.filter(q=>q.w===w);const seen=qs.filter(q=>PR.q[q.id]);const wk_=qs.filter(q=>PR.q[q.id]&&PR.q[q.id].weak);const mast=seen.filter(q=>!PR.q[q.id].weak&&PR.q[q.id].w);
  rows+='<tr><td>Week '+w+'</td><td>'+seen.length+' / '+qs.length+'</td><td>'+(wk_.length?'<span class="miss">'+wk_.length+'</span>':'0')+'</td><td>'+mast.length+'</td></tr>';});
 return '<table><tr><th>Week</th><th>Attempted</th><th>Weak now</th><th>Recovered</th></tr>'+rows+'</table>';
}
function rWeak(){
 AN={};const ids=weakIds();
 const bad=ids.map(id=>QM[id]).sort((a,b)=>(PR.q[b.id].w||0)-(PR.q[a.id].w||0));
 let h='<div class="card"><b style="color:var(--a)">Weak Spots</b><div class="hint">Questions you missed or revealed. Get one right twice in a row to clear it. '+(persist?'Progress is saved in this browser on this device.':'<span class="miss">Storage is blocked here, so progress will be lost when you close the page. Use the backup box below.</span>')+'</div>'+
 '<div class="chips"><span class="chip w">'+ids.length+' weak now</span><span class="chip g">'+QS.filter(q=>PR.q[q.id]&&!PR.q[q.id].weak&&PR.q[q.id].w).length+' recovered</span><span class="chip">'+Object.keys(PR.q).length+' attempted of '+QS.length+'</span></div>'+
 '<button class="bx p" data-act="runweak"'+(ids.length?'':' disabled')+'>Quiz me on weak spots</button> <button class="bx" data-act="tab" data-v="rev">Read them in Revision</button></div>';
 h+='<div class="card"><b>Remind me to re-read</b><div class="hint">The reminder shows as a banner the next time you open this page after the chosen time (the page cannot send push notifications).</div><div class="chips"><button class="bx" data-act="rem" data-v="tonight">Tonight 8 pm</button><button class="bx" data-act="rem" data-v="1d">Tomorrow morning</button><button class="bx" data-act="rem" data-v="3d">In 3 days</button></div><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="datetime-local" id="remdt" style="max-width:240px;margin:0"><button class="bx" data-act="remset">Set custom time</button>'+(PR.rem?'<button class="bx" data-act="remclear">Clear</button>':'')+'</div>'+(PR.rem?'<div class="hint" style="margin-top:6px">Reminder set for '+new Date(PR.rem).toLocaleString()+'</div>':'')+'</div>';
 h+='<div class="sech pr">Missed questions'+(ids.length?' ('+ids.length+')':'')+'</div>';
 h+=bad.length?bad.map((q,i)=>{const r=PR.q[q.id];return '<div class="q" id="qc_'+q.id+'"><div class="t"><span class="wk">'+wkLabel(q).replace('Week ','W')+'</span>'+setLabel(q)+' <span class="miss">missed '+r.w+'x</span></div><p>'+esc(q.q)+'</p>'+q.o.map((o,j)=>'<div class="o'+(j===q.a?' ok':j===r.p?' no':'')+'" style="cursor:default">'+'ABCD'[j]+') '+esc(o)+(j===q.a?' &nbsp;\u2713 correct':j===r.p?' &nbsp;\u2717 your answer':'')+'</div>').join('')+'<div class="ex s">'+q.e+'</div><div style="margin-top:6px">'+jumpLink(q)+'<button class="lnk" data-act="und" data-q="'+q.id+'">Mark understood</button></div></div>'}).join(''):'<div class="card hint">No weak spots. Take the Mega Quiz and any miss will land here.</div>';
 h+='<div class="sech">Progress by week</div>'+progTable();
 h+='<div class="sech">Backup (move progress between devices)</div><div class="card"><div class="hint">Copy this text somewhere safe. Paste it back and press Restore on another device or browser.</div><textarea id="bk">'+JSON.stringify(PR)+'</textarea><button class="bx" data-act="restore">Restore from text</button> <button class="bx" data-act="clear">Clear all progress</button></div>';
 main.innerHTML=h;
}
/* ---------- events ---------- */
const main=$('#main');
function setRem(ts){PR.rem=ts;savePR();render();}
document.addEventListener('click',e=>{
 const fc=e.target.closest('.fc');if(fc){fc.classList.toggle('f');return;}
 const hd=e.target.closest('.acc>.h');if(hd){hd.parentNode.classList.toggle('open');return;}
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,d=b.dataset;
 if(a==='tab'){tab=d.v;if((tab==='notes')&&!wk)wk=1;render();scrollTo(0,0);}
 else if(a==='wk'){wk=+d.v;if(tab==='notes'&&!wk)wk=1;render();scrollTo(0,0);}
 else if(a==='pm'){pm=d.v;chrome();}
 else if(a==='ans')answer(d.q,+d.o);
 else if(a==='rev')answer(d.q,-1);
 else if(a==='restart'){rQuiz();}
 else if(a==='runweak'){QF.s='weak';QF.w='all';tab='quiz';render();scrollTo(0,0);}
 else if(a==='jump'){openJump(+d.w,+d.si,d.h||null);}
 else if(a==='und'){if(PR.q[d.q]){PR.q[d.q].weak=false;PR.q[d.q].s=2;savePR();}render();}
 else if(a==='expall')document.querySelectorAll('#main .acc').forEach(x=>x.classList.add('open'));
 else if(a==='colall')document.querySelectorAll('#main .acc').forEach(x=>x.classList.remove('open'));
 else if(a==='rem'){const n=new Date();if(d.v==='tonight'){n.setHours(20,0,0,0);if(n<Date.now())n.setDate(n.getDate()+1)}else if(d.v==='1d'){n.setDate(n.getDate()+1);n.setHours(8,0,0,0)}else{n.setDate(n.getDate()+3);n.setHours(8,0,0,0)}setRem(n.getTime());}
 else if(a==='remset'){const v=$('#remdt').value;if(v)setRem(new Date(v).getTime());}
 else if(a==='remclear')setRem(null);
 else if(a==='snooze')setRem(Date.now()+864e5);
 else if(a==='restore'){try{const o=JSON.parse($('#bk').value);if(o&&o.q){PR=o;savePR();render();}}catch(x){alert('That text is not valid backup data.')}}
 else if(a==='clear'){if(confirm('Clear all saved quiz progress and weak spots?')){PR={q:{},rem:null};savePR();render();}}
});
render();
</script>
</body>
</html>
