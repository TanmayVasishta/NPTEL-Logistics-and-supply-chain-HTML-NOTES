<script>
const DATA={"weeks":{"1":{"notes":[["Lecture 1 - Introduction to Logistics: Design and Management","<p><b>Logistics<\/b> = management of the flow of <b>goods, information and resources<\/b> from the point of <b>origin to the point of consumption<\/b>, both <b>forward and reverse<\/b>. It covers planning, implementing and controlling efficient movement and storage of goods plus related information and financial transactions within a supply chain.<\/p>\n<h4>Evolution<\/h4><div class=\"flow\"><div>Local<\/div><i>&rarr;<\/i><div>Regional / National<\/div><i>&rarr;<\/i><div>Global<\/div><\/div><h4>The Seven R's of logistics<\/h4><ul><li>Right <b>product<\/b> (with right information about it)<\/li><li>Right <b>quantity<\/b><\/li><li>Right <b>time<\/b><\/li><li>Right <b>condition<\/b><\/li><li>Right <b>place<\/b><\/li><li>Right <b>customer<\/b><\/li><li>Right (financial) <b>resources<\/b><\/li><\/ul><h4>Key elements<\/h4><div class=\"flow\"><div>Transportation<\/div><i>&rarr;<\/i><div>Warehousing<\/div><i>&rarr;<\/i><div>Inventory control<\/div><i>&rarr;<\/i><div>Order fulfilment<\/div><i>&rarr;<\/i><div>Distribution<\/div><\/div><p>Context from the lecture: 10-minute deliveries create pressure, so failures must be anticipated. The ultimate aim is to deliver the correct products to the right location at the right time while <b>minimising expenses and maximising effectiveness<\/b>. Effective logistics optimises operations, cuts cost, raises customer satisfaction and gives competitive advantage.<\/p>\n<h4>Reference books<\/h4><ul><li>Donald Waters - Logistics: An Introduction to Supply Chain Management<\/li><li>Ghiani, Laporte, Musmanno - Introduction to Logistics Systems Management<\/li><li>John J. Liu - Supply Chain Management and Transport Logistics<\/li><li>Mangan and Lalwani - Global Logistics and Supply Chain Management<\/li><li>Bramel and Simchi-Levi - The Logic of Logistics<\/li><\/ul>"],["Lecture 2 - Stakeholders, Advantages and Modern Concepts","<h4>Logistics stakeholders and process flow<\/h4><table><tr><th>Stage<\/th><th>What happens<\/th><\/tr><tr><td>Order placement<\/td><td>Customer orders goods or services<\/td><\/tr><tr><td>Order processing<\/td><td>Sales / customer service team processes the order<\/td><\/tr><tr><td>Picking and packing<\/td><td>Orders picked from shelves; securely packed<\/td><\/tr><tr><td>Warehousing<\/td><td>Products stored at strategic locations<\/td><\/tr><tr><td>Inventory management<\/td><td>Levels checked to avoid <b>stock-outs<\/b>; reorder cycles replenish raw material<\/td><\/tr><tr><td>Transportation<\/td><td>Trucks, trains, ships, aircraft move packed orders<\/td><\/tr><tr><td>Delivery<\/td><td>Local carriers / postal services do <b>last-mile<\/b> delivery<\/td><\/tr><tr><td>Order tracking<\/td><td>Customers track using <b>docket numbers<\/b> from the provider<\/td><\/tr><tr><td>Customer service<\/td><td>Handles inquiries, issues, after-sale returns<\/td><\/tr><tr><td>Feedback and improvement<\/td><td>Customer feedback and internal metrics reveal scope to improve<\/td><\/tr><\/table><h4>Logistics management<\/h4><p>Planning, implementation and control of movement and storage of goods, services and information across the supply chain: strategising, executing and overseeing the flow.<\/p>\n<h4>Advantages of effective logistics management<\/h4><ul><li><b>Efficiency<\/b> - fewer interruptions<\/li><li><b>Cost reduction<\/b> - optimised routes, warehouse operations and inventory levels<\/li><li><b>Customer satisfaction<\/b> - timely delivery builds loyalty<\/li><li><b>Competitive advantage<\/b> - superior service, faster delivery, lower cost<\/li><li><b>Risk management<\/b> - mitigates stock-outs, delays, disruptions<\/li><li><b>Resource optimisation<\/b> - vehicles, warehouses, manpower<\/li><li><b>Market expansion<\/b> - reach new customers in new regions<\/li><\/ul><h4>Logistics design and management: core elements<\/h4><ul><li><b>Strategic planning<\/b> - objectives, market demand, alignment with business goals<\/li><li><b>Inventory management<\/b> - balance supply and demand via forecasting and optimisation<\/li><li><b>Warehousing<\/b> - storage efficiency, material handling, inventory control<\/li><li><b>Transportation<\/b> - modes, route optimisation, freight management<\/li><li><b>Order processing<\/b> - timely, accurate, entry to delivery<\/li><li><b>Distribution<\/b> - timely delivery, last-mile optimisation, cost minimisation<\/li><li><b>Technology<\/b> - RFID, IoT, AI-ML, UAV (drones), GPS for real-time monitoring<\/li><li><b>Continuous improvement<\/b> - KPIs, reachability, deliverability, adapting to market<\/li><\/ul><p>Design also considers cost optimisation, customer satisfaction, sustainability and risk; it involves analysing demand patterns, choosing transport modes, designing warehouse layouts and implementing inventory control.<\/p>\n<h4>Modern logistics concepts<\/h4><table><tr><th>Concept<\/th><th>Idea<\/th><\/tr><tr><td>Lean<\/td><td>From lean manufacturing: waste reduction, streamlined processes<\/td><\/tr><tr><td>Just-in-Time (JIT)<\/td><td>Minimise holding cost by aligning production and delivery schedules with customer demand; shorter lead times<\/td><\/tr><tr><td>Agile<\/td><td>Flexibility and responsiveness; dynamic networks, real-time analytics, close collaboration with partners<\/td><\/tr><tr><td>Green (sustainable)<\/td><td>Optimised routes, eco-friendly fuels and vehicles, packaging reduction, recycling, waste reduction<\/td><\/tr><tr><td>Collaborative<\/td><td>Cooperation among stakeholders: share information, resources, best practice<\/td><\/tr><tr><td>Omni-channel<\/td><td>Seamless, consistent experience across sales channels; driven by e-commerce and multi-channel retailing<\/td><\/tr><tr><td>Reverse<\/td><td>Returns, exchanges, end-of-life disposal; recover value, comply with recycling regulations<\/td><\/tr><tr><td>Supply chain visibility<\/td><td>Real-time tracking of inventory and shipments using RFID, AI-ML, IoT, UAV, GPS, cloud software<\/td><\/tr><\/table>"],["Lecture 3 - Manufacturing Logistics: National and International Scenario","<p><b>Manufacturing logistics<\/b> oversees materials, resources and procedures used to produce goods: procurement, inventory control, production scheduling, transportation and distribution of finished products.<\/p>\n<h4>Architecture<\/h4><ul><li><b>Supply chain management<\/b> - flow of materials from suppliers to plant and product to end customer<\/li><li><b>Inventory management<\/b> - balance levels to cut holding cost while meeting production<\/li><li><b>Production planning and scheduling<\/b> - meet demand with minimum lead time and cost<\/li><li><b>Quality control<\/b> - quality of raw materials and finished goods<\/li><li><b>Material handling<\/b> - movement inside the facility with suitable equipment<\/li><li><b>Transportation<\/b> - among suppliers, plants, distribution centres, customers<\/li><li><b>Warehousing<\/b> - storage and handling of materials and finished goods<\/li><li><b>Reverse logistics<\/b> - defective or excess material returns, recycling<\/li><\/ul><h4>Factors driving development of logistics<\/h4><table><tr><th>Factor<\/th><th>Effect<\/th><\/tr><tr><td>Globalisation<\/td><td>International trade raises complexity; needs advanced global transport, inventory, distribution solutions<\/td><\/tr><tr><td>E-commerce growth<\/td><td>Faster delivery, adaptable fulfilment, cross-channel integration<\/td><\/tr><tr><td>Supply chain collaboration<\/td><td>Alliances among suppliers, manufacturers, distributors, LSPs<\/td><\/tr><tr><td>Technology<\/td><td>GPS, RFID, cloud, analytics: real-time visibility, optimisation, automation<\/td><\/tr><tr><td>Infrastructure<\/td><td>Ports, airports, railways, highways cut transit times<\/td><\/tr><tr><td>Emerging markets<\/td><td>Opportunity plus new market dynamics and regulation<\/td><\/tr><tr><td>Sustainability<\/td><td>Alternative fuels, green packaging, energy-efficient modes<\/td><\/tr><tr><td>Customer expectations<\/td><td>Faster delivery, accurate tracking, hassle-free returns<\/td><\/tr><tr><td>Regulatory changes<\/td><td>Trade, customs, safety, environmental standards<\/td><\/tr><\/table><h4>Global scenario<\/h4><div class=\"cards\"><div class=\"m\"><b>EUR 8.4 trillion<\/b><span>Logistics industry worth in 2021<\/span><\/div><div class=\"m\"><b>EUR 13.7 trillion<\/b><span>Projected by 2027<\/span><\/div><div class=\"m\"><b>USD 9 trillion<\/b><span>Global logistics cost in 2020<\/span><\/div><div class=\"m\"><b>10.7% of GDP<\/b><span>Share of world GDP (USD 85.24 trillion)<\/span><\/div><div class=\"m\"><b>Asia-Pacific<\/b><span>Largest share of logistics costs<\/span><\/div><div class=\"m\"><b>United States<\/b><span>Largest 3PL market<\/span><\/div><\/div><h4>Indian scenario<\/h4><div class=\"cards\"><div class=\"m\"><b>USD 274 billion<\/b><span>Market size, 2022<\/span><\/div><div class=\"m\"><b>USD 563 billion<\/b><span>Projected by 2030<\/span><\/div><div class=\"m\"><b>9.4% CAGR<\/b><span>Growth rate<\/span><\/div><div class=\"m\"><b>14% of GDP<\/b><span>India logistics cost<\/span><\/div><div class=\"m\"><b>11%<\/b><span>BRICS average (India is higher)<\/span><\/div><\/div><p>Logistics is the backbone of every sector's supply chain (healthcare, hospitality, manufacturing). It is time-bound: a few hours' delay at one stage ripples into days at delivery.<\/p>\n<h4>Challenges faced by Indian logistics companies<\/h4><table><tr><th>Challenge<\/th><th>Detail<\/th><\/tr><tr><td>High order intensity ratio<\/td><td>Bulk order surges (festivals) break ETA and prioritisation; limited resources due to difficult payment cycles<\/td><\/tr><tr><td>Transportation roadblocks<\/td><td>Poor internal roads, hill accidents and landslides, congestion, checkpoints, toll stations<\/td><\/tr><tr><td>Rail tariffs<\/td><td>High cost, congested network, monsoon floods cancel services<\/td><\/tr><tr><td>Port and shipping problems<\/td><td>Slowest mode; understaffed ports, overstuffed berths, shallow ports cannot take large vessels<\/td><\/tr><tr><td>Lack of skilled personnel<\/td><td>Under-skilled, over-worked staff; poor training and pay cause turnover<\/td><\/tr><tr><td>Slow technology transition<\/td><td>Setup cost, foreign trainers, learning time; returns may not recover investment<\/td><\/tr><tr><td>Warehousing and taxation<\/td><td>Pest, leakage, space shortage; govt warehouses hold grain; layered taxes waste time<\/td><\/tr><tr><td>Competition with global giants<\/td><td>Short cycles and free one-day delivery at competitive prices<\/td><\/tr><tr><td>Customer mindset<\/td><td>Unwilling to pay extra for under 2-day delivery; expectations set by Amazon<\/td><\/tr><tr><td>Rising fuel costs<\/td><td>Higher freight surcharge reduces profit<\/td><\/tr><tr><td>Government policies<\/td><td>Tighter compliance mandates create bottlenecks<\/td><\/tr><tr><td>Shortage of drivers and delivery staff<\/td><td>Burn-out from heavy time-bound workloads<\/td><\/tr><\/table>"],["Lecture 4 - Storage and Warehousing","<p><b>Storage<\/b> = holding goods, materials and products at points along the supply chain from raw material to finished goods. Example: quick-commerce (Blinkit, Zepto) 10-minute delivery works because of <b>dark stores<\/b>.<\/p>\n<h4>Components of storage<\/h4><ul><li><b>Warehousing<\/b> - hubs owned by manufacturers, wholesalers, retailers or 3PLs<\/li><li><b>Inventory management<\/b> - optimisation, replenishment, cycle counting, valuation<\/li><li><b>Storage facilities<\/b> - warehouses, distribution centres, cold storage, <b>bonded warehouses<\/b> (customs control), cross-docking facilities<\/li><li><b>Equipment<\/b> - pallet racks, shelving, mezzanine floors, forklifts, conveyors, AS/RS<\/li><li><b>Safety and security<\/b> - CCTV, access control, alarms, barriers<\/li><li><b>Material handling<\/b> - protecting, storing, controlling materials; manual versus automated<\/li><\/ul><h4>Warehouse layout: FAST<\/h4><div class=\"cards\"><div class=\"m\"><b>F - Flow<\/b><span>Stock inflow and outflow strategy<\/span><\/div><div class=\"m\"><b>A - Accessibility<\/b><span>Safe travel room for staff and forklifts<\/span><\/div><div class=\"m\"><b>S - Space<\/b><span>Maximise storage; minimise offices, empty pallet areas<\/span><\/div><div class=\"m\"><b>T - Throughput<\/b><span>Units processed per time interval (outbound)<\/span><\/div><\/div><h4>7 steps to plan the layout<\/h4><div class=\"flow\"><div>Define purpose<\/div><i>&rarr;<\/i><div>Diagram and total area<\/div><i>&rarr;<\/i><div>Storage requirements<\/div><i>&rarr;<\/i><div>Equipment needs<\/div><i>&rarr;<\/i><div>Map and optimise space<\/div><i>&rarr;<\/i><div>Test traffic flow<\/div><i>&rarr;<\/i><div>Implement<\/div><\/div><h4>Utilities of warehouses<\/h4><ul><li><b>Product consolidation<\/b> - lower transport cost<\/li><li><b>Cross-docking<\/b> - unload, sort, load outbound immediately<\/li><li><b>Value-added services<\/b> - packaging, labelling, <b>kitting<\/b>, assembly<\/li><li><b>Seasonal storage<\/b> - smooths demand and supply fluctuations<\/li><li><b>Inventory management<\/b> - hold until needed for production or distribution<\/li><li><b>Risk mitigation<\/b> - buffer against supplier delays, transport issues, disasters<\/li><\/ul><h4>Cross-docking<\/h4><table><tr><th>Utilities<\/th><th>Challenges<\/th><th>Impacts<\/th><\/tr><tr><td>JIT inventory<br>Optimised transport<br>Lower holding cost<br>Improved efficiency<br>Faster transit<\/td><td>Supplier / customer relationships<br>Quality control without normal warehousing checks<br>Coordination of inbound/outbound schedules<br>Technology and infrastructure cost<\/td><td>Better customer service<br>Efficiency<br>Cost savings<br>Competitive advantage<\/td><\/tr><\/table><h4>Cases<\/h4><ul><li><b>Amazon<\/b> - cross-docking centres for fast retail delivery<\/li><li><b>Roche Diagnostics (Switzerland)<\/b> - perishable products needing same-day delivery, cross-docking suppliers keep required conditions<\/li><li><b>Mainfreight (NZ)<\/b> - cross-dock services; suited to perishables, constant-demand retail items, pre-barcoded goods<\/li><\/ul>"],["Lecture 5 - Logistics Service Providers","<p>An <b>LSP<\/b> offers transportation, storage, distribution and management services for businesses: road/rail/air/sea transport, warehousing, freight forwarding, customs brokerage, inventory management, order fulfilment, packaging, consulting, technology.<\/p>\n<h4>Key components<\/h4><ul><li>Services offered and customisation<\/li><li>Expertise and experience<\/li><li>Global reach<\/li><li>Technology integration (TMS, WMS, GPS, RFID, cloud)<\/li><li>Risk management (insurance, contingency, compliance)<\/li><li>Cost efficiency (economies of scale, pay-per-use pricing)<\/li><li>Continuous improvement<\/li><\/ul><h4>Why companies outsource (A.T. Kearney survey)<\/h4><p>Avoid capital expenditure, cut costs, increase flexibility, focus on core business, improve service, lack of scale, acquire talent, avoid labour problems. Most outsourced: domestic transport, warehousing, international transport, customs brokerage, freight forwarding. Strategic, customer-facing activities are outsourced least.<\/p>\n<h4>Types of LSP<\/h4><table><tr><th>Type<\/th><th>Description<\/th><\/tr><tr><td><b>1PL<\/b><\/td><td>Firm or individual with own cargo organises transport; supplier and customer only, no middlemen; own fleet, warehouses, staff; vertical integration; full risk<\/td><\/tr><tr><td><b>2PL<\/b><\/td><td><b>Asset-based carrier<\/b> owning means of transport (rail, road, sea, air); mainly international heavy / wholesale goods; narrower scope<\/td><\/tr><tr><td><b>3PL<\/b><\/td><td>Transport plus warehousing, terminal operations and other services; scalable, global, tech-enabled; <b>90% of Fortune 500<\/b> use a 3PL (Armstrong and Associates)<\/td><\/tr><tr><td><b>4PL<\/b><\/td><td><b>Lead logistics provider<\/b> overseeing entire supply chain; lacks physical assets; negotiates between companies; single invoice; end-to-end visibility<\/td><\/tr><tr><td><b>5PL<\/b><\/td><td><b>Logistics aggregator<\/b>; bundles needs of multiple 3PLs for better rates; fully integrated solution through multiple outsourced providers<\/td><\/tr><\/table><h4>Case study: Elixia<\/h4><p>A leading Indian 3PL struggled to allocate and manage costs for local and upcountry deliveries due to improper vehicle allocation. After defining budgeted costs and dedicated vehicle capacity, it saved <b>INR 6.7 lac in one month<\/b>.<\/p>"]],"gl":[["Logistics","Management of flow of goods, information and resources from origin to consumption (forward and reverse).",""],["7 R's","Right product, quantity, time, condition, place, customer, (financial) resources.",""],["Key elements","Transportation, warehousing, inventory control, order fulfilment, distribution.",""],["Last-mile delivery","Final leg to the customer via local carriers or postal services.",""],["Docket number","Number supplied by the provider so customers can track orders.",""],["Lean logistics","Waste reduction and streamlined processes.",""],["JIT","Align production and delivery with demand to minimise holding cost.",""],["Agile logistics","Flexibility and responsiveness to market change.",""],["Green logistics","Eco-friendly fuels, packaging reduction, recycling; also sustainable logistics.",""],["Collaborative logistics","Partners share information, resources and best practice.",""],["Omni-channel","Consistent experience across channels, driven by e-commerce.",""],["Reverse logistics","Returns, exchanges and end-of-life disposal; recover value.",""],["Supply chain visibility","Real-time tracking using RFID, AI-ML, IoT, UAV, GPS, cloud.",""],["Manufacturing logistics","Materials, resources and procedures for producing goods.",""],["Logistics cost share","Global 10.7% of GDP (2020); India 14% versus BRICS 11%.",""],["Indian market size","USD 274 bn (2022) to USD 563 bn (2030), 9.4% CAGR.",""],["Order intensity ratio","Surge of bulk orders that breaks timelines (festival season).",""],["Dark store","Local fulfilment point enabling 10-minute quick commerce.",""],["Bonded warehouse","Warehouse for goods under customs control.",""],["AS/RS","Automated storage and retrieval system.",""],["FAST","Flow, Accessibility, Space, Throughput: warehouse layout factors.",""],["Kitting","Packing complementary products into one sellable kit.",""],["Cross-docking","Unload, sort, load outbound without long-term storage.",""],["Seasonal storage","Warehouse use to absorb demand fluctuations.",""],["1PL","Company runs its own logistics in-house.",""],["2PL","Asset-based carrier owning ships, aircraft, trucks.",""],["3PL","Outsourced multi-service provider; used by 90% of Fortune 500.",""],["4PL","Lead logistics provider integrating the whole supply chain; no own assets.",""],["5PL","Logistics aggregator bundling demand of 3PLs.",""],["Elixia case","Indian 3PL saved INR 6.7 lac in a month by optimising vehicle allocation.",""]],"q":[["o","Which of the following best defines logistics?",["Manufacturing goods at the lowest cost","Management of the flow of goods, information and resources from point of origin to point of consumption","Marketing and distribution of finished products only","Financial planning of a company's supply chain"],1,"Logistics covers the full flow, forward and reverse, from origin to consumption."],["o","Which step comes immediately after order placement in the logistics process?",["Delivery","Transportation","Order Processing","Warehousing"],2,"Placement is followed by processing by the sales or customer service team."],["o","Just-in-Time (JIT) logistics primarily aims to:",["Increase buffer stock in warehouses","Minimize inventory holding costs by aligning production with customer demand","Expand the number of suppliers","Increase lead times for better planning"],1,"JIT aligns production and delivery schedules with demand, cutting holding cost and lead time."],["o","Omni-channel logistics is primarily driven by the growth of:",["Air freight","E-commerce and multi-channel retailing","Rail transportation","Traditional brick and mortar stores"],1,"The lecture links omni-channel to e-commerce and multi-channel retailing."],["o","Which is a challenge specific to Indian logistics companies?",["Surplus of delivery staff and drivers","Overdevelopment of warehousing infrastructure","High order intensity ratio and transportation roadblocks","Excessive investment in new technologies"],2,"India has a shortage of drivers, poor warehousing and slow technology adoption."],["o","A 5PL provider is also known as a:",["Logistics aggregator","Asset-based carrier","Lead logistics provider","In-house logistics manager"],0,"5PL aggregates the demand of 3PLs. Lead logistics provider is 4PL."],["o","Which concept reduces environmental impact through eco-friendly fuels, packaging reduction and waste minimization?",["Lean Logistics","Agile Logistics","Green Logistics","Reverse Logistics"],2,"Green (sustainable) logistics."],["o","Cross-docking is best described as:",["Long-term storage in a central warehouse","A type of customs clearance procedure","A method of inventory counting","Incoming shipments unloaded, sorted and loaded onto outbound trucks without long-term storage"],3,"No long-term storage is the defining feature."],["o","Which of the following is a utility of warehousing?",["Increasing transportation costs","Reducing product quality","Providing seasonal storage to handle demand fluctuations","Replacing manufacturing operations"],2,"Seasonal storage smooths supply and demand fluctuations."],["o","Which provider is an 'asset-based carrier' owning ships, airlines or trucks?",["1PL","2PL","4PL","5PL"],1,"2PL owns the means of transport."],["x","The Seven R's of logistics do NOT include which of the following?",["Right quantity","Right condition","Right competitor","Right customer"],2,"The R's: product, quantity, time, condition, place, customer, resources."],["x","Global total logistics costs in 2020 were about what share of world GDP?",["4.5%","7.2%","10.7%","15.3%"],2,"About USD 9 trillion, roughly 10.7% of GDP."],["x","India's logistics cost as a percentage of GDP is:",["8%, below the BRICS average","11%, equal to BRICS","14%, above the BRICS average of 11%","20%, double the BRICS average"],2,"14% for India versus an 11% BRICS average."],["x","Projected Indian logistics market by 2030 and CAGR:",["USD 563 billion at 9.4%","USD 274 billion at 5%","USD 1 trillion at 12%","USD 400 billion at 3%"],0,"From USD 274 bn in 2022 to USD 563 bn by 2030 at 9.4% CAGR."],["x","In the FAST warehouse layout framework, the 'T' stands for:",["Transport","Throughput","Time","Technology"],1,"Throughput: units processed per time interval."],["x","Which type of facility holds goods under customs control?",["Cold storage","Bonded warehouse","Cross-dock","Mezzanine floor"],1,"Bonded warehouses hold goods under customs control."],["x","Warehouse kitting refers to:",["Counting stock cyclically","Packing complementary individual products into a single sellable pack","Moving goods by forklift","Returning goods to supplier"],1,"A value-added service that bundles complementary products."],["x","Which company in the lecture used cross-docking for perishable products needing same-day delivery?",["Roche Diagnostics","Elixia","Mainfreight only for IT","Hitachi"],0,"Roche Diagnostics, a healthcare manufacturer in Switzerland."],["x","A 4PL provider mainly:",["Owns the trucks and ships","Oversees the entire supply chain as lead logistics provider without owning physical assets","Does only last-mile delivery","Is the company's own warehouse team"],1,"4PL coordinates multiple 3PLs and offers a single invoice and end-to-end visibility."],["x","According to the lecture, roughly what share of Fortune 500 companies use a 3PL?",["30%","50%","70%","90%"],3,"Armstrong and Associates: 90%."],["x","In the Elixia case study the savings came mainly from:",["Buying new aircraft","Defining budgeted costs and dedicated vehicle capacity for deliveries","Cutting staff pay","Closing warehouses"],1,"Better vehicle allocation saved INR 6.7 lac in one month."],["x","Which concept recovers value from returned products and complies with recycling rules?",["Reverse logistics","Agile logistics","Collaborative logistics","JIT"],0,"Reverse logistics covers returns, exchanges and end-of-life disposal."]],"imp":[["Definition of logistics","Management of the flow of goods, information and resources from origin to consumption, forward and reverse."],["Order of the logistics process","Order placement, then order processing (immediately after), picking and packing, warehousing, transportation, delivery (last mile), tracking, customer service."],["JIT","Aligns production and delivery with customer demand to minimise inventory holding cost and lead time."],["Modern concepts","Lean (waste), agile (responsiveness), green (eco fuels, less packaging, waste), collaborative, omni-channel (e-commerce driven), reverse (returns), visibility (RFID, IoT, GPS)."],["Cross-docking","Unload, sort, load outbound with no long-term storage."],["Utilities of warehousing","Consolidation, cross-docking, value-added services (kitting), seasonal storage, inventory management, risk mitigation."],["1PL to 5PL","1PL in-house; 2PL asset-based carrier; 3PL outsourced multi-service (90% of Fortune 500); 4PL lead logistics provider; 5PL aggregator."],["Challenges in Indian logistics","High order intensity ratio, transportation roadblocks, rail and port issues, skill shortage, slow technology adoption, fuel cost."],["Key numbers","Global logistics cost 10.7% of GDP; India 14% vs BRICS 11%; India market USD 274 bn (2022) to USD 563 bn (2030), 9.4% CAGR."],["Seven R's","Right product, quantity, time, condition, place, customer, resources."],["FAST layout","Flow, Accessibility, Space, Throughput."],["Elixia case","Indian 3PL saved INR 6.7 lac in a month through vehicle allocation."]]},"2":{"notes":[["Lecture 6 - E-Logistics","<p><b>E-logistics<\/b> = management of all physical flows of an organisation selling goods on an online platform (website, marketplace); it uses digital tools to streamline operations, raise visibility and improve efficiency.<\/p><div class=\"cards\"><div class=\"m\"><b>35%<\/b><span>Customers (Fevad) who had a bad delivery will not reorder from that site<\/span><\/div><div class=\"m\"><b>43%<\/b><span>French online buyers (PayPal/ComScore) abandoned a purchase due to shipping cost<\/span><\/div><\/div><p>E-commerce has a much longer withdrawal (return) period, so returns are far more likely; flawless delivery is central for e-merchants.<\/p>\n<h4>Solutions customers expect<\/h4><ul><li>Several delivery methods (home delivery most popular, plus pick-up and eco-friendly options)<\/li><li>Free delivery<\/li><li>Delivery tracking (almost obligatory)<\/li><\/ul><h4>Key elements of e-logistics<\/h4><table><tr><th>Element<\/th><th>Role<\/th><\/tr><tr><td>Supply chain visibility<\/td><td>Real-time tracking of goods and inventory<\/td><\/tr><tr><td><b>WMS<\/b><\/td><td>Warehouse operations: inventory, fulfilment, picking<\/td><\/tr><tr><td>Inventory management<\/td><td>Real-time tracking across locations, automated processes<\/td><\/tr><tr><td><b>GTM<\/b><\/td><td>Compliance with trade rules, tariffs, customs documentation, trade finance<\/td><\/tr><tr><td>Last-mile solutions<\/td><td>Route optimisation, delivery tracking apps, autonomous delivery<\/td><\/tr><tr><td>Reverse logistics platforms<\/td><td>Returns, recalls, recycling<\/td><\/tr><tr><td>Analytics and predictive insights<\/td><td>Data analytics and machine learning<\/td><\/tr><tr><td><b>Blockchain<\/b><\/td><td>Immutable decentralised records: transparency, security, traceability, less fraud<\/td><\/tr><tr><td><b>EDI<\/b>, TMS<\/td><td>Electronic exchange of business documents; transport management<\/td><\/tr><\/table><h4>Challenges<\/h4><p>High returns (Amazon returns overview), delivery expectations, cost of free shipping, last-mile cost.<\/p>\n<h4>Case: Same-day delivery<\/h4><ul><li><b>Amazon<\/b> - warehouses in densely populated urban areas, inventory closer to customers<\/li><li><b>Walmart<\/b> - pilot programmes using its store network, UPS distribution, flat USD 10 fee, no minimum order<\/li><li><b>eBay<\/b> - same-day for items not in its own inventory via local retailers and dedicated couriers<\/li><\/ul><div class=\"tip\">India angle: ONDC and quick-commerce (festival season order volumes, fashion e-commerce) were discussed as market context.<\/div>"],["Lecture 7 - International Logistics","<p>Planning and implementing how a business moves physical goods and materials from supplier to customer across borders. <b>Main goals: cost efficiency and reliability<\/b> (one misunderstood local rule can make a shipment unusable or confiscated).<\/p>\n<h4>Key components<\/h4><ul><li><b>Customs clearance<\/b> - compliance and documentation of both countries<\/li><li><b>Supply chain visibility<\/b> - real-time tracking<\/li><li><b>Inventory management<\/b> across borders<\/li><li><b>Risk management<\/b> - geopolitics, currency fluctuation, trade barriers, disasters<\/li><li><b>Incoterms<\/b> - standard terms defining buyer and seller rights and responsibilities<\/li><li><b>Cross-border regulations<\/b><\/li><li><b>Cultural and language considerations<\/b><\/li><li><b>Global supply chain network<\/b><\/li><li><b>Sustainability<\/b><\/li><\/ul><h4>Cross-border transactions<\/h4><p>Payers and recipients are in different countries (wholesale, retail, B2B, B2C). Forecast to exceed <b>USD 250 trillion by 2027<\/b>, up over USD 100 trillion in a decade. Growth drivers: trade and e-commerce, cross-border supply chains, global investment, remote workers and remittances.<\/p>\n<h4>7 steps<\/h4><div class=\"flow\"><div>Initiation<\/div><i>&rarr;<\/i><div>Routing and processing<\/div><i>&rarr;<\/i><div>Payment verification<\/div><i>&rarr;<\/i><div>Confirmation<\/div><i>&rarr;<\/i><div>Fulfilment<\/div><i>&rarr;<\/i><div>Settlement (ACH, 2-5 business days)<\/div><i>&rarr;<\/i><div>Tracking<\/div><\/div><h4>Challenges<\/h4><ul><li>Slower and up to <b>10x costlier<\/b> than domestic; may take weeks to reconcile<\/li><li>High funding costs (pre-funding)<\/li><li>Transaction fees at each stage<\/li><li><b>Currency exchange rate fluctuations<\/b><\/li><li>Long transaction chains<\/li><li>Tax and legal implications<\/li><li>Limited operating hours<\/li><li>Fragmented data formats<\/li><li>Legacy technology (batch processing)<\/li><li>Complex compliance checks<\/li><\/ul><h4>Stakeholders<\/h4><ul><li><b>Exporter<\/b> (seller / shipper) and <b>importer<\/b> (buyer)<\/li><li>Customs broker / agent - clearance, documents, inspections, duties<\/li><li><b>Shipping company<\/b> and <b>shipping agent<\/b> (its representative at a port)<\/li><li><b>Insurance<\/b> companies covering transport incidents<\/li><\/ul>"],["Lecture 8 - International Market Penetration Strategies","<p>Six strategies: <b>Exporting, Licensing, Joint ventures, Ownership, Importing, Countertrade<\/b>.<\/p><table><tr><th>Strategy<\/th><th>Types<\/th><th>Benefits<\/th><th>Challenges<\/th><th>Indian examples<\/th><\/tr><tr><td><b>Exporting<\/b> (simplest, least risky)<\/td><td>Direct (no intermediaries); indirect (agents, distributors, trading firms)<\/td><td>Diversification, competitive advantage, economies of scale, revenue<\/td><td>Tariffs, logistics, currency and payment risk, legal compliance, culture<\/td><td>Tata Motors; Bajaj Auto (70+ countries); Infosys<\/td><\/tr><tr><td><b>Licensing<\/b><\/td><td>Trademark, patent, copyright, franchising<\/td><td>Low capital, risk mitigation, brand exposure<\/td><td>Quality control, IP protection, dependency on licensee, licensee may become competitor<\/td><td>Amul; ITC (Aashirvaad, Sunfeast, Bingo); Fabindia<\/td><\/tr><tr><td><b>Joint venture<\/b><\/td><td>Equity JV (new legal entity); contractual JV (no entity)<\/td><td>Risk sharing, resources, market entry<\/td><td>Culture, strategic alignment, governance, IP, exit strategy<\/td><td>Mahindra and Mahindra; HUL; Reliance<\/td><\/tr><tr><td><b>Ownership<\/b><\/td><td>Wholly owned subsidiary (100%), equity investment, franchising, <b>acquisition<\/b><\/td><td>Control, market presence, knowledge transfer<\/td><td>Capital, regulation, integration, political and economic risk<\/td><td>Aditya Birla; <b>Tata Steel acquired Corus<\/b>; Dr. Reddy's<\/td><\/tr><tr><td><b>Importing<\/b><\/td><td>Bringing foreign goods in for use or resale<\/td><td>Product diversity, cost, time-to-market<\/td><td>Trade barriers, supply chain complexity, no quality control, currency risk<\/td><td>Walmart India; Amazon India; Apple India<\/td><\/tr><tr><td><b>Countertrade<\/b><\/td><td>Goods or services exchanged for goods or services (reciprocal / offset)<\/td><td>Market access, diversification, risk mitigation<\/td><td>Complexity, negotiation, transaction cost, operational and financial risk<\/td><td>Indian Oil Corp (oil states); ONGC Videsh<\/td><\/tr><\/table><h4>Case: Noatum Logistics, Peru<\/h4><p>Syringes from China were needed urgently for the Covid-19 vaccination campaign. Noatum found the only viable route and ran monthly <b>charter flights<\/b> to meet the government deadline at reasonable cost.<\/p>"],["Lecture 9 - Logistics KPIs","<p>KPIs measure efficiency and effectiveness of transportation, warehousing, inventory and order fulfilment. Examples: shipping time, order accuracy, picking accuracy, order cycle time, equipment and trailer utilisation, dwell time, carrying cost, inventory turnover, inventory-to-sales ratio.<\/p>\n<h4>Transportation management<\/h4><table><tr><th>KPI<\/th><th>Formula / example<\/th><\/tr><tr><td>Average cost per skid or order<\/td><td>Total cost / number of orders (Bob's Hardware: 300 orders, USD 6.83)<\/td><\/tr><tr><td>Average transportation cost<\/td><td>Transport cost / monthly gross income x 100 (800 / 10,000 = 8%)<\/td><\/tr><tr><td>Freight cost per unit shipped<\/td><td>Freight cost / units (4,200 / 6,000 = USD 0.70)<\/td><\/tr><\/table><h4>Supply management<\/h4><table><tr><th>KPI<\/th><th>Formula / example<\/th><\/tr><tr><td>Transit time to distance<\/td><td>Time / miles (5 days / 2,000 mi = 0.0025 days per mile)<\/td><\/tr><tr><td>Stock rotation (inventory turnover)<\/td><td>Sales / average inventory (10,000 / 5,000)<\/td><\/tr><tr><td>Out-of-network shipment<\/td><td>Out-of-network / total x 100 (20 / 5,450 = 0.4%)<\/td><\/tr><\/table><h4>Distribution management<\/h4><table><tr><th>KPI<\/th><th>Formula / example<\/th><\/tr><tr><td><b>On-Time Delivery (OTD)<\/b><\/td><td>On-time units / total units x 100 (15 / 18 = 83%)<\/td><\/tr><tr><td>On-time pickup<\/td><td>Pickups on time / total shipments x 100 (43 / 46 = 93.5%)<\/td><\/tr><tr><td>On-time shipping<\/td><td>Orders shipped on time / total x 100 (18 / 23 = 78.3%)<\/td><\/tr><\/table><h4>Warehousing and order management<\/h4><table><tr><th>KPI<\/th><th>Formula / example<\/th><\/tr><tr><td>Unplanned shipment<\/td><td>Unplanned / total x 100 (4 / 4,000 = 0.1%)<\/td><\/tr><tr><td>Order accuracy<\/td><td>Correct orders / orders picked x 100 (123 / 128 = 96%)<\/td><\/tr><tr><td>Inventory accuracy<\/td><td>Items counted / items in system x 100 (3,458 / 3,506 = 98.6%)<\/td><\/tr><tr><td>Dock-to-stock<\/td><td>Hours to put away / shipments (12 / 18 = 0.67 h)<\/td><\/tr><tr><td>Units processed per sq ft<\/td><td>Units / usable space (60,000 / 16,400 = 3.7)<\/td><\/tr><tr><td>Space use in warehouse<\/td><td>Space with product / total x 100 (3,300 / 16,500 = 20%)<\/td><\/tr><\/table><h4>Logistics performance<\/h4><table><tr><th>KPI<\/th><th>Formula / example<\/th><\/tr><tr><td>Cost per pound<\/td><td>Shipment cost / weight (836.24 / 2,200 = USD 0.38; typical 0.22-0.42)<\/td><\/tr><tr><td>Cost per mile<\/td><td>(Fixed + variable cost) / miles ((2,540 + 2,312) / 3,600 = USD 1.34)<\/td><\/tr><tr><td>Number of shipments<\/td><td>Monthly shipment count, broken down by region or product<\/td><\/tr><\/table>"],["Lectures 10 and 11 - Tools for Improving Logistics Efficiency","<p>Quality control ensures products reach customers to specification. Logistics quality = satisfying demand at lowest cost without compromising service level. <b>Quality costs<\/b> (obtaining quality: systems, upkeep) versus <b>non-quality costs<\/b> (losses from downtime, malfunction). Tools: Deming's cost of quality, PDCA, 7 QC tools, quality circles, 5S, benchmarking.<\/p>\n<h4>1. PDCA (Deming cycle / continuous improvement spiral)<\/h4><div class=\"flow\"><div>Plan<\/div><i>&rarr;<\/i><div>Do<\/div><i>&rarr;<\/i><div>Check<\/div><i>&rarr;<\/i><div>Act<\/div><\/div><ul><li><b>Plan<\/b> - define problem; identify opportunity and analyse start, set measurable targets, prepare action plan<\/li><li><b>Do<\/b> - test phase: perform chosen action, eliminate causes<\/li><li><b>Check<\/b> - compare results with plan; goal met leads to Act, not met means revisit (plan not executed properly or plan flawed)<\/li><li><b>Act / adjust<\/b> - document, standardise and monitor the change<\/li><\/ul><h4>2. Seven QC tools (Kaoru Ishikawa, Guide to Quality Control, 1976)<\/h4><table><tr><th>Tool<\/th><th>Purpose<\/th><\/tr><tr><td>1. Flowchart<\/td><td>Visual steps and sequence; reveals bottlenecks and decision points<\/td><\/tr><tr><td>2. Check sheet<\/td><td>Record data (e.g. defects) systematically<\/td><\/tr><tr><td>3. Histogram<\/td><td>Variation / dispersion and average of data (e.g. delivery times)<\/td><\/tr><tr><td>4. <b>Pareto diagram<\/b><\/td><td><b>80-20 rule<\/b>: ~80% of effects from ~20% of causes; prioritise vital few (e.g. scratched screen, battery issues)<\/td><\/tr><tr><td>5. Cause and effect (fishbone / Ishikawa)<\/td><td>Root-cause categories such as process, people<\/td><\/tr><tr><td>6. Scatter diagram<\/td><td>Relationship between two variables<\/td><\/tr><tr><td>7. <b>Control chart<\/b> (Shewhart chart, 1920s)<\/td><td>Control limits at +/-3 standard deviations; inside = common-cause, outside = special-cause variation<\/td><\/tr><\/table><h4>3. Quality circles<\/h4><p>Dr. Ishikawa is the father of quality circles: a voluntary group of people from the same or similar work area. Roles: top management (support), coordinator (link to management), leader (rotates), members (drawn from the work area).<\/p>\n<h4>4. 5S philosophy (Japanese origin; waste reduction and efficiency)<\/h4><table><tr><th>Term<\/th><th>Meaning<\/th><\/tr><tr><td>Seiri<\/td><td>Sort<\/td><\/tr><tr><td>Seiton<\/td><td>Set in order<\/td><\/tr><tr><td><b>Seiso<\/b><\/td><td><b>Shine<\/b> (clean)<\/td><\/tr><tr><td>Seiketsu<\/td><td>Standardise<\/td><\/tr><tr><td>Shitsuke<\/td><td>Sustain<\/td><\/tr><\/table><h4>5. Benchmarking<\/h4><p>Systematic process of measuring, comparing and improving performance and quality against best practice; a strategic management tool for logistics.<\/p>"]],"gl":[["E-logistics","Management of physical flows of an organisation selling online.",""],["Fevad 35%","Customers who had a bad delivery experience will not reorder.",""],["WMS","Warehouse Management System: inventory, picking, fulfilment.",""],["GTM","Global Trade Management: customs, tariffs, trade compliance.",""],["EDI","Electronic exchange of business documents between trading partners.",""],["Blockchain","Immutable decentralised records: transparency, security, traceability.",""],["Same-day delivery","Amazon urban warehouses; Walmart USD 10 flat with UPS; eBay local couriers.",""],["International logistics","Moving goods across borders; goals: cost efficiency and reliability.",""],["Incoterms","Standard terms for buyer and seller rights and responsibilities.",""],["Cross-border transaction","Payer and recipient in different countries; USD 250 tn by 2027.",""],["ACH settlement","Clearing step taking 2 to 5 business days.",""],["Exchange rate risk","Currency fluctuation, unique to cross-border.",""],["Exporter / importer","Seller to a foreign country / buyer from abroad.",""],["Exporting","Selling goods made at home to foreign customers; direct or indirect.",""],["Licensing","IP rights granted for royalties; trademark, patent, copyright, franchising.",""],["Equity JV","Partners form a new legal entity sharing profit, risk, control.",""],["Contractual JV","Collaboration by contract without a new entity.",""],["Wholly owned subsidiary","100% ownership and control abroad.",""],["Acquisition","Buying an existing foreign business (Tata Steel and Corus).",""],["Importing","Bringing foreign goods in for use, resale or distribution.",""],["Countertrade","Goods or services swapped for goods or services (IOC, OVL).",""],["KPI","Key Performance Indicator for logistics operations.",""],["OTD","On-time delivery = on-time units / total units x 100.",""],["Stock rotation","Inventory turnover = sales / average inventory.",""],["Dock-to-stock","Hours from receipt to put-away per shipment.",""],["Quality vs non-quality cost","Cost of obtaining quality vs losses from lack of quality.",""],["PDCA","Plan, Do, Check, Act; Deming cycle (Shewhart origin).",""],["Pareto diagram","80-20 rule.",""],["Fishbone diagram","Ishikawa root-cause diagram.",""],["Control chart","Shewhart chart with +/-3 SD limits.",""],["7 QC tools","Flowchart, check sheet, histogram, Pareto, fishbone, scatter, control chart (Ishikawa, 1976).",""],["Quality circle","Voluntary workplace group improving quality; Ishikawa.",""],["5S","Seiri, Seiton, Seiso, Seiketsu, Shitsuke.",""],["Benchmarking","Comparing performance with best practice to improve.",""]],"q":[["o","Which e-logistics key element allows the electronic exchange of business documents like purchase orders and invoices between trading partners?",["Warehouse Management System (WMS)","Transportation Management System (TMS)","Electronic Data Interchange (EDI)","Global Trade Management (GTM)"],2,"EDI exchanges documents electronically between partners."],["o","Which technology enhances transparency, security and traceability in supply chain transactions through decentralized record-keeping?",["Blockchain technology","GPS tracking","RFID","Cloud computing"],0,"Blockchain gives immutable, decentralised records."],["o","Incoterms are standardized terms that define:",["Packaging standards for global shipments","The rights and responsibilities of buyers and sellers in international transactions","Customs duty rates across countries","Insurance premiums for international cargo"],1,"They allocate rights and responsibilities between buyer and seller."],["o","Which market penetration strategy involves selling goods produced in one country directly to customers in another country?",["Licensing","Joint Venture","Exporting","Countertrade"],2,"That is the definition of exporting."],["o","Tata Steel's acquisition of Corus Group is an example of which strategy?",["Exporting","Licensing","Joint Venture","Acquisition"],3,"Acquisition falls under the Ownership strategy."],["o","According to the 7 QC Tools, the Pareto Diagram is based on which principle?",["70-30 rule","80-20 rule","60-40 rule","90-10 rule"],1,"About 80% of effects arise from 20% of causes."],["o","The PDCA cycle was made popular by which consultant, though attributed to Walter Shewhart?",["Joseph Juran","Philip Crosby","William Edwards Deming","Kaoru Ishikawa"],2,"It is known as the Deming cycle."],["o","On-Time Delivery (OTD) is a KPI that belongs to which category?",["Transportation Management","Supply Management","Distribution Management","Warehousing and Order Management"],2,"The lecture lists OTD under Distribution Management."],["o","In the 5S philosophy, 'SEISO' corresponds to which action?",["Sort","Set in Order","Standardize","Shine"],3,"Seiso means shine."],["o","Which is a challenge unique to cross-border transactions compared to domestic ones?",["Use of barcodes","Currency exchange rate fluctuations","Use of warehousing","Product packaging"],1,"Domestic trade has one currency."],["x","Cross-border payments can cost up to how many times a domestic transaction?",["2 times","5 times","10 times","50 times"],2,"The lecture states up to ten times more."],["x","Settlement of a cross-border transaction through the ACH typically takes:",["Seconds","Same day","2 to 5 business days","About 3 months"],2,"Clearing and reconciliation take two to five business days."],["x","Which licensing type is a specialised form where the franchisee operates under the franchisor's brand and model?",["Patent licensing","Copyright licensing","Franchising","Equity JV"],2,"Franchising grants rights to a brand, model and procedures for fees and royalties."],["x","An equity joint venture differs from a contractual one because it:",["Has no partners","Creates a new legal entity in which partners hold ownership stakes","Involves only exports","Has no profit sharing"],1,"A contractual JV has no separate entity."],["x","Indian Oil Corporation's arrangements with oil-producing countries are an example of:",["Exporting","Countertrade","Franchising","Wholly owned subsidiary"],1,"Goods or services are exchanged for oil."],["x","In the Walmart same-day pilot, the delivery fee was:",["Free","Flat USD 10 with no minimum order","USD 50 minimum order","Per kilometre"],1,"Walmart partnered with UPS with a flat USD 10 fee."],["x","A company delivered 15 of 18 products on time. Its OTD is about:",["15%","75%","83%","95%"],2,"15 / 18 x 100 = 83%."],["x","Control limits on a Shewhart control chart are set at:",["+/-1 standard deviation","+/-2 standard deviations","+/-3 standard deviations","+/-6 standard deviations"],2,"Points outside indicate special-cause variation."],["x","In PDCA, standardising and documenting a successful change happens in the:",["Plan phase","Do phase","Check phase","Act phase"],3,"Act (adjust) documents, standardises and monitors the change."],["x","Who introduced the 7 QC tools in 'Guide to Quality Control' (1976) and is the father of quality circles?",["Walter Shewhart","Deming","Kaoru Ishikawa","Juran"],2,"Dr. Kaoru Ishikawa."],["x","Which 5S term means 'Set in order'?",["Seiri","Seiton","Seiketsu","Shitsuke"],1,"Seiri sort, Seiton set in order, Seiso shine, Seiketsu standardise, Shitsuke sustain."],["x","Which QC tool shows the relationship between two variables?",["Scatter diagram","Check sheet","Flowchart","Histogram"],0,"A scatter diagram checks whether a relationship exists between two variables."],["x","In the Noatum Logistics case, how were syringes delivered from China to Peru?",["By rail","Monthly charter flights","By sea only","By road"],1,"Charter flights were the only viable route within the timeline."]],"imp":[["E-logistics elements","EDI (document exchange), WMS, TMS, GTM, blockchain (transparency, security, traceability), GPS, RFID, cloud."],["E-logistics numbers","35% of customers with a bad delivery will not reorder (Fevad); 43% of French online buyers abandoned a purchase due to shipping cost."],["Incoterms","Standard terms for buyer and seller rights and responsibilities in international trade."],["Market penetration strategies","Exporting, licensing, joint venture, ownership (wholly owned, acquisition: Tata Steel and Corus), importing, countertrade."],["Cross-border challenges","Exchange rate fluctuation (unique), up to 10x cost, ACH settlement 2-5 days, fees, compliance, fragmented data."],["Cross-border facts","7 steps from initiation to tracking; volume forecast above USD 250 trillion by 2027."],["KPIs by category","Transportation, supply, distribution (OTD), warehousing and order management; OTD = on-time units / total x 100."],["PDCA","Plan, Do, Check, Act; Shewhart origin, popularised by Deming."],["Seven QC tools","Flowchart, check sheet, histogram, Pareto (80-20), fishbone (Ishikawa), scatter, control chart (+/-3 SD); Ishikawa 1976."],["5S","Seiri sort, Seiton set in order, Seiso shine, Seiketsu standardise, Shitsuke sustain."],["Quality circles and benchmarking","Voluntary improvement groups (Ishikawa); benchmarking against best practice."],["Noatum case","Charter flights moved syringes from China to Peru for the Covid-19 campaign."]]},"3":{"notes":[["Lecture 12 - Reverse Logistics (1): concept, importance","<div class=\"tip\"><b>Analogy:<\/b> Like returning an empty gas cylinder to the supplier: the flow runs backwards from customer to seller.<\/div><h4 data-t=\"M\">What it is<\/h4><p>Traditional logistics with the flow in the opposite direction; the movement concerns waste and returns. Defined as taking waste and returns along the supply chain and reworking them (or parts of them) to create a new product that can be sold (Stanislawski & Szymonik, <mark>2023<\/mark>).<\/p><h4 data-t=\"L\">Other names<\/h4><p>Retro logistics, reverse supply chain, reverse logistics flow, reverse flow, backward supply chain, returns management, aftermarket logistics, aftermarket supply chain.<\/p><h4 data-t=\"L\">Lambert & Stock<\/h4><p>Reverse distribution is 'going the wrong way on a one way street' because the great majority of product shipments flow in one direction.<\/p><h4 data-t=\"L\">Carter & Ellram<\/h4><p>The return, upstream movement of a good or material from reuse, recycling or disposal; linked to environmental, quality and wear-dating issues; often performed by new, auxiliary channel members.<\/p><h4 data-t=\"L\">Thierry et al.<\/h4><p>Places reverse logistics under the umbrella of product recovery management.<\/p><h4 data-t=\"M\">Rogers & Tibben-Lembke<\/h4><p>Adapting the Council of Logistics Management definition: planning, implementing and controlling the efficient, cost-effective flow of raw materials, in-process inventory, finished goods and related information from the point of consumption to the point of origin, for recapturing value or proper disposal.<\/p><h4 data-t=\"L\">Reverse vs forward<\/h4><p>Forward flow = raw materials and components needed for production. Reverse flow = everything coming from the consumer that is waste or a return.<\/p><h4 data-t=\"M\">Reverse vs green logistics<\/h4><p>Identifying them as the same is a mistake. Green logistics relates to environmentally friendly resources and their transformation in ways that are favourable to people and not harmful to the environment.<\/p><h4 data-t=\"M\">Types of returns<\/h4><p>Return of unused products; commercial returns; returns of products under warranty; wastes and products from network activities (supply chain and reverse logistics); packaging.<\/p><h4 data-t=\"L\">Why important: legislation<\/h4><p>Several countries, especially in Europe, force manufacturers to take back products after use. Netherlands (from January <mark>1999<\/mark>): manufacturers and importers of white and brown goods must take back and recover products; similar rule for cars. Germany: Packaging Ordinance requires companies to collect all sales packaging.<\/p><h4 data-t=\"M\">Why important: economics<\/h4><p>Landfill space is depleting and landfill cost rose sharply: US national average tipping fee went from <mark>$8<\/mark> to about <mark>$49.78<\/mark> between <mark>1985<\/mark> and <mark>2010<\/mark> (about <mark>600%<\/mark>). Recovery systems became more profitable for automobile parts, copiers, computers, tyres and aviation equipment. Reverse logistics is now a strategic part of business planning.<\/p><h4 data-t=\"L\">Why important: environment<\/h4><p>Reduces costs while ensuring sustainability, helps adhere to environmental legislation, and lets a company project itself as 'green' (an increasingly important marketing element).<\/p><h4 data-t=\"L\">Why important: services shift<\/h4><p>Consumers increasingly buy a set of services with products (e.g. maintenance contracts covering repairs and parts), which facilitates take-back of end-of-life products.<\/p><h4 data-t=\"L\">E-waste example<\/h4><p>E-waste is among the fastest-growing waste types; <mark>80%<\/mark> of mobile phones are upgraded every two years. Sources: households, industries, institutions (schools, hospitals, government). Collection via municipal points, electronic industries, retailers, informal and formal recycling. Informal recycling is common in developing countries such as India and South Africa, where methods are rudimentary and much e-waste ends in uncontrolled landfills.<\/p>"],["Lecture 13 - Reverse Logistics (2): aspects, process, success factors, measures, cases","<div class=\"tip\"><b>Analogy:<\/b> Like a repair-and-recycle depot: every returned item is checked at the door, sorted, then fixed, resold, recycled or, as a last resort, dumped.<\/div><h4 data-t=\"L\">Key aspect: product returns<\/h4><p>Returns due to defects, damage, overstock or dissatisfaction: receiving, inspecting, refurbishing, repackaging.<\/p><h4 data-t=\"L\">Key aspect: remanufacturing and refurbishment<\/h4><p>Restore returned or used products to functional or marketable condition: disassembly, repair, cleaning, reassembly.<\/p><h4 data-t=\"L\">Key aspect: recycling and disposal<\/h4><p>Recycling packaging, extracting valuable materials from end-of-life products, disposing hazardous waste responsibly.<\/p><h4 data-t=\"L\">Key aspect: warranty and service management<\/h4><p>Handling warranty claims, service requests and repairs with service providers, suppliers and customers.<\/p><h4 data-t=\"L\">Key aspect: asset recovery and remarketing<\/h4><p>Recover value through resale, remarketing, redistribution: selling refurbished products, liquidating excess inventory, repurposing assets.<\/p><h4 data-t=\"L\">Key aspect: supply chain optimization<\/h4><p>Use reverse processes to improve efficiency, cut cost, improve sustainability: reverse logistics software, route optimization, integration with forward logistics.<\/p><h4 data-t=\"M\">Process (Ait-Kadi et al., 2013)<\/h4><p>Gatekeeping, collection, sorting, processing (treatment), disposal.<\/p><h4 data-t=\"L\">Gatekeeping<\/h4><p>Controls product entrance into the reverse system; blocks returns that do not belong to the business or where there is no contract or legal obligation. Usually ends in acceptance or rejection.<\/p><h4 data-t=\"L\">Collection<\/h4><p>Recovery and transport of returned products; can be handled by customers, third parties or the business. Canon: in <mark>1990<\/mark> launched an ink cartridge collection programme with a pre-paid shipping coupon in new cartridge packaging; now collection in <mark>24<\/mark> countries via retailers, a logistics service provider or direct shipping.<\/p><h4 data-t=\"L\">Sorting<\/h4><p>Validates the information from gatekeeping; products sorted by condition and reason for return.<\/p><h4 data-t=\"L\">Processing and treatment<\/h4><p>Three sub-steps: choose from the processing activities the business offers (limited by stock levels and sale possibility, and by product nature, age, condition), then process. Options: repackaging, repair, disassembling, reconfiguring, remanufacturing, updating or upgrading, recycling, donating, selling on secondary markets, incinerating, disposing.<\/p><h4 data-t=\"M\">Remanufacturing vs repair<\/h4><p>Remanufacturing reworks modules, components or whole products to a state equivalent to new; unlike repair, it systematically replaces a larger number of used or defective modules or components.<\/p><h4 data-t=\"L\">Disposal<\/h4><p>Landfill or incinerator, used as a last resort. Ensure no hazardous materials in the waste (or treat them to comply with laws and policy); incinerators should at least recover heat energy (vapour turned into electricity).<\/p><h4 data-t=\"H\">Success factors (10)<\/h4><p>Visibility and transparency; efficient returns management; product recovery and disposition; collaboration with partners; network design; technology and data analytics; compliance and regulation; customer experience and satisfaction; continuous improvement and innovation; sustainability and corporate responsibility.<\/p><h4 data-t=\"L\">Visibility and transparency<\/h4><p>Track returned products, their condition and movement; reveals bottlenecks and delays.<\/p><h4 data-t=\"L\">Efficient returns management<\/h4><p>Clear return policies, convenient return options, streamlined processing to minimise delays and errors.<\/p><h4 data-t=\"L\">Network design<\/h4><p>Strategically locate return centres, refurbishment facilities, recycling centres and disposal sites to cut transport cost, lead time and improve resource use.<\/p><h4 data-t=\"H\">Technology and data analytics<\/h4><p>Tracking and tracing systems, automated sorting and processing, predictive analytics: real-time visibility, faster decisions, proactive problem-solving.<\/p><h4 data-t=\"M\">Performance measures<\/h4><p>Return rate (% of units sold that are returned); return processing time; recovery rate (% of returns refurbished, repaired, resold or recycled); regulatory compliance; disposition cost; transportation cost; inventory holding cost; customer education and communication; customer satisfaction; environmental impact (carbon, energy, water, waste); continuous improvement; supplier collaboration; training and skills; technology adoption (RFID, IoT sensors, AI); risk management and contingency planning; reverse supply chain integration; circular economy initiatives; metrics alignment; stakeholder engagement.<\/p><h4 data-t=\"M\">Case: Amazon<\/h4><p>No-fuss returns and training programmes. National Retail Federation: record <mark>$761 billion<\/mark> of merchandise returned in <mark>2021<\/mark>; <mark>16.6%<\/mark> of holiday-season merchandise returned (up over <mark>56%<\/mark> on the year before); online return rate nearly <mark>21%<\/mark> (<mark>18%<\/mark> in <mark>2020<\/mark>). Free, fast returns attract customers but raise volume and cost. Product donation: software identifies and sorts items fit for donation at fulfilment centres. Samsung <mark>49<\/mark>-inch TV in SIPP packaging: eliminates nine packaging components, package volume down <mark>69%<\/mark>, air shipped down <mark>87%<\/mark>.<\/p><h4 data-t=\"L\">Case: IKEA<\/h4><p>Generous return policy; refurbishment centres (inspect, repair, clean, new finishes); material recovery facilities (separate wood, metal, plastics for recycling); circular design (durability, repairability, recyclability). Goal: carbon neutral by <mark>2030<\/mark>.<\/p><h4 data-t=\"M\">House of Reverse Logistics (Wang & Sun, 2005)<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>Slide 'Reverse logistics: an overview'. Goal: minimise cost and maximise profit. Five pillars: RL input, RL process, RL structure, RL output, RL system, resting on reasons (legislation, social responsibility, corporate imaging, environmental concern, economic benefit, customer awareness). Each pillar has a box of factors (see the rebuilt diagram below).<\/p><h4 data-t=\"M\">Process diagram<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>The generic process (Ait-Kadi et al., <mark>2013<\/mark>): returned goods pass through gatekeeping, collection, sorting, treatment and disposal system, with an integrated information system and reverse logistics coordination across all stages.<\/p><h4 data-t=\"M\">Flow and rebuilt diagrams<\/h4><div class=\"viz\"><h5>House of Reverse Logistics (Wang &amp; Sun, 2005) <span class=\"wb sl\">SLIDE IMAGE<\/span><\/h5><div class=\"mid\"><b>REVERSE LOGISTICS<\/b><br>GOAL: minimise cost and maximise profit<\/div><table class=\"tb\"><tr><th>Pillar<\/th><th>Factors shown on the slide<\/th><\/tr><tr><td>RL input<\/td><td>Raw material, recycled material, used parts/new parts, supplier, forecasting, inventory system, and how to collect product/parts<\/td><\/tr><tr><td>RL process<\/td><td>Disassembly process, coordination, supply chain, inventory systems, repair and after-sales service, remanufacturing, recycle, refurbishing, reuse, production planning<\/td><\/tr><tr><td>RL structure<\/td><td>Location-allocation, inspection and consolidation, integrating manufacturing and remanufacturing, product modularity<\/td><\/tr><tr><td>RL output<\/td><td>Pricing after the remanufacturing process and competition, customer relation<\/td><\/tr><tr><td>RL system<\/td><td>Customer behaviour/habits, government policy, facility and ability of company, innovation, strategic planning, SWOT, stakeholder theory, organisational slack<\/td><\/tr><\/table><div class=\"mid\" style=\"margin-top:8px\">REASON (foundation): legislation, social responsibility, corporate imaging, environmental concern, economic benefit, customer awareness<\/div><p class=\"cap\">Pillar-to-box matching follows the arrows on the slide.<\/p><\/div><div class=\"viz\"><h5>Generic process of reverse logistics (A&iuml;t-Kadi et al., 2013) <span class=\"wb sl\">SLIDE IMAGE<\/span><\/h5><div class=\"flow\"><span>Returned goods<\/span><i>&rarr;<\/i><span>Gatekeeping<\/span><i>&rarr;<\/i><span>Collection<\/span><i>&rarr;<\/i><span>Sorting<\/span><i>&rarr;<\/i><span>Treatment<\/span><i>&rarr;<\/i><span>Disposal system<\/span><\/div><div class=\"g2\" style=\"margin-top:8px\"><div><b>Integrated information system<\/b>Connected to every stage (dashed links on the slide).<\/div><div><b>Reverse logistics coordination<\/b>Spans the whole process, from returned goods to disposal.<\/div><\/div><\/div>"],["Lecture 14 - Green Logistics","<div class=\"tip\"><b>Analogy:<\/b> Like a kitchen that sorts waste and buys local: green SCM is the whole kitchen; green logistics is only the delivery bike.<\/div><h4 data-t=\"H\">GSCM<\/h4><p>The component reflecting the relationship between the natural environment and supply chain operations; includes external and internal factors that influence logistics management, and measures supply chain performance on environmental aspects.<\/p><h4 data-t=\"M\">GSCM practices<\/h4><p>Green transportation (freight CO2 emissions rising since the 1990s; <mark>71%<\/mark> in <mark>2016<\/mark> and expected to rise <mark>50%<\/mark> more by <mark>2050<\/mark>); green procurement and logistics (buying products and services less harmful to environment at competitive prices); green warehouse (adequate stock to avoid waste, lower transport cost); green design; green manufacturing (little to no pollution or waste); green marketing.<\/p><h4 data-t=\"M\">Green logistics<\/h4><p>Eco-friendly logistics: managing flow of goods and resources to minimise environmental impact; reduces carbon emissions, energy use, waste across transport, warehousing, distribution. Examples: alternative fuels, route optimization, energy-efficient vehicles, less packaging waste, reverse logistics, eco-friendly packaging. Before the 1960s there was little concern; the environment was seen as able to absorb waste and replace resources without limit (Murphy & Poist, <mark>1995<\/mark>).<\/p><h4 data-t=\"M\">GSCM vs green logistics<\/h4><p>Scope: entire process from raw material extraction to delivery vs transportation and distribution only. Activities: sustainable sourcing, efficient manufacturing, recycling, eco packaging vs route optimization, low-emission vehicles, efficient WMS, sustainable packaging. Objective: minimise environmental impact of whole chain while keeping efficiency and profit vs make logistics more environmentally friendly by cutting GHG, energy and resource use.<\/p><h4 data-t=\"L\">Challenges<\/h4><p>Rising raw material prices; COVID-<mark>19<\/mark> disruption (sourcing difficulty, higher prices); need to change management ideas and existing models toward 'energy conservation, environmental protection and low consumption'.<\/p><h4 data-t=\"L\">Key technologies<\/h4><p>Green transport technologies (cut GHG, air pollution, noise, space use); green vehicle routing considering CO2-equivalent emissions; logistics solutions for carbon neutrality (green procurement, packaging, warehousing; tackling the last-mile challenge); horizontal collaboration (pooling logistics activities and consolidating supply chains of two or more manufacturers); logistics agglomeration in clusters; decarbonization = measure emissions, set reduction targets, assess carbon-reducing options; road freight is a major contributor so alternative fuels matter.<\/p><h4 data-t=\"L\">KPI: reverse chain performance<\/h4><p>% of returns refurbished or recycled, processing time, cost per unit of managing returns.<\/p><h4 data-t=\"L\">KPI: circular economy transition<\/h4><p>% raw materials from recycled or renewable sources; % reduction in waste; ROI of circular initiatives.<\/p><h4 data-t=\"L\">KPI: environmental and financial<\/h4><p>Correlation between environmental indicators (carbon footprint, energy) and financial indicators (profit margin, ROI); cost-benefit analysis; fuel efficiency (fuel per distance or per weight); route optimization effectiveness.<\/p><h4 data-t=\"L\">KPI: sustainability and waste<\/h4><p>% reduction in waste per unit output; recycling rate; energy efficiency ratio.<\/p><h4 data-t=\"M\">KPI: TOVE<\/h4><p>Transportation Overall Vehicle Effectiveness. Vehicle utilization rate = actual payload weight / maximum payload capacity.<\/p><h4 data-t=\"M\">Standards and frameworks<\/h4><p>EN <mark>16258<\/mark> and ISO <mark>14083<\/mark> (measure and report GHG and energy in transport); GLEC Framework (Global Logistics Emissions Council: calculate direct and indirect emissions); harmonization of emissions calculations for consistency and benchmarking.<\/p><h4 data-t=\"M\">Carbon footprint formulas<\/h4><p>Footprint = emissions from transport + warehousing + other logistics. Emissions = activity level x emission factor. Electricity: kWh/yr x 0.<mark>85<\/mark> = kg CO2. Petrol: litres/yr x 2.<mark>296<\/mark> = kg CO2. Diesel: litres/yr x 2.<mark>653<\/mark> = kg CO2.<\/p><h4 data-t=\"L\">Case: DHL<\/h4><p>Founded <mark>1969<\/mark> by Adrian Dalsey, Larry Hillblom and Robert Lynn; operates in <mark>220<\/mark> countries; CSR and sustainability focus since <mark>2009<\/mark>; GoGreen programme. Aimed to reduce carbon emission to <mark>50%<\/mark>, resulting in pollution emission reduced to <mark>70%<\/mark> (as stated on the slide); clean pickup and delivery using electrified vehicles and bicycles; training for suppliers and employees.<\/p><h4 data-t=\"H\">Case: Myntra (green packaging)<\/h4><p>Plastic-free packaging also adopted by seller partners. Replaced poly pouches with recycled paper bags, bubble wrap with carton waste shredded material, plastic tape with paper tape, invoice polybags with recycled Kraft paper pouch, and used RFID-tagged multi-use polyester bags. Diverted <mark>670<\/mark> tonnes of plastic (as of September <mark>2021<\/mark>). 'E-commerce-ready packaging' removes the secondary packaging layer. Partnered with Canopy (no deforestation) and Better Cotton Initiative; two fulfilment centres solar powered.<\/p><h4 data-t=\"L\">Case: IKEA (green transport)<\/h4><p>Travel plans for staff (bicycle, walking, bus, car-sharing); loading shelves instead of wooden pallets cut space and cost. <mark>2019<\/mark> report: transport emissions <mark>19.4%<\/mark>. Goals: cut GHG from transport by <mark>30%<\/mark> in <mark>2020<\/mark> and reach <mark>70%<\/mark> reduction by <mark>2030<\/mark>.<\/p><h4 data-t=\"L\">Future prospects<\/h4><p>Battery electric vehicles (BEV) best for short city routes; fuel cell vehicles (FCV) for longer routes, huge trucks, buses; both emit no GHG or air pollutants. Data envelopment analysis (DEA) evaluates efficiency of green practices. Supplier selection matters: green purchasing ability, green competencies, environmental management, investments, regulatory compliance.<\/p>"],["Lecture 15 - Lean Logistics (1): definition, 3Ms, principles, KPIs","<div class=\"tip\"><b>Analogy:<\/b> Like packing a trekking backpack: carry only what adds value; every extra kilo is waste.<\/div><h4 data-t=\"H\">Lean logistics<\/h4><p>Approach to supply chain management focused on eliminating waste, improving efficiency, streamlining processes, creating constant flow, enhancing collaboration and achieving quality, while cutting costs and maintaining or improving service (Paul Myerson, <mark>2012<\/mark>). Also: recognising and eliminating wasteful activities to increase product flow and speed (Alan Harrison, <mark>2011<\/mark>).<\/p><h4 data-t=\"M\">Benefits<\/h4><p>Improved efficiency, reduced costs, improved customer service, increased profitability; more agile, responsive supply chain.<\/p><h4 data-t=\"H\">History<\/h4><p>Rooted in lean manufacturing from Japan. Term coined by John Krafcik in his <mark>1988<\/mark> master's thesis at MIT. Lean manufacturing pioneered by Toyota engineer Taiichi Ohno in the 1970s. Logistics cost is 5-<mark>15%<\/mark> of turnover in industry and <mark>15<\/mark>-<mark>25%<\/mark> in retail.<\/p><h4 data-t=\"H\">Muda = waste<\/h4><p>Any activity or process that does not add value. Seven types (categorized by Taiichi Ohno in the Toyota Production System): Transport (movement between operations and locations); Inventory (WIP, finished goods, raw material stock); Motion (movement of a person or machine during an operation); Waiting (for a machine, product to arrive, etc.); Overproduction (beyond what the customer ordered); Over-processing (operations beyond what the customer requires); Defects (rejects and rework).<\/p><h4 data-t=\"M\">Other wastes<\/h4><p>Talent (unused skills and knowledge); resources (lights and idle machines left on); by-products (not used). Tools to remove waste: Poka-yoke, Kanban, Takt time, SMED, one-piece flow.<\/p><h4 data-t=\"L\">Waste sources in logistics<\/h4><p>Inventory (keep minimum), warehousing (an extra stop that adds cost and risk), trucks (each loading is motion), travel (time on the road; combine shipments), people (reallocate to productive tasks), e-vehicles (support waste reduction and sustainability).<\/p><h4 data-t=\"H\">Muri = overburden<\/h4><p>Unnecessary stress on employees and processes; causes breakdowns of machines and absenteeism of employees. Caused by Mura and failures such as lack of training, unclear ways of working, wrong tools, poor performance measures. Examples: untrained work, poor layouts, unclear instructions, lack of tools, fluctuating demand, poor maintenance, unreliable processes, poor communication.<\/p><h4 data-t=\"M\">Mura = unevenness<\/h4><p>Waste of unevenness or inconsistency; Mura drives Muda. Example: manager measured on monthly output, department rushes in the last week, over-uses components, then the first week is slow, giving a 'hockey stick' production graph. Better to smooth production to customer demand.<\/p><h4 data-t=\"M\">Principles (5)<\/h4><p>Eliminating waste; improving efficiency (cycle times, throughput, right materials at right time); streamlining processes (remove redundant steps, improve visibility, automate); creating constant flow (inventory levels, lead times, information flow); enhancing collaboration (suppliers, manufacturers, customers); achieving quality (accuracy, consistency, reliability, quality standards).<\/p><h4 data-t=\"L\">KPIs<\/h4><p>On-time delivery; lead time; inventory turnover; order accuracy; transportation cost per unit; warehouse utilization; cycle time; dock-to-stock time (from receipt at dock to stored on racks); return rate; order fulfilment cycle time; perfect order rate; backorder rate; supplier on-time delivery; order lead time variability; shipment damage rate; sustainability metrics; employee engagement and training metrics.<\/p><h4 data-t=\"M\">Muda, Muri, Mura picture<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>The slide shows three cartoon workers with buckets labelled MUDA, MURI, MURA (Japanese forms shown). It also shows 7 Wastes of Lean icons: inventory, waiting, defects, overproduction, motion, transportation, over-processing.<\/p><h4 data-t=\"L\">Capacity vs load vs demand<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>A house-shaped diagram: the capacity of the system is greater than the load on the system, and customer demand is lower still; the unused capacity is labelled Muda.<\/p><h4 data-t=\"M\">Flow and rebuilt diagrams<\/h4><div class=\"viz\"><h5>MUDA, MURI, MURA <span class=\"wb sl\">SLIDE IMAGE<\/span><\/h5><div class=\"g3\"><div><b>MUDA (waste)<\/b>The slide's bucket pictures show water spilling away: effort and material lost. Japanese: muda.<\/div><div><b>MURI (overburden)<\/b>A worker strained by carrying too much: stress on people and machines.<\/div><div><b>MURA (unevenness)<\/b>Uneven loads: work arriving in uneven, inconsistent amounts. Japanese also written as mura.<\/div><\/div><p class=\"cap\">Slide shows three cartoon workers with buckets; descriptions summarise what each drawing is meant to convey.<\/p><\/div><div class=\"viz\"><h5>Capacity vs load vs customer demand <span class=\"wb sl\">SLIDE IMAGE<\/span><\/h5><svg viewBox=\"0 0 420 200\"><rect x=\"40\" y=\"20\" width=\"90\" height=\"160\" fill=\"none\" stroke=\"#888\"/><rect x=\"40\" y=\"20\" width=\"90\" height=\"45\" fill=\"#2a1d05\" stroke=\"#f59e0b\"/><text x=\"46\" y=\"48\" style=\"fill:#f59e0b\">Muda (spare capacity)<\/text><rect x=\"40\" y=\"65\" width=\"90\" height=\"115\" fill=\"#111\" stroke=\"#888\"/><text x=\"48\" y=\"125\">Load on system<\/text><rect x=\"40\" y=\"105\" width=\"90\" height=\"75\" fill=\"#1c1c1c\" stroke=\"#ececec\" stroke-dasharray=\"4 3\"/><text x=\"48\" y=\"150\">Customer demand<\/text><text x=\"150\" y=\"40\">Capacity of the system (tall frame)<\/text><text x=\"150\" y=\"100\">'Capacity on system is greater than the load'<\/text><text x=\"150\" y=\"170\">Waste = capacity that demand does not use<\/text><\/svg><\/div>"],["Lecture 16 - Lean Logistics (2): methodologies and Value Stream Mapping","<div class=\"tip\"><b>Analogy:<\/b> Like a fitness plan: first map where you are (VSM), then fix what is wasteful.<\/div><h4 data-t=\"L\">Methodologies<\/h4><p>Value stream mapping; JIT inventory management; standardized work procedures; continuous improvement culture (Kaizen events, suggestion systems); supplier collaboration; Lean Six Sigma (DMAIC, root cause analysis); technology integration (WMS, TMS, inventory optimization); sustainable packaging; route optimization; performance-based contracts; demand forecasting and planning; modular transportation (intermodal, containerization); reverse logistics optimization; performance measurement and monitoring.<\/p><h4 data-t=\"H\">Value Stream Mapping (VSM)<\/h4><p>Identifies waste, inefficiencies and bottlenecks and develops strategies to remove them. Maps the whole value stream from customer request to delivery. Defines value from the customer's perspective. A visual representation of every step including material flows, information flows and process times. Quote by W. Edwards Deming: 'If you can't describe what you are doing as a process, you don't know what you're doing.'<\/p><h4 data-t=\"L\">VSM step 1: Prepare<\/h4><p>Document the case for change, define scope (start and end of process), identify requirements, review measurements; set logistics for the event (participants, location, materials).<\/p><h4 data-t=\"L\">VSM step 2: Gather data (current state)<\/h4><p>Walk the value stream, follow item and information flow; collect per step: trigger/done, actual lead time, actual cycle time, on-time delivery, defect rate, batch sizes, quality, variations, output, staffing, overtime, work in process. Map flow of items and information; add data and issues.<\/p><h4 data-t=\"L\">VSM step 3: Future state and action plans<\/h4><p>Discuss ideal state, develop future state map, action plans and cadence tracking, draft timeline, communication and training.<\/p><h4 data-t=\"L\">VSM step 4: Execute to plan<\/h4><p>Implement improvements through workshops, events, projects; achieve value stream objectives; create continuous improvement environment.<\/p><h4 data-t=\"L\">VSM step 5: Align<\/h4><p>Periodic alignment meeting: review results and impact on metrics, next quarter events, business changes; update plans; address resistance and sustainment.<\/p><h4 data-t=\"M\">Worked example (stapling)<\/h4><p>Steps: pick up paper (1 s), walk to stapler (5 s, <mark>20<\/mark> ft), staple paper (2 s), walk to desk (5 s, <mark>20<\/mark> ft), put down paper (1 s). Total time <mark>14<\/mark> s, total distance <mark>40<\/mark> ft, value-added time 4 s, value-added distance 0, so value-added time = <mark>28%<\/mark> (the two walks are excess travel). Customer need: stapled pages. Source: Dickson Chiu (<mark>2006<\/mark>).<\/p><h4 data-t=\"L\">VSM approach picture<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>Slide: 'Analyzing the value stream' is a planning tool to optimise results of eliminating waste: current-state VSM + lean basics = future-state VSM. The five process steps are prepare, gather data and develop current state, develop future state and action plan, execute to plan, align.<\/p><h4 data-t=\"M\">Flow and rebuilt diagrams<\/h4><div class=\"flow\"><span>Prepare<\/span><i>&rarr;<\/i><span>Gather data<\/span><i>&rarr;<\/i><span>Future state<\/span><i>&rarr;<\/i><span>Execute<\/span><i>&rarr;<\/i><span>Align<\/span><\/div><div class=\"viz\"><h5>VSM approach <span class=\"wb sl\">SLIDE IMAGE<\/span><\/h5><div class=\"flow\"><span>Current-state VSM<\/span><i>&rarr;<\/i><span>+ Lean basics<\/span><i>&rarr;<\/i><span>= Future-state VSM<\/span><\/div><div style=\"height:6px\"><\/div><div class=\"flow\"><span>1 Prepare<\/span><i>&rarr;<\/i><span>2 Gather data and develop current state<\/span><i>&rarr;<\/i><span>3 Develop future state and action plan<\/span><i>&rarr;<\/i><span>4 Execute to plan<\/span><i>&rarr;<\/i><span>5 Align<\/span><\/div><p class=\"cap\">The slide calls VSM a planning tool to optimise the results of eliminating waste.<\/p><\/div>"],["Lecture 17 - Lean Logistics (3): DMAIC, JIT, 5S, Kaizen, SMED, challenges, Toyota case","<div class=\"tip\"><b>Analogy:<\/b> Like running a restaurant kitchen: define the dish, measure the waste, fix it, then keep it that way.<\/div><h4 data-t=\"H\">DMAIC<\/h4><p>Define: agree scope, goals and financial targets
