" stroke-width=\"1.6\"/><text x=\"617.5\" y=\"181\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Customer<\/text><rect x=\"137.5\" y=\"224\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"202.5\" y=\"243\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Manufacturer<\/text><rect x=\"345\" y=\"224\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"410\" y=\"243\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Distributor (local)<\/text><rect x=\"552.5\" y=\"224\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"617.5\" y=\"243\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Customer<\/text><rect x=\"137.5\" y=\"286\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"202.5\" y=\"305\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Manufacturer<\/text><rect x=\"345\" y=\"286\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"410\" y=\"305\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Pickup site<\/text><rect x=\"552.5\" y=\"286\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"617.5\" y=\"305\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Customer collects<\/text><rect x=\"96\" y=\"348\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"161\" y=\"367\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Manufacturer<\/text><rect x=\"262\" y=\"348\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"327\" y=\"367\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Distributor<\/text><rect x=\"428\" y=\"348\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"493\" y=\"367\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Retail store<\/text><rect x=\"594\" y=\"348\" width=\"130\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"659\" y=\"367\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Customer walks in<\/text><text x=\"10\" y=\"30\" fill=\"#f59e0b\" font-size=\"11\" text-anchor=\"start\">1. Manufacturer storage with direct shipping<\/text><text x=\"10\" y=\"92\" fill=\"#f59e0b\" font-size=\"11\" text-anchor=\"start\">2. Direct shipping with in-transit merge<\/text><text x=\"10\" y=\"154\" fill=\"#f59e0b\" font-size=\"11\" text-anchor=\"start\">3. Distributor storage with carrier delivery<\/text><text x=\"10\" y=\"216\" fill=\"#f59e0b\" font-size=\"11\" text-anchor=\"start\">4. Distributor storage with last-mile delivery<\/text><text x=\"10\" y=\"278\" fill=\"#f59e0b\" font-size=\"11\" text-anchor=\"start\">5. Manufacturer / distributor storage with customer pickup<\/text><text x=\"10\" y=\"340\" fill=\"#f59e0b\" font-size=\"11\" text-anchor=\"start\">6. Retail storage with customer pickup<\/text><\/svg><div class=\"cap\">Rebuilt: the six distribution network designs (Chopra and Meindl). Teal-edged boxes mark the customer end.<\/div><\/div><table><tr><th>Design<\/th><th>Key characteristics<\/th><th>Benefits<\/th><th>Considerations<\/th><\/tr><tr><td><b>1 Manufacturer storage, direct shipping (drop shipping)<\/b><\/td><td>Manufacturer keeps finished goods in own facilities; customers order from the manufacturer, who ships straight to them; <b>no distributors or retailers<\/b><\/td><td>Cost savings, control over inventory and quality, fast fulfilment, fewer intermediaries<\/td><td>Needs infrastructure and resources; geographic coverage; transport coordination<\/td><\/tr><tr><td>2 Manufacturer storage, direct shipping and <b>in-transit merge<\/b><\/td><td>Same as 1, plus consolidating multiple orders (from different sources) into one shipment during transit<\/td><td>Better transport efficiency, one delivery per customer<\/td><td>Needs advanced planning and real-time tracking<\/td><\/tr><tr><td>3 <b>Distributor storage with carrier delivery<\/b><\/td><td>Distributors hold inventory in own warehouses; package carriers deliver; distributors manage receiving, storing, shipping<\/td><td>Localised inventory, faster fulfilment, handles higher variety than retail stores, value-added services<\/td><td>Warehouse and inventory control, carrier coordination, customer relationships<\/td><\/tr><tr><td>4 <b>Distributor storage with last-mile delivery<\/b><\/td><td>Distributor stores and also does last leg (own vehicles, 3PL or crowd-sourced); common in e-commerce and grocery<\/td><td>Quicker delivery, reduced transport cost, higher satisfaction; may offer installation or assembly<\/td><td>Route planning, delivery staff, infrastructure, customer communication; route optimisation software<\/td><\/tr><tr><td>5 Manufacturer / distributor storage with <b>customer pickup<\/b><\/td><td>Product stored at manufacturer or distributor site; customer collects<\/td><td>Lower transport cost, faster response, higher availability<\/td><td>Limited convenience and product variety<\/td><\/tr><tr><td>6 <b>Retail storage with customer pickup<\/b><\/td><td>Product stored at a retail store; customer picks up (or inspects before buying)<\/td><td>Convenience, fastest response, cross-selling, personalised service<\/td><td>Limited variety and availability; highest inventory and facility costs<\/td><\/tr><\/table><h4>Comparative ranking (Chopra and Meindl summary)<\/h4><table><tr><th>Dimension<\/th><th>Direct shipping (design 1)<\/th><th>Retail storage with pickup (design 6)<\/th><\/tr><tr><td>Response time<\/td><td>Slowest (days to weeks)<\/td><td>Fastest (immediate)<\/td><\/tr><tr><td>Product variety<\/td><td>Highest<\/td><td>Lowest<\/td><\/tr><tr><td>Product availability<\/td><td>Easiest to provide (aggregated)<\/td><td>Most expensive to provide<\/td><\/tr><tr><td>Inventory cost<\/td><td>Lowest<\/td><td>Highest<\/td><\/tr><tr><td>Facility cost<\/td><td>Lowest<\/td><td>Highest<\/td><\/tr><tr><td>Transportation cost<\/td><td>Highest<\/td><td>Lowest (bulk to store)<\/td><\/tr><tr><td>Order visibility<\/td><td>Harder<\/td><td>Easier (customer physically present)<\/td><\/tr><tr><td>Returnability<\/td><td>Difficult<\/td><td>Easiest<\/td><\/tr><\/table><div class=\"tip\">Designs 3 to 5 sit between these extremes. Move from 1 towards 6 and response time, facility and inventory cost rise while transport cost and variety fall.<\/div>\n<h4>Selecting a design: factors<\/h4><ul><li><b>Customer needs<\/b> - response time, variety and availability, convenience, order visibility, returnability<\/li><li><b>Product characteristics<\/b> - value, demand variability, perishability<\/li><li><b>Cost factors<\/b> - inventory, transportation, facilities, handling<\/li><li><b>Industry dynamics<\/b> - competition, technology, customer preferences<\/li><li>Scalability and adaptability; ownership structure<\/li><li>Alignment with the company's overall strategy<\/li><\/ul><h4>Case study: Dell and online sales<\/h4><ul><li>Dell pioneered online sales of computer hardware; by <b>2009 online sales were about half<\/b> of sales in the category<\/li><li>Sold exclusively online at first, then began <b>distributing through retail stores such as Wal-Mart in 2007<\/b><\/li><\/ul><table><tr><th>Aspect<\/th><th>Customised high-value hardware<\/th><th>Low-cost standardised hardware<\/th><\/tr><tr><td>Customer service<\/td><td>Online excels (flexible configurations); slight fulfilment delay is acceptable<\/td><td>Delay is a disadvantage; customers want immediate availability<\/td><\/tr><tr><td>Inventory<\/td><td>Aggregation and <b>postponement<\/b> (assemble after order, hold only components) cut inventory sharply<\/td><td>Inventory benefit is weaker<\/td><\/tr><tr><td>Facilities<\/td><td>Only manufacturing and component warehouses; no DCs or stores<\/td><td>Same saving, but less decisive<\/td><\/tr><tr><td>Transportation<\/td><td>Higher outbound cost (individual PCs shipped)<\/td><td>Higher outbound cost and slower response hurt more<\/td><\/tr><tr><td>Other benefits<\/td><td>Rapid launch of new products; 24/7 low-cost service; fast payment collection gives negative working capital; IT investment offset by benefits<\/td><td>Benefits less pronounced<\/td><\/tr><tr><td>Verdict<\/td><td>Strong gains in responsiveness and cost<\/td><td>Online channel advantage is smaller<\/td><\/tr><\/table><p>Conclusions of the lecture: companies often adopt a <b>hybrid<\/b> of online and offline channels. Impact on cost varies by industry and firm: Amazon and Blue Nile saw profits increase while Webvan struggled.<\/p>"],["Lecture 44 - Facility Location Planning","<div class=\"imp\"><b>★ Important:<\/b> Asked: FLP belongs to <b>operations research and computational geometry<\/b>; <b>point rating weights sum to 1<\/b>; labour, land, taxation = <b>economic factors<\/b>; <b>centre of gravity minimises transportation cost<\/b>.<\/div><h4>What facility location planning is<\/h4><p>Facility location decisions are <b>strategic<\/b>: they can affect the whole organisation, and they stay dynamic because of changing technology, competition and consumer taste. The study of <b>facility location problems (FLP)<\/b>, also called <b>location analysis<\/b>, is a branch of <b>operations research and computational geometry<\/b> concerned with optimal placement of facilities to minimise transportation cost while considering factors such as keeping hazardous materials away from housing and keeping clear of competitors. Facilities planning also applies to units inside a facility, e.g. an airport baggage department.<\/p>\n<h4>Facility location without proper planning<\/h4><div class=\"dg\"><svg viewBox=\"0 0 760 210\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"330\" y1=\"59\" x2=\"95\" y2=\"120\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"380\" y1=\"59\" x2=\"285\" y2=\"120\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"400\" y1=\"59\" x2=\"475\" y2=\"120\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"460\" y1=\"59\" x2=\"665\" y2=\"120\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"270\" y=\"15\" width=\"220\" height=\"44\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#fb7185\" stroke-width=\"1.6\"/><text x=\"380\" y=\"41\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Poorly planned facility location<\/text><rect x=\"10\" y=\"120\" width=\"170\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"95\" y=\"141.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">1. Sell off<\/text><text x=\"95\" y=\"156.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">(disinvestment)<\/text><rect x=\"200\" y=\"120\" width=\"170\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"285\" y=\"141.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">2. Close and<\/text><text x=\"285\" y=\"156.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">liquidate assets<\/text><rect x=\"390\" y=\"120\" width=\"170\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"475\" y=\"141.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">3. Continue at<\/text><text x=\"475\" y=\"156.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">existing location<\/text><rect x=\"580\" y=\"120\" width=\"170\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"665\" y=\"141.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">4. Relocate to a<\/text><text x=\"665\" y=\"156.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">new location<\/text><\/svg><div class=\"cap\">Rebuilt: four options a firm faces after poor facility location planning.<\/div><\/div><table><tr><th>Option<\/th><th>Implication<\/th><\/tr><tr><td>1 Sell to another company (disinvestment)<\/td><td>Recovers some investment but signals market retreat and loss of presence<\/td><\/tr><tr><td>2 Close and liquidate assets<\/td><td>Short-term loss, stops drain; liquidation often below book value; manage layoffs and legal needs<\/td><\/tr><tr><td>3 Continue at existing location<\/td><td>Higher operating cost and lower profit, but keeps customers and brand; optimise logistics, renegotiate supplier contracts, invest in technology<\/td><\/tr><tr><td>4 Relocate<\/td><td>Significant moving and site cost and transition disruption; long-term benefits may outweigh them<\/td><\/tr><\/table><h4>Three-tier model for assessing location competitiveness<\/h4><div class=\"dg\"><svg viewBox=\"0 0 760 130\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"240\" y1=\"60\" x2=\"265\" y2=\"60\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"495\" y1=\"60\" x2=\"520\" y2=\"60\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"10\" y=\"25\" width=\"230\" height=\"70\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"125\" y=\"49\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Tier 1: Country / macro<\/text><text x=\"125\" y=\"64\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">political, economic, regulatory<\/text><text x=\"125\" y=\"79\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">environment<\/text><rect x=\"265\" y=\"25\" width=\"230\" height=\"70\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"380\" y=\"49\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Tier 2: Region / state<\/text><text x=\"380\" y=\"64\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">infrastructure, labour,<\/text><text x=\"380\" y=\"79\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">incentives, tax regime<\/text><rect x=\"520\" y=\"25\" width=\"230\" height=\"70\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"635\" y=\"49\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Tier 3: Community / site<\/text><text x=\"635\" y=\"64\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">land, utilities, access,<\/text><text x=\"635\" y=\"79\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">quality of life<\/text><\/svg><div class=\"cap\">Rebuilt: three-tier view of location competitiveness (country, region, community or site). Standard framing; the slide diagram was not in the transcript.<\/div><\/div><h4>Factors affecting facility location (domestic)<\/h4><table><tr><th>Factor<\/th><th>Why it matters<\/th><\/tr><tr><td>Electric power availability and cost<\/td><td>Multiple sources, capacity for present and future needs, predictable rates<\/td><\/tr><tr><td>Natural disasters and weather<\/td><td>Hurricanes, floods, tornadoes, earthquakes disrupt beyond contingency plans<\/td><\/tr><tr><td>Property tax rates<\/td><td>Affect real estate improvements and equipment investment<\/td><\/tr><tr><td>Corporate income tax<\/td><td>Apportionment structure; single sales factor states more favourable<\/td><\/tr><tr><td>Sales taxes<\/td><td>Affect capital-intensive projects before operation begins<\/td><\/tr><tr><td>Labour availability and quality<\/td><td>Skilled workforce is essential<\/td><\/tr><tr><td>Construction costs and quality<\/td><td>Drive project cost and quality<\/td><\/tr><tr><td>Telecommunications infrastructure<\/td><td>Points of presence, trunk lines, national carriers<\/td><\/tr><tr><td>Economic development incentives<\/td><td>Lower project and operating cost but cannot offset a poor business climate<\/td><\/tr><tr><td>Quality of life<\/td><td>Attracts and retains skilled workers<\/td><\/tr><\/table><h4>Factors for international location planning<\/h4><table><tr><th>Category<\/th><th>Factors<\/th><\/tr><tr><td><b>Economic factors<\/b><\/td><td><b>Cost of labour<\/b>, <b>cost of land and facilities<\/b>, transportation and logistics cost, <b>taxation<\/b>, economic stability, market access, incentives and subsidies<\/td><\/tr><tr><td>Environmental<\/td><td>Climate and natural disasters, environmental regulations, sustainability initiatives (renewable energy)<\/td><\/tr><tr><td>Political and regulatory<\/td><td>Regulatory environment (labour, environmental, trade), political stability, trade agreements and tariffs, intellectual property protection, ease of doing business<\/td><\/tr><tr><td>Social and cultural<\/td><td>Cultural compatibility, quality of life, labour availability and skills, demographic trends, language and communication, healthcare and education facilities<\/td><\/tr><tr><td>Technological and infrastructure<\/td><td>Infrastructure quality (roads, ports, airports), telecommunications and IT, R&D and innovation<\/td><\/tr><tr><td>Supply chain and operational<\/td><td>Proximity to suppliers and customers, supply chain integration, operational flexibility<\/td><\/tr><\/table><h4>Operations strategies for multiple facilities<\/h4><table><tr><th>Strategy<\/th><th>Benefit<\/th><th>Case<\/th><\/tr><tr><td>Separate facilities by <b>product or service<\/b><\/td><td>Specialisation, efficiency, simpler quality control<\/td><td>Procter and Gamble: cleaning products plant vs personal care plant<\/td><\/tr><tr><td>Separate facilities by <b>geographical area<\/b><\/td><td>Lower transport cost, faster delivery, better local service<\/td><td>Amazon fulfilment centres in North America, Europe, Asia<\/td><\/tr><tr><td>Separate facilities by <b>process<\/b><\/td><td>Process specialisation, better control at each stage<\/td><td>Tesla: Nevada Gigafactory (batteries) and Fremont (vehicle assembly)<\/td><\/tr><\/table><h4>Systematic site evaluation<\/h4><p>Step 1: identify all factors (infrastructure, suppliers, cost structure, quality of labour and materials, free trade zones, political risk, business environment, customer proximity, government barriers). Step 2: apply qualitative models when factors cannot be quantified. Step 3: apply quantitative models.<\/p>\n<h4>Qualitative models<\/h4><ul><li><b>Simple comparison chart:<\/b> list critical subjective factors, compare locations, pick the best fit (e.g. Biratnagar vs Kathmandu on community attitude, lifestyle, cultural alignment)<\/li><li><b>Weighted factor scoring:<\/b> list factors, assign weights (1 to 5), develop a rating scale (1 to 10), score each location, multiply and sum, choose the highest<\/li><\/ul><h4>Point rating / factor rating technique<\/h4><div class=\"flow\"><div>Identify factors<\/div><i>&rarr;<\/i><div>Assign weights (sum = 1 or 100%)<\/div><i>&rarr;<\/i><div>Rating scale (e.g. 1 to 5)<\/div><i>&rarr;<\/i><div>Rate each location<\/div><i>&rarr;<\/i><div>Weighted score = rating x weight, summed<\/div><i>&rarr;<\/i><div>Pick the highest<\/div><\/div><p>Lecture example: new distribution centre with cost factors (weight 0.4: land and construction cost), market factors (0.35: nearness to customers and highways), operational factors (0.25: skilled labour, utilities). Weights add to <b>1<\/b>.<\/p><table><tr><th>Illustrative factor group<\/th><th>Weight<\/th><th>Rating A<\/th><th>Rating B<\/th><th>Score A<\/th><th>Score B<\/th><\/tr><tr><td>Cost<\/td><td>0.40<\/td><td>3<\/td><td>4<\/td><td>1.20<\/td><td>1.60<\/td><\/tr><tr><td>Market<\/td><td>0.35<\/td><td>5<\/td><td>3<\/td><td>1.75<\/td><td>1.05<\/td><\/tr><tr><td>Operational<\/td><td>0.25<\/td><td>4<\/td><td>4<\/td><td>1.00<\/td><td>1.00<\/td><\/tr><tr><td><b>Total<\/b><\/td><td><b>1.00<\/b><\/td><td><\/td><td><\/td><td><b>3.95<\/b><\/td><td><b>3.65<\/b><\/td><\/tr><\/table><div class=\"tip\">Ratings above are illustrative (the slide table was not in the transcript). Method and weights are from the lecture; Location A wins here.<\/div>\n<h4>Quantitative models<\/h4>\n<h4>1. Median (load-distance) method with rectilinear distance<\/h4><p>Minimises total transport cost / distance between the new facility and existing ones; movement only along X and Y axes. Find the <b>median load<\/b>, then the facility whose cumulative load first covers the median fixes the coordinate.<\/p><ul><li>Lecture example: total load 2,863, median load about 1,432<\/li><li>Bareilly 1-452, Shahjahanpur 453-1130 do not reach the median; <b>Kanpur 1131-1842 includes it<\/b>, so X-coordinate = Kanpur's = 50<\/li><li>Same on the Y axis gives Gonda = 50<\/li><li>Cost rate is highlighted by dotted lines between facilities<\/li><\/ul><h4>2. Centre of gravity (CG) model<\/h4><p>Determines the optimal location of a new facility by taking the weighted average of existing facility locations or demand points, thereby <b>minimising transportation cost<\/b> of serving multiple locations.<\/p><div class=\"cards\"><div class=\"m\"><b>Cx = Σ(wi xi) / Σwi<\/b><span>Weighted average X coordinate<\/span><\/div><div class=\"m\"><b>Cy = Σ(wi yi) / Σwi<\/b><span>Weighted average Y coordinate<\/span><\/div><div class=\"m\"><b>wi<\/b><span>Volume shipped, number of customers or other importance weight<\/span><\/div><\/div><div class=\"flow\"><div>Assign X-Y coordinates<\/div><i>&rarr;<\/i><div>Assign weights<\/div><i>&rarr;<\/i><div>Compute Cx and Cy<\/div><i>&rarr;<\/i><div>Interpret as new site<\/div><\/div><p>Lecture numbers: weights 452, 678, 483, 711, 539 (total 2,863) with X coordinates 10, 30, 80, 50, 80 give Σ wi xi = 142,170, so <b>Cx = 142,170 / 2,863 = 49.7<\/b>.<\/p>\n<h4>3. Varignon frame (mechanical analogue)<\/h4><p>Strings through holes at raw-material locations R1...Rm and markets, joined at a knot P and weighted by W = (annual trips) x (cost per unit distance); without friction the knot settles at the best plant location.<\/p>\n<h4>Resource-oriented location examples<\/h4><ul><li>Sugar mills near sugarcane farms: lower transport time and carriage inwards<\/li><li>Tea factories in Assam, West Bengal and Karnataka: tea needs moist soil and climate<\/li><li>UAE is the largest exporter of crude oil; ADNOC is a leading company<\/li><\/ul><p><b>Conclusion:<\/b> location planning is not just a cost-effective site; it positions the firm to exploit local advantages, mitigate risk and align with long-term goals (Amazon and Toyota use multi-facility strategies).<\/p>"]],"gl":[["Distribution","Steps to move and store a product from supplier stage to customer stage.",""],["Key profit driver","Distribution affects both supply chain cost and customer experience.",""],["Network design phases","Phase I broad structure; Phase II locations, capacities, allocation.",""],["Response time","Time from order to receipt; short time means nearby facilities.",""],["Product variety","Number of products or configurations offered.",""],["Product availability","Probability product is in stock when an order arrives.",""],["Customer experience","Ease of ordering, receiving, customisation, extras.",""],["Time to market","Speed of bringing new products to the market.",""],["Order visibility","Ability to track an order from placement to delivery.",""],["Returnability","Ease of returning goods and handling returns.",""],["Inbound vs outbound cost","Outbound per unit is higher because inbound lots are larger.",""],["Facilities vs costs","More facilities: inventory and facility cost up, transport cost down, response faster.",""],["Cross-docking","Inbound to outbound with no storage.",""],["Drop-shipping","Supplier ships to customer; retailer holds no stock.",""],["Hybrid distribution","Central bulk DC plus regional DCs.",""],["Last-mile delivery","Final leg to the customer's doorstep.",""],["Aggregation","Centralised stock lowers inventory (Amazon).",""],["Postponement","Delay variety until order (Dell, print on demand).",""],["Design 1","Manufacturer storage with direct shipping; no intermediaries.",""],["Design 2","Direct shipping plus in-transit merge of orders.",""],["Design 3","Distributor storage with carrier delivery.",""],["Design 4","Distributor storage with last-mile delivery.",""],["Design 5","Manufacturer or distributor storage with customer pickup.",""],["Design 6","Retail storage with customer pickup.",""],["Dell case","Online since start; added Wal-Mart retail in 2007; ~half of category sales online by 2009.",""],["Webvan","Online grocer that struggled, unlike Amazon and Blue Nile.",""],["FLP","Facility location problem: OR and computational geometry.",""],["Disinvestment","Selling a badly located facility.",""],["Three-tier model","Country, region, community/site view of location competitiveness.",""],["Economic location factors","Labour cost, land and facility cost, taxation, transport cost.",""],["Point rating","Weighted factor scoring; weights sum to 1; highest score wins.",""],["Median method","Rectilinear cost minimisation using median load.",""],["Centre of gravity","Weighted average coordinates minimising transport cost.",""],["Varignon frame","Strings and weights as a mechanical analogue to find the best site.",""],["Multi-facility strategies","By product (P&G), geography (Amazon), process (Tesla).",""]],"q":[["o","Which describes how a company targeting customers who value short response times should design its distribution network?",["Locate fewer facilities that are farther away from the customers","Locate facilities close to the customers","Centralize all inventory in a single global warehouse","Rely solely on digital delivery methods"],1,"Short response time needs nearby facilities."],["o","What is defined as 'the probability of having a product in stock when a customer order arrives'?",["Product Availability","Response Time","Product Variety","Order Visibility"],0,"That is the definition of product availability."],["o","Why do outbound transportation costs per unit tend to be higher than inbound transportation costs?",["Outbound shipments travel much longer distances","Inbound shipments are heavily taxed by the government","Outbound products require specialized temperature-controlled vehicles","Inbound lot sizes are typically larger, allowing for economies of scale"],3,"Amazon receives full truckloads inbound but ships small parcels outbound."],["o","What is the final leg of the delivery process, bringing products to the customer's doorstep, called in online sales distribution?",["Fulfillment Centering","Last-Mile Delivery","Inventory Aggregation","Order Processing"],1,"Last-mile delivery."],["o","Which is a key characteristic of the 'Manufacturer Storage with Direct Shipping' design?",["Products are stored at retail stores for customer pickup","Inventory is held entirely by third-party distributors in regional hubs","The manufacturer eliminates intermediaries and ships products directly to the end customer","Products must pass through a local distributor before reaching the customer"],2,"No distributors or retailers are involved."],["o","The study of facility location problems (FLP), also known as location analysis, is a branch of which two academic fields?",["Operations Research and Computational Geometry","Macroeconomics and Behavioral Psychology","Human Resource Management and Civil Engineering","Financial Accounting and Marketing Analytics"],0,"Operations research and computational geometry."],["o","When using the point rating technique, what should the total sum of all assigned weights equal if you are using decimals?",["0.5","1","5","10"],1,"Weights sum to 1 (or 100%)."],["o","Cost of Labor, Cost of Land and Facilities, and Taxation fall under which main category?",["Environmental Factors","Social Factors","Economic Factors","Technological Factors"],2,"They are the economic factors for international location planning."],["o","The Centre of Gravity (CG) model is primarily used to determine the optimal location of a new facility by minimizing:",["Local property and corporate income tax rates","Transportation costs associated with serving multiple locations","Employee turnover and training costs","Environmental regulations and compliance fees"],1,"Weighted coordinates minimise transport cost."],["o","According to the case study, how did Dell's distribution model change in 2007?",["They completely shut down their online sales channel","They began distributing their products through retail stores like Wal-Mart","They shifted entirely to a distributor storage with carrier delivery network","They stopped selling customized hardware to focus only on standardized PCs"],1,"Dell added retail channels in 2007."],["x","Distribution is best defined as:",["Only moving finished goods to retailers","The steps to move and store a product from the supplier stage to the customer stage","Only warehouse storage","Only last-mile delivery"],1,"It includes inbound and outbound movement and storage."],["x","The two broad phases of distribution network design are:",["Structure visualisation, then locations, capacities and allocation","Forecasting, then pricing","Sourcing, then marketing","Packaging, then labelling"],0,"Phase I broad structure; Phase II specific locations and capacities."],["x","As the number of facilities increases, which cost generally falls (while inbound scale economies are kept)?",["Inventory cost","Facility cost","Transportation cost","Information cost"],2,"Outbound distance shrinks while inventory and facility costs rise."],["x","Cross-docking in a distribution network means:",["Long-term storage in a central DC","Moving products from inbound to outbound transport without storage","Selling directly to the customer","Returning goods to suppliers"],1,"It cuts holding cost and speeds order fulfilment."],["x","Which factor is NOT listed among service factors influencing distribution network design?",["Response time","Returnability","Order visibility","Corporate income tax rate"],3,"Tax rates are a location factor, not a service factor."],["x","Dell assembles PCs only after receiving orders and holds component stock. This is called:",["Aggregation","Postponement","Cross-docking","Drop-shipping"],1,"Postponement delays variety until the order."],["x","For which Dell product does the online channel give the biggest advantage?",["Low-cost standardised PCs","High-value customised PCs","Printer supplies","Used PCs"],1,"Aggregation and postponement work best there; slight delay is acceptable."],["x","Which design has the highest inventory and facility cost but the fastest response?",["Manufacturer storage with direct shipping","Distributor storage with carrier delivery","Retail storage with customer pickup","Drop-shipping"],2,"Retail storage keeps stock near customers."],["x","Which option is NOT one of the four choices after a poorly planned facility location?",["Sell it","Close and liquidate","Relocate","Merge it with a competitor's customers"],3,"The options: sell, close and liquidate, continue, relocate."],["x","Tesla using the Nevada Gigafactory for batteries and Fremont for assembly illustrates separating facilities by:",["Product","Geography","Process","Customer"],2,"P&G is by product; Amazon is by geography."],["x","In the median (load-distance) method with a total load of 2,863, the facility chosen is the one containing which load unit?",["Load 1","About the 1,432nd unit","Load 2,863","The largest load"],1,"The median load fixes the coordinate."],["x","In the centre of gravity method, Cx is calculated as:",["Σ xi / n","Σ(wi xi) / Σwi","Σ wi / Σ xi","Max xi"],1,"It is the weighted average coordinate."],["x","Which statement about Webvan, Amazon and Blue Nile is correct from the lecture?",["All three struggled","Amazon and Blue Nile saw profits increase while Webvan struggled","Only Blue Nile struggled","None used online sales"],1,"Cost impact of online sales varies by firm."],["x","Netflix operating from about 50 warehouses versus Blockbuster's thousands of stores illustrates:",["Network centralisation","Cross-docking","Last-mile delivery","Hybrid distribution"],0,"Online sales allow fewer facilities."]],"imp":[["Role of distribution","Steps to move and store product supplier to customer; key driver of profitability."],["Service factors","Response time, variety, availability, customer experience, time to market, order visibility, returnability."],["Short response time","Locate facilities close to customers; fewer facilities when customers tolerate waiting."],["Product availability","Probability product is in stock when an order arrives."],["Facilities vs costs","More facilities: inventory and facility cost up, transport cost down (if inbound scale kept), response faster."],["Outbound vs inbound cost","Outbound per unit higher because inbound lot sizes are larger."],["Online sales effects","Aggregation, postponement, centralisation, last-mile delivery, higher returns."],["Six distribution designs","Manufacturer direct; direct + in-transit merge; distributor + carrier; distributor + last mile; pickup at mfr/distributor; retail pickup."],["Manufacturer direct shipping","Removes intermediaries; ships straight to the customer."],["Dell case","Online first, added retail (Wal-Mart) in 2007; best for customised hardware, weaker for standardised."],["FLP","Operations research and computational geometry; strategic and dynamic."],["Economic location factors","Labour, land and facilities, transport, taxation, stability, market access, incentives."],["Multi-facility strategies","By product (P&G), geography (Amazon), process (Tesla)."],["Point rating","Factors, weights (sum to 1), ratings, weighted sum, highest wins."],["Median and centre of gravity","Median: rectilinear median load; CG: Cx = Σ(wi xi)/Σwi, minimises transport cost."]]},"10":{"notes":[["Lecture 45 - Demand Forecasting","<div class=\"imp\"><b>★ Important:<\/b> Asked: forecasting avoids <b>overproduction and underproduction<\/b>; <b>geography<\/b> factor (swimwear in Florida); <b>over-reliance on past data<\/b>; <b>expert/insider knowledge<\/b>; <b>limited visibility<\/b> (market volatility, rapid tech change, unpredictable events); forecasting helps <b>reduce carrying cost and prevent stock-outs<\/b>.<\/div><h4>Context: demand in India (World Bank / press numbers in the lecture)<\/h4><div class=\"cards\"><div class=\"m\"><b>7.2%<\/b><span>India GDP growth FY22/23, second highest among G20<\/span><\/div><div class=\"m\"><b>6.3%<\/b><span>World Bank forecast FY23/24<\/span><\/div><div class=\"m\"><b>8.4% YoY<\/b><span>Real GDP growth in Q3 of fiscal 2024<\/span><\/div><div class=\"m\"><b>6.5% YoY<\/b><span>GVA growth in same quarter<\/span><\/div><div class=\"m\"><b>10.6% YoY<\/b><span>Private investment spending growth<\/span><\/div><div class=\"m\"><b>-3.2% YoY<\/b><span>Government consumption (biggest drag)<\/span><\/div><div class=\"m\"><b>-0.8% YoY<\/b><span>Agriculture contraction (first since 2019)<\/span><\/div><div class=\"m\"><b>11.6% / 9.5%<\/b><span>Manufacturing / construction growth<\/span><\/div><\/div><p>A wide gap between GDP (8.4%) and GVA (6.5%) means demand (expenditure side) grows faster than supply (production side): possible excess demand for too few goods and higher inflation, which shows why forecasting matters.<\/p>\n<h4>What is demand forecasting?<\/h4><p>The process of <b>understanding and predicting customer demand<\/b> to make smart decisions about supply chain operations, profit margins, cash flow, capital expenditure and capacity planning. It estimates total sales and revenue for a future period, often (not always) from historical data. It is vital to <b>avoid overproduction and underproduction<\/b>. Steps: decide what is measured and the time perspective, select the type and method, then collect, analyse and interpret.<\/p>\n<h4>Five factors influencing demand forecast<\/h4><table><tr><th>Factor<\/th><th>Example<\/th><\/tr><tr><td><b>Seasonality<\/b><\/td><td>Boating gear in summer; costumes and candy at Halloween; wedding season<\/td><\/tr><tr><td><b>Competition<\/b><\/td><td>New entrant drops demand; a competitor folding raises it<\/td><\/tr><tr><td><b>Economy<\/b><\/td><td>Recession lowers luxury demand, raises low-priced generic demand<\/td><\/tr><tr><td><b>Types of goods<\/b><\/td><td>Perishables need very precise forecasts; subscription boxes are predictable<\/td><\/tr><tr><td><b>Geography<\/b><\/td><td>Swimwear stored mostly in Florida where it is ordered most<\/td><\/tr><\/table><h4>Importance (benefits)<\/h4><table><tr><th>Benefit<\/th><th>How<\/th><\/tr><tr><td>Inventory management<\/td><td>Right stock level: lower carrying cost, no stock-outs<\/td><\/tr><tr><td>Cost reduction<\/td><td>Align production and procurement with demand; less waste<\/td><\/tr><tr><td>Customer satisfaction<\/td><td>Products available when and where wanted<\/td><\/tr><tr><td>Marketing and promotion<\/td><td>Time and place campaigns<\/td><\/tr><tr><td>Financial planning<\/td><td>Project revenue, budget, investment<\/td><\/tr><tr><td>Risk mitigation<\/td><td>Plan contingencies for volatile markets<\/td><\/tr><tr><td>Production planning<\/td><td>Avoid over and underproduction<\/td><\/tr><tr><td>Resource allocation<\/td><td>People, machinery, raw materials<\/td><\/tr><tr><td>Supply chain optimisation<\/td><td>Visibility of future requirements<\/td><\/tr><tr><td>Seasonal planning<\/td><td>Prepare inventory and staffing for peaks<\/td><\/tr><tr><td>Competitive advantage<\/td><td>Agility against demand volatility<\/td><\/tr><tr><td>Strategic decisions<\/td><td>Product development, market and capacity expansion<\/td><\/tr><\/table><h4>Challenges<\/h4><table><tr><th>Challenge<\/th><th>Detail<\/th><\/tr><tr><td>Lack of data<\/td><td>Too little data for accurate prediction<\/td><\/tr><tr><td><b>Over-reliance on past data<\/b><\/td><td>History cannot account for evolving market factors<\/td><\/tr><tr><td><b>Limited visibility into the future<\/b><\/td><td>Market volatility, rapid technological change, unpredictable external events<\/td><\/tr><tr><td>Poor forecasting processes<\/td><td>Wrong processes and tools<\/td><\/tr><tr><td>Insufficient resources<\/td><td>Lack of analysts<\/td><\/tr><tr><td>Inaccurate demand models<\/td><td>Errors in inventory and production decisions<\/td><\/tr><tr><td>Unpredictable external factors<\/td><td>Economic shifts, disasters, politics, technology<\/td><\/tr><\/table><h4>Types of demand forecasting<\/h4><table><tr><th>Type<\/th><th>Meaning<\/th><\/tr><tr><td>Passive<\/td><td>Past sales used to predict future; assumes similar to last year; for steady-sales firms<\/td><\/tr><tr><td>Active<\/td><td>Used by start-ups and fast growers; includes growth plans, marketing, competitive environment<\/td><\/tr><tr><td>Short-term<\/td><td>Small window; day-to-day, JIT, Black Friday planning<\/td><\/tr><tr><td>Long-term<\/td><td>More than a year; seasonality, annual patterns, capacity, capital plans<\/td><\/tr><tr><td>Macro<\/td><td>External forces: economy, competition, consumer trends<\/td><\/tr><tr><td>Micro<\/td><td>Specific industry or segment (e.g. organic peanut butter for millennial parents in Austin)<\/td><\/tr><\/table><h4>Methods<\/h4><div class=\"dg\"><svg viewBox=\"0 0 780 260\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"390\" y1=\"44\" x2=\"210\" y2=\"80\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"390\" y1=\"44\" x2=\"570\" y2=\"80\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"210\" y1=\"114\" x2=\"95\" y2=\"150\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"210\" y1=\"114\" x2=\"265\" y2=\"150\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"570\" y1=\"114\" x2=\"525\" y2=\"150\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"570\" y1=\"114\" x2=\"695\" y2=\"150\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"525\" y1=\"190\" x2=\"490\" y2=\"205\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"525\" y1=\"190\" x2=\"600\" y2=\"205\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"525\" y1=\"190\" x2=\"710\" y2=\"205\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"290\" y=\"10\" width=\"200\" height=\"34\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"390\" y=\"31\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Demand forecasting methods<\/text><rect x=\"110\" y=\"80\" width=\"200\" height=\"34\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"210\" y=\"101\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">QUALITATIVE<\/text><rect x=\"470\" y=\"80\" width=\"200\" height=\"34\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"570\" y=\"101\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">QUANTITATIVE<\/text><rect x=\"10\" y=\"150\" width=\"170\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"95\" y=\"166.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Expert / insider<\/text><text x=\"95\" y=\"181.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">knowledge<\/text><rect x=\"190\" y=\"150\" width=\"150\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"265\" y=\"174\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Delphi method<\/text><rect x=\"10\" y=\"205\" width=\"170\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"95\" y=\"229\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Surveys<\/text><rect x=\"190\" y=\"205\" width=\"150\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"265\" y=\"221.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Interviews and<\/text><text x=\"265\" y=\"236.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">focus groups<\/text><rect x=\"350\" y=\"205\" width=\"150\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"425\" y=\"229\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Salesforce composite<\/text><rect x=\"440\" y=\"150\" width=\"170\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"525\" y=\"166.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Time series:<\/text><text x=\"525\" y=\"181.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">moving averages<\/text><rect x=\"620\" y=\"150\" width=\"150\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"695\" y=\"174\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Trend projection<\/text><rect x=\"440\" y=\"205\" width=\"100\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"490\" y=\"229\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">SMA<\/text><rect x=\"550\" y=\"205\" width=\"100\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"600\" y=\"229\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">EMA<\/text><rect x=\"660\" y=\"205\" width=\"100\" height=\"40\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"710\" y=\"229\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">WMA<\/text><\/svg><div class=\"cap\">Rebuilt: map of the forecasting methods covered in Lecture 45.<\/div><\/div><h4>Qualitative methods<\/h4>\n<h4>Delphi method<\/h4><p>Structured, iterative technique relying on a panel of experts to reach convergence of opinion.<\/p><div class=\"flow\"><div>Select experts (10-50)<\/div><i>&rarr;<\/i><div>Design questionnaire<\/div><i>&rarr;<\/i><div>First round, independent answers<\/div><i>&rarr;<\/i><div>Feedback and analysis<\/div><i>&rarr;<\/i><div>Subsequent rounds (usually 2-4)<\/div><i>&rarr;<\/i><div>Final report<\/div><\/div><ul><li>Anonymity avoids groupthink and dominant individuals<\/li><li>Each round shows statistical feedback and anonymised responses; experts revise<\/li><li>Ends at consensus or stable pattern; final report states agreement, disagreement and actions<\/li><\/ul><h4>Expert or insider knowledge<\/h4><p>Specialised understanding of people with significant experience in a field, industry or organisation. Tools: <b>interviews, focus groups, Delphi, workshops and brainstorming, surveys and questionnaires<\/b>.<\/p>\n<h4>Survey method<\/h4><div class=\"flow\"><div>Define objectives<\/div><i>&rarr;<\/i><div>Design questionnaire<\/div><i>&rarr;<\/i><div>Select sample<\/div><i>&rarr;<\/i><div>Administer<\/div><i>&rarr;<\/i><div>Collect and analyse<\/div><i>&rarr;<\/i><div>Interpret<\/div><i>&rarr;<\/i><div>Report<\/div><\/div><table><tr><th>Mode<\/th><th>Features<\/th><\/tr><tr><td>Online<\/td><td>Cheap, fast, large reach (SurveyMonkey, Google Forms)<\/td><\/tr><tr><td>Telephone<\/td><td>Real-time clarification<\/td><\/tr><tr><td>Face-to-face<\/td><td>High response, non-verbal cues; slow and costly<\/td><\/tr><tr><td>Mail<\/td><td>Reaches remote areas; low response, slow<\/td><\/tr><\/table><p>Question types: multiple choice, Likert scale, ranking, dichotomous (yes/no), open-ended. Sampling: random, stratified, convenience. Analysis tools: SPSS, Excel; qualitative data via thematic analysis.<\/p>\n<h4>Interviews and focus groups<\/h4><p>Qualitative methods exploring attitudes, experiences, perceptions: define objectives, interview guide, choose participants, conduct (rapport, open questions, active listening), record and transcribe, analyse themes and report.<\/p>\n<h4>Salesforce composite forecasting<\/h4><p>Combines multiple data sources and methods to offset the weaknesses of single methods.<\/p><div class=\"flow\"><div>Collect data (CRM, opportunities, accounts, history)<\/div><i>&rarr;<\/i><div>Choose methods and weights<\/div><i>&rarr;<\/i><div>Generate initial forecasts<\/div><i>&rarr;<\/i><div>Collaborative input from reps and managers<\/div><i>&rarr;<\/i><div>Combine using weights<\/div><i>&rarr;<\/i><div>Review and adjust<\/div><i>&rarr;<\/i><div>Visualise and report<\/div><\/div><h4>Quantitative methods<\/h4><p><b>Time series analysis<\/b> uses historic data to find the underlying <b>trend<\/b> (general direction) and <b>seasonal variation<\/b> (regular weekly, monthly or quarterly patterns), then predicts the future for budgeting and forecasting.<\/p><table><tr><th>Moving average<\/th><th>Idea<\/th><\/tr><tr><td><b>SMA<\/b> (simple)<\/td><td>Average over a fixed number of periods; shorter window reacts faster, longer window smoother<\/td><\/tr><tr><td><b>EMA<\/b> (exponential)<\/td><td>More weight on recent data, older data decays; faster response; can be computed from today's value and previous EMA; suits non-linear data<\/td><\/tr><tr><td><b>WMA<\/b> (weighted)<\/td><td>Chosen weights per period, sum of weighted values divided by sum of weights; filters outliers; flexible<\/td><\/tr><\/table><h4>Trend projection<\/h4><div class=\"flow\"><div>Collect historical data<\/div><i>&rarr;<\/i><div>Plot data<\/div><i>&rarr;<\/i><div>Choose trend model (linear, exponential, polynomial)<\/div><i>&rarr;<\/i><div>Fit trend line<\/div><i>&rarr;<\/i><div>Extrapolate<\/div><i>&rarr;<\/i><div>Evaluate and adjust<\/div><\/div><p>Assumption: past patterns continue into the future.<\/p>"],["Lecture 46 - Capacity Planning","<div class=\"imp\"><b>★ Important:<\/b> Asked: <b>Efficiency = actual output / effective capacity x 100%<\/b> (utilisation uses design capacity); <b>long-term / strategic capacity planning<\/b> covers several years.<\/div><p><b>Capacity planning<\/b> balances available resources to satisfy customer demand or project capacity needs: how much production capacity is needed as demand changes. In production and project management, capacity is the amount of work completed in a given time.<\/p>\n<h4>Types by horizon<\/h4><table><tr><th>Type<\/th><th>Horizon and focus<\/th><\/tr><tr><td><b>Long-term / strategic<\/b><\/td><td>Several years; supply and need forecasting; aligned with business goals and growth; strategic workforce capacity planning<\/td><\/tr><tr><td>Medium-term / tactical<\/td><td>A few months to a year; bridges strategic and operational; scheduling, forecasting, utilisation tracking<\/td><\/tr><tr><td>Short-term / operational<\/td><td>Days to months; reactive; scheduling, workforce management; solves immediate resource gaps<\/td><\/tr><\/table><h4>Capacity measures<\/h4><div class=\"dg\"><svg viewBox=\"0 0 760 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><rect x=\"10\" y=\"15\" width=\"720\" height=\"34\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"370\" y=\"36\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Design capacity (ideal maximum output)<\/text><rect x=\"10\" y=\"60\" width=\"590\" height=\"34\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"305\" y=\"81\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Effective capacity = design capacity - allowances<\/text><rect x=\"10\" y=\"105\" width=\"450\" height=\"34\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#fb7185\" stroke-width=\"1.6\"/><text x=\"235\" y=\"126\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Actual output (cannot exceed effective capacity)<\/text><text x=\"700\" y=\"155\" fill=\"#71717a\" font-size=\"12\" text-anchor=\"middle\">Utilisation = actual / design   |   Efficiency = actual / effective<\/text><\/svg><div class=\"cap\">Rebuilt: relation between design capacity, effective capacity and actual output (bar lengths illustrative).<\/div><\/div><table><tr><th>Term<\/th><th>Meaning<\/th><\/tr><tr><td><b>Design capacity<\/b><\/td><td>Maximum output a facility is engineered to achieve under ideal conditions<\/td><\/tr><tr><td><b>Effective (system) capacity<\/b><\/td><td>Design capacity minus allowances (maintenance, downtime, breaks, scheduling conflicts, variations in demand)<\/td><\/tr><tr><td><b>Actual output<\/b><\/td><td>Rate actually achieved; cannot exceed effective capacity; hit by breakdowns, absenteeism, shortages<\/td><\/tr><\/table><div class=\"cards\"><div class=\"m\"><b>Efficiency<\/b><span>(Actual output / Effective capacity) x 100%<\/span><\/div><div class=\"m\"><b>Utilisation<\/b><span>(Actual output / Design capacity) x 100%<\/span><\/div><div class=\"m\"><b>Effective capacity<\/b><span>Design capacity - allowances<\/span><\/div><\/div><h4>Worked example<\/h4><p>Actual production last week 25,000 units; design capacity 230 units per hour; plant runs 7 days, three 8-hour shifts; effective capacity 28,000.<\/p><ul><li>Weekly design capacity = (7 x 3 x 8) x 230 = <b>38,640 units<\/b><\/li><li>Utilisation = 25,000 / 38,640 = <b>64.7%<\/b><\/li><li>Efficiency = 25,000 / 28,000 = <b>89.3%<\/b><\/li><\/ul><h4>Capacity planning strategies by resource<\/h4><table><tr><th>Strategy<\/th><th>Purpose<\/th><\/tr><tr><td>Workforce<\/td><td>Right number of workers and hours<\/td><\/tr><tr><td>Product<\/td><td>Right products or inventory to fulfil deliverables (pet store: food, toys, carriers)<\/td><\/tr><tr><td>Tool<\/td><td>Machinery, vehicles, assembly parts<\/td><\/tr><tr><td>Resource<\/td><td>Maximise capacity of existing resources; decide which to add or remove<\/td><\/tr><tr><td>Project<\/td><td>Time and resources for a given project; balance workload against milestones<\/td><\/tr><\/table><h4>Capacity planning process<\/h4><div class=\"flow\"><div>Estimate capacity requirements<\/div><i>&rarr;<\/i><div>Evaluate existing capacity and gap<\/div><i>&rarr;<\/i><div>Identify alternatives<\/div><i>&rarr;<\/i><div>Financial analysis<\/div><i>&rarr;<\/i><div>Qualitative assessment<\/div><i>&rarr;<\/i><div>Choose best long-term alternative<\/div><i>&rarr;<\/i><div>Implement<\/div><i>&rarr;<\/i><div>Monitor results<\/div><\/div><h4>Alternatives<\/h4><ul><li>Increase capacity (new equipment or facilities)<\/li><li>Optimise existing capacity (process improvement)<\/li><li>Outsource production or services<\/li><li>Flexible workforce (temporary, part-time)<\/li><li>Demand management (pricing, promotions)<\/li><li>Contingency plans (buffer inventory, backup suppliers)<\/li><li>Leverage technology and innovation (Industry 4.0)<\/li><\/ul><p>Implementation needs detailed planning, stakeholder engagement, continuous improvement and change management; qualitative issues include culture, employee morale, supply chain relationships and reputation.<\/p>\n<h4>Evaluating alternatives<\/h4><p><b>Economic:<\/b> cost, useful life, compatibility, revenue (break-even analysis). <b>Non-economic:<\/b> employee and community reactions, and similar considerations.<\/p>\n<h4>Break-even analysis<\/h4><div class=\"dg\"><svg viewBox=\"0 0 760 270\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><line x1=\"60\" y1=\"20\" x2=\"60\" y2=\"225\" stroke=\"#71717a\"/><line x1=\"60\" y1=\"225\" x2=\"720\" y2=\"225\" stroke=\"#71717a\"/>\n<line x1=\"60\" y1=\"195\" x2=\"700\" y2=\"195\" stroke=\"#a1a1aa\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/>\n<line x1=\"60\" y1=\"195\" x2=\"700\" y2=\"60\" stroke=\"#fb7185\" stroke-width=\"3\"/>\n<line x1=\"60\" y1=\"225\" x2=\"700\" y2=\"30\" stroke=\"#34d399\" stroke-width=\"3\"/>\n<circle cx=\"316\" cy=\"145\" r=\"6\" fill=\"#f59e0b\"/><text x=\"326\" y=\"140\" fill=\"#f59e0b\" font-size=\"12\">Break-even point (Q = FC / (r - v))<\/text>\n<text x=\"705\" y=\"193\" fill=\"#a1a1aa\" font-size=\"11\">Fixed cost<\/text><text x=\"705\" y=\"63\" fill=\"#fb7185\" font-size=\"11\">Total cost<\/text><text x=\"705\" y=\"33\" fill=\"#34d399\" font-size=\"11\">Total revenue<\/text>\n<text x=\"390\" y=\"255\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Quantity<\/text><text x=\"316\" y=\"240\" fill=\"#f59e0b\" font-size=\"11\" text-anchor=\"middle\">Q BEP<\/text>\n<text x=\"180\" y=\"115\" fill=\"#fb7185\" font-size=\"12\">Loss<\/text><text x=\"520\" y=\"115\" fill=\"#34d399\" font-size=\"12\">Profit<\/text><\/svg>\n<div class=\"cap\">Rebuilt: break-even chart. Below Q BEP the firm makes a loss; above it, a profit.<\/div><\/div><div class=\"cards\"><div class=\"m\"><b>Q BEP = FC / (r - v)<\/b><span>r = price per unit, v = variable cost per unit<\/span><\/div><div class=\"m\"><b>TC = FC + v x Q<\/b><span>Total cost<\/span><\/div><div class=\"m\"><b>Q for profit P<\/b><span>(P + FC) / (r - v)<\/span><\/div><\/div><h4>Example: pizza place<\/h4><p>New small pizza line: lease USD 4,000 per month, variable cost USD 4, price USD 9.<\/p><ul><li>Break-even = 4,000 / (9 - 4) = <b>800 pizzas per month<\/b><\/li><li>Profit at 1,200 pizzas = 1,200 x 9 - (4,000 + 1,200 x 4) = 10,800 - 8,800 = <b>USD 2,000 profit<\/b> (the slide shows USD 6,000, which is revenue minus variable cost only and leaves out the USD 4,000 fixed cost)<\/li><li>Pizzas for USD 10,000 profit = (10,000 + 4,000) / 5 = <b>2,800<\/b><\/li><li>Expected demand 700 < 800: <b>not profitable<\/b><\/li><\/ul><h4>Make or buy break-even<\/h4><p>Set Total cost of Make = Total cost of Buy: Q BEP = FC / (VB - VM). Example (ABX Company): fixed cost 160,000, VM = 100, VB = 150: Q BEP = 160,000 / 50 = <b>3,200<\/b>. At 1,000 units: Make = 100,000 + 160,000 = 260,000; Buy = 150,000, so <b>buy<\/b>. Above the break-even quantity the option with the lower variable cost wins.<\/p>"],["Lecture 47 - Sequencing and Scheduling","<div class=\"imp\"><b>★ Important:<\/b> Sequencing rules and their results (<b>SPT gives the lowest total flow time<\/b>); <b>Johnson's rule<\/b> for two machines; conditions for three machines.<\/div><p><b>Sequencing<\/b> is the order of processing a set of tasks over resources; <b>scheduling<\/b> adds the allocation of start and finish times to each order. Scheduling provides a shop-floor calendar and is often done by software considering resources, demand and capacity.<\/p>\n<h4>Sequencing rules (five-job example in the lecture)<\/h4><table><tr><th>Rule<\/th><th>Priority to<\/th><th>Total flow time<\/th><th>Average delay<\/th><\/tr><tr><td><b>FIFO<\/b> First In First Out<\/td><td>First arrival<\/td><td>50 days (mean 10)<\/td><td>4.6 days<\/td><\/tr><tr><td><b>LIFO<\/b> Last In First Out<\/td><td>Last arrival (rarely used; accelerates a delayed job)<\/td><td>46 days (mean 9.2)<\/td><td>4.0 days<\/td><\/tr><tr><td><b>SPT<\/b> Shortest Processing Time<\/td><td>Quickest job; fewer queues<\/td><td><b>36 days (mean 7.2)<\/b><\/td><td><b>2.4 days<\/b><\/td><\/tr><tr><td><b>LPT<\/b> Longest Processing Time<\/td><td>Longest job; fewer changeovers, better utilisation<\/td><td>60 days (mean 12)<\/td><td>6.8 days<\/td><\/tr><tr><td><b>EDD<\/b> Earliest Due Date<\/td><td>Most urgent deadline<\/td><td>39 days (mean 7.8)<\/td><td><b>2.4 days<\/b><\/td><\/tr><tr><td><b>LS<\/b> Least Slack<\/td><td>Smallest slack s = d - p<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td><b>CR<\/b> Critical Ratio<\/td><td>Smallest (time until due / remaining processing time); dynamic, combines EDD and SPT<\/td><td>-<\/td><td>-<\/td><\/tr><\/table><div class=\"tip\">In this example SPT gives the lowest total flow time and, with EDD, the lowest average delay. LPT is worst on both.<\/div>\n<h4>Advantages and limitations<\/h4><table><tr><th>Advantages<\/th><th>Limitations<\/th><\/tr><tr><td>Avoids bottlenecks; adaptable standard rules; lean stable processes; customer-specific sequences; captures planning know-how<\/td><td>Dynamic changes disrupt plans; limited machines, labour, materials; complexity with many jobs; conflicting priorities; setup and changeover difficulty; software and integration limits<\/td><\/tr><\/table><h4>Types of scheduling problems<\/h4><ul><li><b>Single machine:<\/b> n jobs on one machine<\/li><li><b>Flow shop:<\/b> n jobs with m operations and the same sequence for every job (general problem has exponential complexity)<\/li><\/ul><h4>Johnson's rule (2 machines, n jobs)<\/h4><p>Gives an optimal sequence in polynomial time. Preconditions: constant job times, job times independent of sequence, every job finishes machine 1 before machine 2, equal priority.<\/p><div class=\"flow\"><div>List jobs and times<\/div><i>&rarr;<\/i><div>Pick the shortest time<\/div><i>&rarr;<\/i><div>If on machine 1: schedule first; if on machine 2: schedule last<\/div><i>&rarr;<\/i><div>Remove job; repeat towards the middle<\/div><\/div><p>Ties are broken arbitrarily. With heavy idle time at the second centre, job splitting may be used.<\/p>\n<h4>n jobs on three machines (A, B, C)<\/h4><p>Apply Johnson if either condition holds: <b>min(A) &gt;= max(B)<\/b> or <b>min(C) &gt;= max(B)<\/b>. Then replace the machines with two fictitious machines G and H (Gi = Ai + Bi, Hi = Bi + Ci) and sequence as usual. Example in the lecture: MDH Masala processing five items on machines A, B and C.<\/p>"],["Lecture 48 - Transportation Management","<div class=\"imp\"><b>★ Important:<\/b> Asked: the four components of transportation decisions are <b>Load, Mode, Flow, Route<\/b>.<\/div><h4>Major components of transportation decisions<\/h4><div class=\"flow\"><div>Load<\/div><i>&rarr;<\/i><div>Mode<\/div><i>&rarr;<\/i><div>Flow<\/div><i>&rarr;<\/i><div>Route<\/div><\/div><h4>1. Load<\/h4><p>Quantity and composition of goods transported at a given time; goal is high capacity utilisation, low handling cost and timely delivery.<\/p><table><tr><th>Aspect<\/th><th>Meaning<\/th><\/tr><tr><td>Load size<\/td><td>Amount per shipment, from parcels to full truckloads or containers<\/td><\/tr><tr><td>Load weight<\/td><td>Total mass; obey weight limits (safety, fines, delays)<\/td><\/tr><tr><td>Load volume<\/td><td>Space occupied; palletisation and stacking for cubic optimisation<\/td><\/tr><tr><td>Load packaging<\/td><td>Protection against damage, theft, spoilage; easy handling<\/td><\/tr><tr><td>Load composition<\/td><td>Mix of products; consolidation cuts shipping cost<\/td><\/tr><tr><td>Load balancing<\/td><td>Even weight distribution (axle weight, centre of gravity) for stability and fuel efficiency<\/td><\/tr><\/table><h4>Fleet selection and size: key factors<\/h4><ul><li>Transportation demand (history, trends, forecasts)<\/li><li>Service level requirements (lead time, frequency, flexibility, SLAs)<\/li><li>Geographical coverage (area, distance, traffic, accessibility)<\/li><li>Cargo characteristics<\/li><li>Redundancy and flexibility for disruptions<\/li><li>Cost: total cost of ownership (acquisition, operating, maintenance, fuel, depreciation)<\/li><li>Technology: route optimisation, telematics, fleet management<\/li><li>Regulatory compliance (registration, licences, insurance, driver hours)<\/li><li>Scalability and growth<\/li><\/ul><h4>2. Mode<\/h4><table><tr><th>Mode<\/th><th>Best for<\/th><th>Advantages<\/th><th>Challenges<\/th><\/tr><tr><td><b>Road<\/b><\/td><td>Short to medium distance, regional, last mile, perishables<\/td><td>Flexibility, door to door, frequent, reaches remote places, JIT<\/td><td>Congestion, weather, regulations, higher cost per mile on long hauls<\/td><\/tr><tr><td><b>Rail<\/b><\/td><td>Long-distance bulk and heavy goods<\/td><td>Cheap at scale, low fuel and emissions, reliable schedules<\/td><td>Limited access, slower, extra handling<\/td><\/tr><tr><td><b>Maritime (water)<\/b><\/td><td>Bulk, commodities, long haul, international trade<\/td><td>Lowest cost per ton, high capacity, global<\/td><td>Slowest, weather and port congestion, no door to door<\/td><\/tr><tr><td><b>Air<\/b><\/td><td>Time-sensitive, high-value, perishable<\/td><td>Speed, predictable schedules, global<\/td><td>Highest cost, limited capacity for bulky cargo, airport dependence<\/td><\/tr><tr><td><b>Pipeline<\/b><\/td><td>Petroleum, gas, chemicals, continuous flow<\/td><td>Low cost per unit, safe, low energy, dedicated route<\/td><td>Limited cargo types, high initial investment, leak and maintenance risks<\/td><\/tr><tr><td><b>Intermodal<\/b><\/td><td>Combine modes in one shipment<\/td><td>Uses strengths of each mode, door to door, end-to-end visibility<\/td><td>Coordination, documentation, terminal dependence<\/td><\/tr><\/table><p>Lecture example (mode choice by cost): finished goods shipped plant to warehouse; annual volume 1,200,000 lb; product worth USD 25 per lb; plant and carrying cost 30% per year (a trade-off between transport cost and inventory carrying cost).<\/p>\n<h4>3. Flow<\/h4><table><tr><th>Flow<\/th><th>Meaning<\/th><th>Challenges<\/th><\/tr><tr><td>Physical flow<\/td><td>Movement of goods from suppliers to customers (transport, handling, storage)<\/td><td>Delays, capacity limits, disruptions<\/td><\/tr><tr><td>Information flow<\/td><td>Orders, invoices, forecasts, data exchange<\/td><td>Silos, inaccurate data, incompatible systems<\/td><\/tr><tr><td>Financial flow<\/td><td>Payments, pricing, invoicing<\/td><td>Payment delays, invoice mismatch, currency changes<\/td><\/tr><tr><td>Reverse flow<\/td><td>Returns, repairs, recycling, disposal (reverse logistics)<\/td><td>Returns handling, defective goods, regulation, cost<\/td><\/tr><\/table><h4>4. Route<\/h4><p>Strategic selection of optimal routes considering distance, time, cost, capacity, mode, infrastructure and regulation. It minimises cost and transit time, optimises resources and ensures timely delivery. Challenges: traffic, road conditions, weather, restrictions, geopolitics.<\/p>\n<h4>Transportation management systems (TMS)<\/h4><p>Software that automates carrier selection, load building, routing and scheduling and freight payment. Lecture facts: US companies spend over <b>USD 600 billion<\/b> a year on transportation and about USD 1 billion on TMS. Examples: Polaroid (least-cost carrier and method), Tree of Life (inbound freight efficiency from <b>55% to 75%<\/b>), Orange Glo (automated freight payment, better on-time delivery).<\/p>"],["Lecture 49 - Transportation Problem Programming (types, IBFS, NWCR)","<div class=\"imp\"><b>★ Important:<\/b> Asked: a <b>balanced transportation problem has total supply = total demand<\/b>. Know NWCR, LCM, VAM, MODI and the optimality condition <b>m + n - 1<\/b> allocations.<\/div><p>The <b>transportation problem<\/b> finds the cheapest way to ship goods from several sources (factories, warehouses) to several destinations (customers, DCs) while meeting supply and demand. It is a linear programming problem: decision variables are quantities shipped, the objective minimises total cost.<\/p>\n<h4>Assumptions<\/h4><ul><li>Fixed supply and demand<\/li><li>Single homogeneous commodity<\/li><li>Cost is linear in quantity shipped<\/li><li>Route capacity limits (maximum per route)<\/li><li>Non-negative variables<\/li><li>Full shipments (goods fully transported)<\/li><\/ul><h4>Types<\/h4><table><tr><th>Type<\/th><th>Meaning<\/th><\/tr><tr><td><b>Balanced<\/b><\/td><td><b>Total supply = total demand<\/b><\/td><\/tr><tr><td>Unbalanced<\/td><td>Supply is not equal to demand; add a <b>dummy source or destination<\/b> with zero cost to balance<\/td><\/tr><\/table><div class=\"dg\"><svg viewBox=\"0 0 760 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"180\" y1=\"55\" x2=\"210\" y2=\"55\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"380\" y1=\"55\" x2=\"410\" y2=\"55\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"580\" y1=\"55\" x2=\"610\" y2=\"55\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"10\" y=\"25\" width=\"170\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"95\" y=\"44\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Phase I<\/text><text x=\"95\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Initial basic feasible<\/text><text x=\"95\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">solution (NWCR, LCM, VAM)<\/text><rect x=\"210\" y=\"25\" width=\"170\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"295\" y=\"44\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Check<\/text><text x=\"295\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">allocations = m + n - 1?<\/text><text x=\"295\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">(else add epsilon)<\/text><rect x=\"410\" y=\"25\" width=\"170\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"495\" y=\"44\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Phase II<\/text><text x=\"495\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Optimise with MODI<\/text><text x=\"495\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">(u and v, opportunity cost d)<\/text><rect x=\"610\" y=\"25\" width=\"140\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"680\" y=\"51.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Optimal when<\/text><text x=\"680\" y=\"66.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">all d >= 0<\/text><\/svg><div class=\"cap\">Rebuilt: two phases of the transportation problem.<\/div><\/div><h4>Phase I: initial basic feasible solution (IBFS)<\/h4><p>An initial allocation meeting all supply and demand constraints; problem must be balanced. A basic solution has <b>m + n - 1<\/b> allocations (m sources, n destinations).<\/p>\n<h4>1. North-West Corner Rule (NWCR)<\/h4><p>Start at the upper-left cell; allocate min(supply, demand); strike out the exhausted row or column; move on; repeat. It ignores costs, so it is easy but rarely optimal.<\/p>\n<p><b>Lecture example:<\/b> supplies Jaipur 40, Udaipur 60, Mumbai 70; demands Kanpur 70, Pune 40, Delhi 60 (balanced: 170 = 170).<\/p><table><tr><th>Allocation<\/th><th>Units<\/th><th>Unit cost (Rs)<\/th><th>Cost<\/th><\/tr><tr><td>Jaipur to Kanpur<\/td><td>40<\/td><td>4<\/td><td>160<\/td><\/tr><tr><td>Udaipur to Kanpur<\/td><td>30<\/td><td>3<\/td><td>90<\/td><\/tr><tr><td>Udaipur to Pune<\/td><td>30<\/td><td>4<\/td><td>120<\/td><\/tr><tr><td>Mumbai to Pune<\/td><td>10<\/td><td>2<\/td><td>20<\/td><\/tr><tr><td>Mumbai to Delhi<\/td><td>60<\/td><td>8<\/td><td>480<\/td><\/tr><tr><td><b>Total<\/b><\/td><td>170<\/td><td><\/td><td><b>Rs 870<\/b><\/td><\/tr><\/table><div class=\"tip\">The slide writes the first term as (40x40); the correct product is 4 x 40 = 160, which is what makes the total Rs 870.<\/div>\n"],["Lecture 50 - Transportation Problem Programming (LCM, VAM, MODI)","<div class=\"imp\"><b>★ Important:<\/b> Know <b>LCM<\/b>, <b>VAM<\/b> and the <b>MODI optimality test<\/b>; optimal when all opportunity costs dij &gt;= 0, and dij = 0 signals an alternative optimum.<\/div><h4>2. Least Cost Method (LCM)<\/h4><p>Pick the cell with the lowest cost in the whole table, allocate min(supply, demand), strike out the satisfied row or column, repeat. Ties are broken arbitrarily (e.g. two cells with cost 3). In the lecture example the lowest cost is 1 (Jaipur to Delhi), and 40 units are allocated.<\/p>\n<h4>3. Vogel's Approximation Method (VAM)<\/h4><p>Standard method: for each row and column compute the <b>penalty<\/b> (difference between the two smallest costs), select the row or column with the largest penalty, allocate the maximum to its cheapest cell, strike out, recompute. Usually gives a start closest to optimal.<\/p>\n<h4>Phase II: optimality with MODI (u-v method)<\/h4><ul><li>Needs m + n - 1 allocations (add a tiny epsilon if fewer: degenerate case)<\/li><li>Set one u or v to 0; for each occupied cell ui + vj = cij to find all u and v<\/li><li>For each empty cell compute opportunity cost dij = cij - (ui + vj)<\/li><li><b>If all dij &gt;= 0 the solution is optimal<\/b>; if some dij = 0 an alternative optimum exists<\/li><li>Otherwise form a loop from the most negative cell, shift units and repeat<\/li><\/ul><h4>Lecture example: optimal result<\/h4><p>All dij &gt;= 0 with d32 = 0, so the current solution is optimal and an <b>alternative optimum exists<\/b>. Optimal allocation: X11 = 10, X12 = 50, X13 = 40, X23 = 30, X25 = 90, X31 = 30, X34 = 90.<\/p><div class=\"cards\"><div class=\"m\"><b>Rs 1,400<\/b><span>Minimum cost = 4x10 + 1x50 + 2x40 + 3x30 + 7x90 + 5x30 + 4x90<\/span><\/div><\/div><h4>Why transportation programming is useful in logistics<\/h4><ul><li><b>Cost minimisation<\/b> - fuel, maintenance, labour<\/li><li><b>Improved service levels<\/b> - faster, more reliable delivery<\/li><li><b>Inventory management<\/b> - timely delivery, fewer stock-outs, less excess<\/li><li><b>Resource optimisation<\/b> - vehicles, drivers, warehouses, less idle time<\/li><li><b>Time efficiency<\/b> - best routes and schedules<\/li><li><b>Competitive advantage<\/b> - lower costs, better service<\/li><\/ul>"],["Lecture 51 - Assignment Problem Programming","<div class=\"imp\"><b>★ Important:<\/b> Assignment problem is a <b>special case of the transportation problem<\/b> (one-to-one, square matrix). Know the <b>Hungarian method<\/b> and the dummy row/column rule.<\/div><p>An <b>assignment problem<\/b> assigns a number of resources to an equal number of activities to minimise total cost (or maximise total profit). It arises because men, machines and so on have different efficiencies for different activities. Uses: workers to machines, markets to factories, salesmen to sales areas.<\/p>\n<h4>Mathematical model<\/h4><ul><li>n jobs and n persons; cij = cost of person i on job j<\/li><li>xij = 1 if resource i is assigned to task j, otherwise 0<\/li><li>Minimise ΣΣ cij xij<\/li><li>Constraints: each task gets exactly one resource and each resource exactly one task<\/li><li>A special application of linear programming, a special case of the transportation problem<\/li><\/ul><table><tr><th>Type<\/th><th>Matrix<\/th><\/tr><tr><td>Balanced<\/td><td>Square (n x n); rows = columns<\/td><\/tr><tr><td>Unbalanced<\/td><td>Non-square; add a <b>dummy row or column with zero costs<\/b><\/td><\/tr><\/table><h4>Hungarian method<\/h4><div class=\"dg\"><svg viewBox=\"0 0 780 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"120\" y1=\"55\" x2=\"130\" y2=\"55\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"250\" y1=\"55\" x2=\"260\" y2=\"55\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"380\" y1=\"55\" x2=\"390\" y2=\"55\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"510\" y1=\"55\" x2=\"520\" y2=\"55\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"640\" y1=\"55\" x2=\"650\" y2=\"55\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"10\" y=\"25\" width=\"110\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"65\" y=\"44\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">1. Balance<\/text><text x=\"65\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">(add dummy,<\/text><text x=\"65\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">cost 0)<\/text><rect x=\"130\" y=\"25\" width=\"120\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"190\" y=\"44\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">2. Row reduce,<\/text><text x=\"190\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">then column<\/text><text x=\"190\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">reduce<\/text><rect x=\"260\" y=\"25\" width=\"120\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"320\" y=\"44\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">3. Assign<\/text><text x=\"320\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">single zeros<\/text><text x=\"320\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">(box and strike)<\/text><rect x=\"390\" y=\"25\" width=\"120\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"450\" y=\"44\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">4. Assignments<\/text><text x=\"450\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">= n?<\/text><text x=\"450\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">then optimal<\/text><rect x=\"520\" y=\"25\" width=\"120\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"580\" y=\"44\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">5. Cover zeros<\/text><text x=\"580\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">with minimum<\/text><text x=\"580\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">lines<\/text><rect x=\"650\" y=\"25\" width=\"120\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"710\" y=\"44\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">6. Subtract K<\/text><text x=\"710\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">uncovered, add K<\/text><text x=\"710\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">at crossings<\/text><text x=\"390\" y=\"130\" fill=\"#71717a\" font-size=\"12\" text-anchor=\"middle\">If lines < n, repeat from step 3 with the revised table<\/text><\/svg><div class=\"cap\">Rebuilt: Hungarian method flow.<\/div><\/div><table><tr><th>Step<\/th><th>Action<\/th><\/tr><tr><td>1<\/td><td>Build the cost table and balance it (dummy with zero cost)<\/td><\/tr><tr><td>2<\/td><td>Opportunity cost table: subtract row minimum from each row, then column minimum from each column; every row and column now has a zero<\/td><\/tr><tr><td>3<\/td><td>Assign: find a row with exactly one unmarked zero, box it, strike other zeros in its column; repeat for columns; if ties, choose arbitrarily (then an alternative optimum exists)<\/td><\/tr><tr><td>4<\/td><td>If assignments = n, optimal; total cost uses the original costs of assigned cells<\/td><\/tr><tr><td>5<\/td><td>Otherwise cover all zeros with the minimum number of lines: tick unassigned rows, tick columns with zeros in ticked rows, tick rows with assignments in ticked columns, repeat; draw lines through ticked columns and unticked rows<\/td><\/tr><tr><td>6<\/td><td>Revise: K = smallest uncovered element; subtract K from uncovered cells, add K at line crossings; singly covered cells unchanged<\/td><\/tr><tr><td>7<\/td><td>Repeat steps 3 to 6 until optimal<\/td><\/tr><\/table><h4>Worked example 1 (computer centre)<\/h4><p>Three programmers and three programmes: row minima 80, 80 and 110 are subtracted; then column minima 0, 10 and 0; single zeros are assigned in (1,C) and (3,A), then (2,B). Assignments (3) = rows (3), so the solution is optimal.<\/p>\n<h4>Worked example 2 (unbalanced)<\/h4><p>Four jobs, five machines: a <b>dummy job 5<\/b> with zero costs is added; after the first pass only four assignments exist; the covering lines number 4, less than the order 5, so the matrix is revised with the smallest uncovered element; then 5 assignments are found. <b>Machine E receives no job<\/b> (the dummy), giving the minimum total time.<\/p>\n<h4>Advantages of assignment programming<\/h4><table><tr><th>Group<\/th><th>Points<\/th><\/tr><tr><td>Efficiency<\/td><td>Minimises cost, time and wastage; can maximise benefits; dynamic optimisation; enhances productivity<\/td><\/tr><tr><td>Clarity<\/td><td>Clear mathematical objective, quantifiable metrics, integrates constraints<\/td><\/tr><tr><td>Ease<\/td><td>Simple binary variables; tabular representation; scalable; accessible to non-experts<\/td><\/tr><tr><td>Flexibility<\/td><td>Adaptable constraints; tailored solutions; what-if scenario analysis<\/td><\/tr><tr><td>Real-time use<\/td><td>Fast response in emergencies and transport; IoT and sensor data; workforce management; routing and scheduling<\/td><\/tr><\/table><h4>Assumptions<\/h4><ul><li>Deterministic demand and supply<\/li><li>Homogeneous tasks and resources<\/li><li>Fixed assignment costs<\/li><li>No intermediate stops or transshipments<\/li><li>Linear relationships<\/li><li>Simple capacity limits<\/li><li>Single period planning<\/li><li>Objective: minimise cost or maximise benefit<\/li><li>Non-negative variables<\/li><li>Fixed origins and destinations<\/li><\/ul>"]],"gl":[["Demand forecasting","Understanding and predicting customer demand to avoid overproduction and underproduction.",""],["Seasonality","Demand changes with seasons, holidays, events.",""],["Types of goods","Perishables need precise forecasts; subscriptions are predictable.",""],["Geography (forecast)","Where customers live and stock is held (swimwear in Florida).",""],["Passive forecasting","Use past sales only; for steady sales.",""],["Active forecasti
