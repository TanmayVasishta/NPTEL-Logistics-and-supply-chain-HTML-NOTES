% SKUs and customers<\/td><td>Share of volume from top 20%<\/td><\/tr><tr><td>Average batch size<\/td><td>Average produced per batch<\/td><\/tr><tr><td>Production service level<\/td><td>Fraction of production orders completed on time<\/td><\/tr><tr><td>Product variety<\/td><td>Number of products processed; cost and flow time rise with variety<\/td><\/tr><\/table><h4>Inventory<\/h4><div class=\"cards\"><div class=\"m\"><b>I = D x T<\/b><span>Little's Law: Inventory = Throughput (demand rate) x Flow time<\/span><\/div><div class=\"m\"><b>T = I / D<\/b><span>Cut inventory at constant throughput and flow time falls<\/span><\/div><\/div><ul><li>Matches supply and demand (buffer between production and consumption)<\/li><li>Exploits economies of scale in production and transport<\/li><li>Raises responsiveness (e.g. apparel) but high inventory ties up capital, adds holding cost, risks markdown and obsolescence<\/li><li>Form, location and quantity decide competitiveness: finished goods near customers = responsive and costly; centralised raw material = cheap and slow<\/li><li><b>Amazon:<\/b> best sellers stocked in many regional warehouses, slow movers in few, slowest from publisher or printed on demand<\/li><li>Three inventory types: <b>cycle<\/b> (normal demand), <b>safety<\/b> (buffer against uncertainty), <b>seasonal<\/b> (peak periods); also the desired level of product availability<\/li><\/ul><h4>Inventory metrics<\/h4><table><tr><th>Metric<\/th><th>Meaning<\/th><\/tr><tr><td>Cash conversion cycle<\/td><td>Inventory, payables and receivables; time to turn cash outlay into cash from sales<\/td><\/tr><tr><td>Average inventory<\/td><td>In units, days of demand and financial value<\/td><\/tr><tr><td>Seasonal inventory<\/td><td>Difference between inflow beyond cycle and safety stock and sales<\/td><\/tr><tr><td>Inventory turnover<\/td><td>COGS or sales / average inventory<\/td><\/tr><tr><td>DIO<\/td><td>Average inventory / COGS per day; high means slow selling<\/td><\/tr><tr><td>Average replenishment batch size<\/td><td>Per SKU; max minus min inventory<\/td><\/tr><tr><td>Average safety inventory<\/td><td>Inventory on hand when a replenishment arrives<\/td><\/tr><tr><td>Fill rate<\/td><td>Share of orders met from stock<\/td><\/tr><tr><td>Fraction of time out of stock<\/td><td>Time a SKU has zero inventory; estimates lost sales<\/td><\/tr><tr><td>Obsolete inventory<\/td><td>Share past an obsolescence date<\/td><\/tr><\/table>"],["Lecture 30 - Supply Chain Drivers (Transportation, Information, Sourcing, Pricing)","<div class=\"imp\"><b>★ Important:<\/b> Asked: <b>air freight = highest responsiveness<\/b>; <b>Amazon free shipping (7-14 days) levels warehouse workload<\/b>. Remember the Dell, Blue Nile, Sunsweet and Cisco examples.<\/div><h4>Transportation<\/h4><ul><li>Moves product between stages; fast modes raise responsiveness and cost, slow modes (sea, rail) raise efficiency<\/li><li>Fast transport lets firms carry less inventory; mode choice shapes inventory and facility decisions<\/li><li><b>Dell<\/b> flies components from Asia (less inventory, higher transport cost); <b>Blue Nile<\/b> centralises diamond stock and ships FedEx overnight (no costly stores)<\/li><li>Network design: direct shipments versus consolidation points; modes: air, truck, rail, sea, pipeline, internet for information goods; choice by speed, shipment size, cost, flexibility<\/li><li>Inbound cost sits in COGS; outbound cost in selling, general and administrative expense<\/li><\/ul><table><tr><th>Transportation metric<\/th><th>Meaning<\/th><\/tr><tr><td>Average inbound transportation cost<\/td><td>Cost of bringing product in (percent of sales or COGS)<\/td><\/tr><tr><td>Average incoming shipment size<\/td><td>Units or value per inbound shipment<\/td><\/tr><tr><td>Inbound cost per shipment<\/td><td>Shows scale opportunities with shipment size<\/td><\/tr><tr><td>Average outbound transportation cost<\/td><td>Cost of sending out (per unit or percent of sales)<\/td><\/tr><tr><td>Average outbound shipment size<\/td><td>Units or value per outbound shipment<\/td><\/tr><tr><td>Outbound cost per shipment<\/td><td>Scale opportunities outbound<\/td><\/tr><tr><td>Fraction transported by mode<\/td><td>Share by truck, rail, air; finds over or under-used modes<\/td><\/tr><\/table><h4>Information<\/h4><ul><li>Raises asset utilisation, coordinates flows, increases responsiveness, cuts cost, supports customer-centric offers and IT investment<\/li><li>Examples: <b>Seven-Eleven Japan, Wal-Mart<\/b><\/li><li><b>Push<\/b> needs forecasts; <b>pull<\/b> needs actual demand data<\/li><li><b>S&OP<\/b> aligns sales forecasts with production and inventory plans; enabling tech: ERP, analytics, cloud<\/li><li><b>Sunsweet Growers<\/b> replaced Excel planning with an S&OP suite: production overruns fell from <b>30% to under 15%<\/b>, forecast accuracy up 15-20%, early warnings 2-3 weeks sooner<\/li><\/ul><table><tr><th>Information metric<\/th><th>Meaning<\/th><\/tr><tr><td>Forecast horizon<\/td><td>How far ahead; must be at least the decision lead time<\/td><\/tr><tr><td>Frequency of update<\/td><td>Update more often than the decision is revisited<\/td><\/tr><tr><td>Forecast error<\/td><td>Forecast minus actual; measure of uncertainty, drives safety inventory and spare capacity<\/td><\/tr><tr><td>Seasonal factors<\/td><td>Season average demand versus annual average<\/td><\/tr><tr><td>Variance from plan<\/td><td>Planned versus actual production or inventory; flags shortages and surpluses<\/td><\/tr><tr><td>Demand variability / order variability ratio<\/td><td>Standard deviations of demand and orders; below one may signal amplification issues<\/td><\/tr><\/table><div class=\"tip\"><b>Complexity versus value:<\/b> more information raises complexity and cost, with diminishing marginal value; share the minimum needed (e.g. aggregate sales rather than detailed point-of-sale data).<\/div>\n<h4>Sourcing<\/h4><ul><li>Purchasing goods and services; choose responsive or efficient sources, in-house or outsourced<\/li><li>Low-cost countries: IKEA furniture modules; Dell sources some PCs from China while keeping responsive in-house capacity<\/li><li>Outsource for responsiveness when in-house is costly (next-day package delivery); keep in-house for control (Zara quick order)<\/li><li>Outsource for efficiency when third parties offer scale<\/li><li><b>Cisco:<\/b> low-end home routers made and packed in China and shipped in bulk; high-end products from responsive contract manufacturers in the US<\/li><li>Decisions: in-house or outsource, supplier selection (number, criteria, negotiation or auction), procurement<\/li><li>Outsource only if it raises supply chain surplus more than doing it internally<\/li><\/ul><table><tr><th>Sourcing metric<\/th><th>Meaning<\/th><\/tr><tr><td>Days payable outstanding<\/td><td>Days between supplier performing and being paid<\/td><\/tr><tr><td>Average purchase price<\/td><td>Quantity-weighted price<\/td><\/tr><tr><td>Supply quality<\/td><td>Quality of supplied product<\/td><\/tr><tr><td>Supply lead time<\/td><td>Order to arrival; long = less responsive, more inventory<\/td><\/tr><tr><td>Fraction of on-time deliveries<\/td><td>Share of on-time deliveries<\/td><\/tr><tr><td>Range of purchase price<\/td><td>Fluctuation; checks quantity-price link<\/td><\/tr><tr><td>Average purchase quantity<\/td><td>Is enough aggregation occurring?<\/td><\/tr><tr><td>Supplier reliability<\/td><td>Variability of lead time and delivered quantity<\/td><\/tr><\/table><h4>Pricing<\/h4><ul><li>Sets revenue and customer segments; matches supply and demand when the chain is inflexible (short-term discounts shift demand)<\/li><li>Costco: consistently low prices for a segment valuing affordability<\/li><li><b>Everyday low pricing<\/b> gives stable demand and efficiency; <b>high-low<\/b> uses periodic deep discounts; <b>menu pricing<\/b> by time or delivery location<\/li><li>Pricing must reflect economies of scale and customer response-time preferences<\/li><li><b>Amazon (July 2008, two books worth USD 30):<\/b> standard 3-5 business days USD 4.98; two-day USD 13.97; one-day USD 22.97; <b>free shipping 7-14 business days<\/b><\/li><li>One-day buyers create high urgency; free-shipping buyers <b>level out warehouse workload<\/b>, so Amazon serves both responsive and cost-focused customers<\/li><\/ul><p>Pricing metrics include profit margin, revenue per unit, and variation of price and demand over time. Overall goal: raise total supply chain surplus.<\/p>"]],"gl":[["Supply chain uncertainty","Unpredictability and volatility disrupting flow of goods and materials.",""],["Demand uncertainty","Overall unpredictability of customer demand.",""],["Implied demand uncertainty","Uncertainty of the portion of demand the chain plans to satisfy.",""],["Supply uncertainty","Variability in availability and reliability of supply; high for new products.",""],["Risk vs uncertainty","Risk can be estimated (outcome x probability); uncertainty cannot.",""],["Bullwhip effect","Demand variance amplification upstream; reduced by visibility.",""],["CRM","Interface firm-customer: marketing, pricing, sales, order management.",""],["ISCM","Internal processes: capacity, demand and supply planning, fulfilment.",""],["SRM","Interface firm-suppliers: selection, negotiation.",""],["SCOR","Supply-Chain Council model: Plan, Source, Make, Deliver, Return (+Enable).",""],["SCOR attributes","Reliability, responsiveness, agility, costs, asset management efficiency.",""],["4 P's of SCOR","Performance, Process, Practice, People.",""],["Cyclic view","Customer order, replenishment, manufacturing, procurement cycles.",""],["Customer order cycle","Customer-retailer interface.",""],["Replenishment cycle","Retailer-distributor interface.",""],["Manufacturing cycle","Distributor-manufacturer interface.",""],["Procurement cycle","Manufacturer-supplier interface.",""],["Push process","Speculative, in anticipation of orders.",""],["Pull process","Reactive, in response to an order.",""],["Continuous model","Steady flow, stable demand (Amazon).",""],["Fast chain","Short life cycle, speed (Zara).",""],["Efficient chain","Waste reduction in competitive markets.",""],["Agile model","Process alignment, virtual integration, network base, market sensitivity (Nike).",""],["Custom-configured","Customer-tailored (Dell).",""],["Flexible model","Peaks and low demand (Hewlett Packard).",""],["Virtual model","Cloud and analytics (P&G).",""],["Control tower","Cloud AI platform for end-to-end real-time visibility.",""],["MILP","Mixed-integer linear programming, used for network design.",""],["Six drivers","Facilities, Inventory, Transportation, Information, Sourcing, Pricing.",""],["Little's Law","I = D x T.",""],["Cycle / safety / seasonal inventory","Core, buffer and peak-demand stocks.",""],["Inventory turnover","COGS (or sales) / average inventory.",""],["DIO","Days of inventory outstanding.",""],["Flow time efficiency","Theoretical flow time / actual flow time.",""],["EDLP vs high-low","Steady prices versus periodic deep discounts.",""],["Intel Atom case","Order cycle 9 weeks to 2; saved over USD 4 per chip.",""]],"q":[["o","'Implied demand uncertainty' in a supply chain focuses on:",["The total annual sales forecast of a company along with the variability caused due to seasonal patterns","The uncertainty associated with the portion of demand the supply chain plans to satisfy","The transportation costs across distribution centres","The variability in supplier pricing because of the seasonal pricing"],1,"Implied demand uncertainty concerns only the part of demand the chain plans to serve (Week 6 lecture)."],["o","The three Supply Chain Macro Processes are:",["Planning, Sourcing, and Delivering","Design, Build, and Distribute","Procurement, Operations, and Logistics","Customer Relationship Management, Internal Supply Chain Management, and Supplier Relationship Management"],3,"CRM, ISCM and SRM."],["o","In the Cyclic View, which cycle occurs at the interface between the retailer and the distributor?",["Customer order cycle","Replenishment cycle","Manufacturing cycle","Procurement cycle"],1,"Customer order: customer-retailer; replenishment: retailer-distributor; manufacturing: distributor-manufacturer; procurement: manufacturer-supplier."],["o","In the Push/Pull View, a 'Pull' process is best defined as:",["Execution initiated in anticipation of customer orders (speculative)","Producing goods before knowing actual customer demand","Execution initiated in response to a customer order (reactive)","Holding large amounts of finished goods inventory"],2,"Pull is reactive; push is speculative."],["o","Which transportation mode is generally used to achieve the highest responsiveness?",["Sea freight","Rail transport","Air freight","Pipeline"],2,"Air is fastest but costliest."],["o","The six key drivers of supply chain performance are:",["Facilities, Inventory, Transportation, Information, Sourcing, and Pricing","People, Process, Technology, Culture, Structure, and Strategy","Planning, Scheduling, Executing, Monitoring, Controlling, and Improving","Procurement, Operations, Logistics, Distribution, Returns, and Sustainability"],0,"Chopra and Meindl's six drivers."],["o","Centralizing facilities in a supply chain tends to:",["Increase responsiveness and increase costs","Increase efficiency but reduce responsiveness","Reduce efficiency and reduce responsiveness","Increase responsiveness and reduce costs"],1,"Centralising gains scale economies but customers are farther away."],["o","According to Little's Law, reducing inventory while keeping throughput constant will:",["Decrease flow time","Increase flow time","Have no effect on flow time","Eliminate the need for safety stock"],0,"I = D x T, so lower I with constant D means lower T."],["o","In Amazon's pricing example, customers opting for free shipping (7-14 business days) help Amazon by:",["Generating the highest revenue per order","Levelling out the workload at the warehouse over time, improving efficiency","Increasing the urgency of logistics operations","Reducing the need for any inventory"],1,"Slow free shipping lets Amazon smooth warehouse workload."],["o","A firm serving primarily emergency orders faces _____ implied demand uncertainty compared to a firm with long lead times.",["Lower","Equal","Higher","No difference in"],2,"Long lead times let orders be filled evenly, lowering uncertainty."],["x","Risk differs from uncertainty because risk:",["Cannot be estimated","Is a function of outcome and probability and can be estimated","Only applies to demand","Is always low"],1,"Uncertainty is when outcome or probability cannot be estimated."],["x","Raising a supply chain's service level will:",["Reduce implied demand uncertainty","Increase implied demand uncertainty even if demand uncertainty is unchanged","Have no effect","Eliminate surges"],1,"It requires covering rare surges."],["x","SCOR's five management processes are:",["Plan, Source, Make, Deliver, Return","Design, Build, Test, Ship, Bill","Buy, Store, Move, Sell, Return","Forecast, Order, Pack, Ship, Track"],0,"Enable supports all of them."],["x","Which is NOT a SCOR performance attribute?",["Reliability","Responsiveness","Brand loyalty","Asset management efficiency"],2,"Reliability, responsiveness, agility, costs, asset management efficiency."],["x","The manufacturing cycle occurs at the interface between:",["Customer and retailer","Retailer and distributor","Distributor and manufacturer","Manufacturer and supplier"],2,"Manufacturer-supplier is the procurement cycle."],["x","A 'Push' process is executed:",["In response to a customer order","In anticipation of customer orders","Only for services","Only after delivery"],1,"Push is speculative."],["x","Which is NOT one of the four traits of an agile supply chain?",["Process alignment","Virtual integration","Network base","Fixed long-term forecasting"],3,"Market sensitivity is the fourth."],["x","Dell's individualised computer configurations illustrate which model?",["Continuous","Custom-configured","Efficient","Flexible"],1,"Custom-configured chains tailor to the customer."],["x","In the Intel Atom chip case, the order cycle was reduced from:",["9 weeks to 2 weeks","2 weeks to 9 weeks","12 weeks to 6 weeks","5 days to 1 day"],0,"Make-to-order cut inventory and saved over USD 4 per unit."],["x","According to Little's Law, inventory equals:",["Throughput divided by flow time","Throughput multiplied by flow time","Flow time minus throughput","Demand plus cost"],1,"I = D x T."],["x","Blue Nile's strategy combines:",["Decentralised inventory and slow shipping","Centralised diamond inventory and FedEx overnight delivery","Many physical stores","Outsourced design only"],1,"Responsive transport allows centralised inventory and lower costs."],["x","Amazon's free shipping option ships in:",["1 day","2 days","3-5 business days","7-14 business days"],3,"It helps level out warehouse workload."],["x","Flow time efficiency is the ratio of:",["Actual to theoretical flow time","Theoretical to actual average flow time","Capacity to utilisation","Inventory to sales"],1,"Low values mean much time is spent waiting."]],"imp":[["Implied demand uncertainty","Uncertainty of the demand portion the chain plans to serve. Emergency orders = higher; higher service level = higher."],["Risk vs uncertainty","Risk = outcome x probability, estimable; uncertainty cannot be estimated. Supply uncertainty higher for new products and immature processes."],["Three macro processes","CRM (customer interface), ISCM (internal), SRM (supplier interface)."],["Cyclic view","Customer order (customer-retailer), replenishment (retailer-distributor), manufacturing (distributor-manufacturer), procurement (manufacturer-supplier)."],["Push/pull view","Pull = reactive to an order; push = speculative, anticipating orders."],["SCOR model","Plan, Source, Make, Deliver, Return (+Enable); five attributes; 4 P's; 250+ metrics; Supply-Chain Council."],["Seven SC models with examples","Continuous (Amazon), fast (Zara), efficient, agile (Nike; 4 traits), custom-configured (Dell), flexible (HP), virtual (P&G)."],["Intel Atom case","Make-to-order; order cycle 9 to 2 weeks; saved over USD 4 on a USD 20 chip (from about USD 5.50)."],["Six drivers","Facilities, inventory, transportation (logistics) + information, sourcing, pricing (cross-functional)."],["Facilities trade-off","Centralise = efficiency up, responsiveness down; decentralise = reverse."],["Little's Law","I = D x T; cutting inventory at constant throughput cuts flow time."],["Inventory types and metrics","Cycle, safety, seasonal; turnover, DIO, fill rate, cash conversion cycle."],["Transportation trade-off","Air = most responsive, costly; sea and rail = efficient. Dell flies parts; Blue Nile uses FedEx overnight."],["Information limits","Share the minimum necessary; Sunsweet 30% to under 15% overruns; forecast error drives safety stock."],["Pricing and Amazon","Menu pricing: USD 4.98 / 13.97 / 22.97 or free (7-14 days) which levels warehouse workload; EDLP vs high-low."]]},"7":{"notes":[["Lecture 31 - Impellers, Concepts and Value Chain","<div class=\"tip\"><b>Analogy:<\/b> Like a car's engine, fuel and road: impellers are the forces that push a supply chain forward.<\/div><h4 data-t=\"M\">Impellers<\/h4><p>Driving forces or factors that influence and propel supply chain performance and operations. They include facilities, inventory, transportation, information systems, sourcing strategies, pricing mechanisms and other key drivers shaping responsiveness, efficiency and overall performance; each aligns strategy with broader business objectives and competitive strategy.<\/p><h4 data-t=\"H\">Traditional 3 impellers<\/h4><p>(1) Empowered customer: more knowledgeable and demanding; expects variety, availability, competitive pricing; transparency such as seeing restaurant kitchens raises expectations. (2) Developments in information technology tools: faster, more efficient supply chains; data collection, workforce management, resource tracking, real-time inventory monitoring; tools: MRP, ERP, VMI, TAV. (3) Globalization: new markets and consumers, more competition and risk, easy export and import.<\/p><h4 data-t=\"L\">2 additional impellers (some literature)<\/h4><p>Focus on sustainability (ethical sourcing, energy-efficient transport and logistics, waste reduction). Collaboration and integration (across procurement, manufacturing, marketing, sales; partnerships with suppliers and logistics providers).<\/p><h4 data-t=\"M\">Systems concept<\/h4><p>Views the supply chain as a holistic, interconnected system, not isolated parts; a change in one part ripples through the whole; optimise the whole network rather than segments.<\/p><h4 data-t=\"M\">Total cost concept<\/h4><p>Considers all supply chain costs including indirect and hidden ones: procurement, production, transportation, inventory, storage, distribution. Aim: minimise total cost while keeping or improving quality; analyse cost drivers at each stage.<\/p><h4 data-t=\"M\">Trade-off concept<\/h4><p>Optimising one aspect usually needs sacrificing another (cost vs quality, cost vs speed, inventory level vs customer responsiveness); evaluate choices against strategic objectives.<\/p><h4 data-t=\"H\">Bullwhip effect<\/h4><p>Small fluctuations in consumer demand cause amplified order variations upstream. Causes: information delays, forecast inaccuracies, order batching and other distortions. Results: inefficiency, excess inventory, stock-outs, higher cost. Mitigation: better demand forecasting, shorter order lead times, vendor-managed inventory, collaboration and information sharing.<\/p><h4 data-t=\"M\">Value chain<\/h4><p>Series of interconnected activities that add value as a product moves from conception to consumption. Primary: new product development (specifications from market needs), marketing and sales (generate demand, gather feedback), operations (transform inputs to outputs), distribution (logistics, warehousing, transportation), service (inquiries, issues, retention). Supporting: finance (budgeting, investment), accounting (records and reporting), information technology (systems, networks, data), human resources (recruit, train, develop).<\/p><h4 data-t=\"M\">5 essential considerations<\/h4><p>Supply sense, supply response, deciding and committing, demand sense, demand response.<\/p><h4 data-t=\"H\">Supply sense<\/h4><p>Ability of supply chain professionals to anticipate, understand and respond effectively to shifts and challenges in the supply chain environment; strategic thinking, analysis, proactive decisions.<\/p><h4 data-t=\"M\">Supply response<\/h4><p>Operations that make things happen (manufacturing, asset management); ability to adjust supply chain operations to changes in demand, market conditions or external factors (responsiveness).<\/p><h4 data-t=\"L\">Deciding and committing<\/h4><p>Making strategic decisions and commitments aligned with business objectives: evaluating options, setting priorities, setting direction of the supply chain.<\/p><h4 data-t=\"M\">Demand sense<\/h4><p>Ability to sense and anticipate changes in customer demand accurately using data, analytics and market insight to understand preferences and forecast patterns.<\/p><h4 data-t=\"M\">Demand response<\/h4><p>Reacting promptly to changes in customer demand by adjusting production, inventory, distribution and fulfilment.<\/p><h4 data-t=\"L\">Case notes<\/h4><p>The lecture uses video cases (bullwhip effect during COVID-<mark>19<\/mark>; Amazon giving customers what they want, when they want). The summary: impellers (empowered customers, technology, globalization), sustainability and collaboration drive success.<\/p><h4 data-t=\"M\">Flow and rebuilt diagrams<\/h4><div class=\"viz\"><h5>Value chain in a company (Chopra &amp; Meindl)<\/h5><div class=\"flow\"><span>New product development<\/span><i>&rarr;<\/i><span>Marketing &amp; sales<\/span><i>&rarr;<\/i><span>Operations<\/span><i>&rarr;<\/i><span>Distribution<\/span><i>&rarr;<\/i><span>Service<\/span><\/div><div class=\"mid\" style=\"margin-top:10px\">Supporting functions: Finance &middot; Accounting &middot; Information Technology &middot; Human Resources<\/div><\/div>"],["Lecture 32 - Strategic Supply Chain Management (1)","<div class=\"tip\"><b>Analogy:<\/b> Like a football team's playbook: it says who does what, when to pass, and how the score is measured.<\/div><h4 data-t=\"M\">Supply chain strategy<\/h4><p>Overarching plan for planning, design, execution, control and monitoring of supply chain activities. It documents which function handles each activity, when collaboration is needed, what must happen and when, and how performance is measured. It should align to business goals and integrate activities. Best-in-class firms have a separate strategy for each core function, e.g. make-to-stock, make-to-order, engineer-to-order.<\/p><h4 data-t=\"L\">Components<\/h4><p>Sourcing (select suppliers, manage relationships for quality, cost, delivery); logistics (movement of goods, transportation, warehousing, inventory management); production (turning raw materials into finished goods); customer service (orders, after-sales, returns, complaints); distribution (own DCs, 3PLs).<\/p><h4 data-t=\"L\">21st-century competition<\/h4><p>Global economy and globalization, rapid technological change, increasing importance of knowledge and people. Competitive advantage = formulation and implementation of a superior value-creating strategy; commitments and actions to achieve above-average returns; what the firm will do and will not do.<\/p><h4 data-t=\"M\">Cost advantage<\/h4><p>Determine and control cost drivers; reconfigure the value chain if needed (alter production process, change automation, new distribution channel, new advertising media, direct instead of indirect sales, new raw material, forward or backward integration, change location relative to suppliers or buyers). Value-creating activities for cost leadership: cost-effective MIS, few management layers, simplified planning, consistent policies, effective training, easy-to-use manufacturing technologies, technology investment, low-cost raw materials, monitoring supplier performance, linking supplier products to production, economies of scale, efficient-scale facilities, effective delivery schedules, low-cost transportation, highly trained sales force, proper pricing.<\/p><h4 data-t=\"M\">Differentiation advantage<\/h4><p>Control cost drivers if needed; reconfigure the value chain to lower buyers' costs, raise product or service performance, and create sustainability through customer perceptions of uniqueness and reluctance to switch. Activities: highly developed MIS, emphasis on quality, worker compensation for creativity, subjective performance measures, basic research capability, technology, high-quality raw materials and replacement parts, superior incoming-material handling, attractive products, rapid response to specifications, order-processing procedures, customer credit, personal relationships.<\/p><h4 data-t=\"H\">Effective strategy qualities<\/h4><p>Collaborative (stakeholders share plans and data); agile (scale up or down); resilient (expect, mitigate, recover from disruption); digital (connected, controlled, informed); invest in cybersecurity (cyber threats rise with digitisation).<\/p><h4 data-t=\"L\">Technology examples<\/h4><p>ERP orchestrates activities with real-time information on processes, machines, inventory; IoT sensors monitor machine productivity and support predictive maintenance; AI and ML automate manufacturing, warehousing, transportation and distribution.<\/p><h4 data-t=\"L\">Optimisation levers<\/h4><p>Supply chain network design (analyse flows, costs, delivery times); demand planning; inventory optimisation (best locations, balance service and cost); S&OP (align what is made and sold with demand); workforce management.<\/p><h4 data-t=\"L\">Firm's strategic choices<\/h4><p>Economies of scale, barriers to market entry, diversification, product differentiation, industry concentration, market frictions.<\/p><h4 data-t=\"L\">Strategy per value-chain component<\/h4><p>Product development: portfolio selection; internal vs outsourced development. Marketing and sales: segmentation, positioning and pricing, promotion. Supply chain: procurement, manufacturing or service operations, distribution, outsourcing decisions. Broad structure: supplier strategy, operations strategy, logistics strategy.<\/p><h4 data-t=\"H\">Design strategy (distribution)<\/h4><p>Inventory management (levels, replenishment, location); transportation (modes, routes, carriers); operating facilities (location, capacity, layout of plants, warehouses, DCs); information flows (systems for demand forecasting, order management and real-time visibility across the chain).<\/p><h4 data-t=\"L\">Service strategy (distribution)<\/h4><p>Service design; service quality; customer experience management; service differentiation; service recovery; technology integration; employee training; continuous improvement.<\/p><h4 data-t=\"M\">Case: Unilever (CPFR)<\/h4><p>Early 2000s five-year growth strategy and supply chain restructure (governance, global procurement, supply chain managers, supplier engagement, technology): savings of <mark>$14.24 billion<\/mark>. Merged almost <mark>30<\/mark> warehouses into five distribution hubs able to fill orders in about a day; retailers' zero-inventory policy needs diffusion and cross-docking. Set up CPFR agreements with select retailers. Result: forecast accuracy up <mark>10%<\/mark>, inventory holding down <mark>10%<\/mark>, sales volume up <mark>5%<\/mark>.<\/p><h4 data-t=\"L\">Case: Eaton and Intel<\/h4><p>Eaton: pandemic resilience via supply chain education, multi-sourcing, more supplier collaboration, end-to-end connection. Intel: ethical sourcing; smelter audit protocol validates conflict-free tin, tungsten, gold, tantalum using RFID with bagging and tagging.<\/p>"],["Lecture 33 - Strategic Supply Chain Management (2): models","<div class=\"tip\"><b>Analogy:<\/b> Like checking the weather and your own fitness before a climb: external analysis shows what you might do, internal analysis shows what you can do.<\/div><h4 data-t=\"L\">Developing strategy<\/h4><p>A complex, dynamic field (procurement, manufacturing, distribution, customer service) driven by evolving demand, technology, global market dynamics and regulation. Models give a structured approach to decisions.<\/p><h4 data-t=\"M\">External vs internal analysis<\/h4><p>External environment: opportunities and threats, what a firm might choose to do. Internal organisation: unique resources, capabilities and competencies (needed for sustainable competitive advantage), what a firm can do.<\/p><h4 data-t=\"M\">Creating value<\/h4><p>Firms create value by exploiting core competencies; value is measured by product performance characteristics and attributes customers will pay for; superior value gives above-average returns. Walmart: 'everyday low pricing'. Core competencies plus product-market positions are the main sources of competitive advantage.<\/p><h4 data-t=\"L\">SWOT analysis (slide diagram missing)<\/h4><p>Evaluate strengths, weaknesses, opportunities, threats before designing logistics processes; address weaknesses, capitalise on strengths, leverage opportunities and mitigate threats. The lecture's own SWOT chart was an image; the rebuilt matrix below is added from web research.<\/p><h4 data-t=\"H\">Porter's Five Forces<\/h4><p>Strategic tool for analysing competitive forces; traditionally business strategy, adapted to assess the dynamics of the supply chain environment. Created by Harvard professor Michael Porter, published <mark>1979<\/mark> (HBR: 'How Competitive Forces Shape Strategy'); urges leaders to look beyond rivals to forces in the wider environment.<\/p><h4 data-t=\"H\">Five forces in supply chain terms<\/h4><p>Supplier power: concentration, switching costs, relationships. Buyer power: concentration, price sensitivity, differentiation. Threat of new entrants: barriers to entry, industry structure, technological advances. Threat of substitutes: customer preferences, differentiation, regulatory environment. Rivalry: market growth, differentiation, barriers to entry.<\/p><h4 data-t=\"M\">Four Corners model (listed on slide, no content)<span class=\"wb\">WEB<\/span><\/h4><p>Porter's tool for predicting a competitor's likely next moves from four corners: drivers, management assumptions, current strategy, capabilities. Drivers and assumptions are the motivation; strategy and capabilities are the actions. Often combined with Five Forces (Five Forces = current situation, Four Corners = possible future steps).<\/p><h4 data-t=\"L\">Implementation considerations<\/h4><p>No one-size-fits-all. Identify demand types (seasonal, linear, consistent; frequency; fluctuations; forecasting tools); understand the product portfolio (different strategies per product line); know customer location (regional vs global shipments); know suppliers' locations (foreign suppliers mean longer lead times); manage inventory with real-time updates.<\/p><h4 data-t=\"L\">Case: Amazon<\/h4><p>Success rests on warehouse and distribution network, a diversified fleet, and advanced technology. More than <mark>2,373<\/mark> active facilities, over <mark>200<\/mark> fulfilment centres in North America, about <mark>319<\/mark> million sq ft of US warehouse space. FBA (sellers send items to Amazon centres; Amazon packs, delivers, services) and FBA Onsite (Amazon optimises seller processes using its WMS while stock stays at the seller). Robots pick, pack, load and store; Scout is a six-wheeled delivery robot. Inventory turnover about 8.<mark>39<\/mark> for fiscal year ending December <mark>2022<\/mark>.<\/p><h4 data-t=\"M\">Case: Starbucks<\/h4><p>Over <mark>35,000<\/mark> shops, over <mark>$32 billion<\/mark> revenue, <mark>50<\/mark>+ years. Vertically integrated, working with about <mark>400,000<\/mark> coffee producers; own C.A.F.E. (Coffee and Farmer Equity) Practices and ESG standards with strict screening. In <mark>2008<\/mark> Peter Gibbons (VP global supply chain operations) simplified it: four macro-operations (plan, source, manufacture, deliver), centralised logistics, and a binary Scorecard System measuring operational safety, on-time supply and order fulfilment, overall supply chain cost, and financial cost-effectiveness. Result: <mark>98.6%<\/mark> of coffee ethically sourced; worldwide sales up <mark>5%<\/mark>.<\/p><h4 data-t=\"M\">Flow and rebuilt diagrams<\/h4><div class=\"viz\"><h5>SWOT of a supply chain <span class=\"wb\">WEB<\/span><\/h5><div class=\"g2\"><div><b>Strengths (internal, +)<\/b>Agility, end-to-end visibility, reliable supplier partnerships, efficient logistics and inventory systems.<\/div><div><b>Weaknesses (internal, -)<\/b>Inflexible or slow supply chain, excess idle inventory, poor shipment visibility, dependence on single suppliers, slow supplier payment.<\/div><div><b>Opportunities (external, +)<\/b>New technologies (analytics, automation, tracking), new markets and partnerships, sustainability-led differentiation.<\/div><div><b>Threats (external, -)<\/b>Disruptions (disasters, geopolitics, strikes), cyber-attacks on digitised chains, customer or supplier failure, new competitors, regulation.<\/div><\/div><p class=\"cap\">Strategy pairs: SO use strengths on opportunities; ST use strengths against threats; WO use opportunities to fix weaknesses; WT minimise weaknesses and avoid threats. Example content is typical, not from your slides.<\/p><\/div><div class=\"viz\"><h5>Porter's Five Forces adapted to supply chain (from slides)<\/h5><div class=\"g3\"><div class=\"box\"><b>Threat of new entrants<\/b>Barriers to entry, industry structure, technology advances.<\/div><div class=\"box\"><b>Rivalry among competitors<\/b>Market growth, product differentiation, barriers to entry.<\/div><div class=\"box\"><b>Threat of substitutes<\/b>Customer preferences, differentiation, regulatory environment.<\/div><\/div><div class=\"g2\" style=\"margin-top:8px\"><div><b>Supplier power<\/b>Supplier concentration, switching costs, supplier relationships.<\/div><div><b>Buyer power<\/b>Buyer concentration, price sensitivity, product differentiation.<\/div><\/div><\/div><div class=\"viz\"><h5>Porter's Four Corners model <span class=\"wb\">WEB<\/span><\/h5><div class=\"g2\"><div><b>Drivers (motivation)<\/b>Competitor's goals; are they satisfied with performance and position?<\/div><div><b>Management assumptions (motivation)<\/b>How management sees itself, the industry and rivals; makes strategy proactive or reactive.<\/div><div><b>Current strategy (action)<\/b>What the rival is doing; gap between intended and realised strategy.<\/div><div><b>Capabilities (action)<\/b>Strengths and weaknesses; what the rival can realistically do.<\/div><\/div><p class=\"cap\">Drivers and assumptions explain why a rival acts; strategy and capabilities show what it can do. Used to predict the rival's likely next move.<\/p><\/div>"],["Lectures 34-35 - Achieving Supply Chain Strategic Fit","<div class=\"tip\"><b>Analogy:<\/b> Like matching shoes to the terrain: running shoes (efficient) for a track, hiking boots (responsive) for a mountain; the wrong pair loses the race.<\/div><h4 data-t=\"L\">Competitive strategy<\/h4><p>How a company distinguishes itself and satisfies customer needs; defines which customer needs it targets. Wal-Mart: wide range, low prices, high availability. McMaster-Carr: convenience, availability, responsiveness for MRO products. Blue Nile (variety, lower prices, online diamonds) vs Zales (personalised in-store, limited variety).<\/p><h4 data-t=\"L\">Supply chain strategies<\/h4><p>Efficient (lowest cost, streamlined, optimised inventory); responsive (agility, quick response, flexibility, even at higher cost); lean (eliminate waste, JIT, continuous improvement, value stream mapping); agile (adaptability to unpredictable markets, speed, innovation); collaborative (partnerships, information sharing, joint goals).<\/p><h4 data-t=\"M\">Strategic fit<\/h4><p>Consistency between the customer priorities of the competitive strategy and the supply chain capabilities of the supply chain strategy; competitive and supply chain strategies share the same goals. Failure comes from lack of fit or from processes and assets that cannot execute the strategy. Illustration: Dell.<\/p><h4 data-t=\"L\">Importance of fit<\/h4><p>Meets customer needs (satisfaction and loyalty); improves performance by optimising responsiveness and efficiency; enhances competitiveness (unique value propositions); manages costs and risks; supports growth and scalability.<\/p><h4 data-t=\"H\">3 steps to fit (in order)<\/h4><p>Step 1: Understand the customer and supply chain uncertainty. Step 2: Understand the supply chain capabilities. Step 3: Achieve strategic fit (coordinate functional strategies).<\/p><h4 data-t=\"M\">Step 1: customer needs<\/h4><p>Identify the needs of the customer segment: quantity per lot, response time tolerated, variety, service level, price, desired rate of innovation, demand uncertainty and implied demand uncertainty (uncertainty for the supply chain given the portion of demand it must meet and customer attributes desired).<\/p><h4 data-t=\"L\">Implied demand uncertainty and other attributes<\/h4><p>Low implied uncertainty vs high: product margin low vs high; average forecast error <mark>10%<\/mark> vs <mark>40%<\/mark>-<mark>100%<\/mark>; average stock-out rate <mark>1%<\/mark>-<mark>2%<\/mark> vs <mark>10%<\/mark>-<mark>40%<\/mark>; average forced season-end markdown <mark>0%<\/mark> vs <mark>10%<\/mark>-<mark>25%<\/mark>.<\/p><h4 data-t=\"M\">Customer needs and implied demand uncertainty<span class=\"wb\">WEB<\/span><\/h4><p>The slide table was an image. Chopra & Meindl Table 2.1: a wider range of quantity, shorter lead time, greater variety, more sales channels, faster innovation and a higher required service level each INCREASE implied demand uncertainty (see the rebuilt table below).<\/p><h4 data-t=\"M\">Supply uncertainty<\/h4><p>Depends on supply source capability and product life cycle: new products have higher supply uncertainty (designs and processes not perfected); mature products lower. Supply uncertainty rises with frequent breakdowns, unpredictable and low yields, poor quality, limited or inflexible capacity and an evolving production process. Implied uncertainty combines demand and supply uncertainty.<\/p><h4 data-t=\"M\">Step 2: supply chain capabilities<\/h4><p>Responsiveness is the ability to: respond to wide ranges of quantities, meet short lead times, handle large variety, build highly innovative products, meet a high service level, handle supply uncertainty. Assess responsiveness, flexibility, cost and quality; bridge gaps through technology, processes, supplier relationships, logistics.<\/p><h4 data-t=\"M\">Step 3: achieve fit<\/h4><p>Make what the supply chain does well consistent with the target customer's needs using the uncertainty/responsiveness map and the zone of strategic fit. High responsiveness for high implied uncertainty; efficiency for low. Two extremes: efficient (Walmart) and responsive (Dell). No right supply chain strategy independent of competitive strategy; there is a right one for a given competitive strategy.<\/p><h4 data-t=\"L\">McMaster-Carr example<\/h4><p>Customers value variety and rapid MRO delivery, so high implied demand uncertainty; it chooses a responsive supply chain over efficiency despite higher cost.<\/p><h4 data-t=\"L\">Roles across the chain<\/h4><p>Stages may need different responsiveness. Retailer holds minimal inventory and passes most implied uncertainty to the manufacturer; England, Inc. uses flexible manufacturing and can absorb more or less uncertainty, changing what its suppliers need (efficiency or responsiveness).<\/p><h4 data-t=\"M\">Efficient vs responsive<\/h4><p>Primary goal: lowest cost vs quick response. Product design: minimise product cost vs modularity for postponement. Pricing: lower margins vs higher margins. Manufacturing: high utilisation vs capacity flexibility. Inventory: minimise vs buffer. Lead time: reduce but not at greater cost vs aggressively reduce even if costly. Supplier selection: cost and quality (the slide text reads 'Cost and low quality', which looks like a typo) vs speed, flexibility, quality. Transportation: low-cost modes vs fast modes. Source: Fisher (HBR <mark>1997<\/mark>).<\/p><h4 data-t=\"L\">Other issues<\/h4><p>Multiple products and customer segments (different implied uncertainty; use different supply chains or tailor one); product life cycle (early: uncertain demand, high margins, availability first; late: predictable demand, low margins, price matters; responsiveness shifts to efficiency; e.g. pharma, Intel); competitive changes over time (more competitors raise emphasis on variety at reasonable price; the Internet widens variety).<\/p><h4 data-t=\"L\">Pharma example<\/h4><p>New drug: demand highly uncertain, margins high, availability captures share, so responsiveness matters most. Later as a commodity: demand and supply more certain, margins lower, price drives choice.<\/p><h4 data-t=\"L\">Tailored supply chain<\/h4><p>One size does not fit all. Dell: responsive chain for customised PCs, later tailored to serve low-cost channels such as Wal-Mart via contract manufacturers. Levi Strauss: standard vs customised jeans. W.W. Grainger: fast-moving, low-uncertainty items in decentralised locations near customers; slow-moving, high-uncertainty items in a centralised warehouse. Tactics: share links, vary manufacturing and transport modes, central vs decentralised stocking.<\/p><h4 data-t=\"M\">Scope of strategic fit<\/h4><p>Extent to which alignment applies across functions and stages. Five categories: intracompany intraoperation (minimise local cost; each stage independent), intracompany intrafunctional (minimise functional cost), intracompany interfunctional (maximise company profit), intercompany interfunctional (maximise supply chain surplus; share information, joint promotions), flexible or agile intercompany (strategic fit while partners change over time).<\/p><h4 data-t=\"L\">Key drivers to compete (GEP)<\/h4><p>Market alignment, global growth and expansion, supplier relationships, process redesign, performance management (real-time dashboards, KPIs, benchmarks).<\/p><h4 data-t=\"L\">Challenges to maintaining fit<\/h4><p>Increasing product variety and shrinking life cycles (use product platforms with common components; Apple limits variety). Globalization and uncertainty (exchange rates, global demand, commodity prices; build flexibility; Honda's flexible plants). Fragmentation of ownership (outsourcing and specialisation; align all members). Changing technology and business environment (Dell moved from direct sales to retail). Environment and sustainability (Starbucks' local sustainability in sourcing).<\/p><h4 data-t=\"H\">Case: Walmart<\/h4><p>Highest sales per square foot over two decades; cost structure supports lower prices. Strategic sourcing finds suppliers meeting demand at best price; long-term alliances promise increased purchases for lowest prices. Supplier communication networks make the network almost one company. Cross-docking is at the heart of efficient replenishment: reduces inventory and transport costs, saves transit time. Out-of-stock occurrences cut by <mark>16%<\/mark>.<\/p><h4 data-t=\"L\">Case: Dell<\/h4><p>Before <mark>2007<\/mark>: variety of customisable products at a reasonable price; direct sales model; build-to-order (assemble after order); JIT inventory; close supplier collaboration with real-time visibility. After <mark>2007<\/mark>: retail distribution, product diversification, supply chain optimisation (lean), strategic partnerships, sustainability, more customer-centric approach.<\/p><h4 data-t=\"M\">Flow and rebuilt diagrams<\/h4><div class=\"viz\"><h5>Impact of customer needs on implied demand uncertainty (Chopra &amp; Meindl, Table 2.1) <span class=\"wb\">WEB<\/span><\/h5><table class=\"tb\"><tr><th>Customer need<\/th><th>Effect on implied uncertainty<\/th><th>Why<\/th><\/tr><tr><td>Range of quantity required increases<\/td><td>Increases<\/td><td>Wider range of quantity means greater variance in demand<\/td><\/tr><tr><td>Lead time decreases<\/td><td>Increases<\/td><td>Less time to react to orders<\/td><\/tr><tr><td>Variety of products required increases<\/td><td>Increases<\/td><td>Demand per product becomes more disaggregated<\/td><\/tr><tr><td>Number of channels increases<\/td><td>Increases<\/td><td>Total customer demand is spread over more channels<\/td><\/tr><tr><td>Rate of innovation increases<\/td><td>Increases<\/td><td>New products tend to have more uncertain demand<\/td><\/tr><tr><td>Required service level increases<\/td><td>Increases<\/td><td>Firm must handle unusual surges in demand<\/td><\/tr><\/table><p class=\"cap\">In short: customers want more quantity, variety, novelty and availability, they want it now and they want it everywhere.<\/p><\/div><div class=\"viz\"><h5>Levels of implied demand uncertainty (examples) <span class=\"wb\">WEB<\/span><\/h5><div class=\"flow\"><span>LOW: detergent, long-lead-time steel (purely functional products)<\/span><i>&rarr;<\/i><span>increasing implied uncertainty<\/span><i>&rarr;<\/i><span>HIGH: high fashion, iPod-type launches, entirely new products<\/span><\/div><p class=\"cap\">Demand uncertainty is the uncertainty of customer demand; implied demand uncertainty is the resulting uncertainty for the supply chain given the portion of demand it must meet and the attributes customers want.<\/p><\/div><div class=\"viz\"><h5>Supply source capability and supply uncertainty <span class=\"wb\">WEB<\/span><\/h5><table class=\"tb\"><tr><th>Supply source capability<\/th><th>Effect on supply uncertainty<\/th><\/tr><tr><td>Frequent breakdowns<\/td><td>Increases<\/td><\/tr><tr><td>Unpredictable and low yields<\/td><td>Increases<\/td><\/tr><tr><td>Poor quality<\/td><td>Increases<\/td><\/tr><tr><td>Limited supply capacity<\/td><td>Increases<\/td><\/tr><tr><td>Inflexible supply capacity<\/td><td>Increases<\/td><\/tr><tr><td>Evolving production process<\/td><td>Increases<\/td><\/tr><\/table><p class=\"cap\">Stable process (mature technology, reliable suppliers) means low supply uncertainty; evolving process (new products, designs and processes not yet perfected) means high. Matches the slide note that new products have higher supply uncertainty and mature ones lower.<\/p><\/div><div class=\"viz\"><h5>Matching strategy to demand and supply uncertainty (Hau Lee, 2002, cited on the slide) <span class=\"wb\">WEB<\/span><\/h5><table class=\"tb\"><tr><th><\/th><th>Stable supply process (low supply uncertainty)<\/th><th>Evolving supply process (high supply uncertainty)<\/th><\/tr><tr><th>Functional product (low demand uncertainty)<\/th><td><b>Efficient<\/b> supply chain<\/td><td><b>Risk-hedging<\/b> supply chain<\/td><\/tr><tr><th>Innovative product (high demand uncertainty)<\/th><td><b>Responsive<\/b> supply chain<\/td><td><b>Agile<\/b> supply chain<\/td><\/tr><\/table><p class=\"cap\">Efficient: cut cost, high utilisation. Risk-hedging: pool and share inventory or capacity to hedge supply risk. Responsive: flexible, quick response to demand. Agile: responsive plus hedging, needed when both demand and supply are uncertain.<\/p><\/div><div class=\"viz\"><h5>Responsiveness spectrum (slide examples)<\/h5><div class=\"flow\"><span>Integrated steel mill: highly efficient<\/span><i>&rarr;<\/i><span>Hanes apparel: somewhat efficient<\/span><i>&rarr;<\/i><span>Most automotive production: somewhat responsive<\/span><i>&rarr;<\/i><span>Dell: highly responsive<\/span><\/div><\/div><div class=\"viz\"><h5>Uncertainty / responsiveness map and zone of strategic fit <span class=\"wb\">WEB<\/span><\/h5><svg viewBox=\"0 0 420 270\"><rect x=\"50\" y=\"10\" width=\"350\" height=\"220\" fill=\"#050505\" stroke=\"#333\"/><polygon points=\"50,230 50,170 400,10 400,70\" fill=\"#2a1d05\" stroke=\"#f59e0b\"/><text x=\"205\" y=\"125\" transform=\"rotate(-24 205 125)\" style=\"fill:#f59e0b\">ZONE OF STRATEGIC FIT<\/text><text x=\"60\" y=\"35\">Responsive SC, certain demand: over-spending<\/text><text x=\"150\" y=\"222\">Efficient SC, uncertain demand: stock-outs<\/text><circle cx=\"85\" cy=\"195\" r=\"5\" fill=\"#ececec\"/><text x=\"95\" y=\"199\">Efficient (Walmart, steel mill)<\/text><circle cx=\"365\" cy=\"48\" r=\"5\" fill=\"#ececec\"/><text x=\"262\" y=\"44\">Responsive (Dell)<\/text><text x=\"50\" y=\"248\">Certain demand<\/text><text x=\"330\" y=\"248\">Uncertain demand<\/text><text x=\"130\" y=\"262\">Implied uncertainty spectrum &rarr;<\/text><text x=\"2\" y=\"20\" transform=\"rotate(-90 12 130)\">Responsiveness &rarr;<\/text><\/svg><p class=\"cap\">Rebuilt from the lecture's axis labels (implied uncertainty vs responsiveness) and Chopra &amp; Meindl's map. Idea: match responsiveness to implied uncertainty; high-high or low-low is fit.<\/p><\/div><div class=\"viz\"><h5>Cost-responsiveness efficient frontier <span class=\"wb\">WEB<\/span><\/h5><svg viewBox=\"0 0 400 230\"><line x1=\"50\" y1=\"200\" x2=\"380\" y2=\"200\" stroke=\"#555\"/><line x1=\"50\" y1=\"200\" x2=\"50\" y2=\"15\" stroke=\"#555\"/><path d=\"M60 190 C170 180 260 130 365 30\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"2.5\"/><text x=\"150\" y=\"215\">Responsiveness: low &rarr; high<\/text><text x=\"2\" y=\"25\" transform=\"rotate(-90 12 110)\">Cost: low &rarr; high<\/text><text x=\"75\" y=\"60\">Inefficient (above the curve)<\/text><text x=\"210\" y=\"190\">Unattainable (below the curve)<\/text><text x=\"270\" y=\"100\" style=\"fill:#f59e0b\">Efficient frontier<\/text><\/svg><p class=\"cap\">Schematic: for a given responsiveness there is a minimum cost; moving right costs more. A company on the curve trades cost for responsiveness; a company above it is simply inefficient.<\/p><\/div><div class=\"viz\"><h5>Scope of strategic fit (narrow to wide)<\/h5><div class=\"flow\"><span>Intracompany intraoperation<\/span><i>&rarr;<\/i><span>Intracompany intrafunctional<\/span><i>&rarr;<\/i><span>Intracompany interfunctional<\/span><i>&rarr;<\/i><span>Intercompany interfunctional<\/span><i>&rarr;<\/i><span>Agile intercompany<\/span><\/div><\/div>"],["Lecture 36 - Make or Buy, Outsourcing and Strategic Alliances","<div class=\"tip\"><b>Analogy:<\/b> Like a restaurant deciding to bake its own bread or buy it from the bakery next door: do in-house what is your edge, buy the rest.<\/div><h4 data-t=\"M\">Strategic alliance<\/h4><p>Legal agreement between two or more companies committing resources to a common set of goals (new markets, shared IP, infrastructure, technology, people, or complementary product lines). Should be mutually beneficial.<\/p><h4 data-t=\"M\">Types by commitment<\/h4><p>Non-equity: lowest resource commitment, work together on a project without sharing ownership (two tech firms build software, each keeps its technology). Equity: moderate commitment; one company takes ownership in the other or a new entity (car maker invests in a battery company). Joint venture: highest commitment; a new independent legal entity (NewCo) co-owned, shared control and profits (two pharma firms develop a drug). Choice depends on project complexity, risk tolerance and desired control.<\/p><h4 data-t=\"L\">Vertical complementary alliance<\/h4><p>Between firms at different stages of the value chain (upstream or downstream) using skills in complementary ways to create new value: operational efficiency, new markets.<\/p><h4 data-t=\"L\">Horizontal complementary alliance<\/h4><p>Between firms at the same stage (often competitors or same industry) combining resources and skills; marketing, distribution, joint production; share risks and costs.<\/p><h4 data-t=\"H\">Purposes of outsourcing and alliances<\/h4><p>Enhance competitiveness (access specialised resources, capabilities, expertise not available internally); improve efficiency and cost-effectiveness; access new markets and customers; foster innovation and learning; mitigate risks and uncertainties; enhance flexibility and adaptability.<\/p><h4 data-t=\"M\">Benefits of outsourcing<\/h4><p>Cost savings; access to specialised expertise; focus on core competencies; scalability and flexibility; improved efficiency and productivity; risk mitigation; enhanced focus on customer satisfaction.<\/p><h4 data-t=\"M\">Limitations of outsourcing<\/h4><p>Loss of control; communication and coordination challenges (time zones, language, culture); quality and performance risks; dependency on external providers; data security and confidentiality; hidden costs and contractual issues; negative impact on internal workforce.<\/p><h4 data-t=\"M\">Make-or-buy decision<span class=\"wb\">WEB<\/span><\/h4><p>Choose between producing in-house and buying or outsourcing. Guided by core competencies (unique strengths that differentiate), cost, flexibility, scalability and strategic alignment with long-term goals. Typical criteria also include quality, capacity, control, risk and relationships. Cost and quality problems are the usual triggers.<\/p><h4 data-t=\"H\">Case: Apple<\/h4><p>Outsources manufacturing and assembly of all devices to China because manufacturing is not its core competency and assembly there is significantly cheaper; designs in the US, builds in China, ships back for sale.<\/p><h4 data-t=\"L\">Case: Nike<\/h4><p>Core competencies are marketing and design; partners with contract manufacturers instead of making products.<\/p><h4 data-t=\"L\">Case: Google<\/h4><p>Core competencies: search algorithm, data analytics, user experience design. Identify yours via SWOT, customer feedback, benchmarking against leaders, best practices.<\/p><h4 data-t=\"M\">Flow and rebuilt diagrams<\/h4><div class=\"viz\"><h5>Alliance commitment ladder<\/h5><div class=\"flow\"><span>Non-equity alliance (lowest commitment, no ownership)<\/span><i>&rarr;<\/i><span>Equity alliance (moderate, stake held)<\/span><i>&rarr;<\/i><span>Joint venture (highest, new co-owned legal entity)<\/span><\/div><\/div>"]],"gl":[["Impellers","Driving forces or factors that influence and propel supply chain performance and operations. They include facilities, inventory, transportation, information systems, sourcing strategies, pricing mechanisms and other key drivers shaping responsiveness, efficiency and overall performance; each aligns strategy with broader business objectives and competitive strategy.","K"],["Traditional 3 impellers","(1) Empowered customer: more knowledgeable and demanding; expects variety, availability, competitive pricing; transparency such as seeing restaurant kitchens raises expectations. (2) Developments in information technology tools: faster, more efficient supply chains; data collection, workforce management, resource tracking, real-time inventory monitoring; tools: MRP, ERP, VMI, TAV. (3) Globalization: new markets and consumers, more competition and risk, easy export and import.","E"],["2 additional impellers (some literature)","Focus on sustainability (ethical sourcing, energy-efficient transport and logistics, waste reduction). Collaboration and integration (across procurement, manufacturing, marketing, sales; partnerships with suppliers and logistics providers).",""],["Systems concept","Views the supply chain as a holistic, interconnected system, not isolated parts; a change in one part ripples through the whole; optimise the whole network rather than segments.","K"],["Total cost concept","Considers all supply chain costs including indirect and hidden ones: procurement, production, transportation, inventory, storage, distribution. Aim: minimise total cost while keeping or improving quality; analyse cost drivers at each stage.","K"],["Trade-off concept","Optimising one aspect usually needs sacrificing another (cost vs quality, cost vs speed, inventory level vs customer responsiveness); evaluate choices against strategic objectives.","K"],["Bullwhip effect","Small fluctuations in consumer demand cause amplified order variations upstream. Causes: information delays, forecast inaccuracies, order batching and other distortions. Results: inefficiency, excess inventory, stock-outs, higher cost. Mitigation: better demand forecasting, shorter order lead times, vendor-managed inventory, collaboration and information sharing.","E"],["Value chain","Series of interconnected activities that add value as a product moves from conception to consumption. Primary: new product development (specifications from market needs), marketing and sales (generate demand, gather feedback), operations (transform inputs to outputs), distribution (logistics, warehousing, transportation), service (inquiries, issues, retention). Supporting: finance (budgeting, investment), accounting (records and reporting), information technology (systems, networks, data), human resources (recruit, train, develop).","K"],["5 essential considerations","Supply sense, supply response, deciding and committing, demand sense, demand response.","K"],["Supply sense","Ability of supply chain professionals to anticipate, understand and respond effectively to shifts and challenges in the supply chain environment; strategic thinking, analysis, proactive decisions.","E"],["Supply response","Operations that make things happen (manufacturing, asset management); ability to adjust supply chain operations to changes in demand, market conditions or external factors (responsiveness).","K"],["Deciding and committing","Making strategic decisions and commitments aligned with business objectives: evaluating options, setting priorities, setting direction of the supply chain.",""],["Demand sense","Ability to sense and anticipate changes in customer demand accurately using data, analytics and market insight to understand preferences and forecast patterns.","K"],["Demand response","Reacting promptly to changes in customer demand by adjusting production, inventory, distribution and fulfilment.","K"],["Case notes","The lecture uses video cases (bullwhip effect during COVID-19; Amazon giving customers what they want, when they want). The summary: impellers (empowered customers, technology, globalization), sustainability and collaboration drive success.",""],["Supply chain strategy","Overarching plan for planning, design, execution, control and monitoring of supply chain activities. It documents which function handles each activity, when collaboration is needed, what must happen and when, and how performance is measured. It should align to business goals and integrate activities. Best-in-class firms have a separate strategy for each core function, e.g. make-to-stock, make-to-order, engineer-to-order.","K"],["Components","Sourcing (select suppliers, manage relationships for quality, cost, delivery); logistics (movement of goods, transportation, warehousing, inventory management); production (turning raw materials into finished goods); customer service (orders, after-sales, returns, complaints); distribution (own DCs, 3PLs).",""],["21st-century competition","Global economy and globalization, rapid technological change, increasing importance of knowledge and people. Competitive advantage = formulation and implementation of a superior value-creating strategy; commitments and actions to achieve above-average returns; what the firm will do and will not do.",""],["Cost advantage","Determine and control cost drivers; reconfigure the value chain if needed (alter production process, change automation, new distribution channel, new advertising media, direct instead of indirect sales, new raw material, forward or backward integration, change location relative to suppliers or buyers). Value-creating activities for cost leadership: cost-effective MIS, few management layers, simplified planning, consistent policies, effective training, easy-to-use manufacturing technologies, technology investment, low-cost raw materials, monitoring supplier performance, linking supplier products to production, economies of scale, efficient-scale facilities, effective delivery schedules, low-cost transportation, highly trained sales force, proper pricing.","K"],["Differentiation advantage","Control cost drivers if needed; reconfigure the value chain to lower buyers' costs, raise product or service performance, and create sustainability through customer perceptions of uniqueness and reluctance to switch. Activities: highly developed MIS, emphasis on quality, worker compensation for creativity, subjective performance measures, basic research capability, technology, high-quality raw materials and replacement parts, superior incoming-material handling, attractive products, rapid response to specifications, order-processing procedures, customer credit, personal relationships.","K"],["Effective strategy qualities","Collaborative (stakeholders share plans and data); agile (scale up or down); resilient (expect, mitigate, recover from disruption); digital (connected, controlled, informed); invest in cybersecurity (cyber threats rise with digitisation).","E"],["Technology examples","ERP orchestrates activities with real-time information on processes, machines, inventory; IoT sensors monitor machine productivity and support predictive maintenance; AI and ML automate manufacturing, warehousing, transportation and distribution.",""],["Optimisation levers","Supply chain network design (analyse flows, costs, delivery times); demand planning; inventory optimisation (best locations, balance service and cost); S&OP (align what is made and sold with demand); workforce management.",""],["Firm's strategic choices","Economies of scale, barriers to market entry, diversification, product differentiation, industry concentration, market frictions.",""],["Strategy per value-chain component","Product development: portfolio selection; internal vs outsourced development. Marketing and sales: segmentation, positioning and pricing, promotion. Supply chain: procurement, manufacturing or service operations, distribution, outsourcing decisions. Broad structure: supplier strategy, operations strategy, logistics strategy.",""],["Design strategy (distribution)","Inventory management (levels, replenishment, location); transportation (modes, routes, carriers); operating facilities (location, capacity, layout of plants, warehouses, DCs); information flows (systems for demand forecasting, order management and real-time visibility across the chain).","E"],["Service strategy (distribution)","Service design; service quality; customer experience management; service differentiation; service recovery; technology integration; employee training; continuous improvement.",""],["Case: Unilever (CPFR)","Early 2000s five-year growth strategy and supply chain restructure (governance, global procurement, supply chain managers, supplier engagement, technology): savings of $14.24 billion. Merged almost 30 warehouses into five distribution hubs able to fill orders in about a day; retailers' zero-inventory policy needs diffusion and cross-docking. Set up CPFR agreements with select retailers. Result: forecast accuracy up 10%, inventory holding down 10%, sales volume up 5%.","K"],["Case: Eaton and Intel","Eaton: pandemic resilience via supply chain education, multi-sourcing, more supplier collaboration, end-to-end connection. Intel: ethical sourcing; smelter audit protocol validates conflict-free tin, tungsten, gold, tantalum using RFID with bagging and tagging.",""],["Developing strategy","A complex, dynamic field (procurement, manufacturing, distribution, customer service) driven by evolving demand, technology, global market dynamics and regulation. Models give a structured approach to decisions.",""],["External vs internal analysis","External environment: opportunities and threats, what a firm might choose to do. Internal organisation: unique resources, capabilities and competencies (needed for sustainable competitive advantage), what a firm can do.","K"],["Creating value","Firms create value by exploiting core competencies; value is measured by product performance characteristics and attributes customers will pay for; superior value gives above-average returns. Walmart: 'everyday low pricing'. Core competencies plus product-market positions are the main sources of competitive advantage.","K"],["SWOT analysis (slide diagram missing)","Evaluate strengths, weaknesses, opportunities, threats before designing logistics processes; address weaknesses, capitalise on strengths, leverage opportunities and mitigate threats. The lecture's own SWOT chart was an image; the rebuilt matrix below is added from web research.",""],["Porter's Five Forces","Strategic tool for analysing competitive forces; traditionally business strategy, adapted to assess the dynamics of the supply chain environment. Created by Harvard professor Michael Porter, published 1979 (HBR: 'How Competitive Forces Shape Strategy'); urges leaders to look beyond rivals to forces in the wider environment.","E"],["Five forces in supply chain terms","Supplier power: concentration, switching costs, relationships. Buyer power: concentration, price sensitivity, differentiation. Threat of new entrants: barriers to entry, industry structure, technological advances. Threat of substitutes: customer preferences, differentiation, regulatory environment. Rivalry: market growth, differentiation, barriers to entry.","E"],["Four Corners model (listed on slide, no content)","Porter's tool for predicting a competitor's likely next moves from four corners: drivers, management assumptions, current strategy, capabilities. Drivers and assumptions are the motivation; strategy and capabilities are the actions. Often combined with Five Forces (Five Forces = current situation, Four Corners = possible future steps).","K"],["Implementation considerations","No one-size-fits-all. Identify demand types (seasonal, linear, consistent; frequency; fluctuations; forecasting tools); understand the product portfolio (different strategies per product line); know customer location (regional vs global shipments); know suppliers' locations (foreign suppliers mean longer lead times); manage inventory with real-time updates.",""],["Case: Amazon","Success rests on warehouse and distribution network, a diversified fleet, and advanced technology. More than 2,373 active facilities, over 200 fulfilment centres in North America, about 319 million sq ft of US warehouse space. FBA (sellers send items to Amazon centres; Amazon packs, delivers, services) and FBA Onsite (Amazon optimises seller processes using its WMS while stock stays at the seller). Robots pick, pack, load and store; Scout is a six-wheeled delivery robot. Inventory turnover about 8.39 for fiscal year ending December 2022.",""],["Case: Starbucks","Over 35,000 shops, over $32 billion revenue, 50+ years. Vertically integrated, working with about 400,000 coffee producers; own C.A.F.E. (Coffee and Farmer Equity) Practices and ESG standards with strict screening. In 2008 Peter Gibbons (VP global supply chain operations) simplified it: four macro-operations (plan, source, manufacture, deliver), centralised logistics, and a binary Scorecard System measuring operational safety, on-time supply and order fulfilment, overall supply chain cost, and financial cost-effectiveness. Result: 98.6% of coffee ethically sourced; worldwide sales up 5%.","K"],["Competitive strategy","How a company distinguishes itself and satisfies customer needs; defines which customer needs it targets. Wal-Mart: wide range, low prices, high availability. McMaster-Carr: convenience, availability, responsiveness for MRO products. Blue Nile (variety, lower prices, online diamonds) vs Zales (personalised in-store, limited variety).",""],["Supply chain strategies","Efficient (lowest cost, streamlined, optimised inventory); responsive (agility, quick response, flexibility, even at higher cost); lean (eliminate waste, JIT, continuous improvement, value stream mapping); agile (adaptability to unpredictable markets, speed, innovation); collaborative (partnerships, information sharing, joint goals).",""],["Strategic fit","Consistency between the customer priorities of the competitive strategy and the supply chain capabilities of the supply chain strategy; competitive and supply chain strategies share the same goals. Failure comes from lack of fit or from processes and assets that cannot execute the strategy. Illustration: Dell.","K"],["Importance of fit","Meets customer needs (satisfaction and loyalty); improves performance by optimising responsiveness and efficiency; enhances competitiveness (unique value propositions); manages costs and risks; supports growth and scalability.",""],["3 steps to fit (in order)","Step 1: Understand the customer and supply chain uncertainty. Step 2: Understand the supply chain capabilities. Step 3: Achieve strategic fit (coordinate functional strategies).","E"],["Step 1: customer needs","Identify the needs of the customer segment: quantity per lot, response time tolerated, variety, service level, price, desired rate of innovation, demand uncertainty and implied demand uncertainty (uncertainty for the supply chain given the portion of demand it must meet and customer attributes desired).","K"],["Implied demand uncertainty and other attributes","Low implied uncertainty vs high: product margin low vs high; average forecast error 10% vs 40%-100%; average stock-out rate 1%-2% vs 10%-40%; average forced season-end markdown 0% vs 10%-25%.",""],["Customer needs and implied demand uncertainty","The slide table was an image. Chopra & Meindl Table 2.1: a wider range of quantity, shorter lead time, greater variety, more sales channels, faster innovation and a higher required service level each INCREASE implied demand uncertainty (see the rebuilt table below).","K"],["Supply uncertainty","Depends on supply source capability and product life cycle: new products have higher supply uncertainty (designs and processes not perfected); mature products lower. Supply uncertainty rises with frequent breakdowns, unpredictable and low yields, poor quality, limited or inflexible capacity and an evolving production process. Implied uncertainty combines demand and supply uncertainty.","K"],["Step 2: supply chain capabilities","Responsiveness is the ability to: respond to wide ranges of quantities, meet short lead times, handle large variety, build highly innovative products, meet a high service level, handle supply uncertainty. Assess responsiveness, flexibility, cost and quality; bridge gaps through technology, processes, supplier relationships, logistics.","K"],["Step 3: achieve fit","Make what the supply chain does well consistent with the target customer's needs using the uncertainty/responsiveness map and the zone of strategic fit. High responsiveness for high implied uncertainty; efficiency for low. Two extremes: efficient (Walmart) and responsive (Dell). No right supply chain strategy independent of competitive strategy; there is a right one for a given competitive strategy.","K"],["McMaster-Carr example","Customers value variety and rapid MRO delivery, so high implied demand uncertainty; it chooses a responsive supply chain over efficiency despite higher cost.",""],["Roles across the chain","Stages may need different responsiveness. Retailer holds minimal inventory and passes most implied uncertainty to the manufacturer; England, Inc. uses flexible manufacturing and can absorb more or less uncertainty, changing what its suppliers need (efficiency or responsiveness).",""],["Efficient vs responsive","Primary goal: lowest cost vs quick response. Product design: minimise product cost vs modularity for postponement. Pricing: lower margins vs higher margins. Manufacturing: high utilisation vs capacity flexibility. Inventory: minimise vs buffer. Lead time: reduce but not at greater cost vs aggressively reduce even if costly. Supplier selection: cost and quality (the slide text reads 'Cost and low quality', which looks like a typo) vs speed, flexibility, quality. Transportation: low-cost modes vs fast modes. Source: Fisher (HBR 1997).","K"],["Other issues","Multiple products and customer segments (different implied uncertainty; use different supply chains or tailor one); product life cycle (early: uncertain demand, high margins, availability first; late: predictable demand, low margins, price matters; responsiveness shifts to efficiency; e.g. pharma, Intel); competitive changes over time (more competitors raise emphasis on variety at reasonable price; the Internet widens variety).",""],["Pharma example","New drug: demand highly uncertain, margins high, availability captures share, so responsiveness matters most. Later as a commodity: demand and supply more certain, margins lower, price drives choice.",""],["Tailored supply chain","One size does not fit all. Dell: responsive chain for customised PCs, later tailored to serve low-cost channels such as Wal-Mart via contract manufacturers. Levi Strauss: standard vs customised jeans. W.W. Grainger: fast-moving, low-uncertainty items in decentralised locations near customers; slow-moving, high-uncertainty items in a centralised warehouse. Tactics: share links, vary manufacturing and transport modes, central vs decentralised stocking.",""],["Scope of strategic fit","Extent to which alignment applies across functions and stages. Five categories: intracompany intraoperation (minimise local cost; each stage independent), intracompany intrafunctional (minimise functional cost), intracompany interfunctional (maximise company profit), intercompany interfunctional (maximise supply chain surplus; share information, joint promotions), flexible or agile intercompany (strategic fit while partners change over time).","K"],["Key drivers to compete (GEP)","Market alignment, global growth and expansion, supplier relationships, process redesign, performance management (real-time dashboards, KPIs, benchmarks).",""],["Challenges to maintaining fit","Increasing product variety and shrinking life cycles (use product platforms with common components; Apple limits variety). Globalization and uncertainty (exchange rates, global demand, commodity prices; build flexibility; Honda's flexible plants). Fragmentation of ownership (outsourcing and specialisation; align all members). Changing technology and business environment (Dell moved from direct sales to retail). Environment and sustainability (Starbucks' local sustainability in sourcing).",""],["Case: Walmart","Highest sales per square foot over two decades; cost structure supports lower prices. Strategic sourcing finds suppliers meeting demand at best price; long-term alliances promise increased purchases for lowest prices. Supplier communication networks make the network almost one company. Cross-docking is at the heart of efficient replenishment: reduces inventory and transport costs, saves transit time. Out-of-stock occurrences cut by 16%.","E"],["Case: Dell","Before 2007: variety of customisable products at a reasonable price; direct sales model; build-to-order (assemble after order); JIT inventory; close supplier collaboration with real-time visibility. After 2007: retail distribution, product diversification, supply chain optimisation (lean), strategic partnerships, sustainability, more customer-centric approach.",""],["Strategic alliance","Legal agreement between two or more companies committing resources to a common set of goals (new markets, shared IP, infrastructure, technology, people, or complementary product lines). Should be mutually beneficial.","K"],["Types by commitment","Non-equity: lowest resource commitment, work together on a project without sharing ownership (two tech firms build software, each keeps its technology). Equity: moderate commitment; one company takes ownership in the other or a new entity (car maker invests in a battery company). Joint venture: highest commitment; a new independent legal entity (NewCo) co-owned, shared control and profits (two pharma firms develop a drug). Choice depends on project complexity, risk tolerance and desired control.","K"],["Vertical complementary alliance","Between firms at different stages of the value chain (upstream or downstream) using skills in complementary ways to create new value: operational efficiency, new markets.",""],["Horizontal complementary alliance","Between firms at the same stage (often competitors or same industry) combining resources and skills; marketing, distribution, joint production; share risks and costs.",""],["Purposes of outsourcing and alliances","Enhance competitiveness (access specialised resources, capabilities, expertise not available internally); improve efficiency and cost-effectiveness; access new markets and customers; foster innovation and learning; mitigate risks and uncertainties; enhance flexibility and adaptability.","E"],["Benefits of outsourcing","Cost savings; access to specialised expertise; focus on core competencies; scalability and flexibility; improved efficiency and productivity; risk mitigation; enhanced focus on customer satisfaction.","K"],["Limitations of outsourcing","Loss of control; communication and coordination challenges (time zones, language, culture); quality and performance risks; dependency on external providers; data security and confidentiality; hidden costs and contractual issues; negative impact on internal workforce.","K"],["Make-or-buy decision","Choose between producing in-house and buying or outsourcing. Guided by core competencies (unique strengths that differentiate), cost, flexibility, scalability and strategic alignment with long-term goals. Typical criteria also include quality, capacity, control, risk and relationship
