ng","Includes growth plans; for start-ups and fast growers.",""],["Delphi method","Anonymous expert rounds (usually 2-4) until consensus; 10-50 experts.",""],["Expert / insider knowledge","Specialised understanding from experienced people.",""],["Salesforce composite","Weighted combination of several forecasts.",""],["Time series","Trend plus seasonal variation from historical data.",""],["SMA","Simple moving average.",""],["EMA","Exponential moving average; more weight on recent data.",""],["WMA","Weighted moving average with chosen weights.",""],["Trend projection","Fit and extend a trend line from history.",""],["Capacity planning","Balancing resources to meet demand.",""],["Strategic capacity planning","Long-term, several years.",""],["Tactical capacity planning","Medium-term, months to a year.",""],["Operational capacity planning","Short-term, days to months.",""],["Design capacity","Ideal maximum output.",""],["Effective capacity","Design capacity minus allowances.",""],["Actual output","Achieved rate; cannot exceed effective capacity.",""],["Efficiency","Actual / effective x 100%.",""],["Utilisation","Actual / design x 100%.",""],["Break-even point","Q = FC / (r - v).",""],["Make or buy BEP","Q = FC / (VB - VM).",""],["Sequencing","Order of processing jobs over resources.",""],["SPT","Shortest processing time; lowest flow time.",""],["EDD","Earliest due date.",""],["Critical ratio","Time to due date / remaining processing time.",""],["Johnson's rule","Optimal sequencing of n jobs on 2 machines.",""],["Transportation components","Load, mode, flow, route.",""],["TMS","Software automating carrier selection, routing, scheduling, payment.",""],["Intermodal","Multiple modes in one shipment.",""],["Transportation problem","Minimise shipping cost subject to supply and demand.",""],["Balanced problem","Total supply equals total demand.",""],["NWCR","Northwest corner rule: start at top-left cell.",""],["LCM","Least cost method: start at cheapest cell.",""],["VAM","Vogel's approximation using penalties.",""],["MODI","Optimality test with u, v and opportunity cost d.",""],["m + n - 1","Number of allocations in a basic feasible solution.",""],["Assignment problem","One-to-one assignment minimising cost; special transportation problem.",""],["Hungarian method","Reduce rows and columns, cover zeros, revise until n assignments.",""],["Dummy row/column","Added with zero cost to balance an unbalanced problem.",""]],"q":[["o","Demand forecasting is the process of understanding and predicting customer demand to help businesses avoid which of the following?",["High shipping costs and bad PR","Overproduction and underproduction","Competition entering the market","Falling crude oil prices"],1,"It avoids overproduction and underproduction."],["o","A business sells swimwear and stores most of its inventory in Florida where it is ordered most. Which factor influencing demand forecast is addressed?",["Competition","Economy","Geography","Seasonality"],2,"Where customers live and stock is held is geography."],["o","Why can relying too heavily on historical sales data lead to inaccurate demand predictions?",["Because past data cannot account for various evolving market factors","Because past data is completely deleted every calendar year","Because historical data is only useful for startup businesses","Because it forces companies to hire too many data analysts"],0,"Over-reliance on past data ignores evolving factors."],["o","What does expert or insider knowledge refer to in demand forecasting?",["Information gathered strictly from automated internet search bots","Specialized understanding and insights held by individuals with significant experience in a particular field or industry","Financial data publicly released by international banking institutions","Customer feedback forms collected randomly from retail storefronts"],1,"Interviews, focus groups, Delphi, workshops and surveys draw on it."],["o","Which formula calculates a facility's Efficiency percentage?",["Efficiency = (Actual Output / Design Capacity) x 100%","Efficiency = (Effective Capacity / Design Capacity) x 100%","Efficiency = (Actual Output / Effective Capacity) x 100%","Efficiency = (Design Capacity - Allowances) x 100%"],2,"Utilisation divides by design capacity; efficiency by effective capacity."],["o","What are the four major components of transportation decisions in supply chain management?",["Production, Planning, Efficiency, and Utilization","Fixed Cost, Variable Cost, Revenue, and Profit","Load, Mode, Flow, and Route","Interviews, Focus Groups, Surveys, and Delphi Method"],2,"Load, mode, flow and route."],["o","A Balanced Transportation Problem is a special case where:",["The total variable costs exactly equal the total fixed costs","The total supply from all sources equals the total demand at all destinations","The shipment volume is optimized using only rail and road transit","The number of source factories equals the number of retail outlets"],1,"Otherwise it is unbalanced and needs a dummy."],["o","How does accurate demand forecasting help strike the right balance in inventory management?",["By reducing carrying costs and preventing stockouts","By ensuring that products are only sold online","By automatically increasing the prices of older items","By replacing human workers with automated machinery"],0,"Right stock level: lower carrying cost, no stock-outs."],["o","Which type of capacity planning considers future requirements over several years using supply and need forecasting?",["Short-term Capacity Planning","Operational Capacity Planning","Medium-term Capacity Planning","Long-term or Strategic Capacity Planning"],3,"Strategic planning aligns capacity with business goals and growth."],["o","Which set of factors is explicitly mentioned as why companies have limited visibility into the future?",["Overproduction, underproduction, and short shelf-lives","Lack of human resources, bad PR, and high shipping costs","Market volatility, rapid technological changes, and unpredictable external events","Steady customer retention, passive forecasting, and geographic planning"],2,"Those three are named under limited visibility."],["x","Which is NOT one of the five factors influencing demand forecast in the lecture?",["Seasonality","Competition","Economy","Brand logo colour"],3,"Also types of goods and geography."],["x","Active demand forecasting is typically used by:",["Companies aiming at steady sales","Start-ups and rapidly growing companies","Only government agencies","Companies with no sales history"],1,"Passive forecasting suits steady sales; active includes growth plans."],["x","In the Delphi method, subsequent rounds are usually repeated:",["1 time","2 to 4 times","20 times","Only once a year"],1,"Until consensus or a stable pattern emerges, with anonymous feedback."],["x","Which moving average gives more weight to recent data and decreases older data's significance?",["SMA","EMA","Static average","Median"],1,"Exponential moving average."],["x","Long-term demand forecasting covers a period of:",["A single day","A week","More than a year","One hour"],2,"It supports seasonality, capacity and capital planning."],["x","A plant has design capacity 38,640 units per week and produced 25,000. Utilisation is about:",["54.7%","64.7%","74.7%","89.3%"],1,"25,000 / 38,640 = 64.7%. With effective capacity 28,000, efficiency is 89.3%."],["x","Fixed cost USD 4,000, price USD 9, variable cost USD 4. The break-even quantity is:",["400","800","1,200","2,800"],1,"4,000 / (9 - 4) = 800."],["x","For make-or-buy with FC = 160,000, VM = 100, VB = 150, the break-even quantity is:",["1,600","3,200","6,400","1,000"],1,"160,000 / (150 - 100) = 3,200."],["x","In the lecture's five-job example, which sequencing rule gave the lowest total flow time (36 days)?",["FIFO","LIFO","SPT","LPT"],2,"Shortest processing time."],["x","In Johnson's rule for two machines, a job whose shortest time is on machine 1 is scheduled:",["Last","First (towards the front)","Randomly","Removed"],1,"If the shortest time is on machine 2 it is scheduled last."],["x","For three machines, Johnson's rule can be applied when:",["min(A) >= max(B) or min(C) >= max(B)","max(A) = min(C)","All times are equal","Never"],0,"Then use fictitious machines G = A + B and H = B + C."],["x","Which mode suits petroleum and natural gas with continuous flow?",["Air","Pipeline","Road","Rail"],1,"Pipelines are economical for bulk liquids and gases."],["x","The NWCR solution in the lecture's mobile-phone example costs:",["Rs 780","Rs 870","Rs 1,400","Rs 2,310"],1,"160 + 90 + 120 + 20 + 480 = Rs 870."],["x","A basic feasible solution of an m x n transportation problem has how many allocations?",["m x n","m + n","m + n - 1","m - n"],2,"This is the optimality (non-degeneracy) condition."],["x","An unbalanced transportation problem is balanced by adding:",["A dummy source or destination with zero cost","Extra rows with high cost","Nothing","A penalty"],0,"Total supply is made equal to total demand."],["x","In the Hungarian method, the solution is optimal when:",["Lines covering zeros equal n (assignments = n)","All costs are zero","K = 0","The matrix is rectangular"],0,"Otherwise revise with the smallest uncovered element K."]],"imp":[["What forecasting avoids","Overproduction and underproduction; helps inventory balance (lower carrying cost, no stock-outs)."],["Five forecast factors","Seasonality, competition, economy, types of goods, geography."],["Forecasting challenges","Lack of data; over-reliance on past data; limited visibility (volatility, rapid tech change, unpredictable events)."],["Passive vs active; short vs long; macro vs micro","Steady sales vs growth plans; long-term is over one year."],["Qualitative methods","Delphi (anonymous rounds, 2-4), expert/insider knowledge, surveys, interviews and focus groups, Salesforce composite."],["Quantitative methods","Time series (trend, seasonality), SMA, EMA (recent weight), WMA, trend projection."],["Capacity planning types","Strategic (years), tactical (months to a year), operational (days to months)."],["Capacity formulas","Efficiency = actual / effective; utilisation = actual / design; effective = design - allowances."],["Break-even","Q = FC / (r - v); make-or-buy Q = FC / (VB - VM)."],["Sequencing rules","FIFO, LIFO, SPT (lowest flow time), LPT, EDD, LS, CR."],["Johnson's rule","Shortest time on machine 1 first, on machine 2 last; 3-machine conditions."],["Transportation decisions","Load, Mode, Flow, Route; modes road, rail, water, air, pipeline, intermodal."],["Transportation problem","Balanced = supply equals demand; IBFS (NWCR, LCM, VAM); MODI; m + n - 1 allocations."],["NWCR example","Rs 870 (160 + 90 + 120 + 20 + 480); optimal example Rs 1,400."],["Assignment problem","Special transportation problem; Hungarian method; dummy row/column with zero cost."]]},"11":{"notes":[["Lecture 52 - Inventory Management","<div class=\"imp\"><b>★ Important:<\/b> Asked: <b>Minimum Stock = Buffer Stock + Safety Stock<\/b> and <b>decoupling inventory<\/b> (reserve for a second machine if the first fails).<\/div><h4>Inventory management: meaning<\/h4><p><b>Inventory management<\/b> is the process of ordering, storing, using and selling a company's inventory: raw materials, components, finished products, and the warehousing and processing of such items. <b>Inventory<\/b> is any stored material (also called stock; in manufacturing, \"stock\" strictly means finished goods in the store). In the service industry there is no exchange of physical stock, so inventory is mostly intangible: the steps involved before completing a sale.<\/p>\n<h4>Useful terms<\/h4><div class=\"dg\"><svg viewBox=\"0 0 760 120\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"240\" y1=\"55\" x2=\"290\" y2=\"55\" stroke=\"#71717a\" stroke-width=\"2\" /><line x1=\"490\" y1=\"55\" x2=\"540\" y2=\"55\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"40\" y=\"30\" width=\"200\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"140\" y=\"44\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Buffer stock<\/text><text x=\"140\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">consumption during the<\/text><text x=\"140\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">standard replenishment period<\/text><rect x=\"290\" y=\"30\" width=\"200\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"390\" y=\"44\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Safety stock<\/text><text x=\"390\" y=\"59\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">extra stock against uncertainty<\/text><text x=\"390\" y=\"74\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">in supply and demand<\/text><rect x=\"540\" y=\"30\" width=\"200\" height=\"50\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#fb7185\" stroke-width=\"1.6\"/><text x=\"640\" y=\"51.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">MINIMUM STOCK<\/text><text x=\"640\" y=\"66.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">= Buffer + Safety<\/text><text x=\"265\" y=\"58\" fill=\"#f5f5f4\" font-size=\"20\" text-anchor=\"middle\">+<\/text><text x=\"515\" y=\"50\" fill=\"#f5f5f4\" font-size=\"20\" text-anchor=\"middle\">=<\/text><\/svg><div class=\"cap\">Rebuilt: minimum stock formula.<\/div><\/div><table><tr><th>Term<\/th><th>Meaning<\/th><\/tr><tr><td><b>Minimum Stock<\/b><\/td><td>Minimum quantity always available to avoid shortage (critical or hard-to-resupply products): <b>Buffer Stock + Safety Stock<\/b><\/td><\/tr><tr><td><b>Buffer Stock<\/b><\/td><td>Stock equal to consumption during the standard replenishment period<\/td><\/tr><tr><td><b>Safety Stock<\/b><\/td><td>Extra stock kept to mitigate stock-out risk from uncertainties in supply and demand<\/td><\/tr><tr><td>Bin card / Stock card<\/td><td>Documents updated by the storekeeper tracking the stock of one product in a bin or the storage<\/td><\/tr><tr><td>Committed inventory<\/td><td>Items committed to a particular order<\/td><\/tr><tr><td>Demand signal<\/td><td>Any request to remove stock from a warehouse, in any format<\/td><\/tr><tr><td>Inventory ledger<\/td><td>Accounting record of receptions and dispatches in quantity and value<\/td><\/tr><tr><td>Lead time<\/td><td>Time between placing an order and receiving it<\/td><\/tr><tr><td>On-hand inventory<\/td><td>Items available to be released<\/td><\/tr><tr><td>Over-stock<\/td><td>Too much inventory kept<\/td><\/tr><tr><td>Physical inventory<\/td><td>Counting and verifying goods to reconcile data<\/td><\/tr><tr><td>Re-ordering cycle<\/td><td>Period between two successive regular orders<\/td><\/tr><tr><td>SKU<\/td><td>Stock Keeping Unit: unique code for a single line item<\/td><\/tr><tr><td>Stock-out<\/td><td>Inventory cannot cope with demand for an item<\/td><\/tr><tr><td>VMI<\/td><td>Vendor Managed Inventory: suppliers manage physical inventory in the retailer's stock<\/td><\/tr><tr><td>WIP<\/td><td>Work in progress / process<\/td><\/tr><\/table><h4>Types of inventory<\/h4><table><tr><th>Type<\/th><th>Meaning<\/th><th>Example or note<\/th><\/tr><tr><td>Raw materials<\/td><td>Initial components or materials for production<\/td><td>Input to the process<\/td><\/tr><tr><td><b>Work in progress (WIP)<\/b><\/td><td>Goods being manufactured but not yet completed<\/td><td>Semi-finished goods on the factory floor<\/td><\/tr><tr><td>Finished goods<\/td><td>Fully manufactured, ready for sale<\/td><td><\/td><\/tr><tr><td><b>MRO<\/b> (Maintenance, Repair, Operating)<\/td><td>Supplies for upkeep of machines and equipment; <b>not accounted as inventory items in the books<\/b><\/td><td>Lubricants, coolants, uniforms, gloves, nuts, bolts, screws<\/td><\/tr><tr><td><b>Buffer inventory<\/b><\/td><td>Held for unexpected rise in demand (e.g. promotion that sells more than planned)<\/td><td>\"Prevention is better than cure\"<\/td><\/tr><tr><td><b>Cycle inventory<\/b><\/td><td>Goods ordered in lot sizes to meet minimum production requirements; plan with campaigns, seasonality, trends<\/td><td>Cycle stock<\/td><\/tr><tr><td><b>Decoupling inventory<\/b><\/td><td><b>Items kept in reserve to be processed by another machine if the previous machine fails<\/b>; shields against supplier problems, inconsistent lead times and production halts<\/td><td>Keeps the chain from collapsing<\/td><\/tr><tr><td><b>Transit (pipeline) inventory<\/b><\/td><td>Shipped by the seller but not yet at the buyer's destination<\/td><td>Also called pipeline inventory<\/td><\/tr><\/table><div class=\"tip\">Distinction used in the lecture: buffer inventory covers an unexpected demand increase; safety stock covers WIP and supplier delays (e.g. manufacturing shutdown).<\/div>"],["Lecture 53 - Inventory Management (Contd.)","<div class=\"imp\"><b>★ Important:<\/b> Asked: <b>DSI<\/b> (average days to turn inventory into sales), <b>zero inventory = JIT<\/b>, <b>ABC: Category A = 20% of stock, 70% of income<\/b>, and <b>VMI<\/b> (supplier manages stock at the retailer).<\/div><p>Four methods in the lecture: <b>JIT, MRP, EOQ, DSI<\/b>, plus the zero inventory concept, ABC analysis and VMI.<\/p>\n<h4>Just-in-Time (JIT)<\/h4><p>Receive goods only as needed in production to raise efficiency and cut waste. Originated in Japan in the 1960s and 1970s; <b>Toyota<\/b> contributed most. Needs careful scheduling and a strong relationship with suppliers.<\/p><table><tr><th>Benefits<\/th><th>Risks and limits<\/th><th>Companies<\/th><\/tr><tr><td>Lower storage and insurance cost; less obsolescence; better cash flow; supplier relationships; efficiency; quality<\/td><td>Supply disruptions halt production; supplier dependency; unpredictable demand causes shortages; costly set-up<\/td><td>Toyota (TPS, 1970s), Dell (build to order), Harley-Davidson<\/td><\/tr><\/table><h4>Material Requirements Planning (MRP)<\/h4><p>Sales-forecast-dependent system making sure materials are available for production and products for delivery. Combines the production schedule, inventory data and the <b>bill of materials (BOM)<\/b> to compute purchasing and shipping schedules. Example: a ski manufacturer stocks plastic, fibreglass, wood and aluminium from forecast orders.<\/p><table><tr><th>Benefits<\/th><th>Limits<\/th><th>Users<\/th><\/tr><tr><td>Inventory control, production planning, cost savings, supplier coordination, efficiency<\/td><td>Needs accurate data; complex and costly; inflexible to sudden change; must integrate with ERP and SCM<\/td><td>Toyota, Intel, Boeing<\/td><\/tr><\/table><h4>Economic Order Quantity (EOQ)<\/h4><p>Number of units to add per batch order to minimise total inventory cost, assuming constant demand. Costs: <b>ordering (set-up) cost<\/b> and <b>holding cost<\/b>.<\/p><div class=\"cards\"><div class=\"m\"><b>EOQ = sqrt(2DS / H)<\/b><span>D annual demand, S cost per order, H holding cost per unit per year<\/span><\/div><\/div><div class=\"dg\"><svg viewBox=\"0 0 760 270\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><line x1=\"60\" y1=\"20\" x2=\"60\" y2=\"225\" stroke=\"#71717a\"/><line x1=\"60\" y1=\"225\" x2=\"720\" y2=\"225\" stroke=\"#71717a\"/>\n<polyline fill=\"none\" stroke=\"#fb7185\" stroke-width=\"3\" points=\"80,200 200,170 320,140 440,110 560,80 680,50\"/>\n<polyline fill=\"none\" stroke=\"#34d399\" stroke-width=\"3\" points=\"80,40 140,95 200,130 260,152 320,167 440,185 560,195 680,200\"/>\n<polyline fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"3\" stroke-dasharray=\"6 4\" points=\"80,55 140,105 200,125 260,132 320,137 380,142 440,150 560,160 680,172\"/>\n<line x1=\"268\" y1=\"30\" x2=\"268\" y2=\"225\" stroke=\"#f5f5f4\" stroke-dasharray=\"3 4\"/><text x=\"268\" y=\"242\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">EOQ (minimum total cost)<\/text>\n<text x=\"690\" y=\"52\" fill=\"#fb7185\" font-size=\"11\">Holding cost<\/text><text x=\"690\" y=\"204\" fill=\"#34d399\" font-size=\"11\">Ordering cost<\/text><text x=\"690\" y=\"176\" fill=\"#f59e0b\" font-size=\"11\">Total cost<\/text>\n<text x=\"400\" y=\"262\" fill=\"#a1a1aa\" font-size=\"11\" text-anchor=\"middle\">Order quantity per batch<\/text><\/svg>\n<div class=\"cap\">Rebuilt (schematic): holding cost rises with batch size, ordering cost falls, and the total is lowest where they meet: the Economic Order Quantity.<\/div><\/div><p>Lecture example (shirt shop selling 1,000 shirts a year): EOQ is about <b>28.3 units<\/b> per order. (Standard figures for this example: order cost 2, holding cost 5 per shirt.)<\/p>\n<h4>Days Sales of Inventory (DSI)<\/h4><p>Average time in days a company takes to <b>turn inventory, including work in progress, into sales<\/b>. Also called average age of inventory, days inventory outstanding (DIO), days in inventory (DII). It shows liquidity: how many days current stock will last. <b>Lower DSI is generally preferred<\/b>; norms differ by industry. Example in lecture: Pfizer.<\/p><div class=\"cards\"><div class=\"m\"><b>DSI = (Avg inventory / COGS) x 365<\/b><span>Standard formula; days to clear stock<\/span><\/div><\/div><h4>Zero inventory concept<\/h4><p>Lean concept aimed at minimising or eliminating excess inventory in production; also Zero Inventory System or Zero Inventory Manufacturing. <b>Based on JIT<\/b> and lean thinking: produce and deliver exactly when needed, in the right quantity, with minimum waste.<\/p><table><tr><th>Importance<\/th><th>Notes<\/th><\/tr><tr><td>Cost reduction<\/td><td>Lower storage, handling, insurance<\/td><\/tr><tr><td>Efficiency<\/td><td>Streamlined processes, less waste<\/td><\/tr><tr><td>Working capital<\/td><td>Less capital tied up in stock<\/td><\/tr><tr><td>Risk mitigation<\/td><td>Less obsolete or spoiled stock<\/td><\/tr><\/table><h4>ABC analysis (inventory theory model)<\/h4><p>Ranks inventory by importance using the <b>80/20 (Pareto)<\/b> idea; often combined with JIT. Drawback: stock must be classified correctly.<\/p><div class=\"dg\"><svg viewBox=\"0 0 760 270\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><line x1=\"60\" y1=\"230\" x2=\"720\" y2=\"230\" stroke=\"#71717a\"/><rect x=\"90\" y=\"166\" width=\"60\" height=\"64\" fill=\"#f59e0b\" opacity=\".85\"/><rect x=\"160\" y=\"6\" width=\"60\" height=\"224\" fill=\"#34d399\" opacity=\".85\"/>\n  <text x=\"120\" y=\"158\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">20%<\/text><text x=\"190\" y=\"-2\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">70%<\/text>\n  <text x=\"155\" y=\"250\" fill=\"#f5f5f4\" font-size=\"13\" text-anchor=\"middle\">Category A<\/text><rect x=\"300\" y=\"134\" width=\"60\" height=\"96\" fill=\"#f59e0b\" opacity=\".85\"/><rect x=\"370\" y=\"150\" width=\"60\" height=\"80\" fill=\"#34d399\" opacity=\".85\"/>\n  <text x=\"330\" y=\"126\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">30%<\/text><text x=\"400\" y=\"142\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">25%<\/text>\n  <text x=\"365\" y=\"250\" fill=\"#f5f5f4\" font-size=\"13\" text-anchor=\"middle\">Category B<\/text><rect x=\"510\" y=\"70\" width=\"60\" height=\"160\" fill=\"#f59e0b\" opacity=\".85\"/><rect x=\"580\" y=\"214\" width=\"60\" height=\"16\" fill=\"#34d399\" opacity=\".85\"/>\n  <text x=\"540\" y=\"62\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">50%<\/text><text x=\"610\" y=\"206\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">5%<\/text>\n  <text x=\"575\" y=\"250\" fill=\"#f5f5f4\" font-size=\"13\" text-anchor=\"middle\">Category C<\/text><rect x=\"560\" y=\"20\" width=\"12\" height=\"12\" fill=\"#f59e0b\"/><text x=\"578\" y=\"31\" fill=\"#f5f5f4\" font-size=\"12\">Share of items<\/text><rect x=\"560\" y=\"42\" width=\"12\" height=\"12\" fill=\"#34d399\"/><text x=\"578\" y=\"53\" fill=\"#f5f5f4\" font-size=\"12\">Share of income<\/text><\/svg><div class=\"cap\">Rebuilt: ABC analysis (Pareto, 80/20 idea). A: 20% of items, 70% of income; B: 30% and 25%; C: 50% and 5%.<\/div><\/div><table><tr><th>Category<\/th><th>Share of items<\/th><th>Share of income<\/th><th>Control<\/th><\/tr><tr><td><b>A<\/b><\/td><td><b>20%<\/b><\/td><td><b>70%<\/b><\/td><td>Tightest ordering control, most attention<\/td><\/tr><tr><td>B<\/td><td>30%<\/td><td>25%<\/td><td>Moderate; still matters<\/td><\/tr><tr><td>C<\/td><td>50%<\/td><td>5%<\/td><td>Loose control<\/td><\/tr><\/table><h4>Vendor Managed Inventory (VMI)<\/h4><p>The <b>supplier assumes responsibility for inventory management and disposition at the customer's warehouse<\/b>. Prerequisite: regular transfer of all relevant data (inventory, consumption) to the supplier. It optimises performance along the chain; the supplier ensures optimal stock levels, and production and inventories can be planned better.<\/p><div class=\"dg\"><svg viewBox=\"0 0 760 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"220\" y1=\"55\" x2=\"290\" y2=\"55\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"470\" y1=\"55\" x2=\"540\" y2=\"55\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"20\" y=\"35\" width=\"200\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"120\" y=\"61.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Customer / retailer<\/text><text x=\"120\" y=\"76.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">warehouse and sales data<\/text><rect x=\"290\" y=\"35\" width=\"180\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"380\" y=\"54\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Supplier<\/text><text x=\"380\" y=\"69\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">monitors stock and decides<\/text><text x=\"380\" y=\"84\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">replenishment<\/text><rect x=\"540\" y=\"35\" width=\"200\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"640\" y=\"54\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Delivery to customer<\/text><text x=\"640\" y=\"69\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">warehouse (supplier owns the<\/text><text x=\"640\" y=\"84\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">replenishment decision)<\/text><text x=\"255\" y=\"48\" fill=\"#71717a\" font-size=\"11\" text-anchor=\"middle\">data<\/text><text x=\"505\" y=\"48\" fill=\"#71717a\" font-size=\"11\" text-anchor=\"middle\">stock<\/text><text x=\"380\" y=\"130\" fill=\"#71717a\" font-size=\"12\" text-anchor=\"middle\">Prerequisite: regular transfer of inventory and consumption data to the supplier<\/text><\/svg><div class=\"cap\">Rebuilt: Vendor Managed Inventory.<\/div><\/div><h4>Product-based versus service-based companies<\/h4><p>Product companies manage physical stock (inventory management); service companies have no physical stock and manage waiting (queue management), as in Week 5.<\/p>"],["Lecture 54 - Supply Chain Digitalization","<div class=\"imp\"><b>★ Important:<\/b> Asked: <b>IoT<\/b> (sensors and RFID for real-time data), <b>ERP<\/b> = Enterprise Resource Planning, and the benefit <b>better financial management through automated reorder notifications<\/b>.<\/div><h4>What supply chain digitization is<\/h4><p>Using digital technologies and analytics to connect, automate and optimise supply chain processes for end-to-end visibility, better decisions and efficiency. <b>Digital transformation<\/b> adds a change in culture, processes and skills.<\/p>\n<h4>Key components<\/h4><table><tr><th>Component<\/th><th>Role<\/th><\/tr><tr><td><b>IoT<\/b> (Internet of Things)<\/td><td>Sensors, RFID tags and devices collecting real-time data on inventory and shipments<\/td><\/tr><tr><td><b>ERP<\/b> (Enterprise Resource Planning)<\/td><td>Integrates inventory, procurement, production planning and finance in one system<\/td><\/tr><tr><td>AI / machine learning, analytics<\/td><td>Demand forecasts, optimisation, preventing stock-outs<\/td><\/tr><tr><td>Blockchain<\/td><td>Traceability and transparency<\/td><\/tr><tr><td>Cloud platforms<\/td><td>Shared, unified data across partners<\/td><\/tr><tr><td>Risk management tools<\/td><td>Assess geopolitical, natural disaster and supplier risks; contingency plans<\/td><\/tr><tr><td>Compliance tools<\/td><td>Track regulatory requirements and documentation<\/td><\/tr><tr><td>Continuous improvement<\/td><td>Automate workflows, culture of experimentation<\/td><\/tr><\/table><h4>Implementing digital transformation<\/h4><div class=\"dg\"><svg viewBox=\"0 0 780 130\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"140\" y1=\"60\" x2=\"155\" y2=\"60\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"285\" y1=\"60\" x2=\"300\" y2=\"60\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"430\" y1=\"60\" x2=\"445\" y2=\"60\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"575\" y1=\"60\" x2=\"590\" y2=\"60\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"10\" y=\"30\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"75\" y=\"49\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">1. Clear vision<\/text><text x=\"75\" y=\"64\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">aligned with<\/text><text x=\"75\" y=\"79\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">enterprise goals<\/text><rect x=\"155\" y=\"30\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"220\" y=\"49\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">2. Assess resources<\/text><text x=\"220\" y=\"64\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">legacy systems, data,<\/text><text x=\"220\" y=\"79\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">workforce skills<\/text><rect x=\"300\" y=\"30\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"365\" y=\"49\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">3. Unified platform<\/text><text x=\"365\" y=\"64\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">end-to-end<\/text><text x=\"365\" y=\"79\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">visibility<\/text><rect x=\"445\" y=\"30\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"510\" y=\"49\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">4. Automate<\/text><text x=\"510\" y=\"64\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">planning<\/text><text x=\"510\" y=\"79\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">(routine tasks)<\/text><rect x=\"590\" y=\"30\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"655\" y=\"49\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">5. Align people<\/text><text x=\"655\" y=\"64\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">and processes<\/text><text x=\"655\" y=\"79\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">(adoption)<\/text><\/svg><div class=\"cap\">Rebuilt: steps to implement digital transformation in the supply chain.<\/div><\/div><ul><li><b>Vision:<\/b> aligned with enterprise objectives (decision-making, automation, visibility)<\/li><li><b>Assess resources:<\/b> legacy systems, capability to generate, collect and analyse data, workforce skills<\/li><li><b>Unified platform:<\/b> complete end-to-end visibility for inventory, warehouse, forecasting, logistics<\/li><li><b>Automate planning:<\/b> routine tasks, not complex or collaborative scenarios; real-time and AI analytics<\/li><li><b>Align the team:<\/b> success depends on collaboration and adopting new methods<\/li><\/ul><h4>Benefits of digitization<\/h4><table><tr><th>Benefit<\/th><th>Example<\/th><\/tr><tr><td><b>Better financial management<\/b><\/td><td>Automated notifications when to reorder, avoiding high <b>stockout costs<\/b>; more accurate replenishment cuts carrying cost and dead stock<\/td><\/tr><tr><td>Minimised lead times<\/td><td>Fulfilment software linked to the e-commerce store receives and prepares orders automatically<\/td><\/tr><tr><td>Improved decision making<\/td><td>Historical sales and buying behaviour predict demand and set inventory per DC<\/td><\/tr><tr><td>Increased automation<\/td><td>Less manual work and human error<\/td><\/tr><tr><td>Organisational flexibility<\/td><td>Freedom to choose the degree of centralisation<\/td><\/tr><tr><td>Accelerates innovation<\/td><td>Strengthens business model and partner relationships<\/td><\/tr><tr><td>End-to-end customer engagement<\/td><td>Order tracking keeps customers informed and in control<\/td><\/tr><\/table><h4>Factors fostering digitalization<\/h4><table><tr><th>Factor<\/th><th>Detail<\/th><\/tr><tr><td>Government initiatives and policies<\/td><td>Funding, tax incentives, regulatory frameworks<\/td><\/tr><tr><td>Market demand and competition<\/td><td>Customer expectations force adoption<\/td><\/tr><tr><td>Technological advancement<\/td><td>AI, ML, IoT, blockchain<\/td><\/tr><tr><td>Globalization and complexity<\/td><td>Manual, disconnected systems no longer viable<\/td><\/tr><\/table><h4>Challenges<\/h4><p>Three unavoidable issues from technical tools and human factors. The main one remains <b>technical<\/b>: companies' information systems and the availability and quality of data; others are people and process related (skills, resistance, adoption).<\/p>"],["Lecture 55 - Smart Supply Chains","<div class=\"imp\"><b>★ Important:<\/b> Know the smart supply chain components (real-time visibility, predictive analytics, automation, dynamic optimisation, collaborative networks) and the <b>three Ps: Profit, People, Planet<\/b>.<\/div><h4>Evolution<\/h4><div class=\"flow\"><div>Early 20th century: Taylor, Ford (efficiency)<\/div><i>&rarr;<\/i><div>Late 20th century: globalization<\/div><i>&rarr;<\/i><div>1980s-90s: IT and ERP<\/div><i>&rarr;<\/i><div>Recent: smart technologies, Industry 4.0<\/div><\/div><h4>Definition and characteristics<\/h4><p>Smart supply chains use data-driven insight, automation and connectivity to improve agility, efficiency and resilience, with real-time monitoring of inventory, production and transport. Characteristics: <b>instrumented, interconnected, intelligent, automated, integrated, innovative<\/b>, adaptable. Definitions in the literature are inconsistent; they refer to smart drivers (logistics, warehouse), data streams, technologies, and characteristics. <b>Industry 4.0<\/b> = cyber-physical systems, cloud and AI.<\/p>\n<h4>Key components<\/h4><table><tr><th>Component<\/th><th>Meaning<\/th><\/tr><tr><td>Real-time visibility<\/td><td>IoT sensors across the chain; track goods, spot bottlenecks<\/td><\/tr><tr><td>Predictive analytics<\/td><td>Big data and AI forecast demand, optimise inventory, anticipate maintenance<\/td><\/tr><tr><td>Automated processes<\/td><td>Robotics, automated material handling, autonomous vehicles<\/td><\/tr><tr><td>Dynamic optimisation<\/td><td>AI and algorithms re-optimise schedules, stock and routes<\/td><\/tr><tr><td>Collaborative networks<\/td><td>Cloud platforms and digital ecosystems share information<\/td><\/tr><tr><td>Sustainable practices<\/td><td>Lower energy, waste; renewable energy, green logistics, eco packaging<\/td><\/tr><tr><td>Agile and resilient<\/td><td>Real-time monitoring and predictive analytics to adapt to disruption<\/td><\/tr><\/table><h4>Responsiveness, efficiency, flexibility, resilience<\/h4><table><tr><th>Concept<\/th><th>Meaning<\/th><\/tr><tr><td>Responsiveness<\/td><td>Adapt quickly to market change and deliver superior customer experience<\/td><\/tr><tr><td><b>Efficiency<\/b><\/td><td>Produce goods or services without wasting materials, time or energy; maximise outputs from given inputs<\/td><\/tr><tr><td>Flexibility<\/td><td>Anticipate and respond to changes in demand and operating conditions<\/td><\/tr><tr><td>Resilience<\/td><td>Efficiency + visibility and traceability + flexibility, supported by IoT, AI and blockchain, so disruptions (disasters, cyber-attacks) are anticipated and handled<\/td><\/tr><\/table><h4>Sustainability in the smart supply chain<\/h4><p>A chain that <b>closes the loop<\/b> of upstream and downstream flows by recycling and recovering used items and re-entering them in production, with goals from economic, environmental and social dimensions.<\/p><div class=\"cards\"><div class=\"m\"><b>Profit<\/b><span>Economic value through efficient manufacturing and distribution<\/span><\/div><div class=\"m\"><b>People<\/b><span>Customer value with attention to social and environmental effects<\/span><\/div><div class=\"m\"><b>Planet<\/b><span>Minimise resource use; eliminate environmental impact of waste<\/span><\/div><\/div><h4>Implementation<\/h4><p>IoT-based, blockchain-based, and cloud and AI-based sustainable smart supply chains; example: power distribution supply chain using Industry 4.0 smart grids.<\/p>"],["Lecture 56 - Robust and Resilient Supply Chain Design","<div class=\"imp\"><b>★ Important:<\/b> Asked: the <b>ultimate goal of a resilient supply chain is to bounce back from disruptions and learn from them<\/b>. Know robustness, vulnerability, PPRR and the Temple.<\/div><h4>Vulnerability, risk, robustness, resilience<\/h4><table><tr><th>Concept<\/th><th>Meaning<\/th><\/tr><tr><td>Risk<\/td><td>Operational, financial or strategic; identify, assess, mitigate (redundancy, supplier diversification, contingency plans)<\/td><\/tr><tr><td>Vulnerability<\/td><td>Susceptibility to disruptions (disasters, geopolitics, downturns, demand shifts) that hit flows of materials, information, resources<\/td><\/tr><tr><td>Robustness<\/td><td>Ability to withstand and recover while keeping essential functions; flexible, adaptable, agile<\/td><\/tr><tr><td><b>Resilience<\/b><\/td><td><b>Ultimate goal: bounce back from disruptions and learn from them to improve future performance<\/b>; adaptive capacity, collaboration, transparency, technology<\/td><\/tr><\/table><h4>Types of supply chain risk<\/h4><table><tr><th>External (harder to predict)<\/th><th>Internal (more manageable)<\/th><\/tr><tr><td><b>Demand<\/b> (miscalculated demand); <b>Supply<\/b> (late or no raw materials); <b>Environmental<\/b> (socio-economic, political, governmental, environmental); <b>Business<\/b> (unexpected change in a dependent entity, e.g. supplier sale)<\/td><td><b>Manufacturing<\/b> (key component disrupted); <b>Business<\/b> (personnel, management, reporting); <b>Planning and control<\/b> (poor forecasting); <b>Mitigation and contingency<\/b> (no contingency plan)<\/td><\/tr><\/table><h4>PPRR risk management model<\/h4><div class=\"dg\"><svg viewBox=\"0 0 760 110\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><line x1=\"180\" y1=\"55\" x2=\"200\" y2=\"55\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"370\" y1=\"55\" x2=\"390\" y2=\"55\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"560\" y1=\"55\" x2=\"580\" y2=\"55\" stroke=\"#71717a\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"10\" y=\"25\" width=\"170\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"95\" y=\"51.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">PREVENTION<\/text><text x=\"95\" y=\"66.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">precautionary measures<\/text><rect x=\"200\" y=\"25\" width=\"170\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"285\" y=\"51.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">PREPAREDNESS<\/text><text x=\"285\" y=\"66.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">contingency plan ready<\/text><rect x=\"390\" y=\"25\" width=\"170\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"475\" y=\"51.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">RESPONSE<\/text><text x=\"475\" y=\"66.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">execute plan, cut impact<\/text><rect x=\"580\" y=\"25\" width=\"170\" height=\"60\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"665\" y=\"51.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">RECOVERY<\/text><text x=\"665\" y=\"66.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">resume normal capacity<\/text><\/svg><div class=\"cap\">Rebuilt: PPRR risk management model.<\/div><\/div><h4>SCRM strategies (7 in the lecture)<\/h4><ul><li>Leverage the <b>PPRR<\/b> model<\/li><li>Manage environmental risk (COVID-19: multi-sourcing; breweries made hand sanitiser, Ford made ventilators; diversify suppliers, source closer, stress tests, inventory buffers, harmonise technology)<\/li><li>Track freight carrier metrics: transit time, number of stops and stop time, loading time, route optimisation, maintenance schedule; have a logistics contingency plan<\/li><li>Conduct internal risk awareness training (best practices, cybersecurity, risk software)<\/li><li>Continuously monitor every level for risk indicators<\/li><li>Use data to model key risk event scenarios (predictive analytics)<\/li><li>Consolidate data in one centralised repository<\/li><\/ul><h4>Temple of Supply Chain Resilience<\/h4><div class=\"dg\"><svg viewBox=\"0 0 760 300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><rect x=\"270\" y=\"8\" width=\"220\" height=\"28\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#fb7185\" stroke-width=\"1.6\"/><text x=\"380\" y=\"26\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Continuous monitoring and intelligence<\/text><rect x=\"60\" y=\"44\" width=\"640\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"380\" y=\"63\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">ROOF: Supply chain transparency (visibility across flows and networks)<\/text><rect x=\"50\" y=\"84\" width=\"150\" height=\"120\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"125\" y=\"148\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Agility<\/text><rect x=\"220\" y=\"84\" width=\"150\" height=\"120\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"295\" y=\"148\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Collaboration<\/text><rect x=\"390\" y=\"84\" width=\"150\" height=\"120\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"465\" y=\"140.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Supply chain risk<\/text><text x=\"465\" y=\"155.5\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">management culture<\/text><rect x=\"560\" y=\"84\" width=\"150\" height=\"120\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#34d399\" stroke-width=\"1.6\"/><text x=\"635\" y=\"148\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Supply chain design<\/text><rect x=\"30\" y=\"214\" width=\"700\" height=\"30\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"380\" y=\"233\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">FLOOR: Product design for supply chain management (raw materials, sourcing locations, configurations)<\/text><rect x=\"10\" y=\"254\" width=\"740\" height=\"34\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#fb7185\" stroke-width=\"1.6\"/><text x=\"380\" y=\"275\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">FOUNDATION: Effective supply chain strategy aligned with competitive strategy<\/text><\/svg><div class=\"cap\">Rebuilt: the \"Temple of Supply Chain Resilience\" from the lecture. Crown = continuous monitoring; roof = transparency; four pillars; floor = product design; foundation = strategy.<\/div><\/div><h4>Components of a robust supply chain<\/h4><ul><li><b>Flexibility<\/b> (flexible manufacturing, agile inventory, dynamic distribution)<\/li><li><b>Resilience<\/b> (contingency plans, backup inventory, alternative sourcing)<\/li><li><b>Redundancy<\/b> (alternative suppliers, facilities, routes)<\/li><li><b>Collaboration<\/b> with partners<\/li><li><b>Risk management<\/b><\/li><li><b>Technology integration<\/b> (analytics, AI, IoT)<\/li><li><b>Visibility<\/b> across the chain<\/li><\/ul><h4>Case: JD.com<\/h4><p>Integrated retail giant with a self-operated mode: buys all products from suppliers under long-term agreements and handles inventory, distribution, delivery and after-sales, controlling quality. Self-operated stores give about <b>60% of sales<\/b>; affiliated stores the rest. Traditional multi-stage chains (factory to brand manufacturer to agent to distributor to retailer) lack information sharing and suffer bullwhip magnification; the integrated chain is more resilient.<\/p>"],["Lecture 57 - 21st Century Supply Chain","<div class=\"imp\"><b>★ Important:<\/b> Know the five themes (digitalization, visibility, globalization, sustainability and CSR, customer-centricity) and the trends (visibility, sustainability, regionalisation, robotics).<\/div><h4>Evolution and challenges<\/h4><p>Technology, globalization and changing consumer preferences forced supply chains to evolve. Global chains raised interconnectedness and complexity: efficient when stable but <b>highly vulnerable<\/b> to disruption. COVID-19 showed the need for resilience: diversified suppliers, contingency plans, risk assessment.<\/p>\n<h4>Five themes<\/h4><table><tr><th>Theme<\/th><th>Meaning<\/th><\/tr><tr><td>Digitalization and automation<\/td><td>AI, ML, big data, IoT: real-time data and decisions<\/td><\/tr><tr><td>Visibility and transparency<\/td><td>Insight from sourcing to delivery; better risk management and forecasting<\/td><\/tr><tr><td>Globalization and outsourcing<\/td><td>Cost, expertise, markets; but geopolitical and trade risks<\/td><\/tr><tr><td>Sustainability and CSR<\/td><td>Lower emissions and waste, ethical sourcing, fair labour<\/td><\/tr><tr><td>Customer-centricity and omni-channel<\/td><td>Speed, convenience, personalisation across stores, e-commerce, apps, social media<\/td><\/tr><\/table><h4>Trends highlighted for 2024<\/h4><table><tr><th>Trend<\/th><th>Detail<\/th><\/tr><tr><td>1 Integral visibility<\/td><td>Real-time visibility moves from nice-to-have to must-have; unified data platforms (IoT, logistics providers, ERP), analytics and digital twins<\/td><\/tr><tr><td>2 Sustainability as differentiator<\/td><td>Green transport, recyclable packaging, circular models, life cycle assessment, ESG disclosure; Paris Agreement context<\/td><\/tr><tr><td>3 Regionalised supply chains<\/td><td>Nearshoring, multi-node networks, dual or multi-sourcing to reduce risk and enable just-in-time<\/td><\/tr><tr><td>4 Robotic and autonomous operations<\/td><td>Automation of warehouses and transport<\/td><\/tr><tr><td>ESG<\/td><td>Environmental, social, governance factors increasingly shape supply chain dynamics<\/td><\/tr><tr><td>Web-based SCM<\/td><td>Web platforms integrate partners and information<\/td><\/tr><\/table>"]],"gl":[["Inventory management","Ordering, storing, using and selling a firm's inventory.",""],["Minimum stock","Buffer stock + safety stock.",""],["Buffer stock","Stock equal to consumption during the standard replenishment period.",""],["Safety stock","Extra stock against uncertainty in supply and demand.",""],["Lead time","Order placement to receipt.",""],["Stock-out","Stock cannot meet demand.",""],["SKU","Stock keeping unit; unique item code.",""],["WIP","Goods in production, not yet completed.",""],["MRO inventory","Maintenance, repair, operating supplies; not booked as inventory.",""],["Buffer inventory","Held for unexpected demand increases.",""],["Cycle inventory","Goods ordered in lot sizes for minimum production needs.",""],["Decoupling inventory","Reserve to be processed by another machine if one fails.",""],["Transit inventory","Shipped but not yet delivered; pipeline inventory.",""],["JIT","Receive goods only as needed; Toyota pioneered.",""],["MRP","Material requirements planning using BOM and forecasts.",""],["BOM","Bill of materials.",""],["EOQ","Order quantity minimising ordering plus holding cost.",""],["DSI","Days sales of inventory: average days to turn stock into sales; lower is better.",""],["Zero inventory","Lean concept based on JIT.",""],["ABC analysis","Pareto-based inventory ranking.",""],["Category A","20% of items, 70% of income.",""],["Category B","30% of items, 25% of income.",""],["Category C","50% of items, 5% of income.",""],["VMI","Supplier manages stock at the customer's location.",""],["Digitization","Digital tools for connected, automated supply chain.",""],["IoT","Sensors and RFID for real-time data.",""],["ERP","Enterprise Resource Planning.",""],["Digitization benefit","Automated reorder notifications avoid stockout costs.",""],["Smart supply chain","Data-driven, automated, connected chain (Industry 4.0).",""],["Three Ps","Profit, People, Planet.",""],["Vulnerability","Susceptibility to disruption.",""],["Robustness","Withstand and recover while keeping function.",""],["Resilience","Bounce back and learn from disruptions.",""],["SCRM","Supply chain risk management.",""],["PPRR","Prevention, Preparedness, Response, Recovery.",""],["Temple of resilience","Foundation strategy; floor design; pillars agility, collaboration, risk culture, design; roof transparency.",""],["Regionalisation","Nearshoring and multi-node networks.",""],["JD.com","Self-operated mode, about 60% of sales.",""]],"q":[["o","Which of the following formulas is used to calculate Minimum Stock?",["Minimum Stock = Safety Stock - Buffer Stock","Minimum Stock = Buffer Stock + Safety Stock","Minimum Stock = Reorder level + Safety Stock","Minimum Stock = Maximum Daily Sales + Maximum Lead Time"],1,"Minimum stock is buffer stock plus safety stock."],["o","Which type of inventory consists of items kept in reserve to be processed by a second machine if the first machine fails?",["Cycle Inventory","Transit Inventory","MRO Inventory","Decoupling Inventory"],3,"Decoupling inventory shields the process from breakdowns."],["o","What does the Days Sales of Inventory (DSI) metric specifically indicate about a company's inventory?",["The total cost of raw materials purchased in a single year","The percentage of profit earned from each unit of inventory sold","The maximum number of days a company can store finished goods before they expire","The average time in days it takes for a company to turn its inventory into sales"],3,"DSI is the average age of inventory in days; lower is generally better."],["o","The 'Zero Inventory' concept is primarily based on which strategy?",["Bulk Ordering Strategy","Over-Stocking Principle","Just-In-Time (JIT)","Manual Data Recording"],2,"Zero inventory builds on JIT and lean thinking."],["o","What is the ultimate goal of a resilient supply chain?",["To bounce back from disruptions and learn from them to improve future performance","To ensure a company never has to change its suppliers","To eliminate all human workers from the manufacturing process","To increase the amount of paperwork required for every transaction"],0,"Resilience is the ultimate goal of supply chain design."],["o","Which is a key benefit of supply chain digitization that helps avoid high stockout costs?",["Better financial management through automated reorder notifications","Manual record-keeping","Increased reliance on paper-based documentation","Eliminating all human workers from the warehouse"],0,"Automated reorder notifications avoid stock-outs."],["o","What is the core principle of Vendor Managed Inventory (VMI)?",["The retailer is solely responsible for managing all stock in the warehouse","Inventory is only managed once it has been fully depleted","Customers must manage the inventory themselves before making a purchase","The supplier assumes responsibility for managing the inventory at the retailer's location"],3,"The supplier manages stock using shared data."],["o","In ABC Analysis, which category typically represents only 20% of total stock but 70% of total income?",["Category C","Category B","Category A","Category D"],2,"A: 20% / 70%; B: 30% / 25%; C: 50% / 5%."],["o","Which key component of digitization uses sensors and RFID tags to collect real-time data on inventory and shipments?",["Manual Ledger Entry","Traditional Filing Systems","Paper-based Documentation","Internet of Things (IoT)"],3,"IoT provides real-time data."],["o","In supply chain digitization, what does ERP stand for?",["Enterprise Resource Planning","Electronic Resource Planning","Efficient Retail Processing","Essential Reliable Procurement"],0,"ERP integrates inventory, procurement, production planning and more."],["x","Buffer stock is best defined as:",["Stock equal to consumption during the standard replenishment period","Stock held only for MRO","Goods in transit","Finished goods only"],0,"Minimum stock adds safety stock to it."],["x","Safety stock is kept mainly to:",["Reduce lead time","Mitigate the risk of stock-out from uncertain supply and demand","Replace JIT","Track WIP"],1,"It covers uncertainty in supply and demand."],["x","Which items are MRO inventory?",["Finished products for sale","Lubricants, coolants, gloves, nuts and bolts","Raw materials for the product","Goods in transit"],1,"MRO items are not accounted as inventory in the books."],["x","Transit inventory is also called:",["Pipeline inventory","Cycle stock","Decoupling stock","Dead stock"],0,"It has been shipped but not yet delivered."],["x","Which inventory method was pioneered by Toyota in the 1960s to 70s?",["EOQ","JIT","ABC analysis","VMI"],1,"Just-in-Time."],["x","MRP uses which key input to compute material needs?",["Bill of materials with production schedule and forecasts","Only last year's sales","Customer complaints","Transport routes"],0,"It integrates BOM, schedule and inventory data."],["x","The EOQ model balances which two costs?",["Ordering cost and holding cost","Labour and energy","Transport and tax","Marketing and design"],0,"Total cost is lowest at the EOQ."],["x","A lower DSI generally indicates:",["Slower clearing of inventory","Faster conversion of inventory into sales","Higher holding cost","More safety stock"],1,"Lower DSI is usually preferred."],["x","ABC Category C typically represents:",["20% of items and 70% of income","30% of items and 25% of income","50% of items and 5% of income","5% of items and 50% of income"],2,"Category C needs loose control."],["x","A prerequisite for VMI is:",["Regular transfer of inventory and consumption data to the supplier","No data sharing","Manual counting only","Retailer-set reorder dates"],0,"The supplier needs data to manage stock."],["x","Which is NOT one of the four pillars of the Temple of Supply Chain Resilience?",["Agility","Collaboration","Price discounting","Supply chain design"],2,"Pillars: agility, collaboration, SCRM culture, supply chain design."],["x","PPRR stands for:",["Prevention, Preparedness, Response, Recovery","Planning, Pricing, Routing, Returns","Production, Procurement, Retail, Repair","Prediction, Protection, Reporting, Review"],0,"A popular supply chain risk management model."],["x","Which is an external supply chain risk?",["Demand risk","Planning and control risk","Manufacturing risk","Mitigation and contingency risk"],0,"External: demand, supply, environmental, business."],["x","The three Ps of sustainable smart supply chains are:",["Profit, People, Planet","Price, Product, Place","Plan, Prepare, Produce","Pull, Push, Predict"],0,"Economic, social and environmental dimensions."],["x","Which trend reduces risk through nearshoring and multi-node networks?",["Regionalised supply chains","Single global sourcing","Manual ledgers","Longer lead times"],0,"A highlighted 2024 trend."],["x","JD.com's self-operated stores contribute about what share of sales?",["10%","30%","60%","95%"],2,"Affiliated stores contribute the rest."]],"imp":[["Minimum stock","Minimum Stock = Buffer Stock + Safety Stock; buffer = consumption during replenishment period; safety = cover for uncertainty."],["Types of inventory","Raw materials, WIP, finished goods, MRO, buffer, cycle, decoupling (reserve if a machine fails), transit (pipeline)."],["JIT, MRP, EOQ, DSI","JIT (Toyota, cuts holding cost); MRP (BOM and forecasts); EOQ (ordering vs holding cost); DSI (average days to turn inventory into sales)."],["Zero inventory","Based on JIT and lean manufacturing."],["ABC analysis","A: 20% of items, 70% of income; B: 30%, 25%; C: 50%, 5%; Pareto based."],["VMI","Supplier manages inventory at the customer location; needs regular data sharing."],["Digitization components and benefits","IoT (sensors, RFID), ERP (Enterprise Resource Planning); benefit: automated reorder notifications avoid stockout costs."],["Digital transformation steps","Vision, assess resources, unified platform, automate planning, align people."],["Smart supply chain","Real-time visibility, predictive analytics, automation, dynamic optimisation, collaboration; three Ps: Profit, People, Planet."],["Resilience vs robustness","Resilience = bounce back and learn (ultimate goal); robustness = withstand disruption while keeping function."],["Risk types and PPRR","External: demand, supply, environmental, business; internal: manufacturing, business, planning and control, contingency; PPRR = Prevention, Preparedness, Response, Recovery."],["Temple of resilience","Foundation strategy, floor product design, pillars agility, collaboration, risk culture, supply chain design, roof transparency, crown monitoring."],["21st century trends","Visibility, sustainability and ESG, regionalisation, robotics, omni-channel."]]},"12":{"notes":[["Lecture 58 - Sustainable Supply Chain","<div class=\"imp\"><b>★ Important:<\/b> Asked: <b>goal = minimise environmental harm (energy, water, waste)<\/b>; <b>Triple Bottom Line coined by John Elkington<\/b>; <b>revenue and profit are traditional concerns<\/b>; <b>cost is the primary barrier<\/b>.<\/div><h4>Role of sustainability in the supply chain<\/h4><p><b>Supply chain sustainability<\/b> = companies' efforts to consider the environmental and human impact of their products' journey: raw material sourcing, production, storage, delivery and every transport link. <b>Goal:<\/b> minimise environmental harm (<b>energy usage, water consumption, waste production<\/b>) while having a positive impact on people and communities. These concerns are <b>in addition to<\/b> traditional corporate concerns such as <b>revenue and profit<\/b>.<\/p>\n<p>The <b>Brundtland Commission<\/b> (UN) defined sustainable development as development that meets present needs without compromising future generations. The <b>2005 UN World Summit<\/b> named economic, environmental and social sustainability as the three pillars; all three must be reconciled. Growth in Brazil, China and India raised pressure on resources, so focus rose.<\/p>\n<h4>Why firms focus on sustainability (3 factor groups)<\/h4><ul><li>Reducing risk and improving financial performance<\/li><li>Attracting customers who value sustainability<\/li><li>Making the world more sustainable<\/li><\/ul><h4>Cases<\/h4><ul><li><b>Unilever<\/b> helped tomato growers in Brazil adopt drip irrigation; almost half its sales and most growth come from emerging economies; buys about 10% of world tea and 30% of spinach<\/li><li><b>Wal-Mart<\/b> began defensively after activist criticism, then cut energy costs (efficient bulbs, skylights) and packaging; redesigned milk jugs with Costco, saving 10 to 20 cents a gallon<\/li><\/ul><h4>Triple Bottom Line (TBL)<\/h4><div class=\"dg\"><svg viewBox=\"0 0 760 290\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\">\n<circle cx=\"300\" cy=\"115\" r=\"95\" fill=\"#f59e0b\" fill-opacity=\".28\" stroke=\"#f59e0b\" stroke-width=\"2\"/><circle cx=\"460\" cy=\"115\" r=\"95\" fill=\"#34d399\" fill-opacity=\".28\" stroke=\"#34d399\" stroke-width=\"2\"/><circle cx=\"380\" cy=\"215\" r=\"95\" fill=\"#fb7185\" fill-opacity=\".28\" stroke=\"#fb7185\" stroke-width=\"2\"/>\n<text x=\"250\" y=\"95\" fill=\"#f5f5f4\" font-size=\"13\" text-anchor=\"middle\">PEOPLE<\/text><text x=\"250\" y=\"112\" fill=\"#f5f5f4\" font-size=\"11\" text-anchor=\"middle\">social<\/text>\n<text x=\"510\" y=\"95\" fill=\"#f5f5f4\" font-size=\"13\" text-anchor=\"middle\">PLANET<\/text><text x=\"510\" y=\"112\" fill=\"#f5f5f4\" font-size=\"11\" text-anchor=\"middle\">environmental<\/text>\n<text x=\"380\" y=\"262\" fill=\"#f5f5f4\" font-size=\"13\" text-anchor=\"middle\">PROFIT<\/text><text x=\"380\" y=\"278\" fill=\"#f5f5f4\" font-size=\"11\" text-anchor=\"middle\">economic<\/text>\n<text x=\"380\" y=\"160\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">Sustainable<\/text><text x=\"380\" y=\"176\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">supply chain<\/text><\/svg>\n<div class=\"cap\">Rebuilt: Triple Bottom Line (John Elkington): people, planet, profit. The 2005 UN World Summit named the same three pillars of sustainable development.<\/div><\/div><p>Coined by <b>John Elkington<\/b>: a yardstick for assessing supply chain sustainability while driving profitability. Aims: transparency in performance, economic opportunity, stronger local activities and competitive advantage, less environmental degradation.<\/p><table><tr><th>TBL measure<\/th><th>Includes<\/th><\/tr><tr><td><b>Social<\/b><\/td><td>Health, well-being, quality of life: supportive work environments, gender equality, ethical practices, labour rights<\/td><\/tr><tr><td><b>Environmental<\/b><\/td><td>Green practices, certified suppliers, lower fossil fuel, waste and electricity use<\/td><\/tr><tr><td><b>Economic<\/b><\/td><td>Financial flow, expenditure, ROI, sustainable investments, growth prospects<\/td><\/tr><\/table><ul><li>Reduces carbon footprint and energy expense<\/li><li>Paves the way for future growth and financial security<\/li><li>Enhances brand image and productivity<\/li><\/ul><h4>Benefits: five business activities<\/h4><table><tr><th>Activity<\/th><th>Benefit<\/th><\/tr><tr><td>Supply chain operations<\/td><td>Lower energy cost by setting emission targets with suppliers<\/td><\/tr><tr><td>Branding<\/td><td>MIT Sloan: consumers may pay <b>2-10% more<\/b> for supply chain transparency<\/td><\/tr><tr><td>Compliance<\/td><td>Government mandates; UN 2030 Sustainable Development Goals; traceability, e-waste, conflict minerals<\/td><\/tr><tr><td>Investor relations<\/td><td>Irresponsible practices hurt stock prices; nearly half of investors (Gallup) interested in sustainable funds<\/td><\/tr><tr><td>Corporate culture<\/td><td>Millennials seek purpose; helps hire and retain<\/td><\/tr><\/table><h4>Key metrics (10)<\/h4><table><tr><th>Metric<\/th><th>Meaning<\/th><\/tr><tr><td>Carbon footprint<\/td><td>Total greenhouse gas emissions of operations<\/td><\/tr><tr><td>Energy consumption<\/td><td>Energy used across manufacturing, transport, distribution<\/td><\/tr><tr><td>Water usage<\/td><td>Water consumed in production<\/td><\/tr><tr><td>Waste generation<\/td><td>Waste at each stage; recycling<\/td><\/tr><tr><td>Supplier diversity<\/td><td>Size, location, ownership, social responsibility<\/td><\/tr><tr><td>Ethical sourcing<\/td><td>Share of materials from suppliers meeting labour and environmental standards<\/td><\/tr><tr><td>Supplier compliance<\/td><td>Adherence, e.g. Fair Trade or FSC certification<\/td><\/tr><tr><td>Product lifecycle analysis<\/td><td>Environmental impact from extraction to disposal<\/td><\/tr><tr><td>Transportation efficiency<\/td><td>MPG or kg CO2 per ton-km<\/td><\/tr><tr><td>Social impact<\/td><td>Fair wages, worker safety, community development<\/td><\/tr><\/table><h4>Drivers adding to sustainability (links to the six drivers)<\/h4><table><tr><th>Driver<\/th><th>Example<\/th><\/tr><tr><td>Facilities<\/td><td>Energy-efficient stores; waste turned into profit (Walmart)<\/td><\/tr><tr><td>Inventory<\/td><td>Cut landfill stock and harmful additives; Walmart removed phosphates and redesigned packaging<\/td><\/tr><tr><td>Transportation<\/td><td>Walmart cut delivery fuel use by <b>65%<\/b>; IKEA designs for density<\/td><\/tr><tr><td>Sourcing<\/td><td>Starbucks C.A.F.E. programme; Mattel recall due to lead paint shows the risk<\/td><\/tr><tr><td>Information<\/td><td>Lack of standard measurement; internal scorecards (Walmart packaging tool)<\/td><\/tr><tr><td>Pricing<\/td><td>Differential pricing by load or time; tax credits (Nissan Leaf); customer willingness to pay long term<\/td><\/tr><\/table><h4>Improving sustainability<\/h4><p>First step: find the supply chain's pain points by calculating the <b>product carbon footprint (PCF)<\/b>, which shows which operations need improvement; then set targets with suppliers, redesign packaging and transport, and track metrics.<\/p>\n<h4>Challenges<\/h4><p><b>Cost is the primary barrier<\/b> to implementing sustainable supply chains. Other difficulties: lack of standard measurement and reporting, supplier compliance, and the time customers take to accept change.<\/p>"],["Lecture 59 - Emergency Supply Chain","<div class=\"imp\"><b>★ Important:<\/b> Asked: conventional chains adopt <b>proactive or reactive strategies for disruptions (fires, floods, labour strikes)<\/b>; the <b>2015 Nepal earthquake<\/b> as an example of humanitarian coordination.<\/div><h4>What is an emergency supply chain (ESC)?<\/h4><p>A specialised logistical framework for urgent, unforeseen situations: natural disasters, public health emergencies, geopolitical crises. The Joint Logistics Enterprise defines a <b>complex emergency<\/b> as international conflict, humanitarian and domestic disaster relief scenarios involving warfare, food insecurity, epidemics and social conflict. ESCs have two domains: <b>networks supporting military expeditions<\/b> and <b>chains supporting NGO disaster relief<\/b>. Aim: timely and effective response, minimal disruption, support for recovery (stockpiling, alternate routes, agile communication).<\/p>\n<h4>Why a separate framework: disruption versus emergency<\/h4><table><tr><th>Conventional supply chain disruption<\/th><th>Emergency supply chain<\/th><\/tr><tr><td>Conventional chains adopt <b>proactive or reactive strategies<\/b> for fires, floods, labour strikes<\/td><td>Formed in response to the emergency, often without prior relationships<\/td><\/tr><tr><td>Existing configuration is adjusted; <b>identity unchanged<\/b> (same stakeholders, products, facilities)<\/td><td>New locations, routes and demand points set up quickly<\/td><\/tr><tr><td>Disruption happens to an existing chain<\/td><td>Disaster relief chains exist specifically to address disasters<\/td><\/tr><tr><td>Success: results at lowest cost, effective and efficient<\/td><td>Success: results quickly; <b>effectiveness over efficiency<\/b>, \"at all cost\"<\/td><\/tr><\/table><div class=\"dg\"><svg viewBox=\"0 0 760 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#a1a1aa\"/><\/marker><\/defs><rect x=\"10\" y=\"30\" width=\"350\" height=\"100\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><text x=\"185\" y=\"54\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">CONVENTIONAL SUPPLY CHAIN<\/text><text x=\"185\" y=\"69\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">goal: maximise service level at lowest cost<\/text><text x=\"185\" y=\"84\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">effective AND efficient<\/text><text x=\"185\" y=\"99\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">exists before; disruptions change its configuration<\/text><text x=\"185\" y=\"114\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">identity stays the same<\/text><rect x=\"400\" y=\"30\" width=\"350\" height=\"100\" rx=\"8\" fill=\"#0b0b0c\" stroke=\"#fb7185\" stroke-width=\"1.6\"/><text x=\"575\" y=\"54\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">EMERGENCY SUPPLY CHAIN<\/text><text x=\"575\" y=\"69\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">goal: results quickly, \"at all cost\"<\/text><text x=\"575\" y=\"84\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">effectiveness over efficiency<\/text><text x=\"575\" y=\"99\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">built after the emergency, new links, routes and demand<\/text><text x=\"575\" y=\"114\" fill=\"#f5f5f4\" font-size=\"12\" text-anchor=\"middle\">e.g. fly supplies instead of sealift<\/text><text x=\"380\" y=\"155\" fill=\"#f5f5f4\" font-size=\"14\" text-anchor=\"middle\">vs<\/text><\/svg><div class=\"cap\">Rebuilt: conventional versus emergency supply chains.<\/div><\/div><h4>Uniqueness of emergency logistics<\/h4><ul><li>Upstream and downstream elements assemble rapidly and need heavy coordination and information sharing<\/li><li>Cost-saving optimisation may be inappropriate; faster modes (flying instead of sealift)<\/li><li>Objective is operational effectiveness, not meeting general demand<\/li><li>Prioritisation of needs is required and urgent decisions carry risk<\/li><\/ul><h4>Humanitarian supply chain management<\/h4><p>Coordination of relief organisations such as UNICEF, using technology for tracking and prioritisation. Highlighted example: the <b>2015 Nepal earthquake<\/b> as effective humanitarian supply chain coordination.<\/p>"],["Lecture 60 - Assets Management in Supply Chain","<div class=\"imp\"><b>★ Important:<\/b> Asked: the <b>meaning of supply chain asset<\/b> (tangible or intangible resource), <b>WIP vs raw materials<\/b>, and <b>asset vs inventory management (complete life cycle)<\/b>.<\/div><h4>Supply chain asset<\/h4><p>A <b>supply chain asset<\/b> is any <b>tangible or intangible resource within a supply chain that contributes to its overall functioning and value creation<\/b>: physical (manufacturing facilities, warehouses, vehicles, inventory) and intangible (information systems, intellectual property, supplier relationships, brand reputation). The definition in the lecture excludes the company's cash and liquid investments.<\/p>\n<h4>Supply chain asset management<\/h4><p>Per the Corporate Finance Institute: developing, operating, maintaining and selling assets cost-effectively. It covers scheduled maintenance, work orders, historical and inventory data, employee and vendor scheduling, institutional knowledge. Example: a driver's post-trip inspection flags brake issues, so a quick work order cuts downtime. Reactive-only asset management hurts productivity; keep a birds-eye view.<\/p>\n<h4>Inventory management versus asset management<\/h4><table><tr><th>Inventory management<\/th><th>Asset management<\/th><\/tr><tr><td>Tracks stock as it enters and leaves<\/td><td>Manages items the organisation intends to keep <b>through their complete life cycles<\/b>, from procurement to disposal<\/td><\/tr><tr><td>Replenishes goods and parts to sell to customers<\/td><td>Regular inspection, cleaning, repair or replacement<\/td><\/tr><tr><td>Customers return items to inventory only if dissatisfied<\/td><td>Users borrow items and return them to the system<\/td><\/tr><tr><td>Minimal contact and minimal details per item<\/td><td>Detailed history per asset; decides which assets provide value<\/td><\/tr><\/table><h4>Types of asset in the supply chain<\/h4><table><tr><th>Asset<\/th><th>Meaning<\/th><\/tr><tr><td><b>Raw materials<\/b><\/td><td>Initial components or materials used in production<\/td><\/tr><tr><td><b>Work-in-progress (WIP)<\/b><\/td><td>Goods being manufactured, not yet complete<\/td><\/tr><tr><td>Finished goods<\/td><td>Fully manufactured, ready for sale or distribution<\/td><\/tr><tr><td>Packaging materials<\/td><td>For packing finished goods for transport and storage<\/td><\/tr><tr><td>Tools and equipment<\/td><td>Machinery and tools for manufacturing or distribution<\/td><\/tr><tr><td>Transportation vehicles<\/td><td>Trucks, ships, airplanes<\/td><\/tr><tr><td>Warehousing infrastructure<\/td><td>Warehouses and storage units<\/td><\/tr><tr><td>IT assets<\/td><td>Software, hardware, technology infrastructure<\/td><\/tr><tr><td>Intellectual property<\/td><td>Patents, trademarks, copyrights<\/td><\/tr><tr><td>Human resources<\/td><td>Skilled labour and workforce<\/td><\/tr><\/table><h4>Asset management KPIs<\/h4><table><tr><th>KPI<\/th><th>Formula / use<\/th><\/tr><tr><td><b>MTBF<\/b> (mean time between failures)<\/td><td>(Time in use - unplanned downtime) / number of breakdowns; anticipate failures<\/td><\/tr><tr><td><b>MTTR<\/b> (mean time to repair)<\/td><td>Total maintenance time / number of repairs; compare technicians<\/td><\/tr><tr><td><b>OEE<\/b> (overall equipment effectiveness)<\/td><td>Availability x Performance x Quality; supports repair-or-replace and maintenance decisions<\/td><\/tr><tr><td>Asset utilisation rate<\/td><td>How effectively assets are used compared with full potential<\/td><\/tr><tr><td>Return on assets<\/td><td>Profit generated per unit of asset value<\/td><\/tr><\/table><div class=\"cards\"><div class=\"m\"><b>Availability<\/b><span>True operating time / planned production time<\/span><\/div><div class=\"m\"><b>Performance<\/b><span>Actual cycle time vs planned (speed)<\/span><\/div><div class=\"m\"><b>Quality<\/b><span>Valid pieces / total pieces produced<\/span><\/div><\/div><h4>Asset tracking and best practices<\/h4><p>Asset tracking systems (barcodes, RFID, GPS, IoT) give location and condition in real time, improve uptime and cut loss, with risks of cost and data accuracy. Best practices: maintain an accurate asset register, use preventive and predictive maintenance, track KPIs, adopt technology, and plan replacement by life cycle.<\/p>"]],"gl":[["Supply chain sustainability","Considering environmental and human impact from sourcing to delivery.",""],["Goal of sustainability","Minimise environmental harm (energy, water, waste) and help communities.",""],["Traditional concerns","Revenue and profit, in addition to sustainability.",""],["Brundtland definition","Meet present needs without compromising future generations.",""],["Three pillars","Economic, environmental, social (UN 2005).",""],["Triple Bottom Line","People, planet, profit; coined by John Elkington.",""],["Social measures","Health, well-being, labour rights, gender equality.",""],["Environmental measures","Fossil fuel, waste, electricity use, certified suppliers.",""],["Economic measures","Cash flow, ROI, sustainable investment, growth.",""],["Consumer premium","MIT Sloan: pay 2-
