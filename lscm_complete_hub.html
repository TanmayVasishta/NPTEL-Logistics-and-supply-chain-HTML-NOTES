with sponsor. Measure: establish current-state performance (VSM and capability measures). Analyze: root causes of deviation from customer requirements. Improve: verify critical outputs, design improvements, pilot; outputs are new KPIs, action plans, future state maps, control plans, documentation. Control: monitoring systems for KPIs, control plans for deviations, corrective actions, continuous review.<\/p><h4 data-t=\"M\">JIT (Just-in-Time)<\/h4><p>Management philosophy that minimises inventory and waste by producing goods only as needed; reduces storage cost, excess inventory, obsolescence. Needs close supplier coordination and flexibility. JIT cycle steps: Design, Manage (TQM review), Pull (Kanban signalling, smaller lots), Establish (vendor relationships), Fine-tune (inventory policies), Build (team skills), Refine (fewer parts and steps), Review (quality metrics, root cause analysis).<\/p><h4 data-t=\"M\">5S<\/h4><p>Sort (Seiri): separate essential from non-essential. Set in order (Seiton): organise remaining items in designated locations. Shine (Seiso): clean and maintain for hygiene and safety. Standardize (Seiketsu): standard procedures to keep improvements. Sustain (Shitsuke): discipline and culture so employees uphold the first four daily.<\/p><h4 data-t=\"M\">Kaizen<\/h4><p>Continuous improvement via small steps: easier and faster, lower risk, accumulated effect often greater than one big improvement. Linked to the Deming cycle.<\/p><h4 data-t=\"M\">SMED<\/h4><p>Single-Minute Exchange of Die: rapid changeover from running one product to the next. 'Single minute' = changeovers and start-ups under <mark>10<\/mark> minutes (single-digit minutes). One-Touch Exchange of Die (OTED): under <mark>100<\/mark> seconds.<\/p><h4 data-t=\"L\">Challenges in implementing lean<\/h4><p>Cultural resistance; lack of leadership commitment; silo mentality; limited employee engagement; inadequate training and skills; measurement and accountability; sustainability of gains; external factors (market, regulation, downturns).<\/p><h4 data-t=\"M\">TPS founders and JIT origin<\/h4><p>Toyota founder Kiichiro Toyoda; TPS founders Taiichi Ohno (<mark>1912<\/mark>-<mark>1990<\/mark>) and Shigeo Shingo (<mark>1909<\/mark>-<mark>1990<\/mark>). The phrase Just-in-Time was coined by Kiichiro Toyoda in <mark>1937<\/mark> because the young company was poor and could not afford excess equipment or material. After WWII Ohno was tasked with improving productivity and driving in Just-in-Time and Jidoka.<\/p><h4 data-t=\"M\">7 principles of TPS<\/h4><p>Reduced setup time; small-lot production; employee involvement and empowerment; quality at the source; equipment maintenance; pull production; supplier involvement.<\/p><h4 data-t=\"M\">Poka-yoke<\/h4><p>Mistake or error proofing: low-cost, highly reliable devices that detect abnormal situations before they occur or, once they occur, stop the machine and prevent defective products.<\/p><h4 data-t=\"H\">Heijunka<\/h4><p>Production smoothing: a levelling technique supporting JIT, smoothing production across departments and suppliers over time; reduces waste by levelling fluctuations in performance within the assembly line; TPS uses it to handle fluctuating customer demand.<\/p><h4 data-t=\"M\">Standardization<\/h4><p>Standardized work has three elements: takt time, working sequence, standard in-process stock. Critical ingredient for Jidoka and JIT; consistent methods limit variation.<\/p><h4 data-t=\"L\">Toyota performance<\/h4><p>Per-head production rose <mark>80%<\/mark> after TPS (<mark>39.7<\/mark> to <mark>70.8<\/mark> vehicles). Market share: <mark>1970<\/mark> GM <mark>40%<\/mark> vs Toyota <mark>2%<\/mark>; Toyota <mark>3%<\/mark> in <mark>1980<\/mark>, <mark>8%<\/mark> in <mark>1990<\/mark>, <mark>9%<\/mark> in <mark>2000<\/mark>, <mark>13%<\/mark> in <mark>2006<\/mark> (GM <mark>26%<\/mark>). Described by the Japanese word 'jojo': slowly, gradually, steadily.<\/p><h4 data-t=\"M\">Lean vs agile logistics<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>Lean: objective efficient operations; method remove all waste; constraint customer service; long-term stability; productivity and utilisation; uniform, standardised work; formal planning cycles. Agile: flexibility to meet demands; customer satisfaction; constraint cost; fast reaction to changing circumstances; lead time and service level; variable work with more local control; less structured, empowered staff.<\/p><h4 data-t=\"M\">Toyota Production System house<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>Roof: highest quality, lowest cost, shortest lead time by eliminating wasted time and activity. Pillars: JIT (takt time, one-piece flow, pull system), culture of continuous improvement, Jidoka (manual or automatic line stop, separate operator and machine activities, error-proofing, visual control). Base: operational stability (Heijunka, standard work, TPM, value chain).<\/p><h4 data-t=\"M\">Jidoka and Poka-yoke<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>Principles of Jidoka: discover an abnormality, stop the process, fix the immediate problem, investigate and solve the root cause. Key components: Poka-yoke, Andon system, autonomous maintenance.<\/p><h4 data-t=\"M\">Gemba<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>Genchi Genbutsu: go and see. Engage: understand and ask about issues using the 5 whys. Muda, Mura, Muri: discover forms of waste. Be respectful: always. Analyse and assess the data you gathered, including the people there.<\/p><h4 data-t=\"M\">Kaizen<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>Kai (change) + Zen (better) = Kaizen, continuous improvement: everybody, everyday, everywhere. Successful examples on slides: easy to lubricate (gear box oil filling, before and after); difficult to inspect becomes easy to inspect (bell condition, before and after); tyre changeover time cut from 5 to <mark>10<\/mark> minutes to 5 to <mark>10<\/mark> seconds.<\/p><h4 data-t=\"L\">Continuous flow case study<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>Batch and push processing: <mark>21<\/mark> minutes for the first piece, lead time <mark>30<\/mark>+ minutes for the total order. Continuous flow (make one, move one): 3 minutes for the first piece, <mark>12<\/mark> minutes for the total order.<\/p><h4 data-t=\"L\">JIT case study (six steps)<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>Customer orders a batch, company orders matching parts; correct parts arrive as needed; stored briefly; assembled shortly after arrival; assembled product ready; finished product distributed soon after assembly.<\/p><h4 data-t=\"L\">Toyota performance charts<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>Per-head production (ten thousand JPY, <mark>1969<\/mark>-<mark>1980<\/mark>): Toyota highest and rising fastest, then Nissan, with GM and Ford far lower. Operating income (US$ millions, <mark>1994<\/mark>-<mark>2006<\/mark>): Toyota rises sharply from about <mark>2001<\/mark>, passing Honda and Nissan, to roughly <mark>6,000<\/mark>-<mark>7,000<\/mark> by <mark>2004<\/mark>-<mark>2006<\/mark> (read approximately from the chart).<\/p><h4 data-t=\"M\">Flow and rebuilt diagrams<\/h4><div class=\"flow\"><span>Define<\/span><i>&rarr;<\/i><span>Measure<\/span><i>&rarr;<\/i><span>Analyze<\/span><i>&rarr;<\/i><span>Improve<\/span><i>&rarr;<\/i><span>Control<\/span><\/div><div class=\"viz\"><h5>Lean vs agile logistics (source: creativesafetysupply.com, as on slide) <span class=\"wb sl\">SLIDE IMAGE<\/span><\/h5><table class=\"tb\"><tr><th>Factor<\/th><th>Lean logistics<\/th><th>Agile logistics<\/th><\/tr><tr><td>Objective<\/td><td>Efficient operations<\/td><td>Flexibility to meet demands<\/td><\/tr><tr><td>Method<\/td><td>Remove all waste<\/td><td>Customer satisfaction<\/td><\/tr><tr><td>Constraint<\/td><td>Customer service<\/td><td>Cost<\/td><\/tr><tr><td>Rate of change<\/td><td>Long-term stability<\/td><td>Fast reaction to changing circumstances<\/td><\/tr><tr><td>Measures of performance<\/td><td>Productivity, utilisation<\/td><td>Lead time, service level<\/td><\/tr><tr><td>Work<\/td><td>Uniform, standardised<\/td><td>Variable, more local control<\/td><\/tr><tr><td>Control<\/td><td>Formal planning cycles<\/td><td>Less structured by empowered staff<\/td><\/tr><\/table><\/div><div class=\"viz\"><h5>The Toyota Production System house <span class=\"wb sl\">SLIDE IMAGE<\/span><\/h5><div class=\"mid\">ROOF: Highest quality, lowest cost, shortest lead time by eliminating wasted time and activity<\/div><div class=\"g3\"><div><b>Just-in-Time (JIT)<\/b>Takt time, one-piece flow, pull system<\/div><div><b>Culture of continuous improvement<\/b>(centre pillar)<\/div><div><b>Jidoka<\/b>Manual or automatic line stop, separate operator and machine activities, error-proofing, visual control<\/div><\/div><div class=\"mid\" style=\"margin-top:8px\">FOUNDATION: Operational stability: Heijunka &middot; Standard work &middot; TPM &middot; Value chain<\/div><\/div><div class=\"viz\"><h5>Principles of Jidoka and its key components <span class=\"wb sl\">SLIDE IMAGE<\/span><\/h5><div class=\"flow\"><span>1 Discover an abnormality<\/span><i>&rarr;<\/i><span>2 Stop the process<\/span><i>&rarr;<\/i><span>3 Fix the immediate problem<\/span><i>&rarr;<\/i><span>4 Investigate and solve the root cause<\/span><\/div><div class=\"g3\" style=\"margin-top:8px\"><div><b>Poka-yoke<\/b>Error-proofing<\/div><div><b>Andon system<\/b>Signal (light and alert) when a problem occurs<\/div><div><b>Autonomous maintenance<\/b>Operators maintain their own equipment<\/div><\/div><\/div><div class=\"viz\"><h5>Batch &amp; push vs continuous flow <span class=\"wb sl\">SLIDE IMAGE<\/span><\/h5><table class=\"tb\"><tr><th><\/th><th>Batch &amp; push processing<\/th><th>Continuous flow (make one, move one)<\/th><\/tr><tr><td>Layout<\/td><td>Process A, B, C each work a batch (10 minutes each)<\/td><td>Processes A, B, C linked; one piece moves at a time<\/td><\/tr><tr><td>First piece out<\/td><td>21 minutes<\/td><td>3 minutes<\/td><\/tr><tr><td>Total order<\/td><td>Lead time 30+ minutes<\/td><td>12 minutes<\/td><\/tr><\/table><\/div><div class=\"viz\"><h5>JIT in six steps (case-study slide) <span class=\"wb sl\">SLIDE IMAGE<\/span><\/h5><div class=\"flow\"><span>1 Customer orders a batch; company orders parts equal to the number of products required<\/span><i>&rarr;<\/i><span>2 Correct number of parts arrives as needed<\/span><i>&rarr;<\/i><span>3 Parts stored for a short time until the line needs them<\/span><i>&rarr;<\/i><span>4 Parts assembled on the line shortly after arrival<\/span><i>&rarr;<\/i><span>5 Assembled product ready for distribution<\/span><i>&rarr;<\/i><span>6 Finished product distributed soon after assembly<\/span><\/div><\/div>"]],"gl":[["What it is","Traditional logistics with the flow in the opposite direction; the movement concerns waste and returns. Defined as taking waste and returns along the supply chain and reworking them (or parts of them) to create a new product that can be sold (Stanislawski & Szymonik, 2023).","K"],["Other names","Retro logistics, reverse supply chain, reverse logistics flow, reverse flow, backward supply chain, returns management, aftermarket logistics, aftermarket supply chain.",""],["Lambert & Stock","Reverse distribution is 'going the wrong way on a one way street' because the great majority of product shipments flow in one direction.",""],["Carter & Ellram","The return, upstream movement of a good or material from reuse, recycling or disposal; linked to environmental, quality and wear-dating issues; often performed by new, auxiliary channel members.",""],["Thierry et al.","Places reverse logistics under the umbrella of product recovery management.",""],["Rogers & Tibben-Lembke","Adapting the Council of Logistics Management definition: planning, implementing and controlling the efficient, cost-effective flow of raw materials, in-process inventory, finished goods and related information from the point of consumption to the point of origin, for recapturing value or proper disposal.","K"],["Reverse vs forward","Forward flow = raw materials and components needed for production. Reverse flow = everything coming from the consumer that is waste or a return.",""],["Reverse vs green logistics","Identifying them as the same is a mistake. Green logistics relates to environmentally friendly resources and their transformation in ways that are favourable to people and not harmful to the environment.","K"],["Types of returns","Return of unused products; commercial returns; returns of products under warranty; wastes and products from network activities (supply chain and reverse logistics); packaging.","K"],["Why important: legislation","Several countries, especially in Europe, force manufacturers to take back products after use. Netherlands (from January 1999): manufacturers and importers of white and brown goods must take back and recover products; similar rule for cars. Germany: Packaging Ordinance requires companies to collect all sales packaging.",""],["Why important: economics","Landfill space is depleting and landfill cost rose sharply: US national average tipping fee went from $8 to about $49.78 between 1985 and 2010 (about 600%). Recovery systems became more profitable for automobile parts, copiers, computers, tyres and aviation equipment. Reverse logistics is now a strategic part of business planning.","K"],["Why important: environment","Reduces costs while ensuring sustainability, helps adhere to environmental legislation, and lets a company project itself as 'green' (an increasingly important marketing element).",""],["Why important: services shift","Consumers increasingly buy a set of services with products (e.g. maintenance contracts covering repairs and parts), which facilitates take-back of end-of-life products.",""],["E-waste example","E-waste is among the fastest-growing waste types; 80% of mobile phones are upgraded every two years. Sources: households, industries, institutions (schools, hospitals, government). Collection via municipal points, electronic industries, retailers, informal and formal recycling. Informal recycling is common in developing countries such as India and South Africa, where methods are rudimentary and much e-waste ends in uncontrolled landfills.",""],["Key aspect: product returns","Returns due to defects, damage, overstock or dissatisfaction: receiving, inspecting, refurbishing, repackaging.",""],["Key aspect: remanufacturing and refurbishment","Restore returned or used products to functional or marketable condition: disassembly, repair, cleaning, reassembly.",""],["Key aspect: recycling and disposal","Recycling packaging, extracting valuable materials from end-of-life products, disposing hazardous waste responsibly.",""],["Key aspect: warranty and service management","Handling warranty claims, service requests and repairs with service providers, suppliers and customers.",""],["Key aspect: asset recovery and remarketing","Recover value through resale, remarketing, redistribution: selling refurbished products, liquidating excess inventory, repurposing assets.",""],["Key aspect: supply chain optimization","Use reverse processes to improve efficiency, cut cost, improve sustainability: reverse logistics software, route optimization, integration with forward logistics.",""],["Process (Ait-Kadi et al., 2013)","Gatekeeping, collection, sorting, processing (treatment), disposal.","K"],["Gatekeeping","Controls product entrance into the reverse system; blocks returns that do not belong to the business or where there is no contract or legal obligation. Usually ends in acceptance or rejection.",""],["Collection","Recovery and transport of returned products; can be handled by customers, third parties or the business. Canon: in 1990 launched an ink cartridge collection programme with a pre-paid shipping coupon in new cartridge packaging; now collection in 24 countries via retailers, a logistics service provider or direct shipping.",""],["Sorting","Validates the information from gatekeeping; products sorted by condition and reason for return.",""],["Processing and treatment","Three sub-steps: choose from the processing activities the business offers (limited by stock levels and sale possibility, and by product nature, age, condition), then process. Options: repackaging, repair, disassembling, reconfiguring, remanufacturing, updating or upgrading, recycling, donating, selling on secondary markets, incinerating, disposing.",""],["Remanufacturing vs repair","Remanufacturing reworks modules, components or whole products to a state equivalent to new; unlike repair, it systematically replaces a larger number of used or defective modules or components.","K"],["Disposal","Landfill or incinerator, used as a last resort. Ensure no hazardous materials in the waste (or treat them to comply with laws and policy); incinerators should at least recover heat energy (vapour turned into electricity).",""],["Success factors (10)","Visibility and transparency; efficient returns management; product recovery and disposition; collaboration with partners; network design; technology and data analytics; compliance and regulation; customer experience and satisfaction; continuous improvement and innovation; sustainability and corporate responsibility.","E"],["Visibility and transparency","Track returned products, their condition and movement; reveals bottlenecks and delays.",""],["Efficient returns management","Clear return policies, convenient return options, streamlined processing to minimise delays and errors.",""],["Network design","Strategically locate return centres, refurbishment facilities, recycling centres and disposal sites to cut transport cost, lead time and improve resource use.",""],["Technology and data analytics","Tracking and tracing systems, automated sorting and processing, predictive analytics: real-time visibility, faster decisions, proactive problem-solving.","E"],["Performance measures","Return rate (% of units sold that are returned); return processing time; recovery rate (% of returns refurbished, repaired, resold or recycled); regulatory compliance; disposition cost; transportation cost; inventory holding cost; customer education and communication; customer satisfaction; environmental impact (carbon, energy, water, waste); continuous improvement; supplier collaboration; training and skills; technology adoption (RFID, IoT sensors, AI); risk management and contingency planning; reverse supply chain integration; circular economy initiatives; metrics alignment; stakeholder engagement.","K"],["Case: Amazon","No-fuss returns and training programmes. National Retail Federation: record $761 billion of merchandise returned in 2021; 16.6% of holiday-season merchandise returned (up over 56% on the year before); online return rate nearly 21% (18% in 2020). Free, fast returns attract customers but raise volume and cost. Product donation: software identifies and sorts items fit for donation at fulfilment centres. Samsung 49-inch TV in SIPP packaging: eliminates nine packaging components, package volume down 69%, air shipped down 87%.","K"],["Case: IKEA","Generous return policy; refurbishment centres (inspect, repair, clean, new finishes); material recovery facilities (separate wood, metal, plastics for recycling); circular design (durability, repairability, recyclability). Goal: carbon neutral by 2030.",""],["House of Reverse Logistics (Wang & Sun, 2005)","Slide 'Reverse logistics: an overview'. Goal: minimise cost and maximise profit. Five pillars: RL input, RL process, RL structure, RL output, RL system, resting on reasons (legislation, social responsibility, corporate imaging, environmental concern, economic benefit, customer awareness). Each pillar has a box of factors (see the rebuilt diagram below).","K"],["Process diagram","The generic process (Ait-Kadi et al., 2013): returned goods pass through gatekeeping, collection, sorting, treatment and disposal system, with an integrated information system and reverse logistics coordination across all stages.","K"],["GSCM","The component reflecting the relationship between the natural environment and supply chain operations; includes external and internal factors that influence logistics management, and measures supply chain performance on environmental aspects.","E"],["GSCM practices","Green transportation (freight CO2 emissions rising since the 1990s; 71% in 2016 and expected to rise 50% more by 2050); green procurement and logistics (buying products and services less harmful to environment at competitive prices); green warehouse (adequate stock to avoid waste, lower transport cost); green design; green manufacturing (little to no pollution or waste); green marketing.","K"],["Green logistics","Eco-friendly logistics: managing flow of goods and resources to minimise environmental impact; reduces carbon emissions, energy use, waste across transport, warehousing, distribution. Examples: alternative fuels, route optimization, energy-efficient vehicles, less packaging waste, reverse logistics, eco-friendly packaging. Before the 1960s there was little concern; the environment was seen as able to absorb waste and replace resources without limit (Murphy & Poist, 1995).","K"],["GSCM vs green logistics","Scope: entire process from raw material extraction to delivery vs transportation and distribution only. Activities: sustainable sourcing, efficient manufacturing, recycling, eco packaging vs route optimization, low-emission vehicles, efficient WMS, sustainable packaging. Objective: minimise environmental impact of whole chain while keeping efficiency and profit vs make logistics more environmentally friendly by cutting GHG, energy and resource use.","K"],["Challenges","Rising raw material prices; COVID-19 disruption (sourcing difficulty, higher prices); need to change management ideas and existing models toward 'energy conservation, environmental protection and low consumption'.",""],["Key technologies","Green transport technologies (cut GHG, air pollution, noise, space use); green vehicle routing considering CO2-equivalent emissions; logistics solutions for carbon neutrality (green procurement, packaging, warehousing; tackling the last-mile challenge); horizontal collaboration (pooling logistics activities and consolidating supply chains of two or more manufacturers); logistics agglomeration in clusters; decarbonization = measure emissions, set reduction targets, assess carbon-reducing options; road freight is a major contributor so alternative fuels matter.",""],["KPI: reverse chain performance","% of returns refurbished or recycled, processing time, cost per unit of managing returns.",""],["KPI: circular economy transition","% raw materials from recycled or renewable sources; % reduction in waste; ROI of circular initiatives.",""],["KPI: environmental and financial","Correlation between environmental indicators (carbon footprint, energy) and financial indicators (profit margin, ROI); cost-benefit analysis; fuel efficiency (fuel per distance or per weight); route optimization effectiveness.",""],["KPI: sustainability and waste","% reduction in waste per unit output; recycling rate; energy efficiency ratio.",""],["KPI: TOVE","Transportation Overall Vehicle Effectiveness. Vehicle utilization rate = actual payload weight / maximum payload capacity.","K"],["Standards and frameworks","EN 16258 and ISO 14083 (measure and report GHG and energy in transport); GLEC Framework (Global Logistics Emissions Council: calculate direct and indirect emissions); harmonization of emissions calculations for consistency and benchmarking.","K"],["Carbon footprint formulas","Footprint = emissions from transport + warehousing + other logistics. Emissions = activity level x emission factor. Electricity: kWh/yr x 0.85 = kg CO2. Petrol: litres/yr x 2.296 = kg CO2. Diesel: litres/yr x 2.653 = kg CO2.","K"],["Case: DHL","Founded 1969 by Adrian Dalsey, Larry Hillblom and Robert Lynn; operates in 220 countries; CSR and sustainability focus since 2009; GoGreen programme. Aimed to reduce carbon emission to 50%, resulting in pollution emission reduced to 70% (as stated on the slide); clean pickup and delivery using electrified vehicles and bicycles; training for suppliers and employees.",""],["Case: Myntra (green packaging)","Plastic-free packaging also adopted by seller partners. Replaced poly pouches with recycled paper bags, bubble wrap with carton waste shredded material, plastic tape with paper tape, invoice polybags with recycled Kraft paper pouch, and used RFID-tagged multi-use polyester bags. Diverted 670 tonnes of plastic (as of September 2021). 'E-commerce-ready packaging' removes the secondary packaging layer. Partnered with Canopy (no deforestation) and Better Cotton Initiative; two fulfilment centres solar powered.","E"],["Case: IKEA (green transport)","Travel plans for staff (bicycle, walking, bus, car-sharing); loading shelves instead of wooden pallets cut space and cost. 2019 report: transport emissions 19.4%. Goals: cut GHG from transport by 30% in 2020 and reach 70% reduction by 2030.",""],["Future prospects","Battery electric vehicles (BEV) best for short city routes; fuel cell vehicles (FCV) for longer routes, huge trucks, buses; both emit no GHG or air pollutants. Data envelopment analysis (DEA) evaluates efficiency of green practices. Supplier selection matters: green purchasing ability, green competencies, environmental management, investments, regulatory compliance.",""],["Lean logistics","Approach to supply chain management focused on eliminating waste, improving efficiency, streamlining processes, creating constant flow, enhancing collaboration and achieving quality, while cutting costs and maintaining or improving service (Paul Myerson, 2012). Also: recognising and eliminating wasteful activities to increase product flow and speed (Alan Harrison, 2011).","E"],["Benefits","Improved efficiency, reduced costs, improved customer service, increased profitability; more agile, responsive supply chain.","K"],["History","Rooted in lean manufacturing from Japan. Term coined by John Krafcik in his 1988 master's thesis at MIT. Lean manufacturing pioneered by Toyota engineer Taiichi Ohno in the 1970s. Logistics cost is 5-15% of turnover in industry and 15-25% in retail.","E"],["Muda = waste","Any activity or process that does not add value. Seven types (categorized by Taiichi Ohno in the Toyota Production System): Transport (movement between operations and locations); Inventory (WIP, finished goods, raw material stock); Motion (movement of a person or machine during an operation); Waiting (for a machine, product to arrive, etc.); Overproduction (beyond what the customer ordered); Over-processing (operations beyond what the customer requires); Defects (rejects and rework).","E"],["Other wastes","Talent (unused skills and knowledge); resources (lights and idle machines left on); by-products (not used). Tools to remove waste: Poka-yoke, Kanban, Takt time, SMED, one-piece flow.","K"],["Waste sources in logistics","Inventory (keep minimum), warehousing (an extra stop that adds cost and risk), trucks (each loading is motion), travel (time on the road; combine shipments), people (reallocate to productive tasks), e-vehicles (support waste reduction and sustainability).",""],["Muri = overburden","Unnecessary stress on employees and processes; causes breakdowns of machines and absenteeism of employees. Caused by Mura and failures such as lack of training, unclear ways of working, wrong tools, poor performance measures. Examples: untrained work, poor layouts, unclear instructions, lack of tools, fluctuating demand, poor maintenance, unreliable processes, poor communication.","E"],["Mura = unevenness","Waste of unevenness or inconsistency; Mura drives Muda. Example: manager measured on monthly output, department rushes in the last week, over-uses components, then the first week is slow, giving a 'hockey stick' production graph. Better to smooth production to customer demand.","K"],["Principles (5)","Eliminating waste; improving efficiency (cycle times, throughput, right materials at right time); streamlining processes (remove redundant steps, improve visibility, automate); creating constant flow (inventory levels, lead times, information flow); enhancing collaboration (suppliers, manufacturers, customers); achieving quality (accuracy, consistency, reliability, quality standards).","K"],["KPIs","On-time delivery; lead time; inventory turnover; order accuracy; transportation cost per unit; warehouse utilization; cycle time; dock-to-stock time (from receipt at dock to stored on racks); return rate; order fulfilment cycle time; perfect order rate; backorder rate; supplier on-time delivery; order lead time variability; shipment damage rate; sustainability metrics; employee engagement and training metrics.",""],["Muda, Muri, Mura picture","The slide shows three cartoon workers with buckets labelled MUDA, MURI, MURA (Japanese forms shown). It also shows 7 Wastes of Lean icons: inventory, waiting, defects, overproduction, motion, transportation, over-processing.","K"],["Capacity vs load vs demand","A house-shaped diagram: the capacity of the system is greater than the load on the system, and customer demand is lower still; the unused capacity is labelled Muda.",""],["Methodologies","Value stream mapping; JIT inventory management; standardized work procedures; continuous improvement culture (Kaizen events, suggestion systems); supplier collaboration; Lean Six Sigma (DMAIC, root cause analysis); technology integration (WMS, TMS, inventory optimization); sustainable packaging; route optimization; performance-based contracts; demand forecasting and planning; modular transportation (intermodal, containerization); reverse logistics optimization; performance measurement and monitoring.",""],["Value Stream Mapping (VSM)","Identifies waste, inefficiencies and bottlenecks and develops strategies to remove them. Maps the whole value stream from customer request to delivery. Defines value from the customer's perspective. A visual representation of every step including material flows, information flows and process times. Quote by W. Edwards Deming: 'If you can't describe what you are doing as a process, you don't know what you're doing.'","E"],["VSM step 1: Prepare","Document the case for change, define scope (start and end of process), identify requirements, review measurements; set logistics for the event (participants, location, materials).",""],["VSM step 2: Gather data (current state)","Walk the value stream, follow item and information flow; collect per step: trigger/done, actual lead time, actual cycle time, on-time delivery, defect rate, batch sizes, quality, variations, output, staffing, overtime, work in process. Map flow of items and information; add data and issues.",""],["VSM step 3: Future state and action plans","Discuss ideal state, develop future state map, action plans and cadence tracking, draft timeline, communication and training.",""],["VSM step 4: Execute to plan","Implement improvements through workshops, events, projects; achieve value stream objectives; create continuous improvement environment.",""],["VSM step 5: Align","Periodic alignment meeting: review results and impact on metrics, next quarter events, business changes; update plans; address resistance and sustainment.",""],["Worked example (stapling)","Steps: pick up paper (1 s), walk to stapler (5 s, 20 ft), staple paper (2 s), walk to desk (5 s, 20 ft), put down paper (1 s). Total time 14 s, total distance 40 ft, value-added time 4 s, value-added distance 0, so value-added time = 28% (the two walks are excess travel). Customer need: stapled pages. Source: Dickson Chiu (2006).","K"],["VSM approach picture","Slide: 'Analyzing the value stream' is a planning tool to optimise results of eliminating waste: current-state VSM + lean basics = future-state VSM. The five process steps are prepare, gather data and develop current state, develop future state and action plan, execute to plan, align.",""],["DMAIC","Define: agree scope, goals and financial targets with sponsor. Measure: establish current-state performance (VSM and capability measures). Analyze: root causes of deviation from customer requirements. Improve: verify critical outputs, design improvements, pilot; outputs are new KPIs, action plans, future state maps, control plans, documentation. Control: monitoring systems for KPIs, control plans for deviations, corrective actions, continuous review.","E"],["JIT (Just-in-Time)","Management philosophy that minimises inventory and waste by producing goods only as needed; reduces storage cost, excess inventory, obsolescence. Needs close supplier coordination and flexibility. JIT cycle steps: Design, Manage (TQM review), Pull (Kanban signalling, smaller lots), Establish (vendor relationships), Fine-tune (inventory policies), Build (team skills), Refine (fewer parts and steps), Review (quality metrics, root cause analysis).","K"],["5S","Sort (Seiri): separate essential from non-essential. Set in order (Seiton): organise remaining items in designated locations. Shine (Seiso): clean and maintain for hygiene and safety. Standardize (Seiketsu): standard procedures to keep improvements. Sustain (Shitsuke): discipline and culture so employees uphold the first four daily.","K"],["Kaizen","Continuous improvement via small steps: easier and faster, lower risk, accumulated effect often greater than one big improvement. Linked to the Deming cycle.","K"],["SMED","Single-Minute Exchange of Die: rapid changeover from running one product to the next. 'Single minute' = changeovers and start-ups under 10 minutes (single-digit minutes). One-Touch Exchange of Die (OTED): under 100 seconds.","K"],["Challenges in implementing lean","Cultural resistance; lack of leadership commitment; silo mentality; limited employee engagement; inadequate training and skills; measurement and accountability; sustainability of gains; external factors (market, regulation, downturns).",""],["TPS founders and JIT origin","Toyota founder Kiichiro Toyoda; TPS founders Taiichi Ohno (1912-1990) and Shigeo Shingo (1909-1990). The phrase Just-in-Time was coined by Kiichiro Toyoda in 1937 because the young company was poor and could not afford excess equipment or material. After WWII Ohno was tasked with improving productivity and driving in Just-in-Time and Jidoka.","K"],["7 principles of TPS","Reduced setup time; small-lot production; employee involvement and empowerment; quality at the source; equipment maintenance; pull production; supplier involvement.","K"],["Poka-yoke","Mistake or error proofing: low-cost, highly reliable devices that detect abnormal situations before they occur or, once they occur, stop the machine and prevent defective products.","K"],["Heijunka","Production smoothing: a levelling technique supporting JIT, smoothing production across departments and suppliers over time; reduces waste by levelling fluctuations in performance within the assembly line; TPS uses it to handle fluctuating customer demand.","E"],["Standardization","Standardized work has three elements: takt time, working sequence, standard in-process stock. Critical ingredient for Jidoka and JIT; consistent methods limit variation.","K"],["Toyota performance","Per-head production rose 80% after TPS (39.7 to 70.8 vehicles). Market share: 1970 GM 40% vs Toyota 2%; Toyota 3% in 1980, 8% in 1990, 9% in 2000, 13% in 2006 (GM 26%). Described by the Japanese word 'jojo': slowly, gradually, steadily.",""],["Lean vs agile logistics","Lean: objective efficient operations; method remove all waste; constraint customer service; long-term stability; productivity and utilisation; uniform, standardised work; formal planning cycles. Agile: flexibility to meet demands; customer satisfaction; constraint cost; fast reaction to changing circumstances; lead time and service level; variable work with more local control; less structured, empowered staff.","K"],["Toyota Production System house","Roof: highest quality, lowest cost, shortest lead time by eliminating wasted time and activity. Pillars: JIT (takt time, one-piece flow, pull system), culture of continuous improvement, Jidoka (manual or automatic line stop, separate operator and machine activities, error-proofing, visual control). Base: operational stability (Heijunka, standard work, TPM, value chain).","K"],["Jidoka and Poka-yoke","Principles of Jidoka: discover an abnormality, stop the process, fix the immediate problem, investigate and solve the root cause. Key components: Poka-yoke, Andon system, autonomous maintenance.","K"],["Gemba","Genchi Genbutsu: go and see. Engage: understand and ask about issues using the 5 whys. Muda, Mura, Muri: discover forms of waste. Be respectful: always. Analyse and assess the data you gathered, including the people there.","K"],["Kaizen","Kai (change) + Zen (better) = Kaizen, continuous improvement: everybody, everyday, everywhere. Successful examples on slides: easy to lubricate (gear box oil filling, before and after); difficult to inspect becomes easy to inspect (bell condition, before and after); tyre changeover time cut from 5 to 10 minutes to 5 to 10 seconds.","K"],["Continuous flow case study","Batch and push processing: 21 minutes for the first piece, lead time 30+ minutes for the total order. Continuous flow (make one, move one): 3 minutes for the first piece, 12 minutes for the total order.",""],["JIT case study (six steps)","Customer orders a batch, company orders matching parts; correct parts arrive as needed; stored briefly; assembled shortly after arrival; assembled product ready; finished product distributed soon after assembly.",""],["Toyota performance charts","Per-head production (ten thousand JPY, 1969-1980): Toyota highest and rising fastest, then Nissan, with GM and Ford far lower. Operating income (US$ millions, 1994-2006): Toyota rises sharply from about 2001, passing Honda and Nissan, to roughly 6,000-7,000 by 2004-2006 (read approximately from the chart).",""]],"q":[["o","Which is listed as a factor for successful reverse logistics?",["Maximizing landfill usage","Reducing supplier collaboration","Technology and Data Analytics","Minimizing customer returns policy options"],2,"L13 lists 10 success factors including technology and data analytics (tracking, automated sorting, predictive analytics)."],["o","Green Supply Chain Management (GSCM) primarily reflects the relationship between:",["Financial planning and procurement","Natural environment and supply chain operations","Customer satisfaction and brand management","Manufacturing output and warehouse capacity"],1,"L14: GSCM reflects the relationship of the natural environment and supply chain operations."],["o","Myntra replacing poly pouches with recycled paper bags is which green practice?",["Green transportation","Green procurement","Green packaging","Green warehousing"],2,"L14 Myntra case: sustainable packaging alternatives (paper bags, paper tape, Kraft pouches); 670 tonnes of plastic diverted."],["o","Lean logistics focuses primarily on:",["Increasing inventory buffer levels","Expanding supplier networks across borders","Eliminating waste, improving efficiency, and streamlining supply chain processes","Maximizing warehouse storage space utilization"],2,"L15 definition (Myerson, 2012): eliminate waste, improve efficiency, streamline processes."],["o","Which is NOT one of the 7 types of Muda categorized by Taiichi Ohno?",["Innovation","Waiting","Transport","Overproduction"],0,"The 7: transport, inventory, motion, waiting, overproduction, over-processing, defects."],["o","'Muri' in lean logistics means:",["Waste in production processes","Unevenness in demand and production","Overburden or unnecessary stress on employees and processes","Excess inventory holding costs"],2,"Muda = waste, Mura = unevenness, Muri = overburden (L15)."],["o","Who coined 'Lean Logistics' in his 1988 master's thesis at MIT?",["Taiichi Ohno","John Krafcik","Shigeo Shingo","Kiichiro Toyoda"],1,"L15 history slide: John Krafcik, 1988 master's thesis at MIT. (Kiichiro Toyoda coined Just-in-Time in 1937.)"],["o","Visual representation of all steps incl. material flows, information flows and process times:",["Just-in-Time (JIT)","DMAIC","5S","Value Stream Mapping (VSM)"],3,"L16 VSM slide uses this exact description."],["o","In DMAIC, what does 'C' stand for?",["Coordinate","Confirm","Control","Calculate"],2,"Define, Measure, Analyze, Improve, Control (L17)."],["o","Heijunka in the Toyota Production System refers to:",["Error-proofing devices to prevent defects","Production smoothing to level fluctuations in demand and performance","Continuous improvement through small incremental changes","Autonomous defect detection and machine stoppage"],1,"L17: Heijunka = production smoothing/levelling. Error-proofing is poka-yoke; small steps is Kaizen."]],"imp":[["Success factors (10) (Lecture 13)","Visibility and transparency; efficient returns management; product recovery and disposition; collaboration with partners; network design; technology and data analytics; compliance and regulation; customer experience and satisfa..."],["Technology and data analytics (Lecture 13)","Tracking and tracing systems, automated sorting and processing, predictive analytics: real-time visibility, faster decisions, proactive problem-solving."],["GSCM (Lecture 14)","The component reflecting the relationship between the natural environment and supply chain operations; includes external and internal factors that influence logistics management, and measures supply chain performance on environ..."],["Case: Myntra (green packaging) (Lecture 14)","Plastic-free packaging also adopted by seller partners. Replaced poly pouches with recycled paper bags, bubble wrap with carton waste shredded material, plastic tape with paper tape, invoice polybags with recycled Kraft paper p..."],["Lean logistics (Lecture 15)","Approach to supply chain management focused on eliminating waste, improving efficiency, streamlining processes, creating constant flow, enhancing collaboration and achieving quality, while cutting costs and maintaining or impro..."],["History (Lecture 15)","Rooted in lean manufacturing from Japan. Term coined by John Krafcik in his 1988 master's thesis at MIT. Lean manufacturing pioneered by Toyota engineer Taiichi Ohno in the 1970s. Logistics cost is 5-15% of turnover in industry..."],["Muda = waste (Lecture 15)","Any activity or process that does not add value. Seven types (categorized by Taiichi Ohno in the Toyota Production System): Transport (movement between operations and locations); Inventory (WIP, finished goods, raw material sto..."],["Muri = overburden (Lecture 15)","Unnecessary stress on employees and processes; causes breakdowns of machines and absenteeism of employees. Caused by Mura and failures such as lack of training, unclear ways of working, wrong tools, poor performance measures. E..."],["Value Stream Mapping (VSM) (Lecture 16)","Identifies waste, inefficiencies and bottlenecks and develops strategies to remove them. Maps the whole value stream from customer request to delivery. Defines value from the customer's perspective. A visual representation of e..."],["DMAIC (Lecture 17)","Define: agree scope, goals and financial targets with sponsor. Measure: establish current-state performance (VSM and capability measures). Analyze: root causes of deviation from customer requirements. Improve: verify critical o..."],["Heijunka (Lecture 17)","Production smoothing: a levelling technique supporting JIT, smoothing production across departments and suppliers over time; reduces waste by levelling fluctuations in performance within the assembly line; TPS uses it to handle..."]]},"4":{"notes":[["Lecture 18 - Trends in Logistics (1): history, categories, stakeholders, technology","<div class=\"tip\"><b>Analogy:<\/b> Like a city's traffic system: many different vehicles and authorities, increasingly run by sensors and software.<\/div><h4 data-t=\"L\">History<\/h4><p>Traced to military contexts. Computing advances in the 1960s and 1970s drove mathematical modelling in logistics. Consolidation into functional departments and growth of third-party transport and LSPs led to the 'Industrialization of Services'. UPS, FedEx and Walmart pioneered industrialization of logistics services. E-logistics then RFID and the 'Internet of Things' (internet technologies + RFID objects + decentralised control).<\/p><h4 data-t=\"M\">Categories of modern logistics (Behrends, 2016)<\/h4><p>Retail; consumer shopping trips; Couriers, Express and Parcel (CEP: global networks, cross-dock terminals); HoReCa (hotels, restaurants, catering: frequent Just-In-Time deliveries); construction (irregular but timely supply); waste management; industrial and terminal haulage.<\/p><h4 data-t=\"L\">Stakeholders (Behrends, 2016)<\/h4><p>Shippers and receivers (decide shipment size, frequency, lead time, delivery precision); public authorities (land-use, traffic planning, infrastructure; boost economy while limiting freight impact on residents); carriers (own-account or third-party; high utilization with required service quality).<\/p><h4 data-t=\"L\">Technology trends<\/h4><p>Automation, IoT, cloud computing, AI, digital twins; plus blockchain, advanced data analytics, robotics, augmented reality, advanced geolocation. Future trends: elastic logistics, green logistics, last-mile delivery, autonomous vehicles, on-demand warehousing.<\/p><h4 data-t=\"H\">Elastic logistics<\/h4><p>Ability of a business to rapidly reduce or expand logistics activities and infrastructure in line with supply chain demand using data-driven technology.<\/p><h4 data-t=\"M\">Automation, IoT, cloud<\/h4><p>Automation: software or machinery taking over part of manual tasks. IoT automates warehouse operations and optimises space use. Cloud: on-demand access to logistics software, storage and processing; real-time shipment tracking.<\/p><h4 data-t=\"L\">Robots, AI, AR, digital twins<\/h4><p>Logistics robots store and move goods (intralogistics). AI optimises routes and schedules from delivery locations and inventory levels. AR-enhanced warehousing lays shortest routes to find items. Digital twins test disruptions, outlier and black swan events without affecting real operations. GPS, BLE, Wi-Fi, cellular and IoT trackers support tracking.<\/p><h4 data-t=\"H\">Cold chain logistics<\/h4><p>Management and transport of temperature-sensitive products (perishables, pharmaceuticals) in a controlled environment to maintain quality and integrity. Components: temperature control; packaging (insulated containers, refrigerated trucks); monitoring and tracking; risk management (equipment failure, temperature excursions); regulatory compliance (FDA, WHO).<\/p><h4 data-t=\"H\">Blockchain<\/h4><p>Decentralised, distributed ledger giving transparency, traceability and security without intermediaries. Elements: transparency and traceability (tamper-proof record); enhanced visibility; improved security (cryptography, consensus); streamlined processes via smart contracts; reduced cost and delays. It identifies non-compliance with standards or product damage during transport.<\/p><h4 data-t=\"H\">Smart contract<\/h4><p>Self-executing contract with predefined rules and conditions, automatically enforced when criteria are met, reducing manual intervention. Helps with fraud, administrative errors and wasted time.<\/p><h4 data-t=\"H\">Big data roles<\/h4><p>Predictive analytics (historical and real-time data to forecast demand, optimise inventory, anticipate disruptions); route optimization (traffic, weather, performance data); warehouse management (layout, picking time, high-demand items); demand forecasting; supply chain visibility; risk management (supplier failure, disasters, geopolitical events).<\/p><h4 data-t=\"M\">Logistics 1.0 to 4.0 (Galindo, 2016)<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>1.0: steam engine power and mechanisation of transport. 2.0: electric power, mass production, automation of handling systems. 3.0: computers and IT, logistics management systems (WMS, TMS), NACCS. 4.0: Internet, IoT and IoS, RFID, CPS, DM. Complexity rises with each stage. Slide timeline markers at about <mark>1800<\/mark>, <mark>1969<\/mark> and <mark>2000<\/mark>; 'Today <mark>2106<\/mark>' appears to be a typo for <mark>2016<\/mark>.<\/p><h4 data-t=\"L\">Drone last-mile system<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>Diagram from Eskandaripour and Boldsaikhan (<mark>2023<\/mark>): depot, trucks, drones and customers connected by Wi-Fi links.<\/p><h4 data-t=\"M\">Flow and rebuilt diagrams<\/h4><div class=\"viz\"><h5>Logistics 1.0 to 4.0 (Galindo, 2016) <span class=\"wb sl\">SLIDE IMAGE<\/span><\/h5><table class=\"tb\"><tr><th>Stage<\/th><th>Technology<\/th><th>Features on slide<\/th><\/tr><tr><td>Logistics 1.0 (end of 18th century to about 1800)<\/td><td>Steam engine power<\/td><td>Mechanisation of transport; from animal force to railway network and steamer/aircraft ship<\/td><\/tr><tr><td>Logistics 2.0 (about 1800 to 1969)<\/td><td>Electric power and mass production<\/td><td>Automation of handling systems; automatic warehousing and sorting equipment; mechanisation of port cargo<\/td><\/tr><tr><td>Logistics 3.0 (1969 to about 2000)<\/td><td>Computers and IT<\/td><td>System of logistics management; WMS, TMS and IT spread; NACCS as progress in infrastructure systems<\/td><\/tr><tr><td>Logistics 4.0 (about 2000 to today)<\/td><td>Use of Internet<\/td><td>Evolution of IoT and IoS; RFID systems; CPS; DM (as labelled)<\/td><\/tr><\/table><p class=\"cap\">Degree of complexity rises from 1.0 to 4.0. The slide's 'Today 2106' looks like a typo for 2016, the paper's date. The year markers are read from arrows on the timeline.<\/p><\/div><div class=\"viz\"><h5>Drone system for last-mile delivery (Eskandaripour &amp; Boldsaikhan, 2023) <span class=\"wb sl\">SLIDE IMAGE<\/span><\/h5><div class=\"flow\"><span>Depot<\/span><i>&rarr;<\/i><span>Truck<\/span><i>&rarr;<\/i><span>Drone<\/span><i>&rarr;<\/i><span>Customer<\/span><\/div><p class=\"cap\">Legend on slide: Wi-Fi, depot, customer, truck, drone. Trucks carry parcels from the depot while drones serve customers on short legs.<\/p><\/div>"],["Lecture 19 - Trends in Logistics (2): drivers, India, challenges, measures, cases","<div class=\"tip\"><b>Analogy:<\/b> Like online shopping: customers want live tracking, small frequent parcels and green delivery, so every layer has to be digital.<\/div><h4 data-t=\"L\">Factors fostering innovation<\/h4><p>Supply chain agility; global labour shortages; automation complexity; demand for real-time data; transparency for critical collaborations; Less Than Truckload demand; digitally evolving business; API-based integrations; demand forecasting; digital freight marketplaces; ecosystem integration.<\/p><h4 data-t=\"L\">Agility and labour<\/h4><p>Self-managed onboarding avoids weeks of waiting in a managed-service queue (onboard a client in hours). Labour shortage pushes automation: machine picking and packing; driverless truck platoons where the second truck mimics the first truck's human driver.<\/p><h4 data-t=\"L\">Automation complexity and real-time data<\/h4><p>End-to-end integration of WMS/ERP with eCommerce platforms removes manual data compilation. The 'Amazon effect' (2-day, same-day shipping) makes customers expect live order location and delivery windows; WMS/ERP links to visibility platforms such as project44 or FourKites.<\/p><h4 data-t=\"L\">EDI and APIs<\/h4><p>EDI starts and orchestrates business processes; APIs give deeper insight. APIs do real-time processing instead of batch processing, so partners get more frequent updates.<\/p><h4 data-t=\"H\">Less Than Truckload (LTL)<\/h4><p>Multiple smaller orders from various companies share one carrier, giving a full load with many stops. Benefits: cost (pay only for the space used), eCommerce friendly, small-business friendly, environmentally conscious (fuller loads, fewer trips, lower emissions).<\/p><h4 data-t=\"L\">Demand forecasting<\/h4><p>Estimating future customer demand from data such as sales history, seasonality, economy, market trends, pricing, competition, so employees, materials and schedules are planned.<\/p><h4 data-t=\"L\">Digital freight marketplaces<\/h4><p>Digital networks where shippers and carriers connect; shippers compare carriers' times, prices and services in one place; carriers reach more customers.<\/p><h4 data-t=\"L\">Ecosystem integration<\/h4><p>One all-encompassing integration platform for internal and external systems: fewer errors, lower complexity, usually cheaper than multiple tools, real-time data sharing.<\/p><h4 data-t=\"M\">India: digital transformation<\/h4><p>IoT fleet management systems give real-time vehicle performance, fuel consumption and driver behaviour data.<\/p><h4 data-t=\"H\">India: last-mile innovation<\/h4><p>Drones, autonomous vehicles, crowd-shipping. Flipkart piloted drone deliveries in some areas to beat traffic bottlenecks.<\/p><h4 data-t=\"L\">India: sustainable practices<\/h4><p>Amazon India committed to a <mark>100%<\/mark> electric delivery fleet by <mark>2030<\/mark>.<\/p><h4 data-t=\"M\">India: warehouse automation<\/h4><p>DHL eCommerce India automated sortation centre in Delhi handles up to <mark>6,000<\/mark> shipments per hour.<\/p><h4 data-t=\"M\">India: predictive analytics<\/h4><p>Delhivery uses predictive analytics to optimise delivery routes.<\/p><h4 data-t=\"L\">India: collaboration and e-commerce focus<\/h4><p>BlackBuck: digital freight platform connecting shippers and truckers. Ekart (Flipkart's logistics arm): faster delivery, hassle-free returns.<\/p><h4 data-t=\"L\">Challenges<\/h4><p>Supply chain disruptions (wildfires, floods, wars, strikes, low Panama Canal water; need resilience); trading partners failing commitments (<mark>80%<\/mark> of companies reported failures; <mark>27%<\/mark> had <mark>11<\/mark>+ partners fail; <mark>29%<\/mark> plan new partners); labour shortages; rising operational costs (<mark>32%<\/mark> will invest in supply chain tech; <mark>43%<\/mark> say ecosystem integration cuts costs; <mark>33%<\/mark> say it raises revenue and profit); sustainability targets (<mark>45%<\/mark> call it critical; laws are tightening; <mark>32%<\/mark> say integration removes data silos).<\/p><h4 data-t=\"H\">Performance measures for modern logistics<\/h4><p>Efficiency (order fulfilment time, cycle time, resource utilization); cost-effectiveness (operating and transport costs); customer satisfaction (on-time delivery, order accuracy, feedback); environmental impact (carbon emissions, fuel consumption, waste generation); flexibility and agility (response time to demand change, lead time variability, inventory turnover); innovation adoption (implementation rate, user adoption, ROI); supply chain visibility (tracking accuracy, inventory visibility, real-time monitoring).<\/p><h4 data-t=\"L\">Case: DHL<\/h4><p>Invested <mark>$350 million<\/mark> to digitise operations; built end-to-end visibility solution MySupplyChain using predictive analytics.<\/p><h4 data-t=\"H\">Case: Amazon anticipatory shipping<\/h4><p>Predicts when, where and which items customers will purchase based on buying habit history in particular areas; a popular item ships from a nearby hub faster. Also predicts how many drivers are needed, number of shipments, and best vehicle storage, improving last-mile sustainability.<\/p><h4 data-t=\"L\">Case: Swiggy and Flipkart<\/h4><p>Swiggy: hyperlocal delivery networks with local restaurants and delivery partners (faster, fresher). Flipkart: last-mile partnerships with local logistics providers for faster delivery, wider coverage and reach into remote areas.<\/p><h4 data-t=\"L\">Challenges diagram<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>Five challenges around a hub: supply chain disruptions; trading partners failing to uphold commitments; labor shortages; rising operational costs; sustainability targets.<\/p><h4 data-t=\"M\">Flow and rebuilt diagrams<\/h4><div class=\"viz\"><h5>Challenges for modern-day logistics <span class=\"wb sl\">SLIDE IMAGE<\/span><\/h5><div class=\"mid\">CHALLENGES<\/div><div class=\"g3\"><div>Supply chain disruptions<\/div><div>Trading partners failing to uphold commitments<\/div><div>Labor shortages<\/div><div>Rising operational costs<\/div><div>Sustainability targets<\/div><\/div><\/div>"],["Lecture 20 - Logistics vs Supply Chain Management","<div class=\"tip\"><b>Analogy:<\/b> Like a football match: logistics is the passing and positioning of the ball; SCM is the whole team strategy that sets up the game.<\/div><h4 data-t=\"L\">Terminology<\/h4><p>The terms are often used interchangeably; what is called SCM in the US is more commonly called logistics management in Europe. Perspectives vary: some say no difference; others say SCM includes logistics and logistics is a set of sub-processes within SCM.<\/p><h4 data-t=\"M\">Supply chain management<\/h4><p>Collaboration between firms connecting suppliers, customers and partners to boost efficiency and create value for the end consumer (Michigan State University). Strategic decisions that set the operational framework within which logistics is performed.<\/p><h4 data-t=\"M\">Logistics (CSCMP definition)<\/h4><p>Part of the supply chain process that plans, implements and controls the efficient, effective forward and reverse flow and storage of goods, services and related information between point of origin and point of consumption to meet customer requirements. Includes demand planning, inventory management, transportation, fleet management, material handling, order fulfilment.<\/p><h4 data-t=\"M\">Inbound vs outbound<\/h4><p>Inbound: material acquisition, handling, transportation, storage. Outbound: collection, maintenance, distribution and transport of goods to the end user. Objective: right quality, right price, right time, right place.<\/p><h4 data-t=\"L\">What they share<\/h4><p>Both focus on goods, services or information; both support company success and differentiation; both increase customer satisfaction; both follow the flow supplier, manufacturer, wholesaler, retailer or consumer.<\/p><h4 data-t=\"H\">Key differences<\/h4><p>Logistics: movement, storage and flow of goods, services, information; focus on meeting customer requirements; old term (military origin; Alexander the Great, born <mark>356<\/mark> B.C., credited as a logistics master); an activity within the supply chain. SCM: links major business processes within and across companies into a high-performance model; focus on competitive advantage; relatively new term (20th century); covers production and inventory planning, labour planning, materials and facilities management, manufacturing and delivery. Many experts credit logistician Keith Oliver with coining 'supply chain management' in the early 1980s.<\/p><h4 data-t=\"L\">Why logistics matters<\/h4><p>Right products at right time; cut cost and raise efficiency; retain customers and loyalty; unique value proposition; deliver from the most cost-effective production location to the customer.<\/p><h4 data-t=\"L\">Logistical components<\/h4><p>Information; storage; warehousing (receiving, put-away, picking, packing, shipping, returns); material handling; packaging; unitization; inventory control; transportation (cars, trains, trucks, planes, ships).<\/p><h4 data-t=\"L\">Logistics across the supply chain<\/h4><p>Planning: information, inventory control. Sourcing: information, material handling, transportation. Manufacturing: information, material handling, storage, warehousing, packaging, unitization, transportation. Delivering: information, warehousing, inventory management, material handling, packaging, transportation. Returning: information, packaging/unitization, material handling, transportation, warehousing.<\/p><h4 data-t=\"L\">Case: GEODIS<\/h4><p>Online retailer with seasonal spikes, fast delivery promises (next or two days) and accuracy needs. Solutions: KPI monitoring, demand forecasting and planning, scalable pop-up warehouses for peaks, shipping from warehouses nearest transport hubs. Result: multi-country network, less cross-border shipping, <mark>91%<\/mark> fulfilment rate for European customers.<\/p><h4 data-t=\"M\">Four perspectives diagram<span class=\"wb sl\">SLIDE IMAGE<\/span><\/h4><p>Slide shows four Venn pictures from Larson and Halldorsson: traditionalist, re-labeling, unionist, intersectionist.<\/p><h4 data-t=\"M\">What the four perspectives mean<span class=\"wb\">WEB<\/span><\/h4><p>Traditionalist: SCM is part of logistics. Re-labeling: SCM is logistics under a new name. Unionist: logistics is a part of SCM (SCM is broader). Intersectionist: the two overlap.<\/p><h4 data-t=\"M\">Flow and rebuilt diagrams<\/h4><div class=\"viz\"><h5>Perspectives on logistics vs SCM (Larson &amp; Halldorsson, 2004) <span class=\"wb sl\">SLIDE IMAGE<\/span><\/h5><svg viewBox=\"0 0 440 230\"><g fill=\"none\" stroke=\"#bbb\"><ellipse cx=\"110\" cy=\"60\" rx=\"85\" ry=\"42\"/><ellipse cx=\"110\" cy=\"62\" rx=\"35\" ry=\"16\"/><ellipse cx=\"330\" cy=\"40\" rx=\"55\" ry=\"24\"/><ellipse cx=\"330\" cy=\"85\" rx=\"55\" ry=\"24\"/><ellipse cx=\"110\" cy=\"170\" rx=\"85\" ry=\"42\"/><ellipse cx=\"110\" cy=\"172\" rx=\"35\" ry=\"16\"/><ellipse cx=\"300\" cy=\"170\" rx=\"60\" ry=\"34\"/><ellipse cx=\"370\" cy=\"170\" rx=\"60\" ry=\"34\"/><\/g><text x=\"30\" y=\"14\">Traditionalist<\/text><text x=\"80\" y=\"38\">Logistics<\/text><text x=\"96\" y=\"66\">SCM<\/text><text x=\"290\" y=\"14\">Re-labeling<\/text><text x=\"305\" y=\"44\">Logistics (X)<\/text><text x=\"318\" y=\"89\">SCM<\/text><text x=\"30\" y=\"124\">Unionist<\/text><text x=\"96\" y=\"148\">SCM<\/text><text x=\"85\" y=\"176\">Logistics<\/text><text x=\"290\" y=\"124\">Intersectionist<\/text><text x=\"268\" y=\"174\">Logistics<\/text><text x=\"372\" y=\"174\">SCM<\/text><\/svg><\/div>"]],"gl":[["History","Traced to military contexts. Computing advances in the 1960s and 1970s drove mathematical modelling in logistics. Consolidation into functional departments and growth of third-party transport and LSPs led to the 'Industrialization of Services'. UPS, FedEx and Walmart pioneered industrialization of logistics services. E-logistics then RFID and the 'Internet of Things' (internet technologies + RFID objects + decentralised control).",""],["Categories of modern logistics (Behrends, 2016)","Retail; consumer shopping trips; Couriers, Express and Parcel (CEP: global networks, cross-dock terminals); HoReCa (hotels, restaurants, catering: frequent Just-In-Time deliveries); construction (irregular but timely supply); waste management; industrial and terminal haulage.","K"],["Stakeholders (Behrends, 2016)","Shippers and receivers (decide shipment size, frequency, lead time, delivery precision); public authorities (land-use, traffic planning, infrastructure; boost economy while limiting freight impact on residents); carriers (own-account or third-party; high utilization with required service quality).",""],["Technology trends","Automation, IoT, cloud computing, AI, digital twins; plus blockchain, advanced data analytics, robotics, augmented reality, advanced geolocation. Future trends: elastic logistics, green logistics, last-mile delivery, autonomous vehicles, on-demand warehousing.",""],["Elastic logistics","Ability of a business to rapidly reduce or expand logistics activities and infrastructure in line with supply chain demand using data-driven technology.","E"],["Automation, IoT, cloud","Automation: software or machinery taking over part of manual tasks. IoT automates warehouse operations and optimises space use. Cloud: on-demand access to logistics software, storage and processing; real-time shipment tracking.","K"],["Robots, AI, AR, digital twins","Logistics robots store and move goods (intralogistics). AI optimises routes and schedules from delivery locations and inventory levels. AR-enhanced warehousing lays shortest routes to find items. Digital twins test disruptions, outlier and black swan events without affecting real operations. GPS, BLE, Wi-Fi, cellular and IoT trackers support tracking.",""],["Cold chain logistics","Management and transport of temperature-sensitive products (perishables, pharmaceuticals) in a controlled environment to maintain quality and integrity. Components: temperature control; packaging (insulated containers, refrigerated trucks); monitoring and tracking; risk management (equipment failure, temperature excursions); regulatory compliance (FDA, WHO).","E"],["Blockchain","Decentralised, distributed ledger giving transparency, traceability and security without intermediaries. Elements: transparency and traceability (tamper-proof record); enhanced visibility; improved security (cryptography, consensus); streamlined processes via smart contracts; reduced cost and delays. It identifies non-compliance with standards or product damage during transport.","E"],["Smart contract","Self-executing contract with predefined rules and conditions, automatically enforced when criteria are met, reducing manual intervention. Helps with fraud, administrative errors and wasted time.","E"],["Big data roles","Predictive analytics (historical and real-time data to forecast demand, optimise inventory, anticipate disruptions); route optimization (traffic, weather, performance data); warehouse management (layout, picking time, high-demand items); demand forecasting; supply chain visibility; risk management (supplier failure, disasters, geopolitical events).","E"],["Logistics 1.0 to 4.0 (Galindo, 2016)","1.0: steam engine power and mechanisation of transport. 2.0: electric power, mass production, automation of handling systems. 3.0: computers and IT, logistics management systems (WMS, TMS), NACCS. 4.0: Internet, IoT and IoS, RFID, CPS, DM. Complexity rises with each stage. Slide timeline markers at about 1800, 1969 and 2000; 'Today 2106' appears to be a typo for 2016.","K"],["Drone last-mile system","Diagram from Eskandaripour and Boldsaikhan (2023): depot, trucks, drones and customers connected by Wi-Fi links.",""],["Factors fostering innovation","Supply chain agility; global labour shortages; automation complexity; demand for real-time data; transparency for critical collaborations; Less Than Truckload demand; digitally evolving business; API-based integrations; demand forecasting; digital freight marketplaces; ecosystem integration.",""],["Agility and labour","Self-managed onboarding avoids weeks of waiting in a managed-service queue (onboard a client in hours). Labour shortage pushes automation: machine picking and packing; driverless truck platoons where the second truck mimics the first truck's human driver.",""],["Automation complexity and real-time data","End-to-end integration of WMS/ERP with eCommerce platforms removes manual data compilation. The 'Amazon effect' (2-day, same-day shipping) makes customers expect live order location and delivery windows; WMS/ERP links to visibility platforms such as project44 or FourKites.",""],["EDI and APIs","EDI starts and orchestrates business processes; APIs give deeper insight. APIs do real-time processing instead of batch processing, so partners get more frequent updates.",""],["Less Than Truckload (LTL)","Multiple smaller orders from various companies share one carrier, giving a full load with many stops. Benefits: cost (pay only for the space used), eCommerce friendly, small-business friendly, environmentally conscious (fuller loads, fewer trips, lower emissions).","E"],["Demand forecasting","Estimating future customer demand from data such as sales history, seasonality, economy, market trends, pricing, competition, so employees, materials and schedules are planned.",""],["Digital freight marketplaces","Digital networks where shippers and carriers connect; shippers compare carriers' times, prices and services in one place; carriers reach more customers.",""],["Ecosystem integration","One all-encompassing integration platform for internal and external systems: fewer errors, lower complexity, usually cheaper than multiple tools, real-time data sharing.",""],["India: digital transformation","IoT fleet management systems give real-time vehicle performance, fuel consumption and driver behaviour data.","K"],["India: last-mile innovation","Drones, autonomous vehicles, crowd-shipping. Flipkart piloted drone deliveries in some areas to beat traffic bottlenecks.","E"],["India: sustainable practices","Amazon India committed to a 100% electric delivery fleet by 2030.",""],["India: warehouse automation","DHL eCommerce India automated sortation centre in Delhi handles up to 6,000 shipments per hour.","K"],["India: predictive analytics","Delhivery uses predictive analytics to optimise delivery routes.","K"],["India: collaboration and e-commerce focus","BlackBuck: digital freight platform connecting shippers and truckers. Ekart (Flipkart's logistics arm): faster delivery, hassle-free returns.",""],["Challenges","Supply chain disruptions (wildfires, floods, wars, strikes, low Panama Canal water; need resilience); trading partners failing commitments (80% of companies reported failures; 27% had 11+ partners fail; 29% plan new partners); labour shortages; rising operational costs (32% will invest in supply chain tech; 43% say ecosystem integration cuts costs; 33% say it raises revenue and profit); sustainability targets (45% call it critical; laws are tightening; 32% say integration removes data silos).",""],["Performance measures for modern logistics","Efficiency (order fulfilment time, cycle time, resource utilization); cost-effectiveness (operating and transport costs); customer satisfaction (on-time delivery, order accuracy, feedback); environmental impact (carbon emissions, fuel consumption, waste generation); flexibility and agility (response time to demand change, lead time variability, inventory turnover); innovation adoption (implementation rate, user adoption, ROI); supply chain visibility (tracking accuracy, inventory visibility, real-time monitoring).","E"],["Case: DHL","Invested $350 million to digitise operations; built end-to-end visibility solution MySupplyChain using predictive analytics.",""],["Case: Amazon anticipatory shipping","Predicts when, where and which items customers will purchase based on buying habit history in particular areas; a popular item ships from a nearby hub faster. Also predicts how many drivers are needed, number of shipments, and best vehicle storage, improving last-mile sustainability.","E"],["Case: Swiggy and Flipkart","Swiggy: hyperlocal delivery networks with local restaurants and delivery partners (faster, fresher). Flipkart: last-mile partnerships with local logistics providers for faster delivery, wider coverage and reach into remote areas.",""],["Challenges diagram","Five challenges around a hub: supply chain disruptions; trading partners failing to uphold commitments; labor shortages; rising operational costs; sustainability targets.",""],["Terminology","The terms are often used interchangeably; what is called SCM in the US is more commonly called logistics management in Europe. Perspectives vary: some say no difference; others say SCM includes logistics and logistics is a set of sub-processes within SCM.",""],["Supply chain management","Collaboration between firms connecting suppliers, customers and partners to boost efficiency and create value for the end consumer (Michigan State University). Strategic decisions that set the operational framework within which logistics is performed.","K"],["Logistics (CSCMP definition)","Part of the supply chain process that plans, implements and controls the efficient, effective forward and reverse flow and storage of goods, services and related information between point of origin and point of consumption to meet customer requirements. Includes demand planning, inventory management, transportation, fleet management, material handling, order fulfilment.","K"],["Inbound vs outbound","Inbound: material acquisition, handling, transportation, storage. Outbound: collection, maintenance, distribution and transport of goods to the end user. Objective: right quality, right price, right time, right place.","K"],["What they share","Both focus on goods, services or information; both support company success and differentiation; both increase customer satisfaction; both follow the flow supplier, manufacturer, wholesaler, retailer or consumer.",""],["Key differences","Logistics: movement, storage and flow of goods, services, information; focus on meeting customer requirements; old term (military origin; Alexander the Great, born 356 B.C., credited as a logistics master); an activity within the supply chain. SCM: links major business processes within and across companies into a high-performance model; focus on competitive advantage; relatively new term (20th century); covers production and inventory planning, labour planning, materials and facilities management, manufacturing and delivery. Many experts credit logistician Keith Oliver with coining 'supply chain management' in the early 1980s.","E"],["Why logistics matters","Right products at right time; cut cost and raise efficiency; retain customers and loyalty; unique value proposition; deliver from the most cost-effective production location to the customer.",""],["Logistical components","Information; storage; warehousing (receiving, put-away, picking, packing, shipping, returns); material handling; packaging; unitization; inventory control; transportation (cars, trains, trucks, planes, ships).",""],["Logistics across the supply chain","Planning: information, inventory control. Sourcing: information, material handling, transportation. Manufacturing: information, material handling, storage, warehousing, packaging, unitization, transportation. Delivering: information, warehousing, inventory management, material handling, packaging, transportation. Returning: information, packaging/unitization, material handling, transportation, warehousing.",""],["Case: GEODIS","Online retailer with seasonal spikes, fast delivery promises (next or two days) and accuracy needs. Solutions: KPI monitoring, demand forecasting and planning, scalable pop-up warehouses for peaks, shipping from warehouses nearest transport hubs. Result: multi-country network, less cross-border shipping, 91% fulfilment rate for European customers.",""],["Four perspectives diagram","Slide shows four Venn pictures from Larson and Halldorsson: traditionalist, re-labeling, unionist, intersectionist.","K"],["What the four perspectives mean","Traditionalist: SCM is part of logistics. Re-labeling: SCM is logistics under a new name. Unionist: logistics is a part of SCM (SCM is broader). Intersectionist: the two overlap.","K"]],"q":[["o","Elastic logistics refers to:",["The use of rubber materials in packaging","Ability to rapidly reduce or expand logistics activities in line with supply chain demand using data-driven technology","A method of stretching delivery deadlines","Flexible pricing models for shipping"],1,"L18 trends slide definition."],["o","In logistics, blockchain primarily helps by:",["Increasing fuel consumption","Reducing the need for transportation","Replacing all human warehouse workers","Identifying non-compliance with standards or product damage, and improving workflow through smart contracts"],3,"L18: blockchain identifies non-compliance or damage in transit; smart contracts improve workflow."],["o","Amazon's 'anticipatory shipping' works by:",["Shipping all products from a single central warehouse","Predicting when, where and which items customers will purchase based on buying habit history","Requiring customers to pre-pay for shipping months in advance","Only delivering on weekends"],1,"L19 case study."],["o","Which performance measure tracks carbon emissions, fuel consumption and waste generation?",["Efficiency","Cost-effectiveness","Environmental impact","Customer satisfaction"],2,"L19 performance measures slide."],["o","Flipkart's drone deliveries in some areas exemplify which trend in Indian logistics?",["Last-mile delivery innovations","Cold chain logistics","Blockchain adoption","Reverse logistics optimization"],0,"L19 India trends: last-mile delivery innovations."],["o","Who is credited by many experts with coining 'supply chain management' in the early 1980s?",["Taiichi Ohno","Keith Oliver","Michael Porter","Peter Drucker"],1,"L20: logistician Keith Oliver."],["o","Less Than Truckload (LTL) shipping primarily benefits businesses by:",["Requiring payment for the entire truck regardless of usage","Increasing the environmental impact of shipping","Eliminating the need for any carriers","Letting customers pay only for the carrier space they use, while consolidating smaller orders"],3,"L19: LTL charges only for space used; fuller loads reduce emissions."],["o","Which role of Big Data analyses historical and real-time data to forecast demand and anticipate disruptions?",["Predictive analytics","Route optimization","Warehouse management","Risk management"],0,"L18 big data roles: predictive analytics."],["o","In blockchain logistics, 'smart contracts' are best described as:",["Paper contracts signed digitally","Insurance contracts for damaged goods","Contracts that require manual approval at every step","Self-executing contracts with predefined rules automatically enforced when criteria are met"],3,"L18 blockchain slide."],["o","Cold chain logistics management is primarily concerned with:",["Managing and transporting temperature-sensitive products like perishables and pharmaceuticals in a controlled environment","Logistics during winter seasons only","Reducing air conditioning cost in warehouses","Shipping goods only to cold regions"],0,"L18 cold chain definition."]],"imp":[["Elastic logistics (Lecture 18)","Ability of a business to rapidly reduce or expand logistics activities and infrastructure in line with supply chain demand using data-driven technology."],["Cold chain logistics (Lecture 18)","Management and transport of temperature-sensitive products (perishables, pharmaceuticals) in a controlled environment to maintain quality and integrity. Components: temperature control; packaging (insulated containers, refriger..."],["Blockchain (Lecture 18)","Decentralised, distributed ledger giving transparency, traceability and security without intermediaries. Elements: transparency and traceability (tamper-proof record); enhanced visibility; improved security (cryptography, conse..."],["Smart contract (Lecture 18)","Self-executing contract with predefined rules and conditions, automatically enforced when criteria are met, reducing manual intervention. Helps with fraud, administrative errors and wasted time."],["Big data roles (Lecture 18)","Predictive analytics (historical and real-time data to forecast demand, optimise inventory, anticipate disruptions); route optimization (traffic, weather, performance data); warehouse management (layout, picking time, high-dema..."],["Less Than Truckload (LTL) (Lecture 19)","Multiple smaller orders from various companies share one carrier, giving a full load with many stops. Benefits: cost (pay only for the space used), eCommerce friendly, small-business friendly, environmentally conscious (fuller ..."],["India: last-mile innovation (Lecture 19)","Drones, autonomous vehicles, crowd-shipping. Flipkart piloted drone deliveries in some areas to beat traffic bottlenecks."],["Performance measures for modern logistics (Lecture 19)","Efficiency (order fulfilment time, cycle time, resource utilization); cost-effectiveness (operating and transport costs); customer satisfaction (on-time delivery, order accuracy, feedback); environmental impact (carbon emission..."],["C
