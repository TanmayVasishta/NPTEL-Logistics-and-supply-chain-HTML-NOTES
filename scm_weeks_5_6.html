D[5]={notes:[
["Lecture 21 - Fundamentals of Supply Chain Management",
`<h4>What is a supply chain?</h4><p>Example in the lecture: a customer wants detergent and goes to a supermarket (Big Bazaar / third-party DC), supplied by P&amp;G or another manufacturer, who is supplied by plastic producers, chemical manufacturers (oil companies), packaging, paper and timber industries.</p>
<p><b>Chopra and Meindl (2013):</b> all parties involved, directly or indirectly, in fulfilling a customer request: manufacturer, suppliers, transporters, warehouses, retailers and even customers. Within each firm it includes new product development, marketing, operations, distribution, finance and customer service. <b>Lu Dawei and Chen:</b> a group of interconnected companies that add value to the stream that transforms inputs from source to the end product or service demanded by the designated end customer.</p>
<p><b>Supply chain management (SCM)</b> combines demand and supply networks and focuses on efficient working of every step. Every link tries to minimise cost and improve long-run performance by removing useless expense, handling and movement; it monitors distribution, production and transport via control of inventory, shipment, internal sales and production.</p>`+dFlows+
`<h4>Objectives</h4><p>Maximise overall value generated: timely delivery, effective inventory management, flexibility and responsiveness, efficient cost-effective production, collaborative supplier-consumer relationship, improved logistics, optimised delivery (time, cost, amount), more customer value, better distribution, demand fulfilment, quality and integrated technology.</p>
<h4>Supply chain decisions</h4>`+dPhases+T(['Phase','Horizon','Examples'],[['Strategy / design','Several years','Outsource or in-house; location and capacity of plants and warehouses; products per location; modes; information systems'],['Planning','Quarter to a year','Configuration fixed; maximise surplus; which markets from which locations, inventory policy, subcontracting, backup locations, timing and size of promotions'],['Operation','Weekly or daily','Allocate orders to inventory or production, set due dates, pick lists, allocate orders to shipments, delivery schedules, replenishment orders']])+
`<h4>Types of supply chain models</h4>`+T(['Model','Best for'],[['Continuous flow','Mature industries; same good repeatedly; stable demand'],['Agile','Unpredictable demand or custom orders; flexibility first'],['Fast','Short life-cycle products; ride a trend and sell out before it ends'],['<b>Flexible</b>','<b>Seasonality</b>: ramp production up and down for peaks and troughs'],['Efficient','Tight profit margins; best use of equipment, inventory, order processing'],['Custom','Specialised, technical industries (e.g. automobile)']])+
`<h4>Concept of SCM: three components</h4>`+T(['Component','Meaning','Level'],[['Configuration (architecture)','How the chain is built: size of supply base, extent of vertical integration, outsourcing, distribution channel design','Strategic'],['Relationship','Inter-firm links, mainly OEM with first-tier suppliers and customers; arm\'s length (price and volume only) versus close partnership (vision, investment plans, NPI, financials)','Strategic and operational'],['Coordination','Operational flow of material, ideally JIT; inventory, capacity, forecasting, scheduling, customer service','Operational']])],
["Lecture 22 - SC Operations: Manufacturing versus Service SC",
`<p>Operations management deals with producing and distributing goods and services. <b>Four functions:</b> planning, scheduling, control, improvement. SCM is a subset of operations management concentrating on material and information flow among suppliers and customers.</p>
<h4>Services versus products</h4><p>Five attributes of services: <b>intangibility, perishability, heterogeneity, inseparability, customer participation</b>. Perishability mirrors inventory management for demand uncertainty; heterogeneity, inseparability and participation have manufacturing counterparts in modularity and JIT.</p>
<p><b>Manufacturing supply chain:</b> network of organisations, resources and technologies that produce and distribute goods (raw materials to assembly, packaging, distribution). <b>Service supply chain:</b> interconnected activities delivering intangible services (healthcare, transport, hospitality, professional); customer engagement, service delivery, resource allocation, support.</p>`+T(['Factor','Manufacturing SC','Service SC'],[['Input','Suppliers\' materials and components','Information, labour, skills'],['Value-added process','Physical production and assembly','Customer-provider interaction'],['Output','Pre-defined product','Customised service'],['Production system','<b>Push</b> (sell from inventory)','<b>Pull</b> (initiated by customer demand)'],['Demand uncertainty','Managed with <b>inventory</b>','Managed with <b>queues</b>'],['Customer relations','Often low level','Critical to overall success']])+
`<h4>Case: Amazon</h4><p>Began by filling orders with books bought from a distributor; added warehouses for speed (about 20 US and 30 elsewhere in 2009); outbound shipping cost almost USD 2 billion in 2009; 460,000 digital books for Kindle; acquired <b>Zappos</b> (added variety: 121,000 product descriptions, 2.2 million images) and <b>diapers.com</b> (little variety, high shipping volume).</p>`],
["Lecture 23 - Principle Streams of Supply Chain (1)",
`<h4>Three streams</h4>`+F(['Procurement / Supply / Sourcing','Operations / Material / Production','Logistics / Distribution'])+
`<h4>Sourcing</h4><p>Systematic identification, assessment and enlistment of suppliers by set criteria, usually via tendering, at tactical and strategic levels; first step of the chain; balances quality against affordability.</p>`+T(['Type','Meaning'],[['Outsourcing','Hire an outside party for work done in-house; front or back office; abroad or domestic'],['<b>Insourcing</b>','Delegate to a person or team <b>within the company</b>; cost saving, on-site quality monitoring'],['Near-sourcing','Place operations close to the home market'],['Global (off-shore) sourcing','Buy from lower labour and production cost countries (China typical); new skills and resources'],['Prime / subcontracting','Subcontractor performs part of a larger project'],['Captive service operations','Partly or wholly-owned entity overseas: control and confidentiality, but weaker economies of scale'],['Professional service','Recruit specialised service occupations'],['<b>Vertical integration</b>','<b>Merging companies at different stages of the same industry</b>; acquiring a supplier = backward; acquiring distribution = forward'],['Few or many suppliers','Multi-supplier for commodities (price based); single source for close partnership'],['Joint venture','Entity of two or more parties with shared ownership, returns, risk, governance'],['Virtual enterprise','Independent firms linked by IT to share skills, costs, market access']])+
`<h4>Procurement management: 8 steps</h4>`+F(['1 Identifying and planning','2 Choosing and selecting suppliers','3 Negotiating the contract','4 Placing the first purchase order','5 Accelerating (expediting) the order','6 Receipt and inspection','7 Clearing the invoice and payment','8 Maintaining relationships and records'])+
`<p>Procurement must be part of product development; use risk management and performance indicators; it is continuous, not one-time. Example: construction company sourcing cement and steel.</p>
<h4>Supply management</h4><p>Identifying, acquiring and managing resources and suppliers: goals are cost control, efficient resource allocation, risk management and information gathering.</p>`],
["Lecture 24 - Principle Streams of Supply Chain (2)",
`<h4>Operations management</h4><p>Converts inputs (raw material, labour, equipment, technology) into outputs as effectively as possible. Functions: planning, scheduling, execution. Applied in manufacturing, service, retail, hospitality, logistics and supply chain.</p>
<h4>Material management</h4>`+L(['<b>MRP</b> - quantity and timing of raw materials needed; avoids over and under stocking','<b>Purchase planning</b> - when and how much to order; balance holding cost against ordering cost','<b>Inventory control</b> - raw material, WIP, finished goods','<b>Material supply management</b> - flow from suppliers to production','<b>Quality control</b> - inspect and test materials','<b>Cost reduction</b> - timely procurement, less waste'])+
`<h4>Production management: the 6 M's</h4>`+F(['Man','Machine','Methods','Materials','Money','Markets'])+
`<p>Goals: right quantity, quality, time and cost. Functions: product and resource selection, production planning and control, machine maintenance and replacement. Strategies: <b>continuous improvement, JIT, TPM (Total Productive Maintenance), SCM</b>. Example: furniture plant.</p>
<h4>Logistics management</h4><p>Planning, implementation and control of movement and storage of goods, services and information; delivers the right product to the right place at the right time in the right condition while <b>minimising costs and maximising efficiency</b>. Components: warehouse management (WMS: barcode, RFID, automation), transportation management (TMS: tracking, mediator between order systems and carriers), distribution management systems (order management, inventory allocation, warehouse forecasting).</p>`],
["Lecture 25 - Objectives of Supply Chain Networks",
`<p><b>Supply chain profitability</b> = revenue from the customer minus total supply chain cost; customers are the only source of revenue. A <b>supply chain network</b> is the interconnected system of suppliers, manufacturers, distributors, retailers, warehouses, transport providers and customers; network design builds and models the chain to understand cost and time to market.</p>
<h4>Four network design decision categories</h4>`+T(['Decision','Question'],[['Facility role','What role and what processes at each facility?'],['Facility location','Where should facilities be?'],['Capacity allocation','How much capacity at each?'],['Market and supply allocation','Which markets does each facility serve and which sources feed it?']])+
`<h4>Factors influencing network decisions</h4>`+T(['Factor','Insight'],[['Strategic','Cost leaders pick lowest-cost sites (Foxconn, Flextronics in China); responsive firms stay near market (Zara in Portugal and Spain)'],['Technological','High economies of scale: few big plants (semiconductors, AMD); low fixed cost: many local plants (Coca-Cola bottling)'],['Macroeconomic','Taxes, tariffs, exchange rates, shipping costs'],['Political','Stable countries; Global Political Risk Index (Eurasia Group): government, society, security, economy'],['Infrastructure','1990s China: Shanghai, Tianjin, Guangzhou despite higher costs'],['Competitive','Locate near or far from competitors depending on competition form, resources'],['Customer response time','Convenience stores many and close; supermarkets fewer, larger']])+dCostSvg+

D[6]={notes:[
["Lecture 26 - Supply Chain Uncertainty and Processes",
`<p>Opening question: are you 100% sure the delivery will come this weekend, and that the truck holds exactly 1,500 units? COVID-19 was not foreseen either. <b>Supply chain uncertainty</b> = unpredictability that disrupts flow of goods: natural disasters, geopolitics, labour shortages, logistics disruptions, demand swings.</p>
<h4>Demand versus implied demand uncertainty</h4>`+T(['Concept','Meaning'],[['Demand uncertainty','Overall unpredictability of customer demand (trends, behaviour, economy)'],['<b>Implied demand uncertainty</b>','Uncertainty of the <b>portion of demand the chain plans to satisfy</b>, shaped by order frequency, lead times, service level']])+
L(['<b>Emergency orders versus long lead time:</b> emergency-serving firm has <b>higher</b> implied uncertainty; long lead time lets orders be filled evenly','<b>Service level:</b> raising it means meeting rare surges, so implied uncertainty rises even if underlying demand uncertainty is unchanged'])+
`<h4>Supply uncertainty</h4>`+L(['<b>Capability of the chain</b> - production process and yields; e.g. PC industry with new components: low yields, breakdowns','<b>Product life-cycle position</b> - new phone: high; salt in a supermarket: low','Linked to implied demand uncertainty; falls as technology matures'])+
`<h4>Risk versus uncertainty</h4><p><b>Risk</b> = outcome and probability, so it can be estimated (low probability but severe impact is still big risk). <b>Uncertainty</b> = decision makers cannot estimate the outcome or probability.</p>
<h4>Sources (courier-industry study)</h4>`+L(['<b>Logistics</b> - delivery delays, network management, storage, carrier strength, machine failures','<b>Information</b> - accuracy, availability, timeliness; infrastructure breakdown','<b>Customer-related</b> - volatile behaviour, reputation, receivables, forecast errors (consignors and consignees)','<b>Environmental</b> - political, economic, social, technological, environmental; labour issues, congestion, disasters, fuel'])+
`<h4>Countering uncertainty</h4>`+L(['Diversify suppliers across regions','Enhance visibility (analytics, tracking, data sharing)','Build flexibility (buffer stock, agile manufacturing)','Strengthen relationships','Invest in resilience (redundant capacity, backup inventory)','Risk management (assessments, scenario planning, alternative routes)','Monitor and adapt; use automation, AI, data analytics'])+
`<h4>Mitigating through automated planning</h4>`+L(['More frequent plans (yearly to weekly reviews cuts inventory)','Consistent planning methods using best practices','Integrating more data sources','Visibility across the chain, reducing the <b>bullwhip effect</b>','Holistic KPI tracking'])+
`<h4>Macro processes</h4>`+dMacro],
["Lecture 27 - Supply Chain Operational Views",
`<h4>SCOR model</h4><p>Planning and diagnostic system from the <b>Supply-Chain Council</b>; benchmarking and diagnostic tools; more than 250 metrics. Five management processes: <b>Plan, Source, Make, Deliver, Return</b> (plus Enable). Five performance dimensions: <b>Reliability, Responsiveness, Agility, Costs, Asset Management Efficiency</b>.</p>`+dScor+
T(['Process','Scope'],[['Plan','Planning, scheduling, coordinating resources to meet demand'],['Source','Procuring materials, products, services from suppliers'],['Make','Manufacturing, assembling, producing to demand'],['Deliver','Order management, inventory management, transport and delivery'],['Return','Returns, repairs, recycling, disposal after delivery']])+
`<h4>4 P's of SCOR</h4>`+L(['<b>Performance</b> - KPIs on the five attributes','<b>Process</b> - standard process framework (plan, source, make, deliver, return, enable)','<b>Practice</b> - methods and tools, best practices','<b>People</b> - skills, organisation, collaboration, continuous improvement'])+
`<p><b>Attributes:</b> reliability (right quantity, right condition), responsiveness (speed), costs, asset management (working capital and fixed assets).</p>
<h4>Benefits and limitations</h4>`+T(['Benefits','Limitations'],[['Covers the whole chain; benchmarking; aligns metrics across boundaries; common vocabulary; standard improvement targets','Complexity and time; one-size-fits-all; rigid linear structure; limited scope (little on social responsibility and sustainability); depends on complete accurate data']])+
`<p>E-commerce note: digital supply chains (HTML, HTTPS, TCP/IP) let firms never meet suppliers or customers; SCOR can close gaps; online customers expect fast, cheap, easy-pay, supported delivery.</p>
<h4>Process and cyclic view</h4>`+dCyc+L(['<b>Customer</b> - convert arrivals into orders','<b>Retailer</b> - order entry communicated quickly','<b>Distributor</b> - reach target customers directly and cost-efficiently; access for services','<b>Manufacturer</b> - make to order, turn raw material into product','<b>Supplier</b> - contributes goods or services to the next link'])+
`<p>Cyclic view clearly defines process owners, roles and desired outcomes; useful for operational decisions.</p>
<h4>Push/pull view</h4>`+dPush+TIP('<b>Pull</b> = reactive (in response to a customer order). <b>Push</b> = speculative (in anticipation of orders).')],
["Lecture 28 - Supply Chain Models and Modelling Systems",
`<p><b>Supply chain modelling</b> designs and analyses a chain to find improvements and simulate scenarios. Model types: static, dynamic, Monte Carlo, linear programming, simulation, queuing, statistical. Choice depends on the optimisation goal. Wrong framework choice exposes the firm to risk, interruption and cost escalation.</p>
<h4>Major components</h4><p>Inventory (most critical), transportation, warehousing, manufacturing, procurement, distribution, customer service, information technology.</p>
<h4>Supply chain models</h4>`+T(['Model','Idea','Example'],[['Continuous','Steady flow; JIT; stable demand and uniform goods; less flexible to sudden change','Amazon'],['Fast chain','Quick delivery, short life cycles; design-to-shelf in weeks versus six months','Zara'],['Efficient chain','Reduce waste, maximise efficiency in competitive markets; relies on production forecasts; vulnerable to labour or material shortages',''],['Agile','Responsive and adaptive; volatile demand; four traits: <b>process alignment, virtual integration, network base, market sensitivity</b>; can charge more; profitable only to a volume threshold','Nike'],['Custom-configured','Tailored to customer; blends agile and continuous flow; small batch, prototypes','Dell'],['Flexible','Handles demand peaks and long low periods; needs part segmentation, precise stocking algorithms, flexible planning; "toggle on or off"','Hewlett Packard'],['Virtual (future)','Cloud computing and analytics for visibility and communication','Procter and Gamble']])+
`<h4>Best practices</h4><p>Understand business needs; choose approach; validate with accurate data; test what-if scenarios; consider different models; involve stakeholders; update regularly; document assumptions and limits; train users; monitor KPIs.</p>
<h4>Challenges</h4><p>Complex relationships, imperfect data, multiple objectives, dynamic environment, integration issues, resource constraints, scenario complexity, risk and uncertainty, change management.</p>
<h4>Control towers</h4><p>Cloud-based, using AI, machine learning and big data for end-to-end real-time visibility across the network; plan for unknowns and reduce disruption.</p>
<h4>Cases</h4>`+M([['9 to 2 weeks','Intel Atom chip order cycle after make-to-order pilot (Malaysia)'],['> USD 4 saved','Per unit on a USD 20 chip (cost was about USD 5.50)'],['10% cost cut','Chemical company MILP network model'],['95% next-day','Products delivered next day after redesign']])+
`<p>Intel: only inventory was a lever, so it moved to make-to-order, a bi-weekly assembly test window, formal S&amp;OP and vendor-managed inventory. The chemical company used a MILP model (sites, candidate DCs, demand regions), faced ERP data standardisation and resistance to change.</p>`],
["Lectures 29 and 30 - Supply Chain Drivers",
`<p><b>Drivers</b> determine responsiveness and efficiency: <b>Facilities, Inventory, Transportation, Information, Sourcing, Pricing</b>. <b>Cross-functional</b> drivers (information, sourcing, pricing) integrate across departments; <b>logistics</b> drivers (facilities, inventory, transportation) concern physical flow.</p>`+SV(760,170,
 [[10,15,230,40,'Facilities',B],[265,15,230,40,'Inventory',B],[520,15,230,40,'Transportation',B],[10,115,230,40,'Information'],[265,115,230,40,'Sourcing'],[520,115,230,40,'Pricing']],null,
 [[380,85,'Logistics drivers (top)  |  Cross-functional drivers (bottom)',G,12]],'Rebuilt: six supply chain drivers.')+
`<h4>Facilities</h4><p>Centralising raises efficiency, lowers responsiveness; decentralising the reverse. Toyota and Honda build plants in major markets; Honda\'s flexible SUV/car plants helped in 2008. Decisions: role, location, capacity, product versus functional focus, cross-docking versus storage. Higher utilisation lowers unit cost but raises delay.</p>
<p>Metrics: capacity, utilisation, processing/setup/down/idle time, cost per unit, quality losses, theoretical versus actual flow time, <b>flow time efficiency</b> (theoretical / actual), top-20% SKU volume, batch size, service level, product variety.</p>
<h4>Inventory</h4>`+dLittle+L(['Matches supply and demand; exploits economies of scale; raises responsiveness but ties up capital','Types: <b>cycle, safety, seasonal</b> inventory; level of product availability','Amazon: best sellers in many regional warehouses, slow movers in few, slowest printed or ordered on demand','Metrics: cash conversion cycle, average inventory, <b>inventory turnover</b> (COGS / average inventory), <b>DIO</b> (average inventory / COGS per day), batch size, safety inventory, fill rate, fraction of time out of stock, obsolete inventory'])+
`<h4>Transportation</h4>`+L(['Faster modes raise responsiveness and cost; slower (sea, rail) raise efficiency','Modes: air, truck, rail, sea, pipeline, internet','<b>Dell</b> flies components from Asia to cut inventory; <b>Blue Nile</b> centralises diamond inventory and uses FedEx overnight','Metrics: inbound/outbound transport cost, shipment size, cost per shipment, fraction by mode'])+
`<h4>Information</h4><p>Improves asset use, coordination, responsiveness and cost (Seven-Eleven Japan, Wal-Mart); push needs forecasts, pull needs actual demand data; enabling tech: ERP, analytics, cloud. <b>Diminishing returns:</b> more information raises complexity and cost. Metrics: forecast horizon (at least the lead time), update frequency, forecast error (the measure of uncertainty). Sunsweet cut production overruns from 30% to under 15%.</p>
<h4>Sourcing</h4><p>In-house versus outsource; supplier selection; globalisation (IKEA modules from low-cost countries); outsource for responsiveness when in-house is costly (next-day carriers); keep in-house for control (Zara); outsource for efficiency (scale). Cisco outsources nearly all manufacturing. Metrics: days payable outstanding, cost of goods, inbound transport cost.</p>
<h4>Pricing</h4><p>Matches supply and demand and raises profit. <b>Everyday low pricing</b> stabilises demand; <b>high-low</b> uses periodic discounts; menu pricing by time, location or speed. <b>Amazon:</b> standard shipping (3-5 business days) USD 4.98, two-day USD 13.97, one-day USD 22.97, or <b>free shipping (7-14 days)</b>, which levels warehouse workload.</p>`]],

5:[[/^Worked example: the detergent/,'L'],[/^Logistics versus SCM/,'M'],[/^Basic supply chain stages/,'M'],[/^Objectives$/,'M'],[/^Objectives of SCM \(full/,'L'],[/^Conclusion of the lecture/,'L'],[/^Case: Amazon/,'L'],[/^Amazon in detail/,'L'],[/^Where operations management/,'L'],[/^Operations managers are responsible/,'L'],[/^Case: Zara/,'L'],[/^Zara discussion/,'L'],[/^More objectives/,'L'],[/^Definition and components/,'L'],[/^Supply management$/,'M'],[/^Sourcing vs procurement/,'M'],[/^The 8 procurement steps explained/,'M'],[/^Operations management$/,'M'],[/^Material management$/,'M'],[/^Production management$/,'M'],[/^Logistics management components/,'M'],[/^Significance of the supply chain/,'M'],[/^Service supply chain framework/,'L'],[/^Service attributes and their/,'M'],[/^Factors influencing network/,'M'],[/^Framework$/,'M']],
6:[[/^Sources \(courier/,'L'],[/^Countering uncertainty/,'M'],[/^Mitigating through automated/,'L'],[/^Why automation reduces/,'L'],[/^Macro process aims/,'M'],[/^Best practices/,'L'],[/^Challenges$/,'L'],[/^Control towers/,'L'],[/^Cases$/,'L'],[/^Benefits of supply chain modelling/,'L'],[/^Facility metrics/,'M'],[/^Inventory metrics/,'M'],[/^SCOR levels/,'L'],[/^Benefits and limitations/,'L'],[/^Major components/,'L'],[/^Model comparison cheat/,'M'],[/^Supply chain models$/,'M'],[/^SCOR model/,'M'],[/^4 P's of SCOR/,'M'],[/^Supply uncertainty/,'M'],[/^Risk versus uncertainty/,'M'],[/^Information$/,'M'],[/^Sourcing$/,'M']],

function tierOf(w,si,p){
 const hm=p.match(/^<h4>(.*?)<\/h4>/);
 const head=hm?hm[1].replace(/<[^>]*>/g,''):'Overview';
 const o=(OVR[w]||[]).find(r=>r[0].test(head)&&(r[2]===undefined||r[2]===si));
 const asked=(KEYS[w]||[]).filter(k=>k[0].test(p)).map(k=>k[1]);
 let t,a=[];
 if(o){t=o[1];}
 else if(asked.length){t='H';a=asked;}
 else if(/class="imp"/.test(p)){t='M';}
 else t='M';
 return {t,a:a,head};
}
function decorate(){
 document.querySelectorAll('.acc').forEach((acc,si)=>{
  const c=acc.querySelector('.c');if(c.dataset.d)return;c.dataset.d='1';
  const cnt={H:0,M:0,L:0};
  c.innerHTML=c.innerHTML.split(/(?=<h4>)/).filter(p=>p.trim()).map(p=>{
   const hm=/^<h4>/.test(p);
   if(!hm&&/class="imp"/.test(p)&&p.replace(/<[^>]*>/g,'').length<420)return p;
   const r=tierOf(wk,si,p);cnt[r.t]++;
   const lab=r.t==='H'?'\u2605 Must know'+(r.a.length?' \u00b7 asked in '+[...new Set(r.a.join(', ').split(', '))].join(', '):''):r.t==='M'?'\u25cf Good to know':'\u25cb Background';
   return '<div class="blk p-'+r.t+'"><span class="pb">'+lab+'</span>'+p+'</div>';
  }).join('');
  const h=acc.querySelector('.h');
  h.innerHTML=h.innerHTML+'<span class="cnt">\u2605 '+cnt.H+' \u00b7 \u25cf '+cnt.M+' \u00b7 \u25cb '+cnt.L+'</span>';
 });
}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{document.body.className='mode-'+b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));});

/* ================= ENGINE ================= */
let wk=5,tab='notes';
const main=document.getElementById('main');
const lab={o:'Original assignment',x:'Extra practice'};
const S={};
function newQ(w){S[w]={st:{},score:0,done:0,f:'all',order:[]}}
newQ(5);newQ(6);
function render(){
 if(tab==='notes'){
  main.innerHTML=D[wk].notes.map(d=>`<div class="acc"><div class="h">${d[0]}</div><div class="c">${d[1]}</div></div>`).join('');
  main.querySelectorAll('.h').forEach(h=>h.onclick=()=>h.parentNode.classList.toggle('open'));
  main.querySelector('.acc').classList.add('open');decorate();
 }else if(tab==='cards'){
  main.innerHTML=`<input type="search" id="fs" placeholder="Search Week ${wk} terms..."><div class="grid" id="fg"></div>`;
  const draw=f=>{const g=document.getElementById('fg');
   g.innerHTML=D[wk].gl.filter(x=>(x[0]+x[1]).toLowerCase().includes(f)).map(x=>`<div class="fc"><div class="fi"><div class="fa">${x[0]}</div><div class="fb">${x[1]}</div></div></div>`).join('');
   g.querySelectorAll('.fc').forEach(c=>c.onclick=()=>c.classList.toggle('f'));};
  draw('');document.getElementById('fs').oninput=e=>draw(e.target.value.toLowerCase());
 }else if(tab==='imp'){
  main.innerHTML='<div class="imp"><b>★ Important topics for Week '+wk+'.</b> These are the ideas the assignment questions tested or that the lectures stress with numbers, definitions or named examples. Revise these first.</div>'+T(['#','Important topic','What to remember'],D[wk].imp.map((x,i)=>[i+1,'<b>'+x[0]+'</b>',x[1]]));
 }else quiz();
}
function quiz(){
 const s=S[wk],qs=D[wk].q;
 main.innerHTML=`<div class="bar"><label>Set <select id="qs"><option value="all">All Week ${wk} questions</option><option value="o">Original assignment (${qs.filter(q=>q[0]==='o').length})</option><option value="x">Extra practice (${qs.filter(q=>q[0]==='x').length})</option></select></label><span id="sc"></span><div class="prog"><i id="pg"></i></div><button class="p" id="rs">Reset / Retake</button></div><div id="res"></div><div id="qb"></div>`;
 const sel=document.getElementById('qs');sel.value=s.f;
 sel.onchange=()=>{newQ(wk);S[wk].f=sel.value;quiz()};
 document.getElementById('rs').onclick=()=>{const f=s.f;newQ(wk);S[wk].f=f;quiz()};
 const idx=qs.map((q,i)=>i).filter(i=>s.f==='all'||qs[i][0]===s.f);
 s.order=idx;
 document.getElementById('qb').innerHTML=idx.map((i,n)=>{const q=qs[i];
  return `<div class="q" id="q${i}"><div class="t">Q${n+1} &middot; ${lab[q[0]]}</div><p>${q[1]}</p>`+q[2].map((o,j)=>`<button class="o" data-q="${i}" data-o="${j}">${'ABCD'[j]}) ${o}</button>`).join('')+`<button class="chk" data-c="${i}">Check Answer</button><div class="ex" id="e${i}"></div></div>`}).join('');
 document.querySelectorAll('.o').forEach(b=>b.onclick=()=>ans(+b.dataset.q,+b.dataset.o));
 document.querySelectorAll('.chk').forEach(b=>b.onclick=()=>ans(+b.dataset.c,-1));
 idx.forEach(i=>{if(s.st[i]!==undefined)show(i,s.st[i])});
 upd();
}
function show(i,sel){
 const q=D[wk].q[i];
 document.querySelectorAll(`#q${i} .o`).forEach((b,j)=>{b.disabled=true;if(j===q[3])b.classList.add('ok');else if(j===sel)b.classList.add('no')});
 const e=document.getElementById('e'+i);
 e.innerHTML=(sel===q[3]?'<b style="color:var(--ok)">Correct.</b> ':sel===-1?'<b>Answer: '+'ABCD'[q[3]]+'.</b> ':'<b style="color:var(--no)">Incorrect.</b> Correct answer: '+'ABCD'[q[3]]+'. ')+q[4];
 e.classList.add('s');
}
function ans(i,o){
 const s=S[wk];if(s.st[i]!==undefined)return;
 s.st[i]=o;s.done++;if(o===D[wk].q[i][3])s.score++;
 show(i,o);upd();
}
function upd(){
 const s=S[wk],n=s.order.length;
 document.getElementById('sc').textContent=`Score: ${s.score} / ${s.done} (of ${n})`;
 document.getElementById('pg').style.width=(n?s.done/n*100:0)+'%';
 if(n&&s.done===n){const r=document.getElementById('res'),p=s.score/n;r.style.display='block';
  r.innerHTML=`<b>${s.score} / ${n}</b><div>${Math.round(p*100)}% &middot; ${p>=.8?'Excellent work':p>=.6?'Good, review the misses':'Revisit the notes and retry'}</div>`}
}
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{wk=+b.dataset.w;document.querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('on',x===b));render();scrollTo(0,0)});
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));render();scrollTo(0,0)});
render();
</script>
